schema: sec-external-capability-ledger-v2
status: revalidation-required
binding:
  repository: sec-platform/sec
  packageAuthority: package.json
  lockAuthority: bun.lock
policy:
  owner: docs/external-provider-policy.md
providers:
  - id: codegraph
    decision: watch
    lifecycle: discovered
    observedVersion: null
    versionAuthority: null
    activeRoutingProfile: null
    surfaces:
      cli: []
      standingMcp: []
    unresolved:
      - data-boundary
      - exact-version
      - license
      - sec-and-nexus-benchmark
  - id: gitnexus
    decision: use-as-development-tool
    lifecycle: revalidation-required
    observedVersion: 1.6.3
    versionAuthority: package.json#devDependencies.gitnexus
    activeRoutingProfile: architecture
    surfaces:
      cli:
        - analyze
        - status
      standingMcp: []
    forbiddenAuthority:
      - AgentOperationsAuthority
      - EngineeringIR
      - actualDelta
      - canonicalImpact
      - sourceWriter
    unresolved:
      - freshness-and-coverage-validation
      - repository-specific-benchmark
  - id: graph-it-live-mcp
    decision: reject-with-rationale
    lifecycle: retired
    observedVersion: null
    versionAuthority: null
    activeRoutingProfile: null
    surfaces:
      cli: []
      standingMcp: []
    rationale: standing MCP surface had no required consumer or validated advantage
invariants:
  maxStandingGraphProviders: 1
  providerOutputCannotBecomeCanonical: true
  providerWriteRequiresWorkPackage: true
