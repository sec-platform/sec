schema: sec-current-state-live-v1
resolver:
  command: bun scripts/codex/document-control-plane.ts status --json
  repository: sec-platform/sec
  remote: origin
  defaultBranch: main
  defaultRef: refs/remotes/origin/main
  requireRemoteMatch: true

stableFacts:
  documentAuthority:
    registry: docs/authority.json
    parser: platform/shared/documentation-authority-contract.ts
  productAuthority:
    document: docs/product.md
  capabilityAuthority:
    implementation: latest-main-code-and-contracts
    verification: exact-head-evidence
