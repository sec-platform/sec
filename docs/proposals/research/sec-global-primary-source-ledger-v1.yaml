coverageSummary:
  sourceCount: 110
  familiesCovered:
    - compiler-ir
    - source-model
    - source-transform
    - static-analysis
    - incremental-computation
    - build-system
    - compiler-correctness
    - formal-methods
    - authorization
    - effects-and-ownership
    - capability-security
    - transaction-recovery
    - durable-workflow
    - distributed-consistency
    - testing
    - web-and-accessibility
    - component-abi
    - configuration-and-reconciliation
    - architecture-and-graph-validation
    - provenance-and-supply-chain
    - serialization-and-api-contracts
    - eventing-and-observability
    - package-resolution-and-versioning
    - ai-governance-and-tool-protocols
  caveat: >-
    110 项并不代表穷尽全球所有资料；它形成可复核的一手资料基线。
    新来源必须给出它改变哪一项设计、为何现有来源不足，而不是仅增加引用数量。
