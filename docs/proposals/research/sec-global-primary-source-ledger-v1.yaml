schema: sec-global-primary-source-ledger-v1
status: research-evidence
exactMain: 6cc3bf8a3b655bebf85dfca3f065c9842207c086
tracking: issue-225
scopeDate: 2026-08-01
authority: none
purpose: >-
  审计 SEC 完整目标架构所吸收、改造、拒绝或仅作互操作参考的全球一手技术资料。
  本账本是 Spike Evidence，不是 canonical 设计或支持声明。
method:
  preferredSources:
    - normative-standard
    - official-project-design
    - original-peer-reviewed-paper
    - official-reference-manual
  excludedAsAuthority:
    - vendor-marketing
    - secondary-blog-summary
    - popularity-ranking
    - ai-generated-summary
  decisionVocabulary:
    - adopt-mechanism
    - adapt-mechanism
    - interoperability-only
    - reference-only
    - reject-as-authority
    - defer-pending-evidence

