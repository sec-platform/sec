decisions:
  - id: DEC-001
    title: Model Federation Kernel replaces implicit cross-domain conventions
    status: new-focused-authority-needed
    priority: before-self-observation
    sources: [SRC-002, SRC-003, SRC-004, SRC-005, SRC-075]
    currentOwners: [docs/system-architecture.md, docs/semantic-model.md]
    canonicalTarget: system-architecture plus shared federation contract
    decision: >-
      建立极小跨域协议，统一 DomainDescriptor、identity/revision reference、authority class、
      validation、coverage、unknown frontier 和 migration binding；不建立万能 object/edge graph。
    invariants:
      - domain-fields-remain-owned-by-domain
      - cross-domain-reference-by-stable-identity-and-revision
      - no-generic-property-bag-core
      - no-consumer-reinterpretation
    proof:
      - schema-contract-tests
      - duplicate-owner-negative-tests
      - cross-domain-reference-property-tests
    migration: 先作为只读 registry 投影现有 domains，再逐 consumer 切换。

  - id: DEC-002
    title: Every public contract is structural semantic operational triad
    status: extend-canonical-design
    priority: permanent-invariant
    sources: [SRC-011, SRC-040, SRC-074, SRC-087, SRC-089, SRC-101]
    currentOwners: [docs/semantic-model.md, docs/compiler-target-ir.md, docs/semantic-mutation.md]
    canonicalTarget: contract protocol and validators
    decision: shape schema 不能单独构成工程合同；必须同时声明语义不变量和 Effect/failure/recovery。
    invariants:
      - shape-validation-does-not-prove-semantics
      - defaults-annotations-do-not-create-authority
      - operational-failure-is-part-of-contract
    proof:
      - generated-parser-differential
      - semantic-negative-tests
      - fault-recovery-tests

  - id: DEC-003
    title: Source representation has bytes LST semantic model and SPM layers
    status: new-focused-authority-needed
    priority: before-self-observation
    sources: [SRC-012, SRC-013, SRC-014, SRC-015, SRC-016]
    currentOwners: [docs/brownfield-import.md]
    canonicalTarget: source-program-model authority
    decision: >-
      精确 bytes/mode、lossless syntax、language semantic model 与 Source Program Model 分层；
      任何 AST/LST/Provider 不能越级成为 Engineering IR。
    invariants:
      - comments-format-unowned-regions-preserved
      - provider-coverage-explicit
      - source-identity-not-absolute-path
      - provider-conflict-retained
    proof:
      - byte-roundtrip-corpus
      - rename-move-identity-tests
      - parser-error-recovery-tests
      - multi-provider-conflict-tests

  - id: DEC-004
    title: Semantic Responsibility is obligation not function cluster
    status: extend-canonical-design
    priority: before-self-observation
    sources: [SRC-012, SRC-020, SRC-021, SRC-022, SRC-045]
    currentOwners: [issue-224, docs/semantic-model.md]
    canonicalTarget: semantic responsibility contract
    decision: Function、span、Block 与 Responsibility 均为多对多；增加 consistency/capability/observability/compatibility facets。
    invariants:
      - compact-code-may-contain-many-responsibilities
      - one-responsibility-may-span-many-artifacts
      - ai-summary-never-identity
      - utility-not-promoted-by-call-frequency
    proof:
      - mixed-function-corpus
      - cross-file-responsibility-corpus
      - inline-extract-identity-tests
      - human-reconcile-evaluation

  - id: DEC-005
    title: Effect Algebra is first-class engineering contract
    status: new-focused-authority-needed
    priority: before-controlled-mutation
    sources: [SRC-045, SRC-047, SRC-048, SRC-049]
    currentOwners: [docs/semantic-model.md, docs/compiler-target-ir.md, docs/semantic-mutation.md]
    canonicalTarget: effect algebra shared contract
    decision: >-
      Effect 具有 resource、capability、read/write、determinism、idempotency、compensation、
      isolation、failure 和 observability；支持 subeffect/conflict/commute/precedence relations。
    invariants:
      - effect-is-not-string-label
      - capability-is-not-ambient
      - semantic-permission-and-os-capability-separated
    proof:
      - effect-composition-properties
      - forbidden-effect-negative-tests
      - provider-capability-matrix

  - id: DEC-006
    title: Type Algebra includes resource opaque recursive and representation dimensions
    status: extend-canonical-design
    priority: before-controlled-mutation
    sources: [SRC-007, SRC-008, SRC-009, SRC-010, SRC-086]
    currentOwners: [docs/compiler-target-ir.md]
    canonicalTarget: type algebra contract
    decision: >-
      增加 recursive identity、variance、refinement reference、resource handle、opaque external、
      serialization representation 和 Target capability；禁止 any/string defaults。
    invariants:
      - type-identity-separate-from-target-spelling
      - recursive-types-canonicalized
      - unsupported-before-emit
      - representation-compatibility-explicit
    proof:
      - recursive-type-properties
      - cross-target-compatibility-tests
      - serialization-roundtrip

  - id: DEC-007
    title: Compiler uses demand-driven query contracts
    status: extend-canonical-design
    priority: before-controlled-mutation
    sources: [SRC-025, SRC-026, SRC-027, SRC-028, SRC-029, SRC-030]
    currentOwners: [issue-194, docs/compiler-target-ir.md]
    canonicalTarget: compiler query kernel
    decision: >-
      每个 query 声明完整 input closure、动态依赖、output fingerprint、validation、invalidation、
      cancellation、resource class 与 clean oracle；增量是 clean computation 的优化。
    invariants:
      - no-ambient-input
      - dirty-set-monotone-on-unknown
      - clean-incremental-byte-equivalence
      - cache-deletable-and-untrusted
    proof:
      - dependency-audit
      - clean-incremental-differential
      - random-input-invalidation-properties
      - cancellation-no-publication

  - id: DEC-008
    title: Compiler Query DAG and Verification Evidence DAG stay distinct
    status: retain-current-direction
    priority: permanent-invariant
    sources: [SRC-025, SRC-031, SRC-078, SRC-106]
    currentOwners: [issue-194, issue-179, docs/verification-governance.md]
    canonicalTarget: existing separate owners
    decision: 两图最多共享物理 CAS，绝不共享 node schema、status、freshness 或 authority。
    invariants:
      - computation-is-not-proof
      - evidence-key-includes-environment-and-producer
      - compiler-cache-never-merge-evidence
    proof:
      - owner-registry-tests
      - cross-graph-type-negative-tests

  - id: DEC-009
    title: Translation validation added between lowering and support claim
    status: new-focused-authority-needed
    priority: before-controlled-mutation
    sources: [SRC-033, SRC-034, SRC-010, SRC-101]
    currentOwners: [docs/compiler-target-ir.md, docs/verification-governance.md]
    canonicalTarget: lowering validation protocol
    decision: >-
      高风险 pure lowering/optimization 对每个 candidate 做 refinement/translation validation；
      tiny trusted kernels 可形式证明；unsupported 明确阻断或降级到更强 Acceptance。
    invariants:
      - transformation-proof-bound-to-exact-input
      - unsupported-never-promoted
      - verifier-independent-from-candidate-where-trust-root
    proof:
      - semantic-refinement-counterexamples
      - differential-interpreter-tests
      - base-side-verifier-tests

  - id: DEC-010
    title: E-graphs are optional local rewrite provider
    status: defer-until-consumer
    priority: future
    sources: [SRC-035, SRC-036]
    currentOwners: []
    canonicalTarget: optional rewrite provider
    decision: >-
      仅用于 typed pure equivalence search、normalization 和 target optimization；
      需要 side conditions、budget、cost extraction 和 proof witness；不得发现 authority/Responsibility。
    invariants:
      - typed-rewrite-only
      - bounded-saturation
      - extracted-result-validated
      - no-authority-creation
    proof:
      - rewrite-soundness-tests
      - saturation-budget-tests
      - translation-validation

  - id: DEC-011
    title: Delta and equivalence are multi-layer typed relations
    status: extend-canonical-design
    priority: before-controlled-mutation
    sources: [SRC-021, SRC-022, SRC-034, SRC-086]
    currentOwners: [docs/delta-and-impact.md]
    canonicalTarget: delta/equivalence contracts
    decision: >-
      Byte、Syntax、Source Semantic、Engineering、Compilation、Artifact、Runtime 和 Support Delta 分层；
      equivalence/refinement/compatibility 各有 verifier 和 assumptions。
    invariants:
      - empty-byte-delta-not-general-proof
      - direction-and-lineage-explicit
      - equivalence-kind-explicit
      - counterexample-retained
    proof:
      - layer-differential-corpus
      - removal-old-endpoint-impact-tests
      - additional-delta-blocking-tests

  - id: DEC-012
    title: Impact uses monotone lattice and canonical witnesses
    status: retain-current-direction
    priority: before-controlled-mutation
    sources: [SRC-021, SRC-022, SRC-023, SRC-024]
    currentOwners: [docs/delta-and-impact.md, issue-188]
    canonicalTarget: impact rule registry
    decision: definite/possible/unknown 单调传播至 fixpoint，每项有 stable witness；预算耗尽形成 unknown frontier。
    invariants:
      - cycles-terminate
      - inferred-never-upgrades-to-definite
      - missing-rule-expands-unknown
      - no-witness-no-canonical-impact
    proof:
      - lattice-property-tests
      - cycle-model-tests
      - witness-order-determinism

  - id: DEC-013
    title: Conditions bind observations to observedRevision
    status: new-focused-authority-needed
    priority: before-parallel-development
    sources: [SRC-072, SRC-103]
    currentOwners: [docs/system-architecture.md, docs/verification-governance.md]
    canonicalTarget: shared condition contract
    decision: >-
      Ready/Supported/Complete/Recovered 等长期状态使用 True/False/Unknown、reasonCode、
      observedRevision、producerRevision 和 Evidence refs；旧 condition 不附着到新 generation。
    invariants:
      - condition-observed-revision-required
      - unknown-preserved
      - message-not-control-flow
      - stable-reason-code
    proof:
      - stale-condition-negative-tests
      - generation-transition-properties

  - id: DEC-014
    title: Verification object model separates requirement applicability execution result claim evidence
    status: extend-canonical-design
    priority: before-parallel-development
    sources: [SRC-010, SRC-011, SRC-078, SRC-106]
    currentOwners: [issue-215, docs/verification-governance.md]
    canonicalTarget: verification result/evidence contracts
    decision: >-
      Requirement、ApplicabilityProof、GateDefinition、ExecutionPlan、ExecutionRecord、GateResult、
      Claim、EvidenceNode 和 AggregateDecision 分离；环境 ownership 和 zero-test proof 强制。
    invariants:
      - no-false-green
      - result-order-independent
      - duplicate-and-missing-identities-fail
      - reused-evidence-binds-environment
      - cleanup-readback-part-of-result
    proof:
      - issue-215-counterexamples
      - status-lattice-properties
      - evidence-invalidation-tests

  - id: DEC-015
    title: Counterexample Registry unifies property fuzz model and fault failures
    status: new-focused-authority-needed
    priority: before-controlled-mutation
    sources: [SRC-057, SRC-058, SRC-059, SRC-060, SRC-061, SRC-107]
    currentOwners: [issue-180]
    canonicalTarget: counterexample corpus contract
    decision: >-
      保存 producer/revision/property/seed/minimal input/replay/fix revision；
      failure cluster 可引用 counterexample，但反例不成为 semantic authority。
    invariants:
      - every-generated-failure-replayable
      - shrink-result-versioned
      - fixed-counterexample-retained-as-regression
    proof:
      - replay-contract-tests
      - corruption-and-version-mismatch-tests

  - id: DEC-016
    title: Mutation plan and apply are separate deterministic transitions
    status: retain-current-direction
    priority: permanent-invariant
    sources: [SRC-073, SRC-108]
    currentOwners: [docs/semantic-mutation.md]
    canonicalTarget: existing mutation state machine
    decision: Plan 无 live write；Apply 在 lease 内重新读取/replan/CAS；state/cache 不反向成为 desired truth。
    invariants:
      - plan-side-effect-free
      - caller-cannot-submit-derived-fields
      - source-and-semantic-cas
      - no-partial-success
    proof:
      - plan-byte-stability
      - stale-plan-concurrency-tests
      - caller-forgery-negative-tests

  - id: DEC-017
    title: Publication protocol distinguishes logical publication and physical durability
    status: extend-canonical-design
    priority: before-controlled-mutation
    sources: [SRC-050, SRC-051, SRC-052, SRC-055]
    currentOwners: [docs/semantic-mutation.md, docs/runtime-and-distribution.md]
    canonicalTarget: publication durability contract
    decision: >-
      WAL-like intent/stage/publish/marker/fsync/readback/terminal protocol；
      终态区分 not-published、published-unknown、published-durable、rolled-back、recovery-required。
    invariants:
      - journal-before-authority-change
      - uncertain-publication-preserves-recovery-material
      - rollback-cas-does-not-overwrite-successor
      - observable-operation-linearizable
    proof:
      - TLA-model
      - crash-point-fault-traversal
      - filesystem-matrix

  - id: DEC-018
    title: Durable workflow replay cannot own semantic terminal states
    status: extend-canonical-design
    priority: before-parallel-development
    sources: [SRC-053]
    currentOwners: [issue-177, issue-179, docs/development-governance.md]
    canonicalTarget: development run kernel
    decision: >-
      history/replay 只拥有 orchestration progress；clock/random/I/O 经 activities；
      Mutation、Verification、Epoch 等终态仍由各 domain owner 输出。
    invariants:
      - orchestrator-deterministic
      - replay-does-not-repeat-effects
      - workflow-versioning-explicit
      - no-second-terminal-state
    proof:
      - replay-differential-tests
      - workflow-upgrade-tests

  - id: DEC-019
    title: Canonical workspace writes are single-writer linearizable not CRDT merged
    status: retain-current-direction
    priority: permanent-invariant
    sources: [SRC-054, SRC-055, SRC-056]
    currentOwners: [docs/semantic-mutation.md, docs/development-governance.md]
    canonicalTarget: workspace writer contract
    decision: canonical source/semantics/release/policy 使用 single writer + CAS；CRDT 仅用于可合并草稿/注释/UI。
    invariants:
      - no-automatic-authority-conflict-merge
      - operation-has-observable-linearization-point
      - ui-crdt-never-publishes-canonical-state
    proof:
      - concurrent-history-tests
      - CRDT-scope-negative-tests

  - id: DEC-020
    title: Work Package parallelism requires semantic and physical conflict proof
    status: retain-current-direction
    priority: before-parallel-development
    sources: [SRC-025, SRC-055]
    currentOwners: [issue-207, issue-191]
    canonicalTarget: Integration Epoch registry
    decision: authority/state/artifact/path/resource/dependency/verification 全部分离才 parallel-safe；unknown 永不 safe。
    invariants:
      - all-active-pairs-resolved
      - global-writers-unique
      - stale-base-invalidates-epoch
      - permitted-path-not-ownership
    proof:
      - issue-207-matrix
      - Alloy-structure-model
      - integration-recompute-tests

  - id: DEC-021
    title: Authorization is semantic policy plus physical capability attenuation
    status: extend-canonical-design
    priority: before-controlled-mutation
    sources: [SRC-041, SRC-042, SRC-043, SRC-044, SRC-047, SRC-048, SRC-049, SRC-100]
    currentOwners: [docs/semantic-mutation.md, docs/workbench-and-ai-operations.md, docs/runtime-and-distribution.md]
    canonicalTarget: authorization and sandbox provider contracts
    decision: >-
      Cedar-like default deny/forbid 与 SEC typed operation负责语义授权；
      WASI/Landlock/seccomp/平台 adapter负责最小物理能力；任一层不能替代另一层。
    invariants:
      - transport-auth-not-semantic-auth
      - semantic-permit-does-not-grant-ambient-host
      - sandbox-limits-explicit
      - unsupported-capability-visible
    proof:
      - policy-property-tests
      - sandbox-capability-matrix
      - privilege-escalation-negative-tests

  - id: DEC-022
    title: External tool protocols remain transport adapters
    status: interoperability-only
    priority: future
    sources: [SRC-017, SRC-018, SRC-019, SRC-097]
    currentOwners: [docs/workbench-and-ai-operations.md]
    canonicalTarget: tool adapter protocol
    decision: LSP/BSP/DAP/MCP 只解决消息、发现和工具互操作；写入、Impact、Result、Terminal 由 SEC facade。
    invariants:
      - adapter-cannot-expand-operation
      - external-path-not-write-authority
      - external-result-is-evidence-or-proposal
    proof:
      - adapter-forgery-negative-tests
      - protocol-version-compatibility-tests

  - id: DEC-023
