authority: none
constraints: docs/proposals/canonical-architecture-convergence-v1/constraints.yaml

vocabulary:
  disposition: [adopt, adapt, reject, defer, experimental]
  priority: [permanent, integrity-now, before-self-observation, before-controlled-mutation, before-parallel-development, before-brownfield, before-web, before-release, future]

decisions:
  - id: ARCH-001
    title: SEC product identity
    disposition: adopt
    priority: permanent
    sources: [docs/product.md, pr-226]
    decision: deterministic multi-domain engineering semantic compiler plus governed change platform
    canonicalTarget: docs/product.md

  - id: ARCH-002
    title: Minimal Model Federation Kernel and reference closure
    disposition: adapt
    priority: before-self-observation
    sources: [pr-226-DEC-001, docs/system-architecture.md, pr-233-review]
    decision: >-
      Retain federation but restrict the kernel to domain/reference/revision/envelope shapes and one
      cross-domain reference-closure validation contract. Domain fields and state machines stay outside.
    canonicalTarget: docs/system-architecture.md-plus-focused-machine-contract
    requiredChecks: [target-exists, revision-compatible, unique-owner, no-forbidden-authority-cycle, unresolved-preserved]
    trustBoundary: base-side-or-independent-verifier
    rejects: [universal-object-model, universal-edge-schema, central-domain-state]

  - id: ARCH-003
    title: Typed domain snapshots plus Fact/Assertion projection
    disposition: adapt
    priority: before-self-observation
    sources: [docs/semantic-model.md, docs/system-architecture.md, pr-226]
    decision: >-
      Domain typed snapshots own domain invariants. Entity/Fact/Assertion is the rebuildable
      cross-domain assertion and provenance projection, not duplicate domain storage.
    canonicalTarget: docs/semantic-model.md-and-docs/system-architecture.md

  - id: ARCH-004
    title: Universal IR or graph
    disposition: reject
    priority: permanent
    sources: [docs/semantic-model.md, pr-226]
    decision: source, semantic, compilation, impact, Evidence and operational models remain distinct
    reversalCondition: none-within-current-product-definition

  - id: ARCH-005
    title: Structural Semantic Operational contract triad
    disposition: adopt
    priority: permanent
    sources: [pr-226-DEC-002, docs/semantic-mutation.md]
    decision: every public contract declares shape, semantic invariants and operational Effect/failure/recovery
    canonicalTarget: shared-contract-protocol-plus-domain-projections

  - id: ARCH-006
    title: Source bytes LST language semantics and Source Program layers
    disposition: adopt
    priority: before-self-observation
    sources: [pr-226-DEC-003, docs/brownfield-import.md]
    decision: exact bytes/mode, lossless syntax, language semantics and SPM dialect are separate
    canonicalTarget: focused-source-program-authority

  - id: ARCH-007
    title: TypeScript source authority
    disposition: adopt
    priority: before-self-observation
    sources: [docs/roadmap.md, pr-226]
    decision: TypeScript Compiler API owns symbol/type/module semantics; full-fidelity layer owns preservation
    canonicalTarget: typescript-source-provider-contract

  - id: ARCH-008
    title: Semantic Responsibility reconstruction
    disposition: adopt
    priority: before-self-observation
    sources: [issue-224, pr-226-DEC-004]
    decision: Responsibility is an obligation with multiple facets and many-to-many source/function/Block bindings
    canonicalTarget: semantic-model-delta-or-focused-responsibility-authority

  - id: ARCH-009
    title: Effect Resource Capability Algebra
    disposition: adapt
    priority: before-controlled-mutation
    sources: [pr-226-DEC-005, docs/semantic-mutation.md, docs/compiler-target-ir.md]
    decision: create a focused shared algebra domain, not a Federation Kernel field
    canonicalTarget: focused-effect-resource-capability-authority

  - id: ARCH-010
    title: Condition and freshness protocol
    disposition: adapt
    priority: before-parallel-development
    sources: [pr-226-DEC-013, docs/verification-governance.md]
    decision: share True/False/Unknown plus observedRevision envelope; domains retain readiness algorithms
    canonicalTarget: focused-condition-contract

  - id: ARCH-011
    title: Compatibility algebra
    disposition: adapt
    priority: before-brownfield
    sources: [pr-226, docs/change-management.md]
    decision: directional multidimensional result protocol with assumptions and counterexamples; no universal algorithm
    dimensions: [source-api, abi, wire, behavior, resource-ownership, data, deployment]
    canonicalTarget: docs/change-management.md-plus-domain-rule-registries
    doesNotOwn: [support-maturity]

  - id: ARCH-012
    title: Support Claim protocol
    disposition: adopt
    priority: before-release
    sources: [docs/roadmap.md, docs/runtime-and-distribution.md, pr-233-review]
    decision: proposed, contract-frozen, implemented-in-main, physically-verified, packaged-deployed and product-supported are separate states
    canonicalTarget: runtime-verification-release-contracts
    doesNotOwn: [compatibility-decision, evidence-execution]

  - id: ARCH-013
    title: Type Algebra extension
    disposition: adopt
    priority: before-controlled-mutation
    sources: [docs/compiler-target-ir.md, pr-226-DEC-006]
    decision: add recursive, resource, opaque external, representation and directional compatibility semantics
    canonicalTarget: docs/compiler-target-ir.md-and-code

  - id: ARCH-014
    title: Bounded Behavior IR
    disposition: adopt
    priority: permanent
    sources: [docs/compiler-target-ir.md, docs/product.md]
    decision: only fully verifiable and lowerable behavior enters Behavior IR; complex logic stays governed or opaque
    canonicalTarget: docs/compiler-target-ir.md

  - id: ARCH-015
    title: Demand-driven compiler Query Contracts
    disposition: adopt
    priority: before-controlled-mutation
    sources: [issue-194, pr-226-DEC-007]
    decision: queries declare exact inputs, dependencies, fingerprints, invalidation, cancellation and clean oracle
    canonicalTarget: compiler-query-kernel
    prerequisite: clean-deterministic-pipeline

  - id: ARCH-016
    title: Compiler Query DAG versus Evidence DAG
    disposition: adopt
    priority: permanent
    sources: [pr-226-DEC-008, docs/verification-governance.md]
    decision: separate schemas, statuses, freshness and authority; physical CAS may be shared
    canonicalTarget: existing-separate-owners

  - id: ARCH-017
    title: Translation validation
    disposition: adapt
    priority: before-controlled-mutation
    sources: [pr-226-DEC-009]
    decision: use for high-risk pure lowering and support-critical transformations, not every business operation
    canonicalTarget: lowering-validation-protocol

  - id: ARCH-018
    title: E-graphs
    disposition: defer
    priority: future
    sources: [pr-226-DEC-010]
    decision: optional typed pure rewrite provider only after a measured consumer exists
    activationTrigger: repeated-local-rewrite-search-with-measurable-benefit

  - id: ARCH-019
    title: Typed Delta layers
    disposition: adopt
    priority: before-controlled-mutation
    sources: [docs/delta-and-impact.md, pr-226-DEC-011]
    decision: Authoring, Syntax, Source Semantic, Engineering, Compilation, Artifact, Runtime and Support deltas remain distinct
    canonicalTarget: docs/delta-and-impact.md

  - id: ARCH-020
    title: Impact lattice and witnesses
    disposition: adopt
    priority: before-controlled-mutation
    sources: [docs/delta-and-impact.md, issue-188]
    decision: definite/possible/unknown monotone fixpoint with stable witnesses and unknown frontier
    canonicalTarget: impact-rule-registry

  - id: ARCH-021
    title: Plan Apply separation and canonical writes
    disposition: adopt
    priority: permanent
    sources: [docs/semantic-mutation.md]
    decision: read-only plan; apply re-reads and replans under single writer and source plus semantic CAS
    canonicalTarget: existing-mutation-state-machine

  - id: ARCH-022
    title: CRDT scope
    disposition: adapt
    priority: permanent
    sources: [pr-226-DEC-019]
    decision: CRDT is limited to non-authority drafts/comments/UI; canonical state remains single-writer
    canonicalTarget: system-architecture-and-mutation

  - id: ARCH-023
    title: Publication durability protocol
    disposition: adopt
    priority: before-controlled-mutation
    sources: [docs/semantic-mutation.md, pr-226-DEC-017]
    decision: journal, publish marker, fsync/readback, exact rollback and recovery-required
    canonicalTarget: mutation-runtime-publication-contract

  - id: ARCH-024
    title: Verification object decomposition
    disposition: adopt
    priority: integrity-now
    sources: [issue-215, docs/verification-governance.md, pr-226-DEC-014]
    decision: Requirement, Applicability, Gate, Execution, Result, Claim, Evidence and Aggregate remain separate
    canonicalTarget: verification-result-and-evidence-contracts

  - id: ARCH-025
    title: Evidence Action Key and CAS
    disposition: adapt
    priority: before-parallel-development
    sources: [pr-231]
    decision: exact Action Key and trust/freshness precede CAS; CAS never grants semantic authority
    canonicalTarget: evidence-dag-action-contract

  - id: ARCH-026
    title: Candidate Closure
    disposition: adopt
    priority: integrity-now
    sources: [pr-231, docs/development-governance.md]
    decision: orchestration-only state machine consuming Scope, Verification, Review and merge authority
    canonicalTarget: development-integration-domain
    doesNotOwn: [verification-semantics, impact, review-findings]

  - id: ARCH-027
    title: Development state decomposition
    disposition: adopt
    priority: before-parallel-development
    sources: [issues-177-179, issues-188-191, issue-194, issues-205-207, issue-219, issue-221, pr-231]
    decision: selection, capsule, closure, candidate, trusted bootstrap, Evidence, run, integration and publication have separate owners
    canonicalTarget: development-governance-plus-machine-contracts

  - id: ARCH-028
    title: Agent Role Operation Primary Skill architecture
    disposition: adapt
    priority: before-parallel-development
    sources: [pr-229, docs/development-governance.md]
    decision: adopt roles, typed operation envelope, exactly one Primary Skill and deterministic services
    experimental: exact-number-and-names-of-skills
    canonicalTarget: development-governance-and-agent-contracts

  - id: ARCH-029
    title: Context Capsule
    disposition: adopt
    priority: before-parallel-development
    sources: [pr-231, docs/workbench-and-ai-operations.md]
    decision: reason/digest/freshness-bound references loaded on demand, not copied repository summaries
    canonicalTarget: task-context-contract

  - id: ARCH-030
    title: Runtime host and toolchain split
    disposition: adopt
    priority: before-release
    sources: [docs/runtime-and-distribution.md, issue-167]
    decision: runtime-neutral Core, supported Node LTS public host family and independent exact Bun toolchain
    experimental: exact-minimum-node-version
    canonicalTarget: runtime-support-profile

  - id: ARCH-031
    title: Package and domain boundaries
    disposition: adapt
    priority: before-release
    sources: [docs/runtime-and-distribution.md, pr-226]
    decision: logical boundaries approved; physical split requires import/load/cycle/release evidence
    canonicalTarget: dependency-provider-program

  - id: ARCH-032
    title: Workbench and AI write path
    disposition: adopt
    priority: permanent
    sources: [docs/product.md, docs/semantic-mutation.md]
    decision: all surfaces use one query/plan/apply/recover facade; AI only proposes
    canonicalTarget: docs/workbench-and-ai-operations.md

  - id: ARCH-033
    title: Authorization architecture
    disposition: adapt
    priority: before-controlled-mutation
    sources: [docs/semantic-mutation.md]
    decision: typed principal/action/resource/context request intersected with owner, policy and runtime capability
    canonicalTarget: authorization-contract

  - id: ARCH-034
    title: Web frontend
    disposition: adopt
    priority: before-web
    sources: [issue-222]
    decision: native HTML/CSS/TS, then TSX, Impact, governed mutation, browser Evidence and framework adapters
    canonicalTarget: source-program-and-target-profile-domains

  - id: ARCH-035
    title: Specialized platforms
    disposition: adopt
    priority: future
    sources: [pr-226-specialized-platform]
    decision: specialized Provider plus Profile plus typed Resource/Effect plus owning Evidence plus governed/opaque boundary
    canonicalTarget: provider-and-target-domains

  - id: ARCH-036
    title: Generic sandbox boolean
    disposition: reject
    priority: permanent
    sources: [docs/runtime-and-distribution.md, pr-226]
    decision: every isolation claim binds platform, mechanism, capability, generation and physical Evidence

  - id: ARCH-037
    title: External mechanisms
    disposition: adapt
    priority: permanent
    sources: [pr-226-research]
    decision: adopt mechanisms and invariants, never import an external object model as SEC authority
    canonicalTarget: relevant-domain-providers

  - id: ARCH-038
    title: Giant architecture implementation PR
    disposition: reject
    priority: permanent
    sources: [docs/development-governance.md, issue-232]
    decision: one total decision may be frozen, but implementation uses owner-focused Work Packages with retirement proof

  - id: ARCH-039
    title: Product starvation by infrastructure
    disposition: reject
    priority: permanent
    sources: [docs/roadmap.md, pr-231, issue-232]
    decision: after Verification truth, a real self-observation-to-Mutation slice cannot be blocked by unrelated architecture or release work

  - id: ARCH-040
    title: Converged Architecture Baseline V1 adoption
    disposition: adopt
    priority: permanent
    sources: [issue-232, pr-233-review]
    decision: every independent proposal decision receives one canonical target or explicit reject/defer/experiment and parallel final designs retire
    canonicalTarget: system-architecture-plus-domain-deltas
    terminology: not-proven-global-optimum

  - id: ARCH-041
    title: Repository Semantic Index
    disposition: adapt
    priority: before-parallel-development
    sources: [pr-231]
    decision: derived, rebuildable development cache for context/impact/review; never a second Engineering IR
    canonicalTarget: focused-derived-repository-index-contract
    activationTrigger: semantic-test-impact-and-compiler-query-inputs-exist

  - id: ARCH-042
    title: Documentation minimization and proposal lifecycle
    disposition: adopt
    priority: permanent
    sources: [issue-232, pr-233-review]
    decision: >-
      stable prose has one owner; executable detail lives in code; mutable state in machine registries;
      future proposals require target/trigger/evidence/reversal/retirement and cannot remain parallel final designs
    canonicalTarget: docs/authority.json-plus-documentation-governance
