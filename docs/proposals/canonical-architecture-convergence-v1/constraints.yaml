schema: sec-canonical-optimization-constraints-v1
status: proposal
tracking: issue-232

purpose: >-
  This registry is the single temporary convergence index for non-negotiable
  constraints. It is not a second authority. Adoption requires migration into
  the owning canonical document or code contract, followed by retirement here.

executionBoundary:
  currentPhase: convergence-not-adoption
  mainAuthorityUnchanged: true
  noWholeProposalMerge: true
  requiredMigrationUnit: one-canonical-owner-at-a-time

permanentRules:
  - one-owner-per-concept
  - no-second-canonical-document
  - no-second-schema-owner
  - no-second-state-machine-owner
  - no-second-writer
  - unknown-never-means-pass
  - cache-never-means-evidence
  - provider-or-ai-never-creates-authority
  - architecture-proposal-never-becomes-runtime-truth

integrationRules:
  - latest-main-is-source-of-truth-before-migration
  - every-adopted-decision-needs-owner-target
  - every-retired-proposal-needs-replacement-or-archive-target
  - product-vertical-slice-cannot-be-blocked-by-optional-infrastructure
  - every-state-changing-node-needs-main-readback

optimizationRules:
  - hot-feedback-and-authoritative-validation-are-separated
  - measurements-before-performance-claims
  - reuse-only-after-exact-action-identity
  - clean-path-remains-correctness-oracle

nextMigrationOrder:
  - complete-formal-verification-candidate
  - close-verification-truth-gaps
  - start-real-sec-self-observation-slice
  - migrate-converged-decisions-by-domain-owner
  - retire-superseded-proposals
