    flow: authority-and-observations-to-validated-workspace
  - id: compilation
    flow: validated-workspace-and-target-profile-to-artifacts
  - id: operation
    flow: typed-intent-to-accepted-rejected-rolled-back-or-recovery-required
  - id: governance
    flow: work-facts-to-selection-review-integration-publication-and-closeout

