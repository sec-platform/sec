stateMachineOwners:
  work-selection: issue-221
  task-capsule: issue-205
  change-closure: issue-219
  candidate-epoch-failure: issue-177
  verification-result: issues-176-215
  trusted-bootstrap: issue-178
  evidence-dag-run-journal: issue-179
  test-impact: issue-188
  hermetic-test-runtime: issue-190
  compiler-query-graph: issue-194
  automatic-feedback: issue-189
  integration-epoch: issues-191-207
  mutation-transaction: docs-semantic-mutation-and-code
  candidate-closure: development-integration-orchestrator-only

sourceArchitecture:
  layers:
    - exact-bytes-and-mode
    - lossless-syntax
    - language-semantic-model
    - source-program-dialect
    - candidate-extraction
    - reconciliation
    - canonical-semantic-domain
  typescript:
    semanticAuthority: typescript-compiler-api
    preservationLayer: full-fidelity-lst
  optionalProviders:
    - tree-sitter
    - ts-morph
    - ast-grep
    - codeql
    - runtime-trace
    - ai-inference

compilerArchitecture:
  stages:
    - target-profile
    - type-algebra
    - application-ir
    - bounded-behavior-ir
    - target-program-ir
    - backend
  executionModel: demand-driven-query-after-clean-correctness
  queryGraphAndEvidenceGraphSeparated: true
  translationValidation: high-risk-pure-transformations
  eGraph: deferred-until-typed-rewrite-consumer

mutationArchitecture:
  planApplySeparated: true
  canonicalWriteModel: single-writer-linearizable-cas
  crdtScope: non-authority-drafts-comments-ui
  terminals: [accepted, rejected, rolled-back, recovery-required]
  publicationStates:
    - not-published
    - published-durability-unknown
    - published-durable
    - rolled-back
    - recovery-required

verificationArchitecture:
  statuses: [passed, failed, not-run, unsupported, invalidated]
  dispositions: [executed, reused, not-executed]
  notRunRequiresApplicabilityProof: true
  actionCacheSeparatedFromCas: true
  failureReusableOnlyForDiagnosis: true
  trustRootUsesIndependentVerifier: true

developmentArchitecture:
  primaryChain:
    - ready-issue
    - trusted-orientation
    - task-capsule
    - change-closure
    - authorized-operation
    - incremental-feedback
    - candidate-closure
    - independent-review
    - integration-epoch
    - expected-head-publication
    - main-readback-cleanup-replan
  agent:
    rolesSeparatedFromSkills: true
    typedOperationEnvelope: true
    exactlyOnePrimarySkill: true
    permanentSkillCount: false
    deterministicRulesOutsideProse: true

runtimeArchitecture:
  semanticCore: runtime-neutral
  publicCliHost: supported-node-lts-family
  repositoryToolchain: exact-bun-until-evidence-changes-decision
  targetHostToolchainOrthogonal: true
  contentAddressedStorageScope: immutable-derived-artifact-and-evidence-blobs
  nonCacheState:
    - authoring-source
    - writer-generation
    - transaction-journal
    - recovery-state
    - canonical-policy

webArchitecture:
  sequence:
    - native-html-css-typescript
    - jsx-tsx-binding
    - cross-artifact-impact
    - governed-web-mutation
    - browser-evidence
    - framework-adapters
  runtimeDomIsEvidenceNotSourceAuthority: true

specializedPlatforms:
  pattern:
    - specialized-provider
    - target-capability-profile
    - typed-resource-effect
    - owning-environment-evidence
    - governed-or-opaque-boundary
  mustNotExpandUniversalBehaviorIr: true

security:
  authorizationRequest: principal-action-resource-context
  defaultDeny: true
  forbidPrecedence: true
  semanticPermissionAndRuntimeAttenuationIntersect: true
  secretsExcludedFrom: [engineering-ir, ai-context, normal-logs, generic-evidence]
  genericSandboxBooleanRejected: true

supportMaturity:
  - proposed
  - contract-frozen
  - implemented-in-main
  - physically-verified
  - packaged-deployed
  - product-supported

forbiddenArchitectures:
  - universal-ir
  - universal-graph
  - generic-property-bag-core
  - one-revision-for-all-domains
  - one-function-one-responsibility
  - one-responsibility-one-block
  - provider-or-ai-creates-authority
  - query-cache-equals-evidence
  - canonical-crdt-auto-merge
  - skill-prose-state-machine
  - current-host-implies-target
  - unsupported-or-unknown-equals-pass
  - giant-cross-domain-implementation-pr
