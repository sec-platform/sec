      - domain-specific-invariants
      - domain-specific-failure-algorithm

  - id: type-algebra
    canonicalTarget: docs/compiler-target-ir.md
    owns:
      - type-identity
      - normalization
      - representation
      - target-mapping
      - directional-type-compatibility

  - id: effect-resource-capability
    canonicalTarget: new-focused-authority-plus-semantic-compiler-mutation-projections
    owns:
      - effect-identity
      - resource-reference
      - capability-requirement
      - determinism-idempotency-isolation-compensation
