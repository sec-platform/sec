    - real-brownfield-adopt-normalize

federationKernel:
  canonicalTarget: docs/system-architecture.md-plus-focused-machine-contract
  scope: minimal-cross-domain-protocol
  owns:
    - domain-id-and-descriptor-shape
    - stable-typed-reference-shape
    - domain-revision-reference-shape
    - authority-and-producer-reference-shape
    - validated-snapshot-envelope
    - coverage-and-unknown-frontier-envelope
    - migration-and-retirement-reference
    - reference-closure-validation-contract
  referenceClosureValidation:
    checks:
      - referenced-domain-and-object-exist
      - referenced-revision-is-compatible
      - canonical-owner-is-unique
      - forbidden-authority-cycle-is-absent
      - unresolved-frontier-is-preserved
    owner: one-federation-reference-closure-validator
    trustBootstrap: base-side-or-independent-verifier
  explicitlyDoesNotOwn:
    - domain-object-fields
    - domain-state-machines
    - type-or-effect-algorithms
    - verification-status-or-aggregation
    - mutation-terminal
    - agent-lifecycle
    - compatibility-decision
    - support-enablement
    - release-state
    - provider-brands
    - business-names

sharedProtocolDomains:
  - id: contract-protocol
    canonicalTarget: docs/system-architecture.md-plus-focused-machine-contract
    owns:
      - structural-contract-envelope
      - semantic-invariant-reference
      - operational-contract-reference
    doesNotOwn: [domain-invariants, domain-failure-algorithms]

  - id: type-algebra
    canonicalTarget: docs/compiler-target-ir.md
    owns: [type-identity, normalization, representation, target-mapping, directional-type-compatibility]

  - id: effect-resource-capability
    canonicalTarget: focused-effect-resource-capability-authority
    owns:
      - effect-identity
      - resource-reference
      - capability-requirement
      - determinism-idempotency-isolation-compensation
      - failure-and-observability-contract
    doesNotOwn: [authorization-decision, runtime-sandbox-implementation]

  - id: condition-freshness
    canonicalTarget: focused-condition-contract
    owns: [true-false-unknown-envelope, observed-revision, producer-revision, stable-reason-code, evidence-reference]
    doesNotOwn: [domain-readiness-algorithm]

  - id: compatibility
    canonicalTarget: docs/change-management.md-plus-domain-rule-registries
    owns: [directional-result-envelope, dimension-registry, assumptions-and-counterexamples]
    dimensions: [source-api, abi, wire, behavior, resource-ownership, data, deployment]
    doesNotOwn: [product-support-maturity, universal-compatibility-algorithm]

  - id: support-claim
    canonicalTarget: docs/runtime-and-distribution.md-plus-verification-and-release-contracts
    owns: [support-claim-identity, maturity-vocabulary, owning-environment-evidence-references, invalidation]
    maturity:
      - proposed
      - contract-frozen
      - implemented-in-main
      - physically-verified
      - packaged-deployed
      - product-supported
    doesNotOwn: [compatibility-algorithms, evidence-execution, product-policy-decision]

planes:
