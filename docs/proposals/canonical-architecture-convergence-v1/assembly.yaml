architecturePatterns:
  source:
    layers: [exact-bytes-mode, lossless-syntax, language-semantics, source-program-dialect, candidates, reconciliation]
    typescriptSemanticAuthority: typescript-compiler-api
  compiler:
    stages: [target-profile, type-algebra, application-ir, bounded-behavior-ir, target-program-ir, backend]
    queryModel: demand-driven-after-clean-correctness
    queryAndEvidenceGraphsSeparated: true
  mutation:
    writeModel: single-writer-linearizable-cas
    terminals: [accepted, rejected, rolled-back, recovery-required]
  verification:
    statuses: [passed, failed, not-run, unsupported, invalidated]
    dispositions: [executed, reused, not-executed]
    notRunRequiresApplicabilityProof: true
  runtime:
    semanticCore: runtime-neutral
    repositoryToolchain: exact-bun-until-evidence-changes-decision
    targetHostToolchainOrthogonal: true
  web:
    sequence: [native-html-css-typescript, jsx-tsx-binding, cross-artifact-impact, governed-web-mutation, browser-evidence, framework-adapters]
    runtimeDomIsEvidenceNotSourceAuthority: true

forbiddenArchitectures:
  - universal-ir-or-graph
  - generic-property-bag-core
  - one-revision-for-all-domains
