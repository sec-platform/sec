schema: sec-canonical-architecture-implementation-dag-v1
status: proposal
tracking: issue-232
exactMain: 6cc3bf8a3b655bebf85dfca3f065c9842207c086
authority: none

objective:
  primary: shortest-trustworthy-path-to-sec-typescript-product-closure
  optimizationOrder:
    - correctness-and-trust-integrity
    - first-pass-yield
    - user-visible-product-vertical-slices
    - repeatable-candidate-delivery
    - safe-parallelism
    - incremental-performance
    - ecosystem-breadth
  antiGoals:
    - giant-architecture-implementation-pr
    - infrastructure-before-consumer
    - speculative-package-splitting
    - automatic-parallelism-before-conflict-proof
    - another-parallel-final-design

hardSchedulingRules:
  - current-formal-work-package-closes-before-canonical-authority-write
  - integrity-p0-p1-blockers-preempt-product-publication
  - architecture-phase-a-may-remain-read-only-parallel
  - after-verification-and-release-integrity-no-optional-infrastructure-may-preempt-first-product-slice
  - every-node-has-one-canonical-owner-and-retirement-output
  - no-node-claims-completion-before-main-readback

lanes:
  - id: integrity-delivery
    purpose: make-current-truth-and-candidate-publication-reliable
  - id: architecture-convergence
    purpose: migrate-this-decision-into-single-canonical-owners-and-retire-parallel-designs
  - id: product-vertical
    purpose: prove-the-architecture-through-self-observation-impact-mutation-and-lowering
  - id: acceleration
    purpose: automate-only-after-correct-owners-and-action-keys-exist
  - id: platform-expansion
    purpose: add-brownfield-web-runtime-release-and-ecosystem-after-core-closure

