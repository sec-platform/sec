parallelWindows:
  - after: I0-close-pr-227
    allowed:
      - I1-verification-aggregate-truth
      - I2-release-credential-closure
      - A1-canonical-assembly-authority
    condition: exact-write-and-authority-conflicts-resolved
  - after: P2-responsibility-self-observation
    allowed:
      - P3-responsibility-impact-explain
      - P5-minimal-target-and-type-closure
      - D0-candidate-closure-read-only
    condition: domain-writes-and-shared-contract-revisions-are-disjoint
  - after: D2-integration-resolver-v1-1
    allowed:
      - multiple-formal-work-packages
    condition: integration-epoch-machine-proof

stopAndReversal:
  - condition: new-p0-or-p1-integrity-counterexample
    action: preempt-and-return-to-owning-integrity-node
  - condition: product-slice-requires-business-name-core-branch
    action: return-to-responsibility-type-or-behavior-model
  - condition: shared-kernel-starts-owning-domain-fields
    action: shrink-kernel-and-restore-domain-owner
  - condition: incremental-result-differs-from-clean
    action: disable-incremental-publication-and-fix-query-contract
  - condition: architecture-work-delays-product-after-I1-I2
    action: pause-optional-architecture-and-run-P0-through-P4
