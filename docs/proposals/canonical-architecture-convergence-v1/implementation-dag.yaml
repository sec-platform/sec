schema: sec-canonical-architecture-implementation-dag-v2
status: proposal
tracking: issue-232
exactMain: 6cc3bf8a3b655bebf85dfca3f065c9842207c086
authority: none
constraints: docs/proposals/canonical-architecture-convergence-v1/constraints.yaml

objective:
  primary: shortest-trustworthy-path-to-sec-typescript-product-closure
  optimizationOrder:
    - correctness-and-trust-integrity
    - first-pass-yield
    - user-visible-product-vertical-slice
    - repeatable-candidate-delivery
    - safe-parallelism
    - incremental-performance
    - ecosystem-breadth

hardRules:
  - every-node-has-one-owner
  - every-node-has-deterministic-completion
  - no-node-self-validates-a-new-trust-root
  - unrelated-release-or-documentation-work-cannot-block-product-observation
  - optional-infrastructure-cannot-preempt-product-after-verification-truth
  - completion-requires-main-readback-or-explicit-read-only-evidence

lanes:
  - id: integrity
  - id: architecture-projection
  - id: product
  - id: delivery-automation
  - id: evidence-and-feedback
  - id: integration
  - id: expansion

nodes:
  - id: I0-close-pr-227
    lane: integrity
    owner: issue-217-pr-227
    requires: []
    outputs: [canonical-claim-summary-adapter, control-plane-handoff, exact-head-evidence, main-readback]
    completion:
      - all-current-review-findings-resolved
      - focused-adapter-typecheck-docs-audit-pass
      - exact-head-hosted-quick-pass
      - single-parent-merge-and-main-readback

  - id: I1-verification-aggregate-truth
    lane: integrity
    owner: issue-215
    requires: [I0-close-pr-227]
    outputs: [order-independent-lattice, owning-environment-policy, not-applicable-policy, zero-test-truth]
    completion:
      - counterexample-and-property-suite-pass
      - writers-and-readers-use-one-aggregate-owner
      - exact-hosted-evidence-and-main-readback

  - id: I2-release-credential-closure
    lane: integrity
    owner: issue-216
    requires: [I0-close-pr-227]
    outputs: [authenticated-release-verification, physical-release-workflow-evidence]
    completion:
      - real-single-parent-release-candidate-runs-end-to-end
      - workflow-contract-and-physical-run-agree
    blocksOnly: [X2-runtime-package-release]

  - id: A0-convergence-baseline
    lane: architecture-projection
    owner: issue-232
    requires: []
    outputs: [decision-baseline, constraints-registry, relation-projection, dependency-dag, retirement-plan]
    completion:
      - independent-adversarial-review-complete
      - every-review-finding-resolved-or-recorded
      - no-canonical-or-control-plane-write

  - id: A1-reference-closure-contract
    lane: architecture-projection
    owner: system-architecture-domain
    requires: [A0-convergence-baseline, I0-close-pr-227]
    outputs: [reference-shapes, reference-closure-validator, generated-navigation-projection]
    trustBootstrap: existing-base-validator-or-independent-verifier
    scope:
      - assembly-projection-owns-nothing
      - system-architecture-retains-layering-and-authority-flow
      - validator-checks-existence-revision-owner-cycle-and-unresolved-frontier
    completion:
      - independent-verifier-rejects-seeded-invalid-assemblies
      - docs-authority-and-reference-tests-pass
      - generated-projection-main-readback
    blocksOnly: [future-cross-domain-workspace-aggregation]

  - id: P0-select-self-observation-corpus
    lane: product
    owner: product-roadmap-domain
    requires: [I1-verification-aggregate-truth]
    outputs: [controlled-sec-subsystem, human-authority-baseline, exact-inventory, acceptance-inventory, opaque-boundaries]
    selection:
      - real-sec-consumer
      - meaningful-responsibility-state-effect-permission
      - small-enough-for-complete-proof
      - mutation-and-rollback-possible
      - not-a-toy-fixture
    completion:
      - selected-repository-paths-and-revision-are-frozen
      - authority-baseline-and-acceptance-ids-are-reviewed
      - source-generated-vendor-opaque-boundaries-are-classified
      - unsupported-assumptions-are-explicit

  - id: P1-typescript-source-program
    lane: product
    owner: source-program-domain
    requires: [P0-select-self-observation-corpus]
    outputs: [source-program-snapshot, lossless-bindings, type-symbol-module-model, coverage-and-unknown]
    completion:
      - byte-stable-rebuild
      - rename-move-identity-tests
      - provider-and-parse-failure-fail-closed
      - source-program-does-not-become-engineering-authority

  - id: P2-responsibility-self-observation
    lane: product
    owner: responsibility-domain
    requires: [P1-typescript-source-program]
    outputs: [responsibility-candidates, facet-bindings, reconciliation, canonical-responsibility-snapshot]
    completion:
      - compact-function-multiple-facets-proven
      - cross-file-responsibility-identity-proven
      - AI-and-static-candidates-cannot-self-authorize
      - result-compared-with-human-authority-baseline

  - id: P3-responsibility-delta-impact-explain
    lane: product
    owner: delta-impact-domain
    requires: [P2-responsibility-self-observation]
    outputs: [typed-delta, responsibility-impact, canonical-witnesses, unknown-frontier]
    completion:
      - facet-change-does-not-blindly-impact-unrelated-facets
      - removal-uses-old-endpoint
      - cycles-converge
      - missing-rule-remains-unknown

  - id: E0-focused-effect-resource-capability
    lane: product
    owner: effect-resource-capability-domain
    requires: [P2-responsibility-self-observation]
    outputs: [minimal-effect-identity, resource-reference, capability-requirement, failure-compensation-contract]
    scope: only-fields-consumed-by-first-governed-mutation
    completion:
      - one-owner-and-no-federation-kernel-leak
      - semantic-permission-and-runtime-capability-remain-separate
      - composition-and-forbidden-effect-tests-pass

  - id: P4-one-governed-mutation
    lane: product
    owner: semantic-mutation-domain
    requires: [P3-responsibility-delta-impact-explain, E0-focused-effect-resource-capability, I1-verification-aggregate-truth]
    outputs: [versioned-operation, read-only-plan, source-path-proof, isolated-transform, actual-delta, terminal-result]
    completion:
      - stale-plan-and-concurrent-writer-rejected
      - forbidden-facets-preserved
      - crash-boundary-and-rollback-proven
      - existing-cli-or-product-adapter-consumes-shared-facade
      - real-source-bytes-and-live-readback-proven

  - id: P5-minimal-target-type-ir
    lane: product
    owner: target-compilation-domain
    requires: [P2-responsibility-self-observation]
    outputs: [typescript-target-profile, minimal-type-algebra, application-ir, bounded-behavior-ir, target-program-ir, backend]
    completion:
      - unsupported-before-emit
      - no-business-name-core-branches
      - validated-boundary-per-layer
      - byte-stable-output-and-source-map

  - id: P6-three-model-typescript-lowering
    lane: product
    owner: target-compilation-domain
    requires: [P4-one-governed-mutation, P5-minimal-target-type-ir]
    outputs: [lifecycle-model, reservation-model, approval-model, governed-extension-case]
    completion:
      - no-core-specialization-between-models
      - typecheck-runtime-negative-and-roundtrip-pass
      - legacy-writer-retired-per-artifact
      - real-consumer-uses-output

  - id: P7-workbench-ai-shared-facade
    lane: product
    owner: workbench-ai-domain
    requires: [P4-one-governed-mutation, P3-responsibility-delta-impact-explain]
    outputs: [referenced-projections, context-capsule, bounded-AI-proposal, shared-plan-apply-recover-facade]
    completion:
      - workbench-and-CLI-bind-same-plan-identity
      - UI-and-AI-cannot-create-authority-or-expand-permission
      - unknown-and-Evidence-remain-visible

  - id: C0-candidate-closure-read-only
    lane: delivery-automation
    owner: development-integration-domain
    requires: [I1-verification-aggregate-truth]
    outputs: [candidate-closure-state, unique-next-transition, stale-head-invalidation, read-only-receipt]
    completion:
      - historical-PR-replay
      - byte-stable-plan
      - no-write-mode

  - id: C1-candidate-closure-service
    lane: delivery-automation
    owner: development-integration-domain
    requires: [C0-candidate-closure-read-only]
    outputs: [trusted-dispatch, review-readback, expected-head-publication-adapter, main-closeout-receipt]
    completion:
      - candidate-cannot-self-prove
      - stale-runs-cancel-or-invalidate
      - permission-and-dry-run-boundaries-pass
      - local-bootstrap-remains-fallback-not-normal-owner

  - id: F0-candidate-epoch-failure
    lane: evidence-and-feedback
    owner: issue-177
    requires: [I1-verification-aggregate-truth, C0-candidate-closure-read-only]
    outputs: [candidate-epoch, failure-fingerprint, deterministic-next-action]
    completion:
      - unchanged-deterministic-failure-is-reused-for-diagnosis
      - changed-causal-input-creates-new-epoch

  - id: B0-trusted-bootstrap
    lane: evidence-and-feedback
    owner: issue-178
    requires: [F0-candidate-epoch-failure]
    outputs: [trusted-base-runner, trust-root-input-closure, bootstrap-evidence]
    completion:
      - candidate-trust-root-change-cannot-authorize-itself
      - base-side-adversarial-vectors-pass

  - id: J0-evidence-dag-run-journal
    lane: evidence-and-feedback
    owner: issue-179
    requires: [F0-candidate-epoch-failure, B0-trusted-bootstrap]
    outputs: [action-key, evidence-dag, run-journal, invalidation-lineage]
    completion:
      - stale-input-invalidates-node
      - replay-does-not-repeat-effects
      - compiler-cache-is-not-Evidence

  - id: T0-semantic-test-impact
    lane: evidence-and-feedback
    owner: issue-188
    requires: [P3-responsibility-delta-impact-explain, I1-verification-aggregate-truth]
    outputs: [semantic-to-test-recommendations, repository-owner-closure, unknown-frontier]
    completion:
      - Full-backstop-false-negative-learning
      - missing-coverage-does-not-become-no-impact

  - id: Q0-compiler-query-kernel
    lane: evidence-and-feedback
    owner: issue-194
    requires: [P5-minimal-target-type-ir]
    outputs: [query-contract, dynamic-dependencies, clean-oracle, cancellation]
    completion:
      - clean-incremental-equivalence
      - no-ambient-input
      - cancellation-does-not-publish

  - id: R0-derived-repository-semantic-index
    lane: evidence-and-feedback
    owner: focused-derived-index-owner
    requires: [T0-semantic-test-impact, Q0-compiler-query-kernel]
    outputs: [rebuildable-symbol-owner-impact-index]
    completion:
      - delete-and-rebuild-parity
      - no-semantic-authority-or-publication-right
      - revision-and-coverage-visible

  - id: W0-automatic-feedback
    lane: evidence-and-feedback
    owner: issue-189
    requires: [T0-semantic-test-impact, R0-derived-repository-semantic-index]
    outputs: [warm-plan-only-feedback, persistent-watch-adapter, thin-check-selection]
    completion:
      - warm-clean-parity
      - daemon-restart-does-not-lose-correctness
      - advisory-feedback-cannot-be-merge-Evidence

  - id: G0-integration-resolver
    lane: integration
    owner: issue-207
    requires: [I1-verification-aggregate-truth, C0-candidate-closure-read-only]
    outputs: [requires-order-conflict-resolution, cycle-missing-target-rejection, integration-epoch-registry]
    completion:
      - two-to-four-real-work-packages-replayed
      - unresolved-never-parallel-safe
      - deterministic-order-and-closeout

  - id: G1-safe-virtual-merge
    lane: integration
    owner: integration-epoch-domain
    requires: [G0-integration-resolver, J0-evidence-dag-run-journal, T0-semantic-test-impact]
    outputs: [virtual-merge-tree, combined-affected-closure, Evidence-reuse-invalidation, queue-closeout]
    completion:
      - combined-state-proven-before-merge
      - unrelated-Evidence-survives-one-candidate-failure

  - id: X0-typescript-brownfield-adopt-normalize
    lane: expansion
    owner: brownfield-domain
    requires: [P4-one-governed-mutation, P6-three-model-typescript-lowering]
    outputs: [real-attach-lift-reconcile-adopt, one-module-normalize, roundtrip-mutation-rollback]
    completion:
      - coverage-and-unknown-visible
      - provider-does-not-own-authority
      - no-unexplained-owner-consumer-artifact-drift

  - id: X1-web-native-tsx
    lane: expansion
    owner: web-source-target-domain
    requires: [X0-typescript-brownfield-adopt-normalize]
    outputs: [HTML-CSS-TS-source-models, TSX-bindings, cross-artifact-impact, governed-web-mutation, browser-Evidence]
    completion:
      - runtime-DOM-is-not-source-authority
      - dynamic-cascade-hydration-unknown-explicit
      - native-and-TSX-corpora-pass

  - id: X2-runtime-package-release
    lane: expansion
    owner: runtime-release-domain
    requires: [P6-three-model-typescript-lowering, I2-release-credential-closure]
    outputs: [Node-host-profile, Bun-toolchain-separation, clean-package, cross-host-determinism, publication-receipt]
    completion:
      - physical-host-platform-matrix
      - packaged-consumer-smoke
      - support-enabled-only-after-Evidence

  - id: X3-registry-ecosystem
    lane: expansion
    owner: registry-provider-domain
    requires: [X0-typescript-brownfield-adopt-normalize, X2-runtime-package-release]
    outputs: [trusted-registry, compatibility-migration-revocation, language-provider-protocol]
    completion:
      - TypeScript-product-closure-already-real
      - supply-chain-and-retirement-proof

productCriticalPaths:
  observationToMutation:
    - I0-close-pr-227
    - I1-verification-aggregate-truth
    - P0-select-self-observation-corpus
    - P1-typescript-source-program
    - P2-responsibility-self-observation
    - P3-responsibility-delta-impact-explain
    - E0-focused-effect-resource-capability
    - P4-one-governed-mutation
  lowering:
    - P2-responsibility-self-observation
    - P5-minimal-target-type-ir
    - P6-three-model-typescript-lowering
  brownfield:
    - P4-one-governed-mutation
    - P6-three-model-typescript-lowering
    - X0-typescript-brownfield-adopt-normalize

parallelMilestones:
  after-I0: [I1-verification-aggregate-truth, I2-release-credential-closure, A1-reference-closure-contract]
  after-P2: [P3-responsibility-delta-impact-explain, E0-focused-effect-resource-capability, P5-minimal-target-type-ir]
  after-I1: [P0-select-self-observation-corpus, C0-candidate-closure-read-only, G0-integration-resolver]
  note: milestone-members-are-not-implicitly-ordered

reversalRules:
  - when: new-P0-or-P1-integrity-counterexample
    action: preempt-only-the-owning-path
  - when: product-slice-requires-business-name-Core-branch
    action: return-to-responsibility-type-or-behavior-model
  - when: kernel-starts-owning-domain-fields
    action: shrink-kernel
  - when: incremental-differs-from-clean
    action: disable-incremental-publication-and-fix-query-contract
  - when: optional-work-delays-P0-through-P4
    action: pause-optional-work-and-resume-product-path
