proposalLifecycle:
  dispositionEnum: [adopt, adapt, defer, experimental, reject, retired]
  requiredFields:
    adopt: [canonicalTarget, migration, retirementTarget]
    adapt: [canonicalTarget, migration, retainedInvariants, rejectedParts, retirementTarget]
    defer: [activationTrigger, reconsiderationEvidence, retirementTarget]
    experimental: [activationTrigger, evidencePlan, successAndFailureCriteria, retirementTarget]
    reject: [reason, reversalCondition, retirementTarget]
    retired: [archiveOrDeletion, consumerReadback]
  invariant: one-disposition-per-proposal-with-multiple-required-fields-allowed

