schema: sec-converged-architecture-plan-v3
status: proposal
tracking: issue-232
authority: none
exactMain: 6cc3bf8a3b655bebf85dfca3f065c9842207c086
mergePolicy: extract-focused-canonical-deltas-never-merge-this-plan-whole

purpose: >-
  Preserve the complete adjudicated future design in one non-authoritative machine record,
  eliminate parallel proposal surfaces, and define the shortest trustworthy migration from
  current main to real SEC product closure.

artifactModel:
  humanEntry: docs/proposals/canonical-architecture-convergence-v1/README.md
  machineRecord: docs/proposals/canonical-architecture-convergence-v1/canonical-plan.yaml
  allowedFilesInThisProposal: [README.md, canonical-plan.yaml]
  prohibitedParallelArtifacts:
    - separate-constraint-registry
    - separate-decision-ledger
    - separate-architecture-assembly
    - separate-implementation-dag
    - separate-migration-plan
    - separate-execution-policy
  canonicalAdoptionRule: one-owner-at-a-time-from-then-latest-main

optimization:
  objectiveOrder:
    - first-trustworthy-user-visible-product-closure
    - correctness-and-trust-integrity
    - first-pass-yield
    - edit-to-useful-signal-latency
    - ready-to-main-readback-latency
    - validated-work-reuse
    - minimum-irreversible-architecture
    - safe-parallelism
    - ecosystem-breadth
  antiMetrics:
    - number-of-documents
    - number-of-abstractions
    - number-of-skills
    - number-of-agents
    - number-of-workflows
    - theoretical-future-coverage-without-consumers
  singleExecutionPath:
    - intent
    - operation
    - capability-resolution
    - deterministic-plan
    - impact
    - controlled-mutation
    - verification
    - evidence
    - integration
    - main-readback
  reversalRule: >-
    If evidence invalidates an identity, owner, dependency, trust boundary, or product assumption,
    return to that decision and recompute; never accumulate downstream exceptions.

constraintClasses:
  permanent: product or trust-model invariant
  evidenceGatedDefault: current default changeable only by comparative evidence and migration
  experiment: cannot block product work until an activated consumer exists
  rejected: prohibited until its explicit reversal condition becomes true

permanentConstraints:
  - id: C-AUTH-001
    ownerTarget: docs/system-architecture.md
    statement: authority, canonical state, Evidence, projection, cache and UI are distinct identities
  - id: C-AUTH-002
    ownerTarget: docs/system-architecture.md
    statement: every canonical identity, revision algorithm, producer, validator, writer and selector has one owner
  - id: C-AUTH-003
    ownerTarget: federation-reference-closure-contract
    statement: one validator owns cross-domain target existence, revision compatibility, unique ownership, forbidden authority cycles and unresolved frontiers
    bootstrap: base-side-or-independent-verifier
  - id: C-UNKNOWN-001
    ownerTarget: docs/semantic-model.md
    statement: unknown, ambiguous, conflicted, stale, unsupported and opaque are explicit and never project to safe, ready or passed
  - id: C-MODEL-001
    ownerTarget: docs/system-architecture.md
    statement: no universal IR, universal graph, generic property-bag Core or one revision for all domains
  - id: C-MODEL-002
    ownerTarget: docs/semantic-model.md
    statement: typed domain snapshots own domain truth; Fact and Assertion are rebuildable cross-domain provenance projections
  - id: C-SOURCE-001
    ownerTarget: docs/brownfield-import.md
    statement: exact bytes, lossless syntax, language semantics, Source Program dialect, candidates and reconciliation remain separate
  - id: C-RESP-001
    ownerTarget: docs/semantic-model.md
    statement: Responsibility is an obligation with many-to-many function, source and Block bindings, never a function, cluster or AI summary
  - id: C-CONTRACT-001
    ownerTarget: focused-contract-protocol
    statement: public contracts define structural, semantic and operational obligations
  - id: C-EFFECT-001
    ownerTarget: focused-effect-resource-capability-contract
    statement: Effect, Resource and Capability form a typed shared protocol outside the Federation Kernel
  - id: C-COMPAT-001
    ownerTarget: docs/change-management.md
    statement: Compatibility is directional and multidimensional and remains separate from Support Claim maturity
  - id: C-SUPPORT-001
    ownerTarget: runtime-verification-release-contracts
    statement: every Support Claim transition consumes the single owning transition contract and proves every predecessor state
  - id: C-COMPILER-001
    ownerTarget: docs/compiler-target-ir.md
    statement: every compiler layer has one producer and raw-to-validated immutable boundary
  - id: C-COMPILER-002
    ownerTarget: docs/compiler-target-ir.md
    statement: Behavior IR remains bounded; complex algorithms remain governed extensions or opaque boundaries
  - id: C-INCREMENTAL-001
    ownerTarget: compiler-query-contract
    statement: incremental and daemon paths are optimizations of the clean oracle and must be clean-equivalent
  - id: C-GRAPH-001
    ownerTarget: compiler-query-and-verification-owners
    statement: Compiler Query DAG and Verification Evidence DAG have separate schemas, authority, freshness and status
  - id: C-DELTA-001
    ownerTarget: docs/delta-and-impact.md
    statement: authoring, syntax, source semantic, engineering, compilation, artifact, runtime and support deltas remain distinct
  - id: C-IMPACT-001
    ownerTarget: docs/delta-and-impact.md
    statement: Impact uses definite, possible and unknown monotone results with witnesses and unknown frontier
  - id: C-MUTATION-001
    ownerTarget: docs/semantic-mutation.md
    statement: plan and apply are separate; apply replans under one writer with source and semantic CAS
  - id: C-MUTATION-002
    ownerTarget: docs/semantic-mutation.md
    statement: mutation terminals are accepted, rejected, rolled-back or recovery-required; partial success is forbidden
  - id: C-PUBLISH-001
    ownerTarget: mutation-runtime-publication-contract
    statement: publication distinguishes not-published, durability-unknown, durable, rolled-back and recovery-required
  - id: C-VERIFY-001
    ownerTarget: docs/verification-governance.md
    statement: candidate cannot prove changes to its own validator, selector, workflow, docs-doctor or merge authority
  - id: C-VERIFY-002
    ownerTarget: docs/verification-governance.md
    statement: not-run requires trusted applicability proof; missing, stale, unsupported, unknown, cleanup or readback failure cannot pass
  - id: C-EVIDENCE-001
    ownerTarget: evidence-action-contract
    statement: Action Cache metadata and content-addressed storage are separate; cache bytes never grant semantic authority
  - id: C-AGENT-001
    ownerTarget: docs/development-governance.md
    statement: Intent and typed Operation are execution axes; Skill is a strategy and routing surface only
  - id: C-AGENT-002
    ownerTarget: operation-permission-contract
    statement: Skill prose cannot own permission, state, candidate truth, Verification, integration order or current SHA
  - id: C-DEV-001
    ownerTarget: docs/development-governance.md
    statement: work selection, Task Capsule, Change Closure, Candidate, Bootstrap, Evidence Run, Integration and Mutation have distinct state owners
  - id: C-PRODUCT-001
    ownerTarget: docs/roadmap.md
    statement: optional infrastructure cannot preempt the first real self-observation-to-mutation product slice
  - id: C-DOC-001
    ownerTarget: docs/authority.json
    statement: one stable semantic owner per concept; navigation owns nothing; dynamic facts live in registries or current control
  - id: C-DOC-002
    ownerTarget: documentation-lifecycle-contract
    statement: every proposal has one disposition plus the required migration, activation, evidence, reversal and retirement fields
  - id: C-TEST-001
    ownerTarget: verification-and-development-contracts
    statement: advisory feedback, candidate authority and release proof are distinct test levels
  - id: C-TEST-002
    ownerTarget: test-capability-contract
    statement: Browser, native, container and other heavy capabilities are prepared only when selected tests require them
  - id: C-TEST-003
    ownerTarget: test-action-contract
    statement: the same exact valid test action is not executed twice in one closure
  - id: C-RUNTIME-001
    ownerTarget: docs/runtime-and-distribution.md
    statement: Semantic Core, Host Runtime, Toolchain Provider and Target Profile are orthogonal
  - id: C-SECURITY-001
    ownerTarget: authorization-and-runtime-capability-contracts
    statement: semantic authorization and physical capability attenuation intersect under default deny
  - id: C-SECURITY-002
    ownerTarget: docs/runtime-and-distribution.md
    statement: generic sandbox booleans are forbidden; isolation claims bind platform, mechanism, capability, generation and physical Evidence

currentDefaults:
  - id: D-TS-001
    class: evidenceGatedDefault
    decision: TypeScript first with language-neutral Core contracts
    target: docs/roadmap.md
  - id: D-TS-002
    class: evidenceGatedDefault
    decision: TypeScript Compiler API owns symbol, type and module semantics; lossless representation owns preservation
    target: source-typescript-provider-contract
  - id: D-HOST-001
    class: evidenceGatedDefault
    decision: supported Node LTS family is the public host and exact Bun is the repository toolchain
    target: docs/runtime-and-distribution.md
  - id: D-SKILL-001
    class: evidenceGatedDefault
    decision: one Primary Skill per Operation; exact Skill number and names remain experimental
    target: agent-operation-contract
  - id: D-FEEDBACK-001
    class: evidenceGatedDefault
    decision: local hot feedback may be partial and advisory but never grants merge authority
    target: automatic-feedback-contract
  - id: D-PARALLEL-001
    class: evidenceGatedDefault
    decision: default single writer; parallel work requires owner, path, contract, resource and integration proof
    target: integration-resolver-contract
  - id: D-PACKAGE-001
    class: evidenceGatedDefault
    decision: logical package boundaries precede physical package splitting
    target: docs/runtime-and-distribution.md

experiments:
  - id: X-EGRAPH-001
    activation: a real typed pure rewrite consumer with measurable search cost
    evidence: comparative correctness, latency and complexity
  - id: X-CAS-001
    activation: stable Action Key and Evidence freshness contracts
    evidence: hit rate, invalidation correctness, storage and operational cost
  - id: X-DAEMON-001
    activation: measured cold-start or repeated graph-rebuild bottleneck
    evidence: clean equivalence, restart safety, memory and cancellation
  - id: X-VIRTUAL-MERGE-001
    activation: Integration Epoch and cross-package conflict proof are in main
    evidence: combined-state correctness and avoided revalidation
  - id: X-MULTI-AGENT-001
    activation: at least two real disjoint Work Packages with measured coordination overhead
    evidence: ready-to-main improvement without owner or Evidence ambiguity
  - id: X-MULTILANG-001
    activation: TypeScript self-observation, mutation, lowering and Brownfield closure are real
    evidence: language-provider completeness and no Core specialization

rejectedDesigns:
  - universal-ir-or-universal-graph
  - generic-property-bag-core
  - central-kernel-owning-domain-state
  - one-revision-for-source-semantic-artifact-evidence-and-transaction
  - one-function-one-responsibility
  - one-responsibility-one-block
  - provider-or-ai-creates-authority
  - query-cache-equals-evidence
  - canonical-crdt-auto-merge
  - skill-prose-as-state-machine-or-permission-authority
  - current-host-or-toolchain-implies-target
  - unsupported-stale-unknown-or-missing-equals-pass
  - giant-cross-domain-implementation-pr
  - parallel-active-final-designs
  - proposal-as-long-term-current-control

