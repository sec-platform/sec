schema: sec-development-throughput-architecture-v1
status: proposal
researchBase: 6cc3bf8a3b655bebf85dfca3f065c9842207c086
tracking: issue-230

principles:
  - id: main-is-product-truth
    statement: Only new-main implementation and readback establish completed product results.
  - id: no-second-owner
    statement: Composition services reference domain results and never redefine Verification, Impact, Failure, Resource, Run, or Integration semantics.
  - id: exact-identity
    statement: Every reusable result binds exact input closure, environment, contract, producer, and output identity.
  - id: unknown-fails-closed
    statement: Unknown, unresolved, stale, missing, unsupported, skipped, or cleanup-unknown never project to PASS or parallel-safe.
  - id: plan-before-side-effect
    statement: Read-only stable plans precede automatic execution or repository mutation.
  - id: one-legal-next-transition
    statement: Any valid external state resolves zero or one legal next transition; zero returns a typed blocker.
  - id: derived-state-is-rebuildable
    statement: Context indexes, caches, journals, and projections are deletable and rebuildable from canonical inputs.
  - id: speed-from-precision
    statement: Throughput gains come from impact precision, reuse, cancellation, parallel proof, and stable candidates rather than reduced verification truth.

maturityLevels:
