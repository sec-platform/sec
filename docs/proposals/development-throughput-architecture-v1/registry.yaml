candidateClosureTransitions:
  - from: authoring
    to: prepared
    requires:
      - authoring-acceptance
      - manifest-frozen
      - change-closure-receipt
  - from: prepared
    to: single-parent-ready
    requires:
      - current-base
      - exact-candidate-tree
      - no-uncommitted-authority
  - from: single-parent-ready
    to: scope-requested
    action: dispatch-scope
  - from: scope-requested
    to: scope-passed
    requires:
      - trusted-scope-artifact-pass
  - from: scope-passed
    to: verification-requested
    action: dispatch-verification
  - from: verification-requested
    to: verification-passed
    requires:
      - trusted-verification-artifact-pass
  - from: verification-passed
    to: review-requested
    action: request-independent-review
  - from: review-requested
    to: review-approved
    requires:
      - exact-head-approval
      - no-unresolved-thread
      - no-request-changes
  - from: review-approved
    to: merge-authorized
    requires:
      - live-pr-revalidation
      - live-base-head-manifest
      - required-evidence-still-valid
  - from: merge-authorized
    to: merged
    action: expected-head-merge
  - from: merged
    to: main-readback
    requires:
      - product-result-in-main
  - from: main-readback
    to: cleanup-completed
    requires:
      - issue-closeout
      - manifest-lifecycle
      - branch-worktree-cleanup-receipts
      - rolling-replan

invalidations:
  - event: head-changed
    invalidates:
      - candidate-aggregate
      - exact-head-review
      - merge-authorization
      - unfinished-head-resource
    mayRetain:
      - action-results-with-unchanged-input-closure
  - event: base-changed
    invalidates:
      - candidate-closure-state-after-prepared
      - integration-epoch
      - virtual-merge
  - event: manifest-changed
    invalidates:
      - scope-artifact
      - verification-request
      - review-scope
      - merge-authorization
  - event: trust-root-changed
    invalidates:
      - candidate-verifier-authorization
    requires:
      - trusted-bootstrap-route
  - event: cleanup-failed
    invalidates:
      - positive-resource-result
      - publication-completion
  - event: user-scope-delta
    action:
      - reconcile-task-capsule
      - preserve-or-invalidate-candidate-by-proof

prioritySequence:
  - priority: P0
    name: candidate-closure
    rationale: Removes the current post-authoring dead zone and makes existing verification investment usable.
  - priority: P1
    name: task-and-change-closure-read-only
    rationale: Reduces predictable rework before more automation increases mutation rate.
  - priority: P2
    name: failure-evidence-run-core
    rationale: Enables exact reuse and deterministic resume.
  - priority: P3
    name: impact-and-feedback-plan
    rationale: Removes repeated scanning and manual lane selection.
  - priority: P4
    name: integration-epoch-and-virtual-merge
    rationale: Adds safe parallel throughput after single-candidate closure is stable.
  - priority: P5
    name: persistent-cache-and-telemetry
    rationale: Optimizes repeated work only after keys, trust, resources, and invalidation are correct.

retirements:
  - target: local-merge-bootstrap-as-state-owner
    after:
      - candidate-closure-engine-main-readback
    preserveAs:
      - thin-operator-cli
  - target: manual-chat-resume
    after:
      - run-journal-and-kernel-acceptance
  - target: manual-test-lane-selection
    after:
      - automatic-feedback-execution-acceptance
  - target: path-only-impact-as-primary
    after:
      - semantic-impact-v2-clean-parity
    preserveAs:
      - conservative-fallback
  - target: one-formal-package-default
    after:
      - integration-epoch-v1-main-readback
    preserveWhen:
      - conflict-or-unresolved
  - target: prose-duplicated-transition-rules
    after:
      - typed-transition-contract-and-projections

nonGoals:
  - migrate-to-bazel-nx-pants
  - remote-execution-v1
  - all-tests-in-edit-loop
  - branch-as-test-parameter
  - ai-as-verification-authority
