id: infra/postgres
version: 0.1.0
kind: infra
stackProfiles:
  - typescript-library
requires: []
provides:
  - db/postgres
conflicts: []
installs:
  - kind: copy
    from: files/src/installed/infra/postgres-contract.ts
    to: src/installed/infra/postgres-contract.ts
  - kind: copy
    from: files/generated/postgres-contract.json
    to: generated/postgres-contract.json
  - kind: copy
    from: files/tests/unit/postgres-contract.test.ts
    to: tests/unit/postgres-contract.test.ts
pins:
  inputs: []
  outputs:
    - id: postgres_contract
      type: PostgresContract
      required: true
slots: []
acceptance:
  - id: postgres_contract_is_available
