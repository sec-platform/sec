id: reporting/ticket-summary
version: 0.1.0
kind: capability
stackProfiles:
  - typescript-library
requires:
  - ticket/read
provides:
  - ticket/reporting
conflicts: []
installs:
  - kind: copy
    from: files/src/installed/reporting/ticket-summary.ts
    to: src/installed/reporting/ticket-summary.ts
  - kind: copy
    from: files/tests/unit/ticket-summary.test.ts
    to: tests/unit/ticket-summary.test.ts
pins:
  inputs:
    - id: ticket_list
      type: TicketRecord[]
      required: true
  outputs:
    - id: ticket_summary
      type: TicketSummary
      required: true
acceptance:
  - id: ticket_summary_can_be_reported
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
        - reporting/ticket-summary
