app:
  id: sec-reference
  name: SEC Reference
  stack: typescript-library
  packageManager: pnpm
  mode: multi-tenant
registry:
  sources:
    - id: official
      kind: official
      location: compiler
      path: catalog/registry/official
    - id: private
      kind: private
      location: workspace
      path: source/blocks/private
blocks:
  - id: auth/basic-session
    version: 0.1.0
  - id: tenant/basic-workspace
    version: 0.1.0
  - id: entity/customer-basic
    version: 0.1.0
  - id: ticket/basic
    version: 0.1.0
  - id: comment/basic
    version: 0.1.0
  - id: agent/harness
    version: 0.1.0
  - id: agent/executor
    version: 0.1.0
  - id: file/upload
    version: 0.1.0
slots:
  - id: customer_normalizer
    block: entity/customer-basic
    kind: adapter
    target: custom/customer_normalizer.ts
    sourcePath: source/code/slots/customer_normalizer.ts
    symbol: normalizeCustomerInput
    description: Name required; email lowercased; phone digits only; company
      defaults to Unknown.
acceptance:
  - id: user_can_login
  - id: user_can_create_customer
  - id: user_can_list_customers
  - id: tenant_only_sees_own_customers
  - id: ticket_can_be_created
  - id: ticket_status_can_transition
  - id: tenant_only_sees_own_tickets
  - id: assignee_can_filter_tickets
  - id: customer_can_upload_attachment
  - id: ticket_attachment_can_be_uploaded
  - id: ticket_comment_can_be_added
  - id: agent_can_be_registered
  - id: agent_can_automatically_classify_ticket
