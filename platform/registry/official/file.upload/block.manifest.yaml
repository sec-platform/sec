id: file/upload
version: 0.1.0
kind: capability
stackProfiles:
  - nextjs-ts-prisma-sqlite
requires:
  - customer/read
  - customer/write
provides:
  - file/upload
conflicts: []
installs:
  - kind: copy
    from: files/src/installed/file/customer-attachments.ts
    to: src/installed/file/customer-attachments.ts
  - kind: copy
    from: files/tests/unit/customer-attachments.test.ts
    to: tests/unit/customer-attachments.test.ts
pins:
  inputs:
    - id: customer_created
      type: CustomerRecord
      required: true
  outputs:
    - id: customer_attachment_uploaded
      type: CustomerAttachmentRecord
      required: true
slots: []
acceptance:
  - id: customer_can_upload_attachment
routes: []
uiHooks:
  - targetPortal: customer_list_item
    component: CustomerAttachmentForm
    importFrom: ../../components/customer-attachment-form.tsx
    dataBinder: |
      const attachmentsByCustomer = new Map(customers.map((customer) => [customer.id, listCustomerAttachments(database, session, customer.id)]));
    renderSnippet: |
      <div className="stack" style={{ marginTop: 12 }}>
                      <CustomerAttachmentForm customerId={customer.id} customerName={customer.name} />
                      <ul className="clean" aria-label={`Attachments for ${customer.name}`}>
                        {(attachmentsByCustomer.get(customer.id) ?? []).map((attachment) => (
                          <li key={attachment.id}>{attachment.fileName} ({attachment.contentType})</li>
                        ))}
                        {(attachmentsByCustomer.get(customer.id) ?? []).length === 0 ? <li>No attachments yet.</li> : null}
                      </ul>
                    </div>
  - targetPortal: customer_list_item
    component: listCustomerAttachments
    importFrom: ../../src/installed/file/customer-attachments.ts
  - targetPortal: ticket_list_item
    component: TicketAttachmentForm
    importFrom: ../../components/ticket-attachment-form.tsx
    dataBinder: |
      const attachmentsByTicket = new Map(tickets.map((ticket) => [ticket.id, listTicketAttachments(database, session, ticket.id)]));
    renderSnippet: |
      <div className="stack" style={{ marginTop: 12 }}>
                      <TicketAttachmentForm ticketId={ticket.id} ticketTitle={ticket.title} />
                      <ul className="clean" aria-label={`Attachments for ${ticket.title}`}>
                        {(attachmentsByTicket.get(ticket.id) ?? []).map((attachment) => (
                          <li key={attachment.id}>{attachment.fileName} ({attachment.contentType})</li>
                        ))}
                        {(attachmentsByTicket.get(ticket.id) ?? []).length === 0 ? <li>No attachments yet.</li> : null}
                      </ul>
                    </div>
  - targetPortal: ticket_list_item
    component: listTicketAttachments
    importFrom: ../../src/installed/ticket/ticket-service.ts

