id: worklog/basic
version: 0.1.0
kind: capability
stackProfiles:
  - nextjs-ts-prisma-sqlite
requires:
  - auth/session
  - tenant/context
  - ticket/read
provides:
  - ticket/worklog
conflicts: []
installs:
  - kind: copy
    from: files/src/installed/worklog/worklog-service.ts
    to: src/installed/worklog/worklog-service.ts
  - kind: merge-prisma
    from: files/prisma/worklog.prisma
    to: prisma/schema.prisma
  - kind: copy
    from: files/tests/unit/worklog-service.test.ts
    to: tests/unit/worklog-service.test.ts
  - kind: copy
    from: files/tests/acceptance/worklog-flow.test.ts
    to: tests/acceptance/worklog-flow.test.ts
pins:
  inputs:
    - id: ticket_created
      type: TicketRecord
      required: true
    - id: actor_identity
      type: Session
      required: true
  outputs:
    - id: worklog_recorded
      type: WorklogRecord
      required: true
slots: []
acceptance:
  - id: worklog_can_be_recorded
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
        - worklog/basic
routes: []
uiHooks:
  - targetPortal: ticket_list_item
    component: TicketWorklogForm
    importFrom: ../../components/ticket-worklog-form.tsx
    dataBinder: |
      const worklogsByTicket = new Map(tickets.map((ticket) => [ticket.id, listWorklogs(database, session, ticket.id)]));
      const worklogMinutesByTicket = new Map(tickets.map((ticket) => [ticket.id, summarizeWorklogMinutes(database, session, ticket.id)]));
    renderSnippet: |
      <div className="stack" style={{ marginTop: 12 }}>
                      <TicketWorklogForm ticketId={ticket.id} ticketTitle={ticket.title} />
                      <div>Total worklog minutes: {worklogMinutesByTicket.get(ticket.id) ?? 0}</div>
                      <ul className="clean" aria-label={`Worklogs for ${ticket.title}`}>
                        {(worklogsByTicket.get(ticket.id) ?? []).map((worklog) => (
                          <li key={worklog.id}>{worklog.minutes}m by {worklog.authorId}: {worklog.note || 'No note'}</li>
                        ))}
                        {(worklogsByTicket.get(ticket.id) ?? []).length === 0 ? <li>No worklogs yet.</li> : null}
                      </ul>
                    </div>
  - targetPortal: ticket_list_item
    component: listWorklogs, summarizeWorklogMinutes
    importFrom: ../../src/installed/worklog/worklog-service.ts

