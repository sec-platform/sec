id: ticket/basic
version: 0.1.0
kind: capability
stackProfiles:
  - nextjs-ts-prisma-sqlite
contracts:
  - path: contracts/ticket.yaml
generators:
  - id: ticket-status-runtime-contract
    kind: generate-state-transition-map
    contract: ticket-core
    state: ticket-status
    target: src/installed/ticket/ticket-semantic-contract.ts
    consumes:
      - state
      - transition
    produces: typescript-runtime-contract
    typeBinding:
      name: TicketStatus
      importFrom: ../../runtime/database.ts
    verification:
      - typecheck
      - ticket_status_can_transition
requires:
  - auth/session
  - tenant/context
provides:
  - ticket/read
  - ticket/write
conflicts: []
installs:
  - kind: copy
    from: files/src/installed/ticket/ticket-service.ts
    to: src/installed/ticket/ticket-service.ts
  - kind: merge-prisma
    from: files/prisma/ticket.prisma
    to: prisma/schema.prisma
  - kind: copy
    from: files/tests/shared/ticket-service-suite.ts
    to: tests/shared/ticket-service-suite.ts
  - kind: copy
    from: files/tests/unit/ticket-service.test.ts
    to: tests/unit/ticket-service.test.ts
  - kind: copy
    from: files/tests/acceptance/ticket-flow.test.ts
    to: tests/acceptance/ticket-flow.test.ts
pins:
  inputs:
    - id: tenant_context
      type: TenantId
      required: true
    - id: actor_identity
      type: Session
      required: true
  outputs:
    - id: ticket_created
      type: TicketRecord
      required: true
    - id: ticket_status_transitioned
      type: TicketRecord
      required: true
    - id: ticket_attachment_uploaded
      type: TicketAttachmentRecord
      required: true
    - id: ticket_comment_added
      type: TicketCommentRecord
      required: true
slots:
  - id: ticket_comment_delegate
    kind: adapter
    target: custom/ticket_comment_delegate.ts
    symbol: addTicketCommentDelegate
    inputType: TicketCommentInput
    outputType: TicketCommentRecord
    writableZones:
      - custom/
    exports:
      - symbol: addTicketCommentDelegate
        params:
          - name: db
            type: Database
            importFrom: ../src/runtime/database.ts
          - name: session
            type: Session
            importFrom: ../src/installed/auth/session.ts
          - name: input
            type: TicketCommentInput
            importFrom: ../src/runtime/database.ts
        outputType: TicketCommentRecord
        outputImportFrom: ../src/runtime/database.ts
      - symbol: listTicketCommentsDelegate
        params:
          - name: db
            type: Database
            importFrom: ../src/runtime/database.ts
          - name: session
            type: Session
            importFrom: ../src/installed/auth/session.ts
          - name: ticketId
            type: number
        outputType: TicketCommentRecord[]
        outputImportFrom: ../src/runtime/database.ts
    mockTemplate: |
      import type { Database, TicketCommentInput, TicketCommentRecord } from '../src/runtime/database.ts';
      import type { Session } from '../src/installed/auth/session.ts';

      function assertTenantTicket(db: Database, ticketId: number, tenantId: string) {
        const ticket = db.tickets.find((entry) => entry.id === ticketId);
        if (!ticket || ticket.tenantId !== tenantId) {
          throw new Error('Ticket is not available for this tenant');
        }
        return ticket;
      }

      export function addTicketCommentDelegate(db: Database, session: Session, input: TicketCommentInput): TicketCommentRecord {
        if (!input.body || !input.body.trim()) {
          throw new Error('Ticket comment is required');
        }
        assertTenantTicket(db, input.ticketId, session.tenantId);
        const comment: TicketCommentRecord = {
          id: db.nextTicketCommentId++,
          tenantId: session.tenantId,
          ticketId: input.ticketId,
          body: input.body.trim(),
          authorId: session.userId,
          createdAt: new Date(0).toISOString()
        };
        db.ticketComments.push(comment);
        return comment;
      }

      export function listTicketCommentsDelegate(db: Database, session: Session, ticketId: number): TicketCommentRecord[] {
        assertTenantTicket(db, ticketId, session.tenantId);
        return db.ticketComments.filter(c => c.tenantId === session.tenantId && c.ticketId === ticketId);
      }
acceptance:
  - id: ticket_can_be_created
    dependsOn:
      - user_can_login
    covers:
      blocks:
        - ticket/basic
  - id: ticket_status_can_transition
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
  - id: assignee_can_filter_tickets
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
  - id: tenant_only_sees_own_tickets
    dependsOn:
      - user_can_login
      - ticket_can_be_created
    covers:
      blocks:
        - tenant/basic-workspace
        - ticket/basic
  - id: ticket_attachment_can_be_uploaded
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
  - id: ticket_comment_can_be_added
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - comment/basic
        - ticket/basic
      slots:
        - ticket_comment_delegate
routes:
  - path: /tickets
    file: src/installed/ticket/ticket-service.ts
