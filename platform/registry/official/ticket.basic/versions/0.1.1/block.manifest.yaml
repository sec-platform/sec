version: 0.1.1
upgrade:
  from:
    - 0.1.x
  migrations:
    - id: mig-ticket-service-refresh
      kind: file-replace
      entry: migrations/ticket-service-refresh.json
      fromVersion: 0.1.0
      toVersion: 0.1.1
      requiresVerification: true
    - id: mig-ticket-upgrade-metadata
      kind: json-array-append
      entry: migrations/ticket-upgrade-metadata.json
      fromVersion: 0.1.0
      toVersion: 0.1.1
      requiresVerification: false
