id: ticket/basic
version: 0.1.1
kind: capability
stackProfiles:
  - nextjs-ts-prisma-sqlite
compatibility:
  blockApi: '1'
  compilerApi: '1'
  stackProfiles:
    - nextjs-ts-prisma-sqlite
requires:
  - auth/session
  - tenant/context
provides:
  - ticket/read
  - ticket/write
conflicts: []
installs:
  - kind: copy
    from: files/src/installed/ticket/ticket-service.ts
    to: src/installed/ticket/ticket-service.ts
  - kind: merge-prisma
    from: files/prisma/ticket.prisma
    to: prisma/schema.prisma
  - kind: copy
    from: files/tests/shared/ticket-service-suite.ts
    to: tests/shared/ticket-service-suite.ts
  - kind: copy
    from: files/tests/unit/ticket-service.test.ts
    to: tests/unit/ticket-service.test.ts
  - kind: copy
    from: files/tests/acceptance/ticket-flow.test.ts
    to: tests/acceptance/ticket-flow.test.ts
pins:
  inputs:
    - id: tenant_context
      type: TenantId
      required: true
    - id: actor_identity
      type: Session
      required: true
  outputs:
    - id: ticket_created
      type: TicketRecord
      required: true
    - id: ticket_status_transitioned
      type: TicketRecord
      required: true
    - id: ticket_attachment_uploaded
      type: TicketAttachmentRecord
      required: true
    - id: ticket_comment_added
      type: TicketCommentRecord
      required: true
slots: []
acceptance:
  - id: ticket_can_be_created
    dependsOn:
      - user_can_login
    covers:
      blocks:
        - ticket/basic
  - id: ticket_status_can_transition
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
  - id: assignee_can_filter_tickets
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
  - id: tenant_only_sees_own_tickets
    dependsOn:
      - user_can_login
      - ticket_can_be_created
    covers:
      blocks:
        - tenant/basic-workspace
        - ticket/basic
  - id: ticket_attachment_can_be_uploaded
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
  - id: ticket_comment_can_be_added
    dependsOn:
      - ticket_can_be_created
    covers:
      blocks:
        - ticket/basic
routes:
  - path: /tickets
    file: src/installed/ticket/ticket-service.ts
upgrade:
  from:
    - 0.1.x
  migrations:
    - id: mig-ticket-service-refresh
      kind: file-replace
      entry: migrations/ticket-service-refresh.json
      fromVersion: 0.1.0
      toVersion: 0.1.1
      requiresVerification: true
    - id: mig-ticket-upgrade-metadata
      kind: json-array-append
      entry: migrations/ticket-upgrade-metadata.json
      fromVersion: 0.1.0
      toVersion: 0.1.1
      requiresVerification: false
