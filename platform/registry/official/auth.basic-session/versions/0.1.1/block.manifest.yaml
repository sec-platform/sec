id: auth/basic-session
version: 0.1.1
kind: capability
stackProfiles:
  - nextjs-ts-prisma-sqlite
compatibility:
  blockApi: '1'
  compilerApi: '1'
  stackProfiles:
    - nextjs-ts-prisma-sqlite
requires: []
provides:
  - auth/session
conflicts: []
installs:
  - kind: copy
    from: files/src/installed/auth/session.ts
    to: src/installed/auth/session.ts
pins:
  outputs:
    - id: actor_identity
      type: Session
      required: true
slots: []
acceptance:
  - id: user_can_login
    covers:
      blocks:
        - auth/basic-session
routes:
  - path: /login
    file: src/installed/auth/session.ts
upgrade:
  from:
    - 0.1.x
  migrations:
    - id: mig-auth-session-refresh
      kind: file-replace
      entry: migrations/auth-session-refresh.json
      fromVersion: 0.1.0
      toVersion: 0.1.1
      requiresVerification: true
    - id: mig-auth-session-upgrade-metadata
      kind: json-array-append
      entry: migrations/auth-session-upgrade-metadata.json
      fromVersion: 0.1.0
      toVersion: 0.1.1
      requiresVerification: false
