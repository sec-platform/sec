[package]
name = "gift-author-kernel"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
num-bigint = "0.4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10.9"
jsonschema = { version = "=0.60.2", default-features = false, features = ["arbitrary-precision"] }
percent-encoding = "2.3"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "=0.60.2", default-features = false, features = ["arbitrary-precision", "conformance"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "gift-author-kernel"
path = "src/main.rs"
