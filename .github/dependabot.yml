version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # The compiler API uses TypeScript 6; native CLI typechecking has its own alias.
    # Major API migrations require explicit compatibility work before this rule is removed.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      bun-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
