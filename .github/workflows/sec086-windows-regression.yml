name: sec086-windows-regression
on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-windows-regression.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a0ec0c528395cf06198b10b62e0b693862480607
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Bind source and retain original host path observations
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sec-regression'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          if ((git rev-parse 'HEAD^{tree}') -ne '64e14d73e9824d045c54a96006e663c6b5d02261') { throw 'source mismatch' }
          git rev-parse HEAD 'HEAD^{tree}' | Set-Content "$dir/source.txt"
          git bundle create "$dir/commits.bundle" refs/remotes/origin/refactor/sec086-architecture '^0ed7eca1412ee3443505662ae58535b799d8b90f'
          if ($LASTEXITCODE -ne 0) { throw 'bundle failed' }
          bun -e 'import os from "node:os"; import fs from "node:fs"; console.log(JSON.stringify({temp:os.tmpdir(),physical:fs.realpathSync.native(os.tmpdir()),runnerTemp:process.env.RUNNER_TEMP}));' *> "$dir/original-temp.json"
          bun run deps:ensure *> "$dir/deps.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$dir/deps.log"; exit 1 }
      - name: Verify the explicitly selected temp root and execute fast lane
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sec-regression'
          $temp = Join-Path $env:RUNNER_TEMP 'sec-tests'
          New-Item -ItemType Directory -Path $temp | Out-Null
          $env:TEMP = $temp
          $env:TMP = $temp
          bun -e 'import os from "node:os"; import {inspectNoFollowDirectoryChain} from "./src/adapters/runtime-state/physical/runtime/physical-no-follow.ts"; const root=os.tmpdir(); inspectNoFollowDirectoryChain(root,"explicit hosted temp"); console.log(JSON.stringify({root,accepted:true}));' *> "$dir/temp-admission.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "$dir/temp-admission.json"; exit 1 }
          $elapsed = [System.Diagnostics.Stopwatch]::StartNew()
          bun run test:fast *> "$dir/fast.log"
          $code = $LASTEXITCODE
          $elapsed.Stop()
          "exit=$code`nelapsedMs=$($elapsed.ElapsedMilliseconds)" | Set-Content "$dir/terminal.txt"
          Get-Content "$dir/fast.log" -Tail 80
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sec086-windows-regression
          path: ${{ runner.temp }}/sec-regression/
          retention-days: 7
          if-no-files-found: error
