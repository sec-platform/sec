name: sec086-slice8b-current-tree

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice8b-current-tree.yml]

permissions: {}

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = a851f1957d3f0c12869db607f0904ee25c9ed504
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Route postgres inspection through application and entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/bootstrap/cli/register-inspection-commands.ts')
          text = p.read_text()
          old_import = "import type { PostgresContract } from './formatters.ts';\n"
          new_import = "import type { PostgresContractProjectionSource } from '../../application/postgres-contract.ts';\n"
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import)

          start = text.index("  addJsonFlags(program.command('postgres')).action(")
          end = text.index("\n  });\n}", start) + len("\n  });")
          old_block = text[start:end]
          assert "formatPostgresContract } = await import('./formatters.ts')" in old_block
          assert "printGeneratedContract<PostgresContract>" in old_block
          new_block = """  addJsonFlags(program.command('postgres')).action(async (rawOptions: Record<string, unknown>, cmd: Command) => {
    const cwd = process.cwd();
    const output = jsonOpts(captureJsonOutputInput(rawOptions, 'own-enumerable'));
    const missingMessage = `Postgres contract not found; run ${commandFromRoot(cmd, 'compose')} first`;
    const { projectPostgresContract } = await import('../../application/postgres-contract.ts');
    const { formatPostgresContract } = await import('../../entry/cli/postgres-contract.ts');
    const { printGeneratedContract } = await import('./artifact-command-read.ts');
    await printGeneratedContract<PostgresContractProjectionSource>(
      cwd,
      missingMessage,
      output,
      (contract) => formatPostgresContract(projectPostgresContract(contract)),
      (contract) => contract.provider === 'postgres'
    );
  });"""
          p.write_text(text[:start] + new_block + text[end:])

          p = Path('src/bootstrap/cli/formatters.ts')
          text = p.read_text()
          type_start = text.index('export type PostgresContract = {')
          type_end = text.index('type RuntimeStepInspect = {', type_start)
          text = text[:type_start] + text[type_end:]
          fn_start = text.index('export function formatPostgresContract(')
          fn_end = text.index('export function formatLockInspect(', fn_start)
          text = text[:fn_start] + text[fn_end:]
          assert 'export type PostgresContract' not in text
          assert 'export function formatPostgresContract' not in text
          p.write_text(text)
          PY

          git add src/bootstrap/cli/register-inspection-commands.ts src/bootstrap/cli/formatters.ts
          git diff --cached --check
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7

      - name: Verify postgres inspection slice
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun test --timeout 20000 tests/unit/postgres-contract-presentation.test.ts tests/unit/inspection-query.test.ts tests/unit/named-inspection-query.test.ts
          bun run docs:doctor
          bun run audit:module-topology

      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: route postgres inspection through entry'
          git diff HEAD^..HEAD --check
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7

      - name: Fast-forward isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
