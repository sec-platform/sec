name: sec086-final-architecture-apply

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-final-apply.yml]

permissions: {}

concurrency:
  group: sec086-final-architecture-apply
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    if: github.repository == 'sec-platform/sec' && github.ref == 'refs/heads/refactor/sec086-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact transport candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Require exact authorized branch baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = af33270ed3d89b268a521a87f93266943f88abe7
          test "$(git rev-parse HEAD~2)" = 56a1995dbb1dc721d7c83f8cf816482accd5a0ba
          test "$(git rev-parse HEAD~3)" = 9eccfe4f6e50c30129916bb939702460bbff0cb7
          test "$(git rev-parse 'HEAD~2^{tree}')" = 53a81a7d519224cb97744aea004238c2b5267839
          test "$(git rev-parse 'HEAD~3^{tree}')" = d3c24fc8d1b3812be5540f3ea5ff39413b7366d6
          git diff --exit-code

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Reconstruct and apply the exact reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sec086-final-transfer/chunk{0,1,2,3,4,5} > "$RUNNER_TEMP/sec086-final-apply.py"
          echo 'ad6722259717b811023ad431385d2875f39ce5b17a5664d21425a266b54b6e2a  '"$RUNNER_TEMP/sec086-final-apply.py" | sha256sum -c -
          python3 - "$RUNNER_TEMP/sec086-final-apply.py" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = 'parent = git("rev-parse", "HEAD^")'
          new = 'parent = git("rev-parse", "HEAD~2")'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          rm -rf .github/sec086-final-transfer
          python3 "$RUNNER_TEMP/sec086-final-apply.py"
          test "$(git write-tree)" = 88f12d2e8c96300ae296f1fdb3e891ed132855d2

      - name: Freeze exact final source tree as a commit
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'refactor: converge SEC source tree on documented ten-module architecture' \
            -m 'Converge physical ownership on contracts/workspace/semantics/compiler/assurance/application/execution/adapters/entry/bootstrap; migrate all existing consumers; enforce the documented 33 direct package edges and pure-core host-I/O boundary; repair entrypoint, descriptor, runtime-layout and trust-path identities. This commit is created only after exact-tree replay; hosted verification follows before branch publication. Main is not modified.'
          test "$(git rev-parse HEAD^{tree})" = 88f12d2e8c96300ae296f1fdb3e891ed132855d2
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Native whole-repository typecheck
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json

      - name: Validate docs and exact ten-package topology
        shell: bash
        run: |
          set -euo pipefail
          bun run docs:doctor
          bun run audit:module-topology
          python3 - <<'PY'
          from pathlib import Path
          roots=sorted(p.name for p in Path('src').iterdir() if p.is_dir())
          expected=sorted('contracts workspace semantics compiler assurance application execution adapters entry bootstrap'.split())
          assert roots == expected, (roots, expected)
          PY

      - name: Verify CLI and architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          bun run sec -- --help >/tmp/sec086-cli-help.txt
          bun test \
            src/adapters/repository/architecture/contract.test.ts \
            src/adapters/repository/architecture/dependency-policy.test.ts \
            tests/unit/runtime-layout.test.ts \
            tests/unit/runtime-entrypoint-path-hardening.test.ts \
            tests/unit/acceptance-coverage-authority.test.ts \
            tests/unit/tcb-trust-root-contract.test.ts

      - name: Run established compiler semantic regression set
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            src/contracts/failure.test.ts \
            src/contracts/directed-graph.test.ts \
            src/contracts/exact-json.test.ts \
            tests/unit/engineering-ir.test.ts \
            tests/unit/workspace-containment-hardening.test.ts \
            tests/unit/workspace-native-paths.test.ts \
            tests/unit/validated-engineering-ir.test.ts \
            tests/unit/verification-invocation-contract.test.ts \
            tests/unit/workspace-semantic-linker.test.ts \
            tests/unit/semantic-contract-responsibility.test.ts \
            tests/unit/semantic-compiler.test.ts \
            tests/unit/semantic-mutation-source-adapter.test.ts \
            tests/unit/logger-record-hardening.test.ts \
            src/adapters/formats/yaml.test.ts

      - name: Build frozen release artifact
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          test "$(git rev-parse HEAD^{tree})" = 88f12d2e8c96300ae296f1fdb3e891ed132855d2
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Fast-forward only the isolated refactor branch and read back
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          candidate=$(git rev-parse HEAD)
          git push origin "HEAD:$branch"
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$candidate"
          printf 'commit=%s\ntree=%s\n' "$candidate" "$(git rev-parse HEAD^{tree})" | tee "$RUNNER_TEMP/sec086-final-readback.txt"

      - name: Preserve final readback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec086-final-architecture-readback
          path: |
            ${{ runner.temp }}/sec086-final-readback.txt
            /tmp/sec086-cli-help.txt
          if-no-files-found: ignore
          retention-days: 7
