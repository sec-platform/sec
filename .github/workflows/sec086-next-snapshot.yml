name: sec086-next-snapshot

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-next-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6baa1c9f5586180fc0b6338af62dc9583cef4e73
          fetch-depth: 1
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6baa1c9f5586180fc0b6338af62dc9583cef4e73
          mkdir -p "$RUNNER_TEMP/sec086-next"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/sec086-next/source.tar.gz"
          git show -s --format='%H%n%T' HEAD > "$RUNNER_TEMP/sec086-next/identity.txt"
          grep -RIn --include='*.ts' --include='*.mts' --include='*.cts' 'error-protocol-contract' src tests > "$RUNNER_TEMP/sec086-next/error-protocol-consumers.txt" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec086-next-snapshot
          path: ${{ runner.temp }}/sec086-next/
          retention-days: 1
          if-no-files-found: error
