name: sec086-delete-temp-branches

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-delete-temp-branches.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only task-owned temporary anchor refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            refactor/sec086-architecture-anchor-cleanup
            refactor/sec086-architecture-anchor-final
            refactor/sec086-architecture-final-publish
            refactor/sec086-architecture-final-safety
            refactor/sec086-architecture-publish-anchor
            refactor/sec086-architecture-temp-anchor
            refactor/sec086-architecture-verified-tree
            refactor/sec086-architecture-verified-tree-2
          )
          for branch in "${branches[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
          for branch in "${branches[@]}"; do
            test -z "$(git ls-remote --heads https://github.com/${GITHUB_REPOSITORY}.git "refs/heads/${branch}")"
          done
