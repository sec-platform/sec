name: repository-branch-inventory

on:
  pull_request:
    paths:
      - .github/workflows/repository-branch-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[] | [.name, .commit.sha] | @tsv' \
            | sort \
            | tee branches.tsv

      - name: Upload branch inventory
        uses: actions/upload-artifact@v4
        with:
          name: repository-branch-inventory
          path: branches.tsv
          if-no-files-found: error
