name: sec086-local-sync
on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-local-sync.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact objects without workspace or credentials
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git bundle create /tmp/sec086.bundle HEAD refs/remotes/origin/main
          git bundle verify /tmp/sec086.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sec086-local-git
          path: /tmp/sec086.bundle
          retention-days: 1
