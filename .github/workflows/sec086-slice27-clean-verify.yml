name: sec086-slice27-clean-verify

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice27-clean-verify.yml]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 82ccc7f9397d14c89786c7f450e98648a48b307a
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 82ccc7f9397d14c89786c7f450e98648a48b307a
          test "$(git rev-parse HEAD^{tree})" = 1a3657440503376bca6f31757d16dc7f0c90ca43
          test ! -e .github/workflows/sec086-resume-audit.yml
          test ! -e .github/workflows/sec086-slice27-clean-verify.yml
          test ! -e src/bootstrap/cli/formatters.ts
          test -z "$(git status --porcelain)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Type and behavior regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sec086-slice27
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json 2>&1 | tee /tmp/sec086-slice27/typecheck.log
          bun test --timeout 30000 tests/unit/explain-summary-presentation.test.ts tests/unit/explain-summary-routing.test.ts tests/unit/explain-graph-inspect-presentation.test.ts tests/unit/explain-graph-inspect-routing.test.ts tests/unit/review-summary-inspect-presentation.test.ts tests/unit/review-summary-inspect-routing.test.ts tests/unit/e2e-matrix-inspect-presentation.test.ts tests/unit/e2e-matrix-inspect-routing.test.ts tests/unit/artifact-upload-paths.test.ts tests/unit/artifact-command-input.test.ts tests/unit/workspace-command-input.test.ts tests/unit/artifact-command-read.test.ts tests/unit/workspace-native-paths.test.ts tests/unit/ci-artifact-manifest-inspect-presentation.test.ts tests/unit/ci-artifact-manifest-inspect-routing.test.ts 2>&1 | tee /tmp/sec086-slice27/regression.log
      - name: Documentation and module boundaries
        shell: bash
        run: |
          set -euo pipefail
          bun run docs:doctor 2>&1 | tee /tmp/sec086-slice27/docs.log
          bun src/adapters/repository/repository-audit/cli.ts --worktree-module-topology --full > /tmp/sec086-slice27/topology.json
          bun -e 'const x=JSON.parse(await Bun.file("/tmp/sec086-slice27/topology.json").text()); if(x.unresolvedFiles.length||x.topology.violations.length) throw new Error(JSON.stringify(x)); console.log(JSON.stringify({files:x.files,references:x.references,unresolved:0,violations:0}))'
      - name: Build exact clean source
        shell: bash
        run: |
          set -euo pipefail
          bun run build 2>&1 | tee /tmp/sec086-slice27/build.log
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\nsource_tree=%s\ntracked_worktree=clean\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > /tmp/sec086-slice27/receipt.txt
          cat /tmp/sec086-slice27/receipt.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sec086-slice27-verification
          path: /tmp/sec086-slice27/
          retention-days: 7
          if-no-files-found: warn
