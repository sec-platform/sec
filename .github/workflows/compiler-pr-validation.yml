name: compiler-pr-validation
run-name: "${{ github.event.action == 'sec-produce-main-health-v1' && format('SEC main health {0} operation {1}', github.event.client_payload.payload.mainSha, github.event.client_payload.payload.requestOperationId) || github.event.action == 'sec-produce-agent-operation-activation-v1' && format('activate {0} PR #{1}', github.event.client_payload.payload.phase, github.event.client_payload.payload.pullRequestNumber) || github.event.action == 'sec-produce-verification-action-v2' && format('produce Action {0}', github.event.client_payload.payload.proposal.proposedActionKey) || github.event.action == 'sec-resume-verification-session-v1' && format('verify session PR #{0} session {1}', github.event.client_payload.payload.completedAction.providerEnvelope.proposal.sessionRequest.prNumber, github.event.client_payload.payload.completedAction.providerEnvelope.proposal.sessionRequest.expectedSessionRevision) || format('verify session PR #{0} session {1}', github.event.client_payload.payload.prNumber, github.event.client_payload.payload.expectedSessionRevision) }}"
on:
  repository_dispatch:
    types:
      - sec-verify-session-v2
      - sec-produce-verification-action-v2
      - sec-produce-main-health-v1
      - sec-produce-agent-operation-activation-v1
      - sec-resume-verification-session-v1
permissions:
  actions: read
  contents: read
  pull-requests: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  receive-verification-session-resume:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'sec-resume-verification-session-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 205
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
      id-token: write
    steps:
      - name: Checkout exact trusted hosted launcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup exact trusted bootstrap Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Verify exact bootstrap Bun bytes
        shell: bash
        run: |-
          set -euo pipefail
          printf '%s  %s\n' '33d56b070be6a9e3da0ab013038b43d1645d0534ca811ecdba4472599117eb4b' "$(command -v bun)" | sha256sum --check --strict
      - name: Install exact trusted launcher dependencies
        shell: bash
        run: exec bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Resume original authenticated Verification Session
        id: resume
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_HOSTED_NEEDS_JSON: ${{ toJSON(needs) }}
          SEC_HOSTED_STEPS_JSON: ${{ toJSON(steps) }}
        run: exec bun --no-env-file src/bootstrap/development/hosted-job-runtime.ts --job receive-verification-session-resume --phase receive-verification-session-resume
      - name: Upload complete original resume dispatch outcome observations
        id: upload-resume-outcomes
        if: ${{ always() && !cancelled() && steps.resume.outputs.resume-outcomes-ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.resume.outputs.resume-outcomes-artifact-name }}
          path: ${{ github.workspace }}/.tmp/codex/hosted-job/receive-verification-session-resume/out/resume-outcomes
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          overwrite: false
      - name: Upload resumed terminal Verification Session artifact
        id: upload-session
        if: ${{ always() && !cancelled() && steps.resume.outputs.session-ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.resume.outputs.session-artifact-name }}
          path: ${{ github.workspace }}/.tmp/codex/hosted-job/receive-verification-session-resume/out/session
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          overwrite: false
  validate-hosted-request:
    if: ${{ github.event_name == 'repository_dispatch' && (github.event.action == 'sec-verify-session-v2' || github.event.action == 'sec-produce-verification-action-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      request-kind: ${{ steps.request.outputs.request-kind }}
      session-request-base64: ${{ steps.request.outputs.session-request-base64 }}
      action-envelope-base64: ${{ steps.request.outputs.action-envelope-base64 }}
      base-sha: ${{ steps.request.outputs.base-sha }}
      base-tree-sha: ${{ steps.request.outputs.base-tree-sha }}
      head-sha: ${{ steps.request.outputs.head-sha }}
      head-tree-sha: ${{ steps.request.outputs.head-tree-sha }}
      pr-number: ${{ steps.request.outputs.pr-number }}
      session-revision: ${{ steps.request.outputs.session-revision }}
      session-revision-hex: ${{ steps.request.outputs.session-revision-hex }}
    steps:
      - name: Resolve proposal against live default, PR, candidate, and actor
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_TYPE: ${{ github.event.action }}
          WORKFLOW_SHA: ${{ github.sha }}
          ACTOR_LOGIN: ${{ github.actor }}
          TRIGGERING_ACTOR_LOGIN: ${{ github.triggering_actor }}
          EVENT_SENDER_JSON: ${{ toJSON(github.event.sender) }}
        with:
          script: |
            // BEGIN GENERATED repository-permission.ts
            function normalizeGitHubRepositoryPermission(value) {
                if (value === null || typeof value !== 'object' || Array.isArray(value))
                    return null;
                const source = value;
                const permission = source.permission;
                if (permission !== 'admin' && permission !== 'maintain' && permission !== 'write'
                    && permission !== 'triage' && permission !== 'read' && permission !== 'none')
                    return null;
                const role = source.role_name;
                if (role === undefined)
                    return permission;
                if (permission === 'write' && role === 'maintain')
                    return 'maintain';
                if (permission === 'read' && role === 'triage')
                    return 'triage';
                return role === permission ? permission : null;
            }
            // END GENERATED repository-permission.ts
            const crypto = require('crypto');
            const payload = JSON.parse(process.env.PAYLOAD_JSON);
            if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
              throw new Error('client_payload must be one object.');
            }
            const sessionKeys = [
              'schema', 'prNumber', 'expectedBaseSha', 'expectedBaseTreeSha', 'expectedHeadSha',
              'expectedHeadTreeSha', 'manifestPath', 'manifestDigest', 'profile',
              'expectedScopeProposalDigest', 'expectedActionPlanDigest', 'expectedSessionRevision',
              'reviewPolicyDigest', 'requestOperationId'
            ].sort();
            const eventType = process.env.EVENT_TYPE;
            let sessionRequest;
            let actionEnvelope = null;
            const wrapperKeys = Object.keys(payload).sort();
            if (wrapperKeys.length !== 1 || wrapperKeys[0] !== 'payload' ||
                !payload.payload || typeof payload.payload !== 'object' || Array.isArray(payload.payload)) {
              throw new Error('Hosted compiler client_payload must be the exact one-key object wrapper.');
            }
            if (eventType === 'sec-verify-session-v2') {
              sessionRequest = payload.payload;
              const keys = Object.keys(sessionRequest).sort();
              if (keys.length !== sessionKeys.length || keys.some((key, index) => key !== sessionKeys[index])) {
                throw new Error('External Session payload has unknown or missing fields.');
              }
            } else if (eventType === 'sec-produce-verification-action-v2') {
              const providerEnvelope = payload.payload;
              const keys = Object.keys(providerEnvelope).sort();
              const expected = [
                'parentDispatchPlanArchiveDigest', 'parentDispatchPlanArtifactId',
                'parentDispatchPlanArtifactName', 'parentDispatchPlanDigest',
                'parentDispatchPlanPayloadDigest', 'parentJobId', 'parentJobName',
                'parentPlanStepName', 'parentRunAttempt', 'parentRunId',
                'parentWorkflowPath', 'parentWorkflowRef', 'parentWorkflowSha', 'proposal', 'schema'
              ].sort();
              if (keys.length !== expected.length || keys.some((key, index) => key !== expected[index]) ||
                  providerEnvelope.schema !== 'sec-verification-action-provider-envelope-v2') {
                throw new Error('Internal Action payload is not the exact provider-envelope schema.');
              }
              const proposal = providerEnvelope.proposal;
              const proposalKeys = Object.keys(proposal ?? {}).sort();
              const exactProposalKeys = ['proposedActionKey', 'schema', 'sessionRequest'];
              if (proposalKeys.length !== exactProposalKeys.length ||
                  proposalKeys.some((key, index) => key !== exactProposalKeys[index]) ||
                  proposal.schema !== 'sec-verification-action-proposal-v2' ||
                  typeof proposal.proposedActionKey !== 'string' ||
                  !/^sha256:[0-9a-f]{64}$/.test(proposal.proposedActionKey)) {
                throw new Error('Internal Action envelope proposal is not canonical.');
              }
              sessionRequest = proposal.sessionRequest;
              actionEnvelope = providerEnvelope;
              const keys2 = Object.keys(sessionRequest ?? {}).sort();
              if (keys2.length !== sessionKeys.length || keys2.some((key, index) => key !== sessionKeys[index])) {
                throw new Error('Internal Action Session request has unknown or missing fields.');
              }
            } else {
              throw new Error('Unknown hosted compiler dispatch type.');
            }
            if (sessionRequest.schema !== 'sec-verification-session-hosted-request-v1') {
              throw new Error('Session request schema is invalid.');
            }
            const sha = (value, label) => {
              if (typeof value !== 'string' || !/^[0-9a-f]{40}$/.test(value)) throw new Error(`${label} is invalid.`);
              return value;
            };
            const digest = (value, label) => {
              if (typeof value !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(value)) throw new Error(`${label} is invalid.`);
              return value;
            };
            if (!Number.isSafeInteger(sessionRequest.prNumber) || sessionRequest.prNumber < 1) throw new Error('prNumber is invalid.');
            for (const key of ['expectedBaseSha', 'expectedBaseTreeSha', 'expectedHeadSha', 'expectedHeadTreeSha']) sha(sessionRequest[key], key);
            for (const key of ['manifestDigest', 'expectedScopeProposalDigest', 'expectedActionPlanDigest', 'expectedSessionRevision', 'reviewPolicyDigest', 'requestOperationId']) digest(sessionRequest[key], key);
            if (!['quick', 'full'].includes(sessionRequest.profile) ||
                typeof sessionRequest.manifestPath !== 'string' ||
                !/^config\/repository\/work-packages\/[a-z0-9][a-z0-9-]*\.md$/.test(sessionRequest.manifestPath)) {
              throw new Error('Session profile or manifest path is invalid.');
            }
            const [repository, pull] = await Promise.all([
              github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo }),
              github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: sessionRequest.prNumber })
            ]);
            const trusted = (permission) => permission === 'maintain' || permission === 'admin';
            if (actionEnvelope === null) {
              const [actorPermission, triggeringPermission] = await Promise.all([
                github.rest.repos.getCollaboratorPermissionLevel({ owner: context.repo.owner, repo: context.repo.repo, username: process.env.ACTOR_LOGIN }),
                github.rest.repos.getCollaboratorPermissionLevel({ owner: context.repo.owner, repo: context.repo.repo, username: process.env.TRIGGERING_ACTOR_LOGIN })
              ]);
              if (!trusted(normalizeGitHubRepositoryPermission(actorPermission.data)) || !trusted(normalizeGitHubRepositoryPermission(triggeringPermission.data))) {
                throw new Error('External Session dispatch requires maintain/admin actor and triggering actor.');
              }
            } else {
              const sender = JSON.parse(process.env.EVENT_SENDER_JSON);
              if (process.env.ACTOR_LOGIN !== 'github-actions[bot]' ||
                  sender?.login !== 'github-actions[bot]' || sender?.id !== 41898282 ||
                  sender?.node_id !== 'MDM6Qm90NDE4OTgyODI=' || sender?.type !== 'Bot') {
                throw new Error('Internal Action dispatch sender is not the canonical Actions bot.');
              }
            }
            const [baseBranch, headCommit, openPulls] = await Promise.all([
              github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: repository.data.default_branch }),
              github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: sessionRequest.expectedHeadSha }),
              github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 })
            ]);
            const baseSha = baseBranch.data.commit.sha;
            const baseTreeSha = baseBranch.data.commit.commit.tree.sha;
            const pullData = pull.data;
            const sameHead = openPulls.filter((candidate) => candidate.head.sha === sessionRequest.expectedHeadSha &&
              candidate.base.ref === repository.data.default_branch && candidate.head.repo?.id === repository.data.id &&
              candidate.base.repo?.id === repository.data.id);
            if (process.env.WORKFLOW_SHA !== baseSha || sessionRequest.expectedBaseSha !== baseSha ||
                sessionRequest.expectedBaseTreeSha !== baseTreeSha || pullData.state !== 'open' || pullData.draft ||
                pullData.base.ref !== repository.data.default_branch || pullData.base.sha !== baseSha ||
                pullData.head.sha !== sessionRequest.expectedHeadSha ||
                headCommit.data.commit.tree.sha !== sessionRequest.expectedHeadTreeSha ||
                pullData.base.repo?.id !== repository.data.id || pullData.head.repo?.id !== repository.data.id ||
                sameHead.length !== 1) {
              throw new Error('Hosted request default/base/head/tree/PR identity is stale or ambiguous.');
            }
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner, repo: context.repo.repo,
              basehead: `${baseSha}...${sessionRequest.expectedHeadSha}`
            });
            if (comparison.data.behind_by !== 0 || !['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('Candidate must contain the exact current base; multi-commit heads are allowed.');
            }
            const locator = (pullData.body ?? '').replaceAll('\r\n', '\n').split('\n')
              .filter((line) => line.startsWith('Work-Package:'));
            if (locator.length !== 1 || locator[0] !== `Work-Package: ${sessionRequest.manifestPath}`) {
              throw new Error('PR Work-Package locator differs from the request.');
            }
            const manifest = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo,
              path: sessionRequest.manifestPath, ref: sessionRequest.expectedHeadSha
            });
            if (Array.isArray(manifest.data) || manifest.data.type !== 'file' || manifest.data.encoding !== 'base64') {
              throw new Error('Work Package manifest is not one ordinary Git blob.');
            }
            const bytes = Buffer.from(manifest.data.content.replaceAll('\n', ''), 'base64');
            const blobSha = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const manifestDigest = `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
            if (bytes.length === 0 || bytes.length > 131072 || blobSha !== manifest.data.sha ||
                manifestDigest !== sessionRequest.manifestDigest) {
              throw new Error('Work Package blob identity or digest is stale.');
            }
            core.setOutput('request-kind', actionEnvelope === null ? 'session' : 'action');
            core.setOutput('session-request-base64', Buffer.from(JSON.stringify(sessionRequest)).toString('base64'));
            core.setOutput('action-envelope-base64', actionEnvelope === null ? '' : Buffer.from(JSON.stringify(actionEnvelope)).toString('base64'));
            core.setOutput('base-sha', baseSha);
            core.setOutput('base-tree-sha', baseTreeSha);
            core.setOutput('head-sha', sessionRequest.expectedHeadSha);
            core.setOutput('head-tree-sha', sessionRequest.expectedHeadTreeSha);
            core.setOutput('pr-number', String(sessionRequest.prNumber));
            core.setOutput('session-revision', sessionRequest.expectedSessionRevision);
            core.setOutput('session-revision-hex', sessionRequest.expectedSessionRevision.slice(7));
  validate-agent-operation-activation-request:
    name: validate-agent-operation-activation-request
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'sec-produce-agent-operation-activation-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      request-base64: ${{ steps.request.outputs.request-base64 }}
      request-operation-id: ${{ steps.request.outputs.request-operation-id }}
      request-operation-hex: ${{ steps.request.outputs.request-operation-hex }}
      phase: ${{ steps.request.outputs.phase }}
      base-sha: ${{ steps.request.outputs.base-sha }}
      head-sha: ${{ steps.request.outputs.head-sha }}
      head-ref: ${{ steps.request.outputs.head-ref }}
      pr-number: ${{ steps.request.outputs.pr-number }}
      actor-node-id: ${{ steps.request.outputs.actor-node-id }}
      actor-permission: ${{ steps.request.outputs.actor-permission }}
      default-branch: ${{ steps.request.outputs.default-branch }}
    steps:
      - name: Bind activation request to live main, exact draft PR, manifest, and maintainer
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          WORKFLOW_SHA: ${{ github.sha }}
          ACTOR_LOGIN: ${{ github.actor }}
          TRIGGERING_ACTOR_LOGIN: ${{ github.triggering_actor }}
          EVENT_SENDER_JSON: ${{ toJSON(github.event.sender) }}
        with:
          script: |
            // BEGIN GENERATED repository-permission.ts
            function normalizeGitHubRepositoryPermission(value) {
                if (value === null || typeof value !== 'object' || Array.isArray(value))
                    return null;
                const source = value;
                const permission = source.permission;
                if (permission !== 'admin' && permission !== 'maintain' && permission !== 'write'
                    && permission !== 'triage' && permission !== 'read' && permission !== 'none')
                    return null;
                const role = source.role_name;
                if (role === undefined)
                    return permission;
                if (permission === 'write' && role === 'maintain')
                    return 'maintain';
                if (permission === 'read' && role === 'triage')
                    return 'triage';
                return role === permission ? permission : null;
            }
            // END GENERATED repository-permission.ts
            const crypto = require('crypto');
            const wrapper = JSON.parse(process.env.PAYLOAD_JSON);
            const wrapperKeys = Object.keys(wrapper ?? {}).sort();
            if (!wrapper || typeof wrapper !== 'object' || Array.isArray(wrapper) ||
                wrapperKeys.length !== 1 || wrapperKeys[0] !== 'payload' ||
                !wrapper.payload || typeof wrapper.payload !== 'object' || Array.isArray(wrapper.payload)) {
              throw new Error('Activation client_payload must be the exact one-key wrapper.');
            }
            const request = wrapper.payload;
            const requestKeys = [
              'schema', 'phase', 'pullRequestNumber', 'expectedBaseSha', 'expectedHeadSha',
              'manifestPath', 'manifestDigest', 'preparationCommentId', 'requestOperationId'
            ].sort();
            const actualKeys = Object.keys(request).sort();
            if (actualKeys.length !== requestKeys.length ||
                actualKeys.some((key, index) => key !== requestKeys[index]) ||
                request.schema !== 'sec-agent-operation-activation-request-v1') {
              throw new Error('Activation request keys or schema are invalid.');
            }
            const canonical = (value) => {
              if (value === null || typeof value !== 'object') return value;
              if (Array.isArray(value)) return value.map(canonical);
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            };
            const digest = (value) => `sha256:${crypto.createHash('sha256')
              .update(JSON.stringify(canonical(value))).digest('hex')}`;
            const sha = (value, label) => {
              if (typeof value !== 'string' || !/^[0-9a-f]{40}$/.test(value)) {
                throw new Error(`${label} is invalid.`);
              }
              return value;
            };
            const sha256 = (value, label) => {
              if (typeof value !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(value)) {
                throw new Error(`${label} is invalid.`);
              }
              return value;
            };
            const material = Object.fromEntries(Object.entries(request)
              .filter(([key]) => key !== 'requestOperationId'));
            if ((request.phase !== 'prepare' && request.phase !== 'finalize') ||
                !Number.isSafeInteger(request.pullRequestNumber) || request.pullRequestNumber < 1 ||
                (request.phase === 'prepare' ? request.preparationCommentId !== null :
                  !Number.isSafeInteger(request.preparationCommentId) || request.preparationCommentId < 1) ||
                typeof request.manifestPath !== 'string' ||
                !/^config\/repository\/work-packages\/[a-z0-9][a-z0-9-]*\.md$/.test(request.manifestPath) ||
                sha256(request.manifestDigest, 'manifestDigest') !== request.manifestDigest ||
                sha256(request.requestOperationId, 'requestOperationId') !== digest(material)) {
              throw new Error('Activation request content or digest is invalid.');
            }
            sha(request.expectedBaseSha, 'expectedBaseSha');
            sha(request.expectedHeadSha, 'expectedHeadSha');
            const sender = JSON.parse(process.env.EVENT_SENDER_JSON);
            if (process.env.ACTOR_LOGIN !== process.env.TRIGGERING_ACTOR_LOGIN ||
                sender?.login?.toLowerCase() !== process.env.ACTOR_LOGIN.toLowerCase() ||
                typeof sender?.node_id !== 'string') {
              throw new Error('Activation actor, triggering actor, and event sender differ.');
            }
            const [repository, actorPermission, pull, openPulls] = await Promise.all([
              github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo }),
              github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: process.env.ACTOR_LOGIN
              }),
              github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: request.pullRequestNumber
              }),
              github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
              })
            ]);
            const permission = normalizeGitHubRepositoryPermission(actorPermission.data);
            if (permission !== 'admin' && permission !== 'maintain') {
              throw new Error('Activation dispatch requires maintain or admin permission.');
            }
            const [baseBranch, headCommit, comparison] = await Promise.all([
              github.rest.repos.getBranch({
                owner: context.repo.owner, repo: context.repo.repo,
                branch: repository.data.default_branch
              }),
              github.rest.repos.getCommit({
                owner: context.repo.owner, repo: context.repo.repo, ref: request.expectedHeadSha
              }),
              github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner, repo: context.repo.repo,
                basehead: `${request.expectedBaseSha}...${request.expectedHeadSha}`
              })
            ]);
            const baseSha = baseBranch.data.commit.sha;
            const pullData = pull.data;
            const matching = openPulls.filter((candidate) =>
              candidate.number === request.pullRequestNumber &&
              candidate.head.sha === request.expectedHeadSha &&
              candidate.base.sha === request.expectedBaseSha &&
              candidate.head.repo?.id === repository.data.id &&
              candidate.base.repo?.id === repository.data.id);
            if (repository.data.default_branch !== 'main' || process.env.WORKFLOW_SHA !== baseSha ||
                request.expectedBaseSha !== baseSha || pullData.state !== 'open' || !pullData.draft ||
                pullData.base.ref !== 'main' || pullData.base.sha !== baseSha ||
                pullData.head.sha !== request.expectedHeadSha ||
                !pullData.head.ref.startsWith('codex/') ||
                pullData.base.repo?.id !== repository.data.id || pullData.head.repo?.id !== repository.data.id ||
                headCommit.data.commit.tree.sha.length !== 40 || matching.length !== 1 ||
                comparison.data.behind_by !== 0 || comparison.data.ahead_by < 1 ||
                comparison.data.total_commits !== comparison.data.commits.length ||
                comparison.data.commits.some((commit) => (commit.parents ?? []).length !== 1)) {
              throw new Error('Activation live main, PR, head, or linear ancestry is stale or ambiguous.');
            }
            const locator = (pullData.body ?? '').replaceAll('\r\n', '\n').split('\n')
              .filter((line) => line.startsWith('Work-Package:'));
            if (locator.length !== 1 || locator[0] !== `Work-Package: ${request.manifestPath}`) {
              throw new Error('PR Work-Package locator differs from the request.');
            }
            const manifest = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo,
              path: request.manifestPath, ref: request.expectedHeadSha
            });
            if (Array.isArray(manifest.data) || manifest.data.type !== 'file' ||
                manifest.data.encoding !== 'base64') {
              throw new Error('Work Package manifest is not one ordinary Git blob.');
            }
            const bytes = Buffer.from(manifest.data.content.replaceAll('\n', ''), 'base64');
            const blobSha = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const manifestDigest = `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
            if (bytes.length === 0 || bytes.length > 131072 || blobSha !== manifest.data.sha ||
                manifestDigest !== request.manifestDigest) {
              throw new Error('Work Package blob identity or digest is stale.');
            }
            core.setOutput('request-base64', Buffer.from(JSON.stringify(canonical(request))).toString('base64'));
            core.setOutput('request-operation-id', request.requestOperationId);
            core.setOutput('request-operation-hex', request.requestOperationId.slice(7));
            core.setOutput('phase', request.phase);
