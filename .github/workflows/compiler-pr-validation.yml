name: compiler-pr-validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_CHANGED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}
  SEC_AFFECTED_TESTS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}

jobs:
  compiler-pr-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect changed TypeScript files
        id: changed_ts
        run: |
          if git diff --name-only --diff-filter=ACMR "$SEC_AFFECTED_TESTS_BASE" HEAD | grep -E '\.[cm]?tsx?$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed TypeScript files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check changed imports
        if: steps.changed_ts.outputs.changed == 'true'
        env:
          SEC_IMPORTS_CHANGED_ONLY: '1'
        run: bun run imports:check

      - name: Typecheck
        run: bun run typecheck

      - name: Affected fast tests
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/affected-fast-tests.log"
          set +e
          bun run test:affected >"$log_file" 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Affected fast test failure tail"
            tail -n 180 "$log_file"
            echo "::endgroup::"
            exit "$status"
          fi

          cat "$log_file"

  compiler-pr-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: compiler-pr-quick
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: PR risk gate
        run: bun scripts/ci-pr-risk.ts
