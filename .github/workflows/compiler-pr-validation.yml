name: compiler-pr-validation
run-name: verify PR #${{ github.event.pull_request.number }} ${{ github.event.label.name }} @ ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
  SEC_AFFECTED_TESTS_BASE: ${{ github.event.pull_request.base.sha }}
  SEC_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  compiler-pr-verification:
    if: github.event.label.name == 'run-quick' || github.event.label.name == 'run-full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies once
        run: bun install --frozen-lockfile

      - name: Resolve verification profile
        id: profile
        shell: bash
        run: |
          case "${{ github.event.label.name }}" in
            run-full) profile=full ;;
            run-quick) profile=quick ;;
            *) echo "Unsupported verification label" >&2; exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Run exact-head verification
        id: verify
        continue-on-error: true
        shell: bash
        run: bun scripts/ci-verification.ts --profile "$profile" --expected-head "$SEC_EXPECTED_HEAD_SHA"
        env:
          profile: ${{ steps.profile.outputs.profile }}

      - name: Record exact-head verification status
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_PROFILE: ${{ steps.profile.outputs.profile }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const profile = process.env.VERIFY_PROFILE;
            const state = process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failure';
            const statusContext = `sec-verification/${profile}/ci-verification-v2`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.VERIFY_HEAD,
              state,
              context: statusContext,
              description: `${profile} ${state} for exact frozen head`
            });

      - name: Fail failed verification
        if: steps.verify.outcome != 'success'
        run: exit 1
