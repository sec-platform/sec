name: compiler-pr-validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_CHANGED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}
  SEC_AFFECTED_TESTS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}

jobs:
  compiler-pr-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect changed TypeScript files
        id: changed_ts
        run: |
          if git diff --name-only --diff-filter=ACMR "$SEC_AFFECTED_TESTS_BASE" HEAD | grep -E '\.[cm]?tsx?$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed TypeScript files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check changed imports
        if: steps.changed_ts.outputs.changed == 'true'
        env:
          SEC_IMPORTS_CHANGED_ONLY: '1'
        run: bun run imports:check

      - name: Typecheck
        run: bun run typecheck

      - name: Probe contract fast tests
        if: always()
        run: bun run test:fast -- tests/contract/benchmark-budget.test.ts tests/contract/ci-command-contract.test.ts tests/contract/ci-contract.test.ts tests/contract/error-protocol.test.ts tests/contract/reference.test.ts

      - name: Probe runtime semantic fast tests
        if: always()
        run: bun run test:fast -- tests/integration/runtime-contract.test.ts tests/integration/semantic-contract.test.ts tests/integration/semantic-projections.test.ts tests/integration/ticket-pipeline.test.ts tests/integration/workspace-engineering-ir.test.ts tests/unit/engineering-ir.test.ts tests/unit/semantic-contract-ir.test.ts

      - name: Probe integrity fast tests
        if: always()
        run: bun run test:fast -- tests/unit/import-organizer-selection.test.ts tests/unit/path-containment.test.ts tests/unit/project-baseline-paths.test.ts tests/unit/project-baseline-phase.test.ts tests/unit/project-provenance-fallback.test.ts tests/unit/project-write-boundary-fallback.test.ts tests/unit/project-write-boundary.test.ts

      - name: Probe overview runtime fast tests
        if: always()
        run: bun run test:fast -- tests/integration/overview.test.ts tests/integration/project-runtime.test.ts tests/integration/semantic-contract.test.ts tests/unit/project-overview.test.ts

  compiler-pr-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: compiler-pr-quick
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: PR risk gate
        run: bun scripts/ci-pr-risk.ts
