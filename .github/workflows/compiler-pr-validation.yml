name: compiler-pr-validation
run-name: 'verify frozen PR #${{ github.event.client_payload.pull_request }} ${{ github.event.client_payload.profile }} @ ${{ github.event.client_payload.expected_head }} base ${{ github.event.client_payload.expected_base }}'

on:
  repository_dispatch:
    types:
      - sec-verify-frozen-v1

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: compiler-pr-verification-${{ github.event.client_payload.pull_request }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compiler-pr-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Resolve trusted frozen request, exact head, current base, and profile
        id: verification
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_TYPE: sec-verify-frozen-v1
          WORKFLOW_HEAD: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const crypto = require('crypto');
            const payload = JSON.parse(process.env.PAYLOAD_JSON);
            if (!payload || typeof payload !== 'object' || Array.isArray(payload)) throw new Error('client_payload must be an object.');
            const expectedKeys = [
              'expected_base', 'expected_head', 'manifest_digest', 'manifest_path', 'profile', 'pull_request', 'schema'
            ];
            if (JSON.stringify(Object.keys(payload).sort()) !== JSON.stringify(expectedKeys)) {
              throw new Error('client_payload keys are invalid.');
            }
            if (payload.schema !== 'codex-development-frozen-verification-request-v1') throw new Error('client_payload schema is invalid.');
            if (!Number.isSafeInteger(payload.pull_request) || payload.pull_request <= 0) throw new Error('pull_request is invalid.');
            for (const key of ['expected_base', 'expected_head']) {
              if (typeof payload[key] !== 'string' || !/^[0-9a-f]{40}$/.test(payload[key])) throw new Error(`${key} is invalid.`);
            }
            if (payload.profile !== 'quick' && payload.profile !== 'full') throw new Error('profile is invalid.');
            if (typeof payload.manifest_path !== 'string' || !/^docs\/work-packages\/[a-z0-9][a-z0-9-]*\.md$/.test(payload.manifest_path)) {
              throw new Error('manifest_path is invalid.');
            }
            if (typeof payload.manifest_digest !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(payload.manifest_digest)) {
              throw new Error('manifest_digest is invalid.');
            }
            if (process.env.EVENT_TYPE !== 'sec-verify-frozen-v1') throw new Error('repository_dispatch type is invalid.');
            const [repository, pull, actorPermission, triggeringPermission] = await Promise.all([
              github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo }),
              github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: payload.pull_request }),
              github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: process.env.ACTOR
              }),
              github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: process.env.TRIGGERING_ACTOR
              })
            ]);
            const trusted = (permission) => permission === 'maintain' || permission === 'admin';
            if (!trusted(actorPermission.data.permission) || !trusted(triggeringPermission.data.permission)) {
              throw new Error('Frozen verification dispatch requires maintain/admin actor and triggering actor.');
            }
            const livePull = pull.data;
            const [baseBranch, openPulls, headCommit] = await Promise.all([
              github.rest.repos.getBranch({
                owner: context.repo.owner, repo: context.repo.repo, branch: repository.data.default_branch
              }),
              github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
              }),
              github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: payload.expected_head })
            ]);
            const currentBase = baseBranch.data.commit.sha;
            if (
              process.env.WORKFLOW_HEAD !== currentBase ||
              currentBase !== payload.expected_base ||
              livePull.state !== 'open' ||
              livePull.base.sha !== currentBase ||
              livePull.head.sha !== payload.expected_head ||
              livePull.base.repo.id !== repository.data.id ||
              livePull.head.repo?.id !== repository.data.id ||
              headCommit.data.parents.length !== 1 ||
              headCommit.data.parents[0].sha !== currentBase ||
              openPulls.filter((candidate) => candidate.head.sha === payload.expected_head).length !== 1
            ) throw new Error('Frozen verification request is stale or not one same-repository single-parent PR head.');
            const locatorLines = (livePull.body ?? '').replaceAll('\r\n', '\n').split('\n')
              .filter((line) => line.startsWith('Work-Package:'));
            if (locatorLines.length !== 1 || locatorLines[0] !== `Work-Package: ${payload.manifest_path}`) {
              throw new Error('PR Work-Package locator does not match dispatch payload.');
            }
            const [headTree, baseTree] = await Promise.all([
              github.rest.git.getTree({
                owner: context.repo.owner, repo: context.repo.repo,
                tree_sha: headCommit.data.commit.tree.sha, recursive: 'true'
              }),
              github.rest.git.getTree({
                owner: context.repo.owner, repo: context.repo.repo,
                tree_sha: baseBranch.data.commit.commit.tree.sha, recursive: 'true'
              })
            ]);
            if (headTree.data.truncated || baseTree.data.truncated) throw new Error('Verifier trust-root tree comparison was truncated.');
            const manifestEntry = headTree.data.tree.find((entry) => entry.path === payload.manifest_path);
            if (
              !manifestEntry || manifestEntry.type !== 'blob' || manifestEntry.mode !== '100644' ||
              typeof manifestEntry.sha !== 'string' || !/^[0-9a-f]{40}$/.test(manifestEntry.sha)
            ) throw new Error('Work Package manifest must be one non-executable ordinary Git blob.');
            const manifestResponse = await github.rest.git.getBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              file_sha: manifestEntry.sha
            });
            if (manifestResponse.data.encoding !== 'base64' || typeof manifestResponse.data.content !== 'string') {
              throw new Error('Work Package manifest blob encoding is invalid.');
            }
            const manifestBytes = Buffer.from(manifestResponse.data.content.replaceAll('\n', ''), 'base64');
            const manifestBlobSha = crypto.createHash('sha1')
              .update(`blob ${manifestBytes.byteLength}\0`).update(manifestBytes).digest('hex');
            const manifestDigest = `sha256:${crypto.createHash('sha256').update(manifestBytes).digest('hex')}`;
            if (
              manifestBytes.byteLength <= 0 || manifestBytes.byteLength > 131072 ||
              manifestResponse.data.size !== manifestBytes.byteLength ||
              manifestBlobSha !== manifestEntry.sha ||
              manifestDigest !== payload.manifest_digest
            ) throw new Error('Work Package manifest blob identity, length, or digest is stale.');
            const trustFiles = new Set([
              '.gitattributes',
              '.gitignore',
              '.gitmodules',
              '.npmrc',
              'bun.lock',
              'bunfig.toml',
              'docs/scripts/docs-doctor.ts',
              'package.json',
              'platform/dev-runner.ts',
              'platform/shared/affected-test-inventory.ts',
              'platform/shared/ci-artifact-contract.ts',
              'platform/shared/ci-artifact-types.ts',
              'platform/shared/ci-contract.ts',
              'platform/shared/ci-evidence-composition-policy-registry.ts',
              'platform/shared/ci-evidence-contract.ts',
              'platform/shared/ci-evidence-reuse-contract.ts',
              'platform/shared/ci-execution-environment.ts',
              'platform/shared/ci-git-changed-files.ts',
              'platform/shared/ci-pr-risk-selection.ts',
              'platform/shared/ci-verification-plan.ts',
              'platform/shared/ci-verification-revision.ts',
              'platform/shared/collections.ts',
              'platform/shared/constants.ts',
              'platform/shared/contract-freeze-contract.ts',
              'platform/shared/errors.ts',
              'platform/shared/fs.ts',
              'platform/shared/paths.ts',
              'platform/shared/platform-command.ts',
              'platform/shared/process.ts',
              'platform/shared/project-runtime.ts',
              'platform/shared/runtime-dependency-spec.ts',
              'platform/shared/test-budget-contract.ts',
              'platform/shared/test-impact-contract.ts',
              'platform/shared/test-ownership-contract.ts',
              'platform/shared/verification-scope-inventory.ts',
              'scripts/ci-pr-risk.ts',
              'scripts/ci-verification.ts',
              'scripts/ci-workspace-fast.ts',
              'tests/setup/runtime-deps.setup.ts',
              'tsconfig.json'
            ]);
            const trustDirectories = [
              '.github/workflows/',
              '.shared-deps/',
              'node_modules/',
              'platform/dev-runner/',
              'platform/shared/test-impact-rules/',
              'scripts/codex/',
              'tests/testkit/'
            ];
            const trustPrefixes = ['.env'];
            const selectTrust = (tree) => Object.fromEntries(tree
              .filter((entry) => entry.path && (
                trustFiles.has(entry.path) ||
                trustDirectories.some((directory) => entry.path.startsWith(directory)) ||
                trustPrefixes.some((prefix) => entry.path.startsWith(prefix))
              ))
              .map((entry) => [entry.path, `${entry.mode}:${entry.type}:${entry.sha}`])
              .sort(([left], [right]) => left < right ? -1 : left > right ? 1 : 0));
            if (JSON.stringify(selectTrust(headTree.data.tree)) !== JSON.stringify(selectTrust(baseTree.data.tree))) {
              throw new Error('manual-bootstrap-required: frozen head changes verifier trust-root blobs.');
            }
            core.setOutput('profile', payload.profile);
            core.setOutput('head', payload.expected_head);
            core.setOutput('base', currentBase);
            core.setOutput('affected-base', headCommit.data.parents[0].sha);
            core.setOutput('manifest', payload.manifest_path);
            core.setOutput('pull-request', String(payload.pull_request));

      - name: Checkout exact PR head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.verification.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies once
        run: bun install --frozen-lockfile

      - name: Run exact-head verification
        id: verify
        shell: bash
        run: bun scripts/ci-verification.ts --profile "$profile" --expected-head "$SEC_EXPECTED_HEAD_SHA"
        env:
          profile: ${{ steps.verification.outputs.profile }}
          SEC_CHANGED_BASE: ${{ steps.verification.outputs.base }}
          SEC_AFFECTED_TESTS_BASE: ${{ steps.verification.outputs.affected-base }}
          SEC_EXPECTED_HEAD_SHA: ${{ steps.verification.outputs.head }}
          SEC_WORK_PACKAGE_MANIFEST_PATH: ${{ steps.verification.outputs.manifest }}

      - name: Upload compact verification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-verification-v7-${{ steps.verification.outputs.profile }}-pr-${{ steps.verification.outputs.pull-request }}-base-${{ steps.verification.outputs.base }}-head-${{ steps.verification.outputs.head }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/ci-verification-evidence.json
          if-no-files-found: error
          retention-days: 90
