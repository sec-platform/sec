        if: ${{ needs.execute-verification-action-sut.outputs.raw-artifact-name != '' && needs.resolve-verification-action.outputs.provider-disposition == 'start-allowed' }}
        with:
          name: ${{ needs.execute-verification-action-sut.outputs.raw-artifact-name }}
          path: ${{ github.workspace }}/.tmp/codex/hosted-job/assemble-verification-action-terminal/in/raw
      - name: Assemble canonical five-state terminal artifact
        id: assemble
        if: ${{ needs.resolve-verification-action.outputs.provider-disposition == 'start-allowed' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_HOSTED_NEEDS_JSON: ${{ toJSON(needs) }}
          SEC_HOSTED_STEPS_JSON: ${{ toJSON(steps) }}
        run: exec bun --no-env-file src/bootstrap/development/hosted-job-runtime.ts --job assemble-verification-action-terminal --phase assemble-hosted-action-terminal
      - name: Upload canonical terminal Action artifact
        id: upload-terminal
        if: ${{ always() && !cancelled() && steps.assemble.outputs.terminal-ready == 'true' && needs.resolve-verification-action.outputs.provider-disposition == 'start-allowed' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.assemble.outputs.terminal-artifact-name }}
          path: ${{ github.workspace }}/.tmp/codex/hosted-job/assemble-verification-action-terminal/out/terminal
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          overwrite: false
      - name: Create exact post-upload terminal anchor
        id: anchor
        if: ${{ needs.resolve-verification-action.outputs.provider-disposition != 'repair-terminal-status' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_HOSTED_NEEDS_JSON: ${{ toJSON(needs) }}
          SEC_HOSTED_STEPS_JSON: ${{ toJSON(steps) }}
        run: exec bun --no-env-file src/bootstrap/development/hosted-job-runtime.ts --job assemble-verification-action-terminal --phase prepare-terminal-anchor
      - name: Upload exact post-upload terminal anchor
        id: upload-anchor
        if: ${{ always() && !cancelled() && steps.anchor.outputs.anchor-ready == 'true' && needs.resolve-verification-action.outputs.provider-disposition != 'repair-terminal-status' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.anchor.outputs.anchor-artifact-name }}
          path: ${{ github.workspace }}/.tmp/codex/hosted-job/assemble-verification-action-terminal/out/anchor
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          overwrite: false
      - name: Publish neutral terminal provider tombstone
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_HOSTED_NEEDS_JSON: ${{ toJSON(needs) }}
          SEC_HOSTED_STEPS_JSON: ${{ toJSON(steps) }}
        run: exec bun --no-env-file src/bootstrap/development/hosted-job-runtime.ts --job assemble-verification-action-terminal --phase anchor-terminal
  main-health:
    name: sec/main-health
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'sec-produce-main-health-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: sec-main-health-${{ github.event.client_payload.payload.mainSha }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Bind canonical MainHealth request to live main
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          script: |
            const crypto = require('crypto');
            const wrapper = JSON.parse(process.env.PAYLOAD_JSON);
            const wrapperKeys = Object.keys(wrapper ?? {}).sort();
            if (wrapperKeys.length !== 1 || wrapperKeys[0] !== 'payload') {
              throw new Error('MainHealth client_payload must be the exact one-key wrapper.');
            }
            const payload = wrapper.payload;
            const keys = Object.keys(payload ?? {}).sort();
            if (keys.length !== 2 || keys[0] !== 'mainSha' || keys[1] !== 'requestOperationId' ||
                typeof payload.mainSha !== 'string' || !/^[0-9a-f]{40}$/.test(payload.mainSha) ||
                typeof payload.requestOperationId !== 'string' ||
                !/^sha256:[0-9a-f]{64}$/.test(payload.requestOperationId)) {
              throw new Error('MainHealth wrapper payload is not canonical.');
            }
            const operationPreimage = JSON.stringify({
              schema: 'sec-produce-main-health-request-v1',
              mainSha: payload.mainSha
            });
            const expectedOperationId = `sha256:${crypto.createHash('sha256')
              .update(operationPreimage, 'utf8').digest('hex')}`;
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const liveMain = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.data.default_branch
            });
            if (repository.data.default_branch !== 'main' ||
                payload.requestOperationId !== expectedOperationId ||
                process.env.WORKFLOW_SHA !== payload.mainSha ||
                liveMain.data.commit.sha !== payload.mainSha) {
              throw new Error('MainHealth request operation/workflow/live-main identity drifted.');
            }
      - name: Checkout exact pushed main revision
        id: checkout-main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.client_payload.payload.mainSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup trusted Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Cache Bun install
        id: cache-bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies from the frozen lock
        id: install
        run: bun install --frozen-lockfile
      - name: Reject import organization drift
        id: imports-check
        run: bun run imports:check --all
      - name: Run exact-main TypeScript checks
        id: typecheck
        run: bun run typecheck:verified
      - name: Reject static architecture contradictions
        id: static-architecture
        run: bun run audit -- --worktree-source-program --enforce
      - name: Validate active documentation authority
        id: docs-doctor
        run: bun run docs:doctor
      - name: Run the complete fast test inventory
        id: test-fast
        run: bun run test -- --scope fast
