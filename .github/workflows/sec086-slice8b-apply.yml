name: sec086-slice8b-apply

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice8b-apply.yml]

permissions: {}

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current postgres baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = a851f1957d3f0c12869db607f0904ee25c9ed504
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7
          test "$(git hash-object .github/sec086-slice8b-current.py)" = 99ffabfe40746534a66aa59fa6acf1ef619bfc49

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply current-tree postgres ownership transform
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/sec086-slice8b-current.py
          git add src/bootstrap/cli/register-inspection-commands.ts src/bootstrap/cli/formatters.ts
          git diff --cached --check
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7
          grep -q "PostgresContractProjectionSource" src/bootstrap/cli/register-inspection-commands.ts
          grep -q "../../entry/cli/postgres-contract.ts" src/bootstrap/cli/register-inspection-commands.ts
          ! grep -q "export type PostgresContract" src/bootstrap/cli/formatters.ts
          ! grep -q "export function formatPostgresContract" src/bootstrap/cli/formatters.ts

      - name: Verify postgres inspection slice
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun test --timeout 20000 tests/unit/postgres-contract-presentation.test.ts tests/unit/inspection-query.test.ts tests/unit/named-inspection-query.test.ts
          bun run docs:doctor
          bun run audit:module-topology

      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: route postgres inspection through entry'
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7

      - name: Fast-forward isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
