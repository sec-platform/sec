name: sec086-slice8b-apply

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice8b-apply.yml]

permissions: {}

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current postgres baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = a851f1957d3f0c12869db607f0904ee25c9ed504
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7
          test "$(git hash-object .github/sec086-slice8b-current.py)" = 99ffabfe40746534a66aa59fa6acf1ef619bfc49

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Print baseline full topology
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BASELINE FULL TOPOLOGY ==='
          bun src/adapters/repository/repository-audit/cli.ts --worktree-module-topology --full

      - name: Apply current-tree postgres ownership transform
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/sec086-slice8b-current.py
          git add src/bootstrap/cli/register-inspection-commands.ts src/bootstrap/cli/formatters.ts
          git diff --cached --check

      - name: Print transformed full topology
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TRANSFORMED FULL TOPOLOGY ==='
          bun src/adapters/repository/repository-audit/cli.ts --worktree-module-topology --full

      - name: Verify non-topology slice
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun test --timeout 20000 tests/unit/postgres-contract-presentation.test.ts tests/unit/inspection-query.test.ts tests/unit/named-inspection-query.test.ts
          bun run docs:doctor
