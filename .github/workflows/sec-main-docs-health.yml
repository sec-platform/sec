name: sec-main-docs-health
run-name: "docs health main ${{ github.sha }}"

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'public-docs/**'
      - 'src/control/documentation/**'
      - 'tests/unit/public-documentation-projection.test.ts'
      - 'tests/unit/documentation-markdown-reference.test.ts'
      - '.github/workflows/sec-main-docs-health.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: sec-main-docs-health-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  docs-health:
    runs-on: [self-hosted, Linux, X64, sec-linux-verification-v1, sec-linux-verification-trusted-v1]
    timeout-minutes: 30
    steps:
      - name: Checkout exact published main revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Setup trusted Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Validate documentation authority and control contracts
        run: bun run docs:doctor

      - name: Validate documentation compiler and reference projections
        run: >-
          bun test
          src/control/documentation/compiler.test.ts
          tests/unit/public-documentation-projection.test.ts
          tests/unit/documentation-markdown-reference.test.ts
          --timeout 180000

      - name: Validate TypeScript contracts
        run: bun run typecheck
