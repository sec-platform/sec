name: sec086-step2-apply

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-step2-apply.yml]

permissions: {}

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact step-one source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:src)" = 39826a7177d3cf61fa8bf1e0dba05822644d07a9
          test "$(git rev-parse HEAD:tests)" = 39f5b4d1d9f274e4962c3efa96df5363f311d7e8
          git diff --exit-code
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply exact local CLI responsibility patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sec086-step2/part{0,1,2}.b64 | base64 -d | xz -d > "$RUNNER_TEMP/step2.patch"
          echo '9b029e69df172213f879873a50a5861f4c35dfe2d74dc51b9351a90ecf315958  '"$RUNNER_TEMP/step2.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/step2.patch"
          git apply --index "$RUNNER_TEMP/step2.patch"
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith(('src/','tests/')) for p in paths), paths
          PY
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:src")" = b33576e8333df9f7f15335bc839f4fc36fbdb81d
          test "$(git rev-parse "$tree:tests")" = 601245c8944e6bf702078f0e064b715778b9f32f
          git diff --cached --check
      - name: Verify type, docs, topology and CLI boundary
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun run docs:doctor
          bun run audit:module-topology
          bun run sec -- --help >/tmp/sec086-step2-help.txt
      - name: Verify affected CLI protocol behavior
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 15000 \
            tests/unit/artifact-command-input.test.ts \
            tests/unit/artifact-command-input.typecheck.ts \
            tests/unit/cli-boundary-capture.test.ts \
            tests/unit/cli-command-groups.test.ts \
            tests/unit/cli-command-lineage.test.ts \
            tests/unit/cli-failure-lifecycle.test.ts \
            tests/unit/inspection-query.test.ts \
            tests/unit/json-output-options.test.ts \
            tests/unit/named-inspection-query.test.ts \
            tests/unit/pipeline-command-input.test.ts \
            tests/unit/pipeline-command-presentation.test.ts \
            tests/unit/pipeline-command-registration.test.ts \
            tests/unit/pipeline-invocation.test.ts \
            tests/unit/verification-lane-policy.test.ts \
            tests/unit/workspace-action.test.ts \
            tests/unit/workspace-action.typecheck.ts \
            tests/unit/workspace-command-input.test.ts \
            tests/unit/workspace-command-input.typecheck.ts
      - name: Commit only verified src and tests
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'refactor(cli): move protocol lifecycle to entry and application' \
            -m 'Move transport decoding/presentation boundaries toward entry and immutable use-case request capture toward application while retaining effectful command assembly in bootstrap. Transport files remain unchanged and are removed by the final exact-tree cleanup.'
          test "$(git rev-parse HEAD:src)" = b33576e8333df9f7f15335bc839f4fc36fbdb81d
          test "$(git rev-parse HEAD:tests)" = 601245c8944e6bf702078f0e064b715778b9f32f
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build frozen release artifact
        run: bun run build
      - name: Fast-forward isolated refactor branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$(git rev-parse HEAD)"
