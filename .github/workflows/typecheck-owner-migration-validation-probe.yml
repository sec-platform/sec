name: typecheck-owner-migration-validation-probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event.pull_request.number == 726 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependency closure without lifecycle effects
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck exact PR head
        run: bun run typecheck

      - name: Run affected owner regressions
        run: >-
          bun test
          tests/unit/verification-evidence-use-contract.test.ts
          tests/contract/verification-result-contract.test.ts
          src/adapters/runtime-state/generated-state/lifecycle.test.ts
          tests/unit/work-selection-live.test.ts
          src/adapters/repository/source-program-model/module-import-provider.test.ts
          src/adapters/repository/source-program-model/typescript-module-load-consistency.test.ts

      - name: Check diff hygiene
        run: git diff --check origin/main...HEAD
