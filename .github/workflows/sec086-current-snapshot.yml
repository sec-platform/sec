name: sec086-current-snapshot

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-current-snapshot.yml]

permissions:
  contents: read

concurrency:
  group: sec086-current-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.repository == 'sec-platform/sec' && github.ref == 'refs/heads/refactor/sec086-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Export exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/sec086-current"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/sec086-current/source.tar.gz"
          git show -s --format='%H%n%T' HEAD > "$RUNNER_TEMP/sec086-current/identity.txt"
          (cd "$RUNNER_TEMP/sec086-current" && sha256sum source.tar.gz > SHA256SUMS)
      - name: Upload exact current branch source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec086-current-source
          path: ${{ runner.temp }}/sec086-current/
          retention-days: 1
          if-no-files-found: error
