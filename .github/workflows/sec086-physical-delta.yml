name: sec086-physical-delta
on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-physical-delta.yml]
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f482d2077b2c025ffb0b574644dff7631c0b1baa
          persist-credentials: false
      - name: Store exact patched blob without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          file=src/adapters/runtime-state/physical/runtime/physical-no-follow.ts
          test "$(git hash-object "$file")" = be327d96ca2ad67b7c5160947ed220ef64e10c79
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/adapters/runtime-state/physical/runtime/physical-no-follow.ts')
          s=p.read_text()
          changes=[(
          '  const objectId = `linux:${String(stats.dev)}:${String(stats.ino)}:${String(stats.mode)}`;',
          '''  // Directory identity must survive an owner-authorized chmod (sealing and
            // retirement). Permission/ctime drift is checked by the generation proof,
            // not encoded as a different physical object. Version the identifier so an
            // older persisted observation cannot silently acquire the new semantics.
            const objectId = `linux-directory-v2:${String(stats.dev)}:${String(stats.ino)}`;'''),(
          "  let authority: WindowsReadOnlyTreeAuthority;\n  let proofText: string;\n  let proofStatus: 'created' | 'reused';",
          "  // Reject stale/foreign roots before any mode or ACL effect. The content\n  // inventory alone need not contain an entry for the root itself.\n  assertSameNoFollowDirectoryIdentity(input.root, 'Proven generation admission root');\n  let authority: WindowsReadOnlyTreeAuthority;\n  let proofText: string;\n  let proofStatus: 'created' | 'reused';"),(
          '  if (input.source.stdioSourceDescriptor === null\n      || input.source.childPath !== `/proc/self/fd/${input.source.stdioSourceDescriptor}`) {',
          '''  // The parent retains a high-numbered source fd; the process boundary maps
            // it to the bounded child slot named by childPath. Those numbers need not
            // (and normally do not) match.
            const childSlot = /^\\/proc\\/self\\/fd\\/([1-9][0-9]*)$/u.exec(input.source.childPath);
            if (input.source.stdioSourceDescriptor === null || childSlot === null
                || Number(childSlot[1]) < 3 || Number(childSlot[1]) > 64) {''')]
          for before,after in changes:
              assert s.count(before)==1
              s=s.replace(before,after)
          p.write_text(s)
          Path('/tmp/physical-blob.json').write_text(json.dumps({'content':s,'encoding':'utf-8'}))
          PY
          test "$(git hash-object "$file")" = 810a147d79240c96c81874ef50340a7be648a270
          result=$(gh api --method POST repos/sec-platform/sec/git/blobs --input /tmp/physical-blob.json --jq .sha)
          test "$result" = 810a147d79240c96c81874ef50340a7be648a270
          printf 'stored_blob=%s\n' "$result"
