name: sec086-fixture-regression
on:
  push:
    branches: [refactor/sec086-regression-hardening]
    paths: [.github/workflows/sec086-fixture-regression.yml]
permissions: {}
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b70fb2f7224114b03c177dc416cefb28d7ef03e
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Construct the exact bounded fixture candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sec-fixture-checks'
          New-Item -ItemType Directory -Path $dir | Out-Null
          if ((git rev-parse HEAD) -ne '6b70fb2f7224114b03c177dc416cefb28d7ef03e') { throw 'source mismatch' }
          $blob = gh api repos/sec-platform/sec/git/blobs/c6bf8b7c800baeb7d8f512068efc641632a00daa | ConvertFrom-Json
          [IO.File]::WriteAllBytes("$dir/delta.py", [Convert]::FromBase64String($blob.content))
          python "$dir/delta.py" "$dir/tree.json"
          if ($LASTEXITCODE -ne 0) { throw 'delta failed' }
          git add -u
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'whitespace failure' }
          $tree = git write-tree
          if ($tree -ne '109682a614c2181f8515a3a68a92c8fd65d1b6c3') { throw "unexpected tree $tree" }
          $stored = gh api --method POST repos/sec-platform/sec/git/trees --input "$dir/tree.json" --jq .sha
          if ($stored -ne $tree) { throw 'stored tree mismatch' }
          git config user.name QzCrane
          git config user.email 107861762+QzCrane@users.noreply.github.com
          $candidate = git commit-tree $tree -p HEAD -m 'bounded fixture verification candidate'
          git checkout --detach $candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate checkout failed' }
          git rev-parse HEAD 'HEAD^{tree}' | Set-Content "$dir/source.txt"
          git bundle create "$dir/commits.bundle" refs/remotes/origin/refactor/sec086-regression-hardening '^35f38af58c6201a0e72446b84a52a55631d2a52d'
          if ($LASTEXITCODE -ne 0) { throw 'bundle failed' }
      - name: Establish dependencies and use an admitted temporary root
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sec-fixture-checks'
          bun run deps:ensure *> "$dir/deps.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$dir/deps.log"; exit 1 }
          $temp = Join-Path $env:RUNNER_TEMP 'sec-fixtures'
          New-Item -ItemType Directory -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - name: Validate independent failure groups without hiding any failure
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sec-fixture-checks'
          bun -e 'import os from "node:os"; import {inspectNoFollowDirectoryChain} from "./src/adapters/runtime-state/physical/runtime/physical-no-follow.ts"; inspectNoFollowDirectoryChain(os.tmpdir(),"fixture temp");' *> "$dir/temp.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $groups = @(
            @{name='portable'; argv=@('test','tests/unit/repository-unused-code-admission.test.ts','tests/unit/testkit-workspace-files.test.ts','tests/unit/product-verification-profile.test.ts')},
            @{name='loader'; argv=@('test','tests/unit/verification-suite-loading.test.ts','tests/unit/verification-suite-paths.test.ts')},
            @{name='causal'; argv=@('test','src/adapters/repository/source-program-model/contract.test.ts','--test-name-pattern','causal')},
            @{name='projection'; argv=@('test','src/adapters/repository/source-program-model/test-impact-projection.test.ts')},
            @{name='normalization'; argv=@('test','src/adapters/self-hosting/development/import-normalization/contract.test.ts','--timeout','180000')},
            @{name='selection'; argv=@('test','tests/unit/slow-test-selection.test.ts','--timeout','180000')},
            @{name='types'; argv=@('node_modules/@typescript/native/bin/tsc','--noEmit','-p','tsconfig.json')}
          )
          $results = @()
          foreach ($group in $groups) {
            $args = $group.argv
            & bun @args *> "$dir/$($group.name).log"
            $results += @{name=$group.name;exitCode=$LASTEXITCODE}
            Get-Content "$dir/$($group.name).log" -Tail 8
          }
          $results | ConvertTo-Json | Set-Content "$dir/results.json"
          if (@($results | Where-Object {$_.exitCode -ne 0}).Count -gt 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sec086-fixture-checks
          path: ${{ runner.temp }}/sec-fixture-checks/
          retention-days: 7
          if-no-files-found: error
