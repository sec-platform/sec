name: compiler-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  compiler-ci:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Restore runtime dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            .shared-deps
          key: ${{ runner.os }}-runtime-deps-${{ hashFiles('bun.lock', 'package.json', 'platform/shared/runtime-dependency-spec.ts') }}
          restore-keys: |
            ${{ runner.os }}-runtime-deps-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Organize changed imports remotely
        env:
          PJC_IMPORTS_CHANGED_ONLY: '1'
        run: bun run imports:organize

      - name: Commit organized imports
        id: import_commit
        if: github.event_name == 'pull_request'
        run: |
          git update-index --refresh
          git diff --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 0) {
            Write-Host "No import changes to commit."
            "changed=false" >> $env:GITHUB_OUTPUT
          } elseif ($diffExit -eq 1) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git diff --cached --quiet
            $cachedDiffExit = $LASTEXITCODE
            if ($cachedDiffExit -eq 0) {
              Write-Host "Import organizer reported changes, but no content diff remains."
              "changed=false" >> $env:GITHUB_OUTPUT
            } elseif ($cachedDiffExit -eq 1) {
              git commit -m "chore: organize imports"
              git push origin HEAD:${{ github.head_ref }}
              "changed=true" >> $env:GITHUB_OUTPUT
            } else {
              exit $cachedDiffExit
            }
          } else {
            exit $diffExit
          }

      - name: Typecheck
        run: bun run typecheck

      - name: Test budget contract
        run: bun run platform -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

      - name: Changed/affected fast tests
        run: bun run test:changed

      - name: Warm runtime dependency cache
        run: bun run platform -- deps warmup

      - name: Resolve graph
        run: bun run platform -- resolve

      - name: Compose project
        run: bun run platform -- compose

      - name: Adapt project
        run: bun run platform -- adapt

      - name: Verify fast lane
        run: bun run platform -- verify --json --compact

  compiler-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Organize imports remotely
        run: bun run imports:organize

      - name: Typecheck
        run: bun run typecheck

      - name: Test budget contract
        run: bun run platform -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

      - name: Slow e2e suite
        run: bun run test:slow

      - name: Benchmark task suite contract
        run: bun run platform -- benchmark suite --json --compact

      - name: Warm runtime dependency cache
        run: bun run platform -- deps warmup

      - name: Resolve graph
        run: bun run platform -- resolve

      - name: Compose project
        run: bun run platform -- compose

      - name: Adapt project
        run: bun run platform -- adapt

      - name: Verify all lanes
        run: bun run platform -- verify --lane all --json --compact

      - name: Lock project
        run: bun run platform -- lock

      - name: Explain project
        run: bun run platform -- explain

      - name: Reference drift check
        run: bun run platform -- reference check --json --compact
