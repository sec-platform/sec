name: compiler-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  compiler-ci:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache runtime dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shared-deps
          key: ${{ runner.os }}-runtime-deps-${{ hashFiles('bun.lock', 'package.json', 'platform/shared/runtime-dependency-spec.ts') }}
          restore-keys: |
            ${{ runner.os }}-runtime-deps-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Test budget contract
        run: npm run platform -- test budget --json --compact

      - name: Contract freeze
        run: npm run test:contract-freeze

      - name: Warm runtime dependency cache
        run: node ./platform/cli/index.ts deps warmup

      - name: Resolve graph
        run: node ./platform/cli/index.ts resolve

      - name: Compose project
        run: node ./platform/cli/index.ts compose

      - name: Adapt project
        run: node ./platform/cli/index.ts adapt

      - name: Verify fast lane
        run: npm run platform -- verify --json --compact

      - name: Generate fast artifact manifest
        if: failure()
        id: fast_artifacts
        shell: pwsh
        run: |
          node ./platform/cli/index.ts artifacts --json
          $manifest = Get-Content control/ci/artifacts.json -Raw | ConvertFrom-Json
          $governancePaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind governance | ConvertFrom-Json).paths)
          $viewPaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind view | ConvertFrom-Json).paths)
          $testPaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind test | ConvertFrom-Json).paths)
          $contractPaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind contract | ConvertFrom-Json).paths)
          if ($manifest.missing.Count -gt 0) {
            $missing = @($manifest.missing | ForEach-Object { "$($_.path) [$($_.reason); $($_.declaredBy)]" })
            Write-Warning "Missing workspace artifacts: $($missing -join ', ')"
          }
          "governance_paths<<EOF" >> $env:GITHUB_OUTPUT
          $governancePaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "view_paths<<EOF" >> $env:GITHUB_OUTPUT
          $viewPaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "test_paths<<EOF" >> $env:GITHUB_OUTPUT
          $testPaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "contract_paths<<EOF" >> $env:GITHUB_OUTPUT
          $contractPaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload fast governance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-fast-governance-diagnostics
          if-no-files-found: warn
          path: ${{ steps.fast_artifacts.outputs.governance_paths }}

      - name: Upload fast local views
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-fast-local-views
          if-no-files-found: warn
          path: ${{ steps.fast_artifacts.outputs.view_paths }}

      - name: Upload fast runtime test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-fast-runtime-test-results
          if-no-files-found: ignore
          path: ${{ steps.fast_artifacts.outputs.test_paths }}

      - name: Upload fast contract artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-fast-contract-artifacts
          if-no-files-found: ignore
          path: ${{ steps.fast_artifacts.outputs.contract_paths }}

  compiler-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache runtime dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shared-deps
          key: ${{ runner.os }}-runtime-deps-${{ hashFiles('bun.lock', 'package.json', 'platform/shared/runtime-dependency-spec.ts') }}
          restore-keys: |
            ${{ runner.os }}-runtime-deps-

      - name: Cache Next build output
        uses: actions/cache@v4
        with:
          path: |
            project/.next/cache
          key: ${{ runner.os }}-next-full-${{ hashFiles('project/package.json', 'project/tsconfig.json', 'project/next.config.mjs', 'project/src/**/*.ts', 'project/app/**/*.ts', 'project/app/**/*.tsx', 'project/components/**/*.tsx', 'project/lib/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-full-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Test budget contract
        run: npm run platform -- test budget --json --compact

      - name: Contract freeze
        run: npm run test:contract-freeze

      - name: Benchmark task suite contract
        run: npm run platform -- benchmark suite --json --compact

      - name: Warm runtime dependency cache
        run: node ./platform/cli/index.ts deps warmup

      - name: Resolve graph
        run: node ./platform/cli/index.ts resolve

      - name: Compose project
        run: node ./platform/cli/index.ts compose

      - name: Adapt project
        run: node ./platform/cli/index.ts adapt

      - name: Verify all lanes
        run: npm run platform -- verify --lane all --json --compact

      - name: Lock project
        run: node ./platform/cli/index.ts lock

      - name: Explain project
        run: node ./platform/cli/index.ts explain

      - name: Reference drift check
        run: npm run platform -- reference check --json --compact

      - name: Generate artifact manifest
        if: always()
        id: full_artifacts
        shell: pwsh
        run: |
          node ./platform/cli/index.ts artifacts --json
          $manifest = Get-Content control/ci/artifacts.json -Raw | ConvertFrom-Json
          $governancePaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind governance | ConvertFrom-Json).paths)
          $viewPaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind view | ConvertFrom-Json).paths)
          $testPaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind test | ConvertFrom-Json).paths)
          $contractPaths = @((node ./platform/cli/index.ts artifacts --paths --json --compact --kind contract | ConvertFrom-Json).paths)
          if ($manifest.missing.Count -gt 0) {
            $missing = @($manifest.missing | ForEach-Object { "$($_.path) [$($_.reason); $($_.declaredBy)]" })
            Write-Warning "Missing workspace artifacts: $($missing -join ', ')"
          }
          "governance_paths<<EOF" >> $env:GITHUB_OUTPUT
          $governancePaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "view_paths<<EOF" >> $env:GITHUB_OUTPUT
          $viewPaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "test_paths<<EOF" >> $env:GITHUB_OUTPUT
          $testPaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "contract_paths<<EOF" >> $env:GITHUB_OUTPUT
          $contractPaths | Sort-Object -Unique >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-governance-artifacts
          if-no-files-found: warn
          path: ${{ steps.full_artifacts.outputs.governance_paths }}

      - name: Upload local views
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-local-views
          if-no-files-found: warn
          path: ${{ steps.full_artifacts.outputs.view_paths }}

      - name: Upload runtime test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-runtime-test-results
          if-no-files-found: ignore
          path: ${{ steps.full_artifacts.outputs.test_paths }}

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-contract-artifacts
          if-no-files-found: ignore
          path: ${{ steps.full_artifacts.outputs.contract_paths }}
