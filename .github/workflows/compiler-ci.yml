name: compiler-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compiler-ci:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect changed TypeScript files
        id: changed_ts
        run: |
          if git diff --name-only --diff-filter=ACMR HEAD^1 HEAD | grep -E '\.[cm]?tsx?$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed TypeScript files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Organize changed imports remotely
        if: steps.changed_ts.outputs.changed == 'true'
        env:
          PJC_IMPORTS_CHANGED_ONLY: '1'
        run: bun run imports:organize

      - name: Commit organized imports
        id: import_commit
        if: github.event_name == 'pull_request' && steps.changed_ts.outputs.changed == 'true'
        run: |
          git update-index --refresh
          if git diff --quiet; then
            echo "No import changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            if git diff --cached --quiet; then
              echo "Import organizer reported changes, but no content diff remains."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore: organize imports"
              git push origin HEAD:${{ github.head_ref }}
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: PR fast gate
        run: bun scripts/ci-pr-gate.ts

  compiler-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Organize imports remotely
        run: bun run imports:organize

      - name: Typecheck
        run: bun run typecheck

      - name: Test budget contract
        run: bun run platform -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

      - name: Slow e2e suite
        run: bun run test:slow

      - name: Benchmark task suite contract
        run: bun run platform -- benchmark suite --json --compact

      - name: Warm runtime dependency cache
        run: bun run platform -- deps warmup

      - name: Resolve graph
        run: bun run platform -- resolve

      - name: Compose project
        run: bun run platform -- compose

      - name: Adapt project
        run: bun run platform -- adapt

      - name: Verify all lanes
        run: bun run platform -- verify --lane all --json --compact

      - name: Lock project
        run: bun run platform -- lock

      - name: Explain project
        run: bun run platform -- explain

      - name: Reference drift check
        run: bun run platform -- reference check --json --compact
