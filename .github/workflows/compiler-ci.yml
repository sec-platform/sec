name: compiler-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  compiler-ci:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Warm runtime dependency cache
        run: node ./platform/cli/index.ts deps warmup

      - name: Resolve graph
        run: node ./platform/cli/index.ts resolve

      - name: Compose project
        run: node ./platform/cli/index.ts compose

      - name: Adapt project
        run: node ./platform/cli/index.ts adapt

      - name: Verify fast lane
        run: node ./platform/cli/index.ts verify --lane fast

      - name: Upload fast diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-fast-diagnostics
          if-no-files-found: warn
          path: |
            project/generated/**
            project/provenance.json

  compiler-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun and runtime dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .shared-deps
          key: ${{ runner.os }}-runtime-${{ hashFiles('bun.lock', 'package.json', 'platform/shared/runtime-dependency-spec.ts') }}
          restore-keys: |
            ${{ runner.os }}-runtime-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Warm runtime dependency cache
        run: node ./platform/cli/index.ts deps warmup

      - name: Resolve graph
        run: node ./platform/cli/index.ts resolve

      - name: Compose project
        run: node ./platform/cli/index.ts compose

      - name: Adapt project
        run: node ./platform/cli/index.ts adapt

      - name: Verify all lanes
        run: node ./platform/cli/index.ts verify --lane all

      - name: Lock project
        run: node ./platform/cli/index.ts lock

      - name: Explain project
        run: node ./platform/cli/index.ts explain

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-generated-artifacts
          if-no-files-found: warn
          path: |
            project/generated/**
            project/provenance.json
            project/graph.lock.json
            project/test-results/**
