name: compiler-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  compiler-ci:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache runtime dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shared-deps
          key: ${{ runner.os }}-runtime-deps-${{ hashFiles('bun.lock', 'package.json', 'platform/shared/runtime-dependency-spec.ts') }}
          restore-keys: |
            ${{ runner.os }}-runtime-deps-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Check organized imports
        run: bun run imports:check

      - name: Test budget contract
        run: bun run platform -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

      - name: Warm runtime dependency cache
        run: bun run platform -- deps warmup

      - name: Resolve graph
        run: bun run platform -- resolve

      - name: Compose project
        run: bun run platform -- compose

      - name: Adapt project
        run: bun run platform -- adapt

      - name: Verify fast lane
        run: bun run platform -- verify --json --compact

  compiler-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Check organized imports
        run: bun run imports:check

      - name: Test budget contract
        run: bun run platform -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

      - name: Benchmark task suite contract
        run: bun run platform -- benchmark suite --json --compact

      - name: Warm runtime dependency cache
        run: bun run platform -- deps warmup

      - name: Resolve graph
        run: bun run platform -- resolve

      - name: Compose project
        run: bun run platform -- compose

      - name: Adapt project
        run: bun run platform -- adapt

      - name: Verify all lanes
        run: bun run platform -- verify --lane all --json --compact

      - name: Lock project
        run: bun run platform -- lock

      - name: Explain project
        run: bun run platform -- explain

      - name: Reference drift check
        run: bun run platform -- reference check --json --compact
