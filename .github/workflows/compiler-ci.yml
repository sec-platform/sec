name: compiler-ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PJC_CHANGED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}
  PJC_CHANGED_TESTS_BASE: HEAD^1

jobs:
  compiler-ci:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect newly changed TypeScript files
        id: changed_ts
        run: |
          if git diff --name-only --diff-filter=ACMR HEAD^1 HEAD | grep -E '\.[cm]?tsx?$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No newly changed TypeScript files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Organize changed imports remotely
        if: steps.changed_ts.outputs.changed == 'true'
        env:
          PJC_IMPORTS_CHANGED_ONLY: '1'
        run: bun run imports:organize

      - name: Commit organized imports
        id: import_commit
        if: github.event_name == 'pull_request' && steps.changed_ts.outputs.changed == 'true'
        run: |
          git update-index --refresh || true
          if git diff --quiet; then
            echo "No import changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            if git diff --cached --quiet; then
              echo "Import organizer reported changes, but no content diff remains."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore: organize imports"
              git push origin HEAD:${{ github.head_ref }}
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: PR fast gate
        if: steps.import_commit.outputs.changed != 'true'
        timeout-minutes: 4
        run: bun scripts/ci-pr-gate.ts

  compiler-pr-full:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: windows-latest
    timeout-minutes: 20
    needs: compiler-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: PR full typecheck
        run: bun run typecheck

      - name: PR full contract freeze
        run: bun run test:contract-freeze

      - name: PR full slow e2e suite upgrade
        run: bun run test:slow -- --suite upgrade

      - name: PR full slow e2e suite runtime
        run: bun run test:slow -- --suite runtime

      - name: PR full slow e2e suite pipeline
        run: bun run test:slow -- --suite pipeline

      - name: PR full slow e2e suite repair
        run: bun run test:slow -- --suite repair

      - name: PR full slow e2e suite registry
        run: bun run test:slow -- --suite registry

      - name: PR full slow e2e suite explain
        run: bun run test:slow -- --suite explain

      - name: PR full slow e2e suite other
        run: bun run test:slow -- --suite other

      - name: PR full fast workspace gate
        run: bun scripts/ci-fast-gate.ts

  compiler-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Organize imports remotely
        run: bun run imports:organize

      - name: Typecheck
        run: bun run typecheck

      - name: Test budget contract
        run: bun run platform -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

      - name: Slow e2e suite upgrade
        id: slow_upgrade
        if: always()
        continue-on-error: true
        run: bun run test:slow -- --suite upgrade

      - name: Slow e2e suite runtime
        id: slow_runtime
        if: always()
        continue-on-error: true
        run: bun run test:slow -- --suite runtime

      - name: Slow e2e suite pipeline
        id: slow_pipeline
        if: always()
        continue-on-error: true
        run: bun run test:slow -- --suite pipeline

      - name: Slow e2e suite repair
        id: slow_repair
        if: always()
        continue-on-error: true
        run: bun run test:slow -- --suite repair

      - name: Slow e2e suite registry
        id: slow_registry
        if: always()
        continue-on-error: true
        run: bun run test:slow -- --suite registry

      - name: Slow e2e suite explain
        id: slow_explain
        if: always()
        continue-on-error: true
        run: bun run test:slow -- --suite explain

      - name: Slow e2e suite other
        id: slow_other
        if: always()
        continue-on-error: true
        run: bun run test:slow -- --suite other

      - name: Benchmark task suite contract
        if: always()
        run: bun run platform -- benchmark suite --json --compact

      - name: Warm runtime dependency cache
        if: always()
        run: bun run platform -- deps warmup

      - name: Resolve graph
        if: always()
        run: bun run platform -- resolve

      - name: Compose project
        if: always()
        run: bun run platform -- compose

      - name: Adapt project
        if: always()
        run: bun run platform -- adapt

      - name: Verify all lanes
        if: always()
        run: bun run platform -- verify --lane all --json --compact

      - name: Lock project
        if: always()
        run: bun run platform -- lock

      - name: Explain project
        if: always()
        run: bun run platform -- explain

      - name: Reference drift check
        if: always()
        run: bun run platform -- reference check --json --compact

      - name: Full validation summary
        if: always()
        shell: pwsh
        run: |
          $failedSlowSuites = @()
          if ('${{ steps.slow_upgrade.outcome }}' -eq 'failure') { $failedSlowSuites += 'upgrade' }
          if ('${{ steps.slow_runtime.outcome }}' -eq 'failure') { $failedSlowSuites += 'runtime' }
          if ('${{ steps.slow_pipeline.outcome }}' -eq 'failure') { $failedSlowSuites += 'pipeline' }
          if ('${{ steps.slow_repair.outcome }}' -eq 'failure') { $failedSlowSuites += 'repair' }
          if ('${{ steps.slow_registry.outcome }}' -eq 'failure') { $failedSlowSuites += 'registry' }
          if ('${{ steps.slow_explain.outcome }}' -eq 'failure') { $failedSlowSuites += 'explain' }
          if ('${{ steps.slow_other.outcome }}' -eq 'failure') { $failedSlowSuites += 'other' }

          if ($failedSlowSuites.Count -gt 0) {
            Write-Error "Slow e2e suites failed: $($failedSlowSuites -join ', ')"
            exit 1
          }

          Write-Host 'Full validation summary passed.'
