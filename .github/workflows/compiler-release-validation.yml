name: compiler-release-validation
run-name: release verify exact main ${{ github.sha }}
on:
  repository_dispatch:
    types:
      - sec-verify-release-main-v1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  compiler-release-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Resolve trusted release request, exact head, and verifier boundary
        id: verification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const requestedRef = context.sha;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: requestedRef
            });
            if (commit.parents.length !== 1 || !/^[0-9a-f]{40}$/.test(commit.parents[0].sha)) {
              throw new Error('Release verification requires exactly one commit parent.');
            }
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.default_branch
            });
            if (commit.sha !== requestedRef || context.ref !== `refs/heads/${repository.default_branch}`
              || context.sha !== baseBranch.commit.sha) {
              throw new Error('Release verifier workflow must execute from the current trusted default branch.');
            }
            core.setOutput('sha', commit.sha);
            core.setOutput('base', commit.parents[0].sha);
      - name: Checkout exact release head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.verification.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify checked-out release parent and tree
        shell: bash
        env:
          SEC_EXPECTED_HEAD_SHA: ${{ steps.verification.outputs.sha }}
          SEC_CHANGED_BASE: ${{ steps.verification.outputs.base }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$SEC_EXPECTED_HEAD_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$SEC_EXPECTED_HEAD_SHA $SEC_CHANGED_BASE"
          git cat-file -e "$SEC_CHANGED_BASE^{commit}"
          git cat-file -e "$SEC_CHANGED_BASE^{tree}"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies once
        run: bun install --frozen-lockfile
      - name: Run exact-head full verification
        id: verify
        shell: bash
        env:
          SEC_EXPECTED_HEAD_SHA: ${{ steps.verification.outputs.sha }}
          SEC_CHANGED_BASE: ${{ steps.verification.outputs.base }}
          SEC_AFFECTED_TESTS_BASE: ${{ steps.verification.outputs.base }}
        run: bun src/bootstrap/development/ci-verification.ts --profile full --expected-head "$SEC_EXPECTED_HEAD_SHA"
      - name: Build and bind exact-head release set
        shell: bash
        env:
          SEC_EXPECTED_HEAD_SHA: ${{ steps.verification.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEC_EXPECTED_HEAD_SHA"
          expected_tree="$(git rev-parse HEAD^{tree})"
          bun run release:build
          test "$(git rev-parse HEAD)" = "$SEC_EXPECTED_HEAD_SHA"
          jq -e --arg commit "$SEC_EXPECTED_HEAD_SHA" --arg tree "$expected_tree" \
            '.schema == "sec-release-set-manifest-v1" and .sourceCommit == $commit and .sourceTree == $tree' \
            build/release-set/release-set-manifest.json > /dev/null

          # Preserve the observed build identity and per-file digests independently
          # of the short-lived, rebuildable validation payload.
          manifest_root="$RUNNER_TEMP/sec-release-manifests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -- "$manifest_root"
          cp -- build/release-set/release-set-manifest.json \
            build/release-set/runtime/runtime-package-manifest.json \
            build/release-set/documentation/documentation-package-manifest.json \
            "$manifest_root/"
      - name: Upload exact-head release manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec-release-manifests-${{ steps.verification.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sec-release-manifests-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
      - name: Upload exact-head runtime and documentation release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec-release-set-${{ steps.verification.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: build/release-set/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload compact full verification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec-verification-v19-full-release-head-${{ steps.verification.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/ci-verification-evidence.json
          if-no-files-found: error
          retention-days: 90
    permissions:
      contents: read
