name: compiler-release-validation
run-name: release verify ${{ inputs.ref || github.sha }}

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit to verify
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compiler-release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies once
        run: bun install --frozen-lockfile

      - name: Capture exact head
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run exact-head full verification
        id: verify
        continue-on-error: true
        shell: bash
        env:
          SEC_EXPECTED_HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: bun scripts/ci-verification.ts --profile full --expected-head "$SEC_EXPECTED_HEAD_SHA"

      - name: Record exact-head full verification status
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_HEAD: ${{ steps.head.outputs.sha }}
        with:
          script: |
            const state = process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.VERIFY_HEAD,
              state,
              context: 'sec-verification/full/ci-verification-v2',
              description: `full ${state} for exact frozen head`
            });

      - name: Fail failed verification
        if: steps.verify.outcome != 'success'
        run: exit 1
