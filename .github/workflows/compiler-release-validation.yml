name: compiler-release-validation
run-name: release verify exact main ${{ github.sha }}

on:
  repository_dispatch:
    types:
      - sec-verify-release-main-v1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compiler-release-verification:
    runs-on: [self-hosted, Linux, X64, sec-linux-verification-v1, sec-linux-verification-sut-v1]
    timeout-minutes: 90
    steps:
      - name: Resolve trusted release request, exact head, and verifier boundary
        id: verification
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const requestedRef = context.sha;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: requestedRef
            });
            if (commit.parents.length === 0) throw new Error('Release verification requires a commit parent for v5 bases.');
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.default_branch
            });
            if (context.ref !== `refs/heads/${repository.default_branch}` || context.sha !== baseBranch.commit.sha) {
              throw new Error('Release verifier workflow must execute from the current trusted default branch.');
            }
            const [headTree, baseTree] = await Promise.all([
              github.rest.git.getTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tree_sha: commit.commit.tree.sha,
                recursive: 'true'
              }),
              github.rest.git.getTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tree_sha: baseBranch.commit.commit.tree.sha,
                recursive: 'true'
              })
            ]);
            if (headTree.data.truncated || baseTree.data.truncated) {
              throw new Error('Verifier trust-root tree comparison was truncated.');
            }
            const registryPath = 'platform/shared/ci-trust-root-registry.json';
            const registryEntry = baseTree.data.tree.find((entry) => entry.path === registryPath);
            if (
              !registryEntry || registryEntry.type !== 'blob' || registryEntry.mode !== '100644' ||
              typeof registryEntry.sha !== 'string' || !/^[0-9a-f]{40}$/.test(registryEntry.sha)
            ) throw new Error('Trusted-base trust-root registry is unavailable or not one ordinary blob.');
            const registryResponse = await github.rest.git.getBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              file_sha: registryEntry.sha
            });
            if (registryResponse.data.encoding !== 'base64' || typeof registryResponse.data.content !== 'string') {
              throw new Error('Trusted-base trust-root registry blob encoding is invalid.');
            }
            const registryBytes = Buffer.from(registryResponse.data.content.replaceAll('\n', ''), 'base64');
            let registry;
            try {
              registry = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(registryBytes));
            } catch {
              throw new Error('Trusted-base trust-root registry is not strict UTF-8 JSON.');
            }
            const registryKeys = [
              'reviewedBoundaryEdges', 'reviewedSutEdges', 'runtimeEntrypoints', 'schema',
              'staticDirectoryPaths', 'staticExactPaths', 'staticPrefixes'
            ];
            if (
              !registry || typeof registry !== 'object' || Array.isArray(registry) ||
              registry.schema !== 'sec-trusted-bootstrap-registry-v3' ||
              JSON.stringify(Object.keys(registry).sort()) !== JSON.stringify(registryKeys)
            ) throw new Error('Trusted-base trust-root registry schema is invalid.');
            for (const key of [
              'staticExactPaths', 'staticDirectoryPaths', 'staticPrefixes', 'runtimeEntrypoints',
              'reviewedSutEdges', 'reviewedBoundaryEdges'
            ]) {
              if (!Array.isArray(registry[key]) || registry[key].some((entry) => typeof entry !== 'string')) {
                throw new Error(`Trusted-base trust-root registry ${key} is invalid.`);
              }
            }
            if (registry.reviewedBoundaryEdges.some((edge) => !/^[^ ]+ -> [^ ]+$/.test(edge)) ||
                !registry.reviewedBoundaryEdges.includes(
                  'scripts/ci-verification.ts -> platform/shared/tcb-closure-lock.ts'
                ) ||
                !registry.reviewedBoundaryEdges.includes(
                  'scripts/codex/verification-session.ts -> platform/shared/tcb-closure-lock.ts'
                )) {
              throw new Error('Trusted-base reviewedBoundaryEdges do not match the canonical V3 boundary shape.');
            }
            const lockPath = 'platform/shared/tcb-closure-lock.ts';
            const lockEntry = baseTree.data.tree.find((entry) => entry.path === lockPath);
            if (
              !lockEntry || lockEntry.type !== 'blob' || lockEntry.mode !== '100644' ||
              typeof lockEntry.sha !== 'string' || !/^[0-9a-f]{40}$/.test(lockEntry.sha)
            ) throw new Error('Trusted-base generated TCB closure lock is unavailable or not one ordinary blob.');
            const lockResponse = await github.rest.git.getBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              file_sha: lockEntry.sha
            });
            if (lockResponse.data.encoding !== 'base64' || typeof lockResponse.data.content !== 'string') {
              throw new Error('Trusted-base generated TCB closure lock blob encoding is invalid.');
            }
            const lockBytes = Buffer.from(lockResponse.data.content.replaceAll('\n', ''), 'base64');
            const lockSource = new TextDecoder('utf-8', { fatal: true }).decode(lockBytes);
            const lockRegionStartMarker = '// <sec-tcb-closure-lock-generated-v2>\n';
            const lockRegionEndMarker = '\n// </sec-tcb-closure-lock-generated-v2>';
            const lockRegionStart = lockSource.indexOf(lockRegionStartMarker);
            const lockRegionEnd = lockSource.indexOf(
              lockRegionEndMarker,
              lockRegionStart + lockRegionStartMarker.length
            );
            if (lockRegionStart < 0 || lockRegionEnd < 0 ||
                lockSource.indexOf(lockRegionStartMarker, lockRegionStart + 1) >= 0 ||
                lockSource.indexOf(lockRegionEndMarker, lockRegionEnd + 1) >= 0 ||
                lockSource.includes('\r') || lockSource.includes('\0')) {
              throw new Error('Trusted-base generated TCB closure region is invalid.');
            }
            const lockRegion = lockSource.slice(
              lockRegionStart + lockRegionStartMarker.length,
              lockRegionEnd
            );
            const lockPrefix = 'export const TCB_CLOSURE_LOCK: TcbClosureLock = ';
            const lockSuffix = ';\n\nexport const TCB_CLOSURE_LOCK_RECEIPT';
            const lockStart = lockRegion.indexOf(lockPrefix);
            const lockEnd = lockRegion.indexOf(lockSuffix, lockStart + lockPrefix.length);
            if (lockStart < 0 || lockEnd < 0 || lockRegion.indexOf(lockPrefix, lockStart + 1) >= 0 ||
                lockRegion.indexOf(lockSuffix, lockEnd + 1) >= 0) {
              throw new Error('Trusted-base generated TCB closure lock envelope is invalid.');
            }
            let lock;
            try {
              lock = JSON.parse(lockRegion.slice(lockStart + lockPrefix.length, lockEnd));
            } catch {
              throw new Error('Trusted-base generated TCB closure lock is not canonical JSON.');
            }
            const lockKeys = [
              'closureDigest', 'moduleBlobs', 'moduleContentDigests', 'moduleCount', 'modules',
              'reviewedBoundaryEdges', 'reviewedEdges', 'reviewedExternalImports',
              'reviewedProcessDispatchers', 'schema', 'trustRevision'
            ];
            if (!lock || typeof lock !== 'object' || Array.isArray(lock) ||
                lock.schema !== 'sec-tcb-closure-lock-v2' ||
                JSON.stringify(Object.keys(lock).sort()) !== JSON.stringify(lockKeys) ||
                !Number.isSafeInteger(lock.moduleCount) || lock.moduleCount <= 0 ||
                !Array.isArray(lock.modules) || lock.modules.length !== lock.moduleCount ||
                lock.modules.some((entry) => typeof entry !== 'string' || entry.length === 0 ||
                  entry.includes('\\') || entry.startsWith('/') || entry.includes('//') ||
                  entry.split('/').some((segment) => segment.length === 0 || segment === '.' || segment === '..')) ||
                lock.modules.some((entry, index) => index > 0 && lock.modules[index - 1] >= entry)) {
              throw new Error('Trusted-base generated TCB closure module identity is invalid.');
            }
            const causalRuntimePaths = lock.modules;
            const trustFiles = new Set([...registry.staticExactPaths, ...causalRuntimePaths]);
            const trustDirectories = registry.staticDirectoryPaths;
            const trustPrefixes = registry.staticPrefixes;
            const selectTrust = (tree) => Object.fromEntries(tree
              .filter((entry) => entry.path && (
                trustFiles.has(entry.path) ||
                trustDirectories.some((directory) => entry.path.startsWith(directory)) ||
                trustPrefixes.some((prefix) => entry.path.startsWith(prefix))
              ))
              .map((entry) => [entry.path, `${entry.mode}:${entry.type}:${entry.sha}`])
              .sort(([left], [right]) => left < right ? -1 : left > right ? 1 : 0));
            if (JSON.stringify(selectTrust(headTree.data.tree)) !== JSON.stringify(selectTrust(baseTree.data.tree))) {
              throw new Error('manual-bootstrap-required: release ref changes the verifier trust root.');
            }
            core.setOutput('sha', commit.sha);
            core.setOutput('base', commit.parents[0].sha);

      - name: Checkout exact release head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.verification.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch release base for exact tree comparison
        run: git fetch --no-tags --depth=1 origin ${{ steps.verification.outputs.base }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache tsc incremental build info
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tmp/typecheck/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('platform/**/*.ts', 'tests/**/*.ts', 'scripts/**/*.ts', 'tsconfig.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      - name: Install dependencies once
        run: bun install --frozen-lockfile

      - name: Check release TCB closure lock read-only
        run: bun scripts/ci-verification.ts tcb-closure-lock --mode check

      - name: Run exact-head full verification
        id: verify
        shell: bash
        env:
          SEC_EXPECTED_HEAD_SHA: ${{ steps.verification.outputs.sha }}
          SEC_CHANGED_BASE: ${{ steps.verification.outputs.base }}
          SEC_AFFECTED_TESTS_BASE: ${{ steps.verification.outputs.base }}
        run: bun scripts/ci-verification.ts --profile full --expected-head "$SEC_EXPECTED_HEAD_SHA"

      - name: Upload compact full verification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-verification-v19-full-release-head-${{ steps.verification.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/ci-verification-evidence.json
          if-no-files-found: error
          retention-days: 90
