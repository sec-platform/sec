name: compiler-release-validation
run-name: release verify ${{ inputs.ref || github.sha }}

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compiler-release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve trusted release request, exact head, and verifier boundary
        id: verification
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
        with:
          script: |
            const requestedRef = process.env.REQUESTED_REF;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: requestedRef
            });
            if (commit.parents.length === 0) throw new Error('Release verification requires a commit parent for v5 bases.');
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.default_branch
            });
            const [headTree, baseTree] = await Promise.all([
              github.rest.git.getTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tree_sha: commit.commit.tree.sha,
                recursive: 'true'
              }),
              github.rest.git.getTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tree_sha: baseBranch.commit.commit.tree.sha,
                recursive: 'true'
              })
            ]);
            if (headTree.data.truncated || baseTree.data.truncated) {
              throw new Error('Verifier trust-root tree comparison was truncated.');
            }
            const trustFiles = new Set([
              '.gitattributes',
              '.gitignore',
              '.gitmodules',
              '.npmrc',
              'bun.lock',
              'bunfig.toml',
              'docs/scripts/docs-doctor.ts',
              'package.json',
              'platform/dev-runner.ts',
              'platform/shared/active-documentation-contract.ts',
              'platform/shared/affected-test-inventory.ts',
              'platform/shared/bun-runtime-version.ts',
              'platform/shared/ci-artifact-contract.ts',
              'platform/shared/ci-artifact-types.ts',
              'platform/shared/ci-contract.ts',
              'platform/shared/ci-evidence-composition-policy-registry.ts',
              'platform/shared/ci-evidence-contract.ts',
              'platform/shared/ci-evidence-reuse-contract.ts',
              'platform/shared/ci-execution-environment.ts',
              'platform/shared/ci-git-changed-files.ts',
              'platform/shared/ci-pr-risk-selection.ts',
              'platform/shared/ci-verification-plan.ts',
              'platform/shared/ci-verification-revision.ts',
              'platform/shared/collections.ts',
              'platform/shared/constants.ts',
              'platform/shared/contract-freeze-contract.ts',
              'platform/shared/errors.ts',
              'platform/shared/fs.ts',
              'platform/shared/heavy-verification-gate-lease.ts',
              'platform/shared/paths.ts',
              'platform/shared/platform-command.ts',
              'platform/shared/process.ts',
              'platform/shared/project-runtime.ts',
              'platform/shared/repository-path-contract.ts',
              'platform/shared/runtime-dependency-spec.ts',
              'platform/shared/test-budget-contract.ts',
              'platform/shared/test-impact-contract.ts',
              'platform/shared/test-ownership-contract.ts',
              'platform/shared/verification-scope-inventory.ts',
              'scripts/ci-pr-risk.ts',
              'scripts/ci-verification.ts',
              'scripts/ci-workspace-fast.ts',
              'scripts/install-git-hooks.ts',
              'tests/setup/runtime-deps.setup.ts',
              'tsconfig.json'
            ]);
            const trustDirectories = [
              '.github/workflows/',
              '.shared-deps/',
              'node_modules/',
              'platform/dev-runner/',
              'platform/shared/test-impact-rules/',
              'scripts/codex/',
              'tests/testkit/'
            ];
            const trustPrefixes = ['.env'];
            const selectTrust = (tree) => Object.fromEntries(tree
              .filter((entry) => entry.path && (
                trustFiles.has(entry.path) ||
                trustDirectories.some((directory) => entry.path.startsWith(directory)) ||
                trustPrefixes.some((prefix) => entry.path.startsWith(prefix))
              ))
              .map((entry) => [entry.path, `${entry.mode}:${entry.type}:${entry.sha}`])
              .sort(([left], [right]) => left < right ? -1 : left > right ? 1 : 0));
            if (JSON.stringify(selectTrust(headTree.data.tree)) !== JSON.stringify(selectTrust(baseTree.data.tree))) {
              throw new Error('manual-bootstrap-required: release ref changes the verifier trust root.');
            }
            core.setOutput('sha', commit.sha);
            core.setOutput('base', commit.parents[0].sha);

      - name: Checkout exact release head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.verification.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies once
        run: bun install --frozen-lockfile

      - name: Run exact-head full verification
        id: verify
        shell: bash
        env:
          SEC_EXPECTED_HEAD_SHA: ${{ steps.verification.outputs.sha }}
          SEC_CHANGED_BASE: ${{ steps.verification.outputs.base }}
          SEC_AFFECTED_TESTS_BASE: ${{ steps.verification.outputs.base }}
        run: bun scripts/ci-verification.ts --profile full --expected-head "$SEC_EXPECTED_HEAD_SHA"

      - name: Upload compact full verification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-verification-v17-full-release-head-${{ steps.verification.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/ci-verification-evidence.json
          if-no-files-found: error
          retention-days: 90
