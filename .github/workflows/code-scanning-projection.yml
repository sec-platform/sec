name: code-scanning-projection

on:
  check_run:
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: read

concurrency:
  group: code-scanning-projection-${{ github.event.check_run.pull_requests[0].number || github.event.check_run.head_sha }}
  cancel-in-progress: true

jobs:
  project:
    if: >-
      github.event.check_run.name == 'CodeQL' &&
      github.event.check_run.app.slug == 'github-advanced-security' &&
      github.event.check_run.pull_requests[0].number > 0
    runs-on: [self-hosted, Linux, X64, sec-linux-verification-v1, sec-linux-verification-trusted-v1]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch projection owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Project exact-head CodeQL findings
        env:
          SEC_CODE_SCANNING_PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          SEC_CODE_SCANNING_EXPECTED_HEAD: ${{ github.event.check_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            set +e
            output="$(bun src/adapters/verification/platform/code-scanning/projection.ts 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 75 ]; then
              exit "$status"
            fi
            sleep 10
          done
          echo "Code scanning projection did not observe exact-head JavaScript/TypeScript settlement within the bounded join window." >&2
          exit 1
