name: code-scanning-projection
run-name: 'project CodeQL findings for PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}'

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read
  security-events: read

concurrency:
  group: sec-code-scanning-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  project:
    if: >-
      ${{ github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted projection owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Join final GitHub Advanced Security CodeQL check
        id: codeql
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const expectedHead = process.env.EXPECTED_HEAD_SHA;
            const deadline = Date.now() + 12 * 60 * 1000;
            while (true) {
              const response = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: expectedHead,
                filter: 'latest',
                per_page: 100
              });
              const codeql = response.data.check_runs.filter((run) =>
                run.name === 'CodeQL' &&
                run.head_sha === expectedHead &&
                run.app?.slug === 'github-advanced-security'
              );
              const terminal = codeql.filter((run) =>
                run.status === 'completed' &&
                (run.conclusion === 'success' || run.conclusion === 'failure')
              );
              if (terminal.length === 1) {
                core.setOutput('check-id', String(terminal[0].id));
                return;
              }
              if (terminal.length > 1) {
                throw new Error('Multiple final GitHub Advanced Security CodeQL checks bind this exact head.');
              }
              const otherCompleted = codeql.filter((run) =>
                run.status === 'completed' && run.conclusion !== null && run.conclusion !== 'neutral'
              );
              if (otherCompleted.length > 0) {
                throw new Error('CodeQL completed without a publishable security result.');
              }
              if (Date.now() >= deadline) {
                throw new Error('Timed out waiting for the final CodeQL check for the exact PR head.');
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

      - name: Project exact CodeQL findings to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_CODE_SCANNING_PR_NUMBER: ${{ github.event.pull_request.number }}
          SEC_CODE_SCANNING_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SEC_CODE_SCANNING_CHECK_ID: ${{ steps.codeql.outputs.check-id }}
        run: bun src/adapters/verification/platform/ci/runtime/code-scanning-projection.ts publish
