name: codeql-race-readers-validation-probe

on:
  push:
    branches:
      - fix/codeql-filesystem-race-readers

permissions:
  contents: read

concurrency:
  group: codeql-race-readers-validation-probe-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Run native typecheck
        run: bun run typecheck

      - name: Run focused regression tests
        run: |
          bun test \
            tests/unit/import-transform-transaction.test.ts \
            tests/unit/windows-appcontainer-probe-assets.test.ts

  validate:
    runs-on: [self-hosted, Linux, X64, sec-linux-verification-v1, sec-linux-verification-sut-v1]
    timeout-minutes: 90
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Run exact-head full verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          SEC_EXPECTED_HEAD_SHA="$GITHUB_SHA" \
          SEC_CHANGED_BASE="$base" \
          SEC_AFFECTED_TESTS_BASE="$base" \
            bun src/adapters/verification/platform/ci/verification.ts --profile full --expected-head "$GITHUB_SHA"

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            tests/unit/import-transform-transaction.test.ts \
            tests/unit/windows-appcontainer-probe-assets.test.ts
