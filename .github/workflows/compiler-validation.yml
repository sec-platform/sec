name: compiler-validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PJC_CHANGED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}
  PJC_AFFECTED_TESTS_BASE: HEAD^1

jobs:
  compiler-pr-quick:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect newly changed TypeScript files
        id: changed_ts
        run: |
          if git diff --name-only --diff-filter=ACMR HEAD^1 HEAD | grep -E '\.[cm]?tsx?$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No newly changed TypeScript files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Organize changed imports remotely
        if: steps.changed_ts.outputs.changed == 'true'
        env:
          PJC_IMPORTS_CHANGED_ONLY: '1'
        run: bun run imports:organize

      - name: Commit organized imports
        id: import_commit
        if: github.event_name == 'pull_request' && steps.changed_ts.outputs.changed == 'true'
        run: |
          git update-index --refresh || true
          if git diff --quiet; then
            echo "No import changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            if git diff --cached --quiet; then
              echo "Import organizer reported changes, but no content diff remains."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore: organize imports"
              git push origin HEAD:${{ github.head_ref }}
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: PR quick gate
        if: steps.import_commit.outputs.changed != 'true'
        timeout-minutes: 12
        run: bun scripts/ci-pr-quick.ts

  compiler-pr-risk:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: compiler-pr-quick
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: PR risk gate
        run: bun scripts/ci-pr-risk.ts

  compiler-release-preflight:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Organize imports remotely
        run: bun run imports:organize

      - name: Typecheck
        run: bun run typecheck

      - name: Test budget contract
        run: bun run platform -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

  compiler-release-slow-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.slow_suites.outputs.suites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Emit slow suite matrix
        id: slow_suites
        run: |
          suites=$(bun -e "import { slowTestSuiteIds } from './platform/shared/test-budget-contract.ts'; console.log(JSON.stringify(slowTestSuiteIds()))")
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  compiler-release-slow:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - compiler-release-preflight
      - compiler-release-slow-matrix
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.compiler-release-slow-matrix.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Slow e2e suite
        run: bun run test:slow -- --suite ${{ matrix.suite }}

  compiler-release-workspace:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: compiler-release-preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Benchmark task suite contract
        if: always()
        run: bun run platform -- benchmark suite --json --compact

      - name: Warm runtime dependency cache
        if: always()
        run: bun run platform -- deps warmup

      - name: Resolve graph
        if: always()
        run: bun run platform -- resolve

      - name: Compose project
        if: always()
        run: bun run platform -- compose

      - name: Adapt project
        if: always()
        run: bun run platform -- adapt

      - name: Verify all lanes
        if: always()
        run: bun run platform -- verify --lane all --json --compact

      - name: Lock project
        if: always()
        run: bun run platform -- lock

      - name: Explain project
        if: always()
        run: bun run platform -- explain

      - name: Reference drift check
        if: always()
        run: bun run platform -- reference check --json --compact

  compiler-release-full:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - compiler-release-preflight
      - compiler-release-slow
      - compiler-release-workspace
    steps:
      - name: Full validation summary
        shell: pwsh
        run: |
          $failedJobs = @()
          if ('${{ needs.compiler-release-preflight.result }}' -ne 'success') { $failedJobs += 'preflight' }
          if ('${{ needs.compiler-release-slow.result }}' -ne 'success') { $failedJobs += 'slow suites' }
          if ('${{ needs.compiler-release-workspace.result }}' -ne 'success') { $failedJobs += 'workspace' }

          if ($failedJobs.Count -gt 0) {
            Write-Error "Full validation failed: $($failedJobs -join ', ')"
            exit 1
          }

          Write-Host 'Full validation summary passed.'
