name: sec086-native-failures
on:
  push:
    branches: [refactor/sec086-regression-hardening]
    paths: [.github/workflows/sec086-native-failures.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bec45df7d636791f92a5087c046d0adc9fb1fc03
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Bind source and dependencies
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'sec-cause'
          New-Item -ItemType Directory -Path $dir | Out-Null
          if ((git rev-parse 'HEAD^{tree}') -ne '147b082d713372bec23a906c5b64523406b969e6') { throw 'source mismatch' }
          git rev-parse HEAD 'HEAD^{tree}' | Set-Content "$dir/source.txt"
          git bundle create "$dir/commits.bundle" refs/remotes/origin/refactor/sec086-regression-hardening '^d2224e95d44486f502608bf93e44633f68f42c20'
          bun run deps:ensure *> "$dir/deps.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $temp=Join-Path $env:RUNNER_TEMP 'sec-cause-temp'
          New-Item -ItemType Directory -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - name: Observe nested retained command before instrumentation
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'sec-cause'
          bun -e 'import {runObservedCommand} from "./src/adapters/runtime-state/physical/runtime/observed-process.ts"; const args=["test","tests/unit/install-git-hooks.test.ts","tests/unit/project-baseline-phase.test.ts","tests/unit/project-provenance-fallback.test.ts","tests/unit/project-write-boundary-fallback.test.ts","--parallel=2","--isolate","--no-orphans"]; const result=await runObservedCommand(process.execPath,args,{cwd:process.cwd(),timeoutMs:60000,onOutput:(stream,bytes)=>process[stream].write(bytes)}); console.log(JSON.stringify(result));' *> "$dir/nested.log"
          "exit=$LASTEXITCODE" | Set-Content "$dir/nested-exit.txt"
          Get-Content "$dir/nested.log" -Tail 12
      - name: Retain the first actual loader rejection, not only its outer category
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'sec-cause'
          @'
          from pathlib import Path
          p=Path('src/adapters/providers/windows-control-cli/runtime/installed-adoption.ts')
          s=p.read_text()
          old="throw new WindowsControlCliInstalledAdoptionError(reason);"
          assert s.count(old)==1
          s=s.replace(old,"console.error('ADOPTION_REJECT', reason, new Error().stack);\n  "+old)
          old='const imported = new Set(imports);'
          assert s.count(old)==1
          s=s.replace(old,"console.error('IMPORTS', JSON.stringify({id:binding.id,imports,declared:[...declaredModules.keys()]}));\n    "+old)
          p.write_text(s)
          '@ | Set-Content "$dir/instrument.py"
          python "$dir/instrument.py"
          if ($LASTEXITCODE -ne 0) { throw 'instrumentation mismatch' }
          bun test tests/unit/windows-control-cli-installed-adoption.test.ts --test-name-pattern 'authenticates exact bytes' *> "$dir/loader.log"
          "exit=$LASTEXITCODE" | Set-Content "$dir/loader-exit.txt"
          git diff -- src/adapters/providers/windows-control-cli/runtime/installed-adoption.ts > "$dir/instrumentation.diff"
          Get-Content "$dir/loader.log" -Tail 80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sec086-native-cause
          path: ${{ runner.temp }}/sec-cause/
          retention-days: 7
          if-no-files-found: error
