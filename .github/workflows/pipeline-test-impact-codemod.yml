name: pipeline-test-impact-codemod

on:
  push:
    branches:
      - pipeline-kernel-v0-3

permissions:
  contents: write

jobs:
  connect-pipeline-test-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: pipeline-kernel-v0-3
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Connect pipeline test impact ownership
        run: bun scripts/codemod-pipeline-test-impact.ts

      - name: Commit codemod result
        run: |
          if git diff --quiet -- platform/shared/test-impact-contract.ts; then
            echo "No test impact codemod changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/shared/test-impact-contract.ts
          git commit -m "test(pipeline): connect explicit pipeline impact ownership"
          git push origin HEAD:pipeline-kernel-v0-3
