name: repository-maintenance
run-name: 'execute audited repository maintenance comment #${{ github.event.client_payload.comment_id }}'

on:
  repository_dispatch:
    types:
      - sec-repository-maintenance-v2

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: sec-repository-maintenance
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      requires-recovery: ${{ steps.prepare.outputs.requires-recovery }}
      recovery-artifact-id: ${{ steps.upload-recovery.outputs.artifact-id }}
      recovery-artifact-digest: ${{ steps.upload-recovery.outputs.artifact-digest }}
      receipt-artifact-id: ${{ steps.upload-receipt.outputs.artifact-id }}
      receipt-artifact-digest: ${{ steps.upload-receipt.outputs.artifact-digest }}
    steps:
      - name: Resolve exact maintenance request carrier
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
        with:
          script: |
            // BEGIN GENERATED repository-permission.ts
            function normalizeGitHubRepositoryPermission(value) {
                if (value === null || typeof value !== 'object' || Array.isArray(value))
                    return null;
                const source = value;
                const permission = source.permission;
                if (permission !== 'admin' && permission !== 'maintain' && permission !== 'write'
                    && permission !== 'triage' && permission !== 'read' && permission !== 'none')
                    return null;
                const role = source.role_name;
                if (role === undefined)
                    return permission;
                if (permission === 'write' && role === 'maintain')
                    return 'maintain';
                if (permission === 'read' && role === 'triage')
                    return 'triage';
                return role === permission ? permission : null;
            }
            // END GENERATED repository-permission.ts
            // BEGIN GENERATED repository-maintenance-permission.ts
            function isRepositoryMaintenancePermission(role) {
                return role === 'admin' || role === 'maintain';
            }
            // END GENERATED repository-maintenance-permission.ts
            const crypto = require('crypto');
            const payload = JSON.parse(process.env.PAYLOAD_JSON);
            const expectedKeys = ['comment_body_sha256', 'comment_id', 'issue_number', 'schema'];
            if (!payload || typeof payload !== 'object' || Array.isArray(payload) ||
                JSON.stringify(Object.keys(payload).sort()) !== JSON.stringify(expectedKeys)) {
              throw new Error('Repository maintenance dispatch payload fields are invalid.');
            }
            if (process.env.EVENT_NAME !== 'repository_dispatch' ||
                process.env.EVENT_ACTION !== 'sec-repository-maintenance-v2' ||
                payload.schema !== 'sec-repository-maintenance-dispatch-v1' ||
                payload.issue_number !== 313 ||
                !Number.isSafeInteger(payload.comment_id) || payload.comment_id < 1 ||
                typeof payload.comment_body_sha256 !== 'string' ||
                !/^sha256:[0-9a-f]{64}$/.test(payload.comment_body_sha256)) {
              throw new Error('Repository maintenance dispatch identity is invalid.');
            }
            if (process.env.WORKFLOW_SHA !== process.env.EVENT_SHA) {
              throw new Error('Repository maintenance workflow is not executing from exact default main.');
            }
            const [comment, permission] = await Promise.all([
              github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: payload.comment_id
              }),
              github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              })
            ]);
            const role = normalizeGitHubRepositoryPermission(permission.data);
            const body = comment.data.body;
            const bodyDigest = typeof body === 'string'
              ? 'sha256:' + crypto.createHash('sha256').update(body, 'utf8').digest('hex')
              : null;
            if (comment.data.id !== payload.comment_id ||
                comment.data.issue_url !== `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/issues/313` ||
                comment.data.user?.login !== context.actor ||
                comment.data.user?.type !== 'User' ||
                comment.data.performed_via_github_app !== null ||
                !isRepositoryMaintenancePermission(role) ||
                bodyDigest !== payload.comment_body_sha256) {
              core.info(JSON.stringify({
                schema: 'sec-maintenance-carrier-rejection-diagnostic-v1',
                commentIdMatches: comment.data.id === payload.comment_id,
                issueUrlMatches: comment.data.issue_url === `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/issues/313`,
                authorMatchesActor: comment.data.user?.login === context.actor,
                authorIsUser: comment.data.user?.type === 'User',
                performedViaAppFieldPresent: Object.prototype.hasOwnProperty.call(comment.data, 'performed_via_github_app'),
                performedViaAppIsNull: comment.data.performed_via_github_app === null,
                associationFieldPresent: Object.prototype.hasOwnProperty.call(comment.data, 'author_association'),
                associationShape: ['COLLABORATOR', 'CONTRIBUTOR', 'FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR', 'MANNEQUIN', 'MEMBER', 'NONE', 'OWNER'].includes(comment.data.author_association) ? comment.data.author_association : 'unknown',
                permissionShape: ['admin', 'maintain', 'write', 'triage', 'read', 'none'].includes(permission.data?.permission) ? permission.data.permission : 'unrecognized',
                roleShape: ['admin', 'maintain', 'write', 'triage', 'read', 'none'].includes(permission.data?.role_name) ? permission.data.role_name : 'absent-or-unrecognized',
                normalizedRoleAccepted: isRepositoryMaintenancePermission(role),
                bodyDigestMatches: bodyDigest === payload.comment_body_sha256
              }));
              throw new Error('Repository maintenance trigger comment or dispatcher authority differs.');
            }
            let request;
            try { request = JSON.parse(body); } catch { throw new Error('Repository maintenance request is not JSON.'); }
            if (request?.schema !== 'sec-repository-maintenance-request-v1' ||
                request?.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                request?.expectedMainSha !== process.env.EVENT_SHA) {
              throw new Error('Repository maintenance request is not bound to exact current main.');
            }
            core.setOutput('request-json', body);
            core.setOutput('issue-number', String(payload.issue_number));
            core.setOutput('comment-id', String(payload.comment_id));
            core.setOutput('comment-author', context.actor);

      - name: Checkout exact maintenance authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install maintenance dependencies from frozen lock
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare exact recovery before any ref effect
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_MAINTENANCE_REQUEST_JSON: ${{ steps.request.outputs.request-json }}
          SEC_MAINTENANCE_ISSUE_NUMBER: ${{ steps.request.outputs.issue-number }}
          SEC_MAINTENANCE_COMMENT_ID: ${{ steps.request.outputs.comment-id }}
          SEC_MAINTENANCE_COMMENT_AUTHOR: ${{ steps.request.outputs.comment-author }}
        run: |
          set -euo pipefail
          request_file="$RUNNER_TEMP/sec-repository-maintenance-request.json"
          printf '%s\n' "$SEC_MAINTENANCE_REQUEST_JSON" > "$request_file"
          operation_kind="$(bun -e '
            const value = JSON.parse(process.env.SEC_MAINTENANCE_REQUEST_JSON);
            if (!Array.isArray(value.operations) || value.operations.length < 1) process.exit(2);
            process.stdout.write(String(value.operations[0]?.kind ?? ""));
          ')"
          if [[ "$operation_kind" != "exact-ref-retirement" ]]; then
            printf 'ref-operation=false\nrequires-recovery=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          carrier_root="/tmp/sec-repository-maintenance-carrier"
          if [[ -e "$carrier_root" || -L "$carrier_root" ]]; then
            echo "maintenance carrier root already exists" >&2
            exit 1
          fi
          mkdir -- "$carrier_root"
          test -d "$carrier_root"
          test ! -L "$carrier_root"
          preparation_file="$carrier_root/recovery-preparation.json"

          bun src/adapters/self-hosting/control/repository-maintenance/repository-maintenance.ts prepare-recovery \
            > "$preparation_file"
          required="$(bun -e '
            const value = await Bun.file(process.argv[1]).json();
            process.stdout.write(value.required === true ? "true" : "false");
          ' "$preparation_file")"
          printf 'ref-operation=true\nrequires-recovery=%s\n' "$required" >> "$GITHUB_OUTPUT"
          if [[ "$required" != "true" ]]; then
            exit 0
          fi

          recovery_root="$(dirname "$GITHUB_WORKSPACE")/sec-recovery"
          artifact_root="$carrier_root/upload"
          bundle_name="$(bun -e '
            const value = await Bun.file(process.argv[1]).json();
            const name = value.refPreparation?.recovery?.bundleName;
            if (typeof name !== "string" || name.length === 0) process.exit(2);
            process.stdout.write(name);
          ' "$preparation_file")"
          if [[ ! "$bundle_name" =~ ^sec-branch-closeout-[A-Za-z0-9.-]+\.bundle$ ]]; then
            echo "recovery bundle leaf is invalid" >&2
            exit 1
          fi
          bundle_digest="$(bun -e '
            const value = await Bun.file(process.argv[1]).json();
            const digest = value.refPreparation?.recovery?.sha256;
            if (typeof digest !== "string" || !/^sha256:[0-9a-f]{64}$/.test(digest)) process.exit(2);
            process.stdout.write(digest.slice(7));
          ' "$preparation_file")"
          mkdir -- "$artifact_root"
          test -d "$artifact_root"
          test ! -L "$artifact_root"
          cp -- "$preparation_file" "$artifact_root/recovery-preparation.json"
          cp -- "$recovery_root/$bundle_name" "$artifact_root/recovery.bundle"
          printf '%s  recovery.bundle\n' "$bundle_digest" > "$artifact_root/recovery.bundle.sha256"

      - name: Upload exact pre-effect recovery
        id: upload-recovery
        if: ${{ steps.prepare.outputs.requires-recovery == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec-repository-maintenance-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sec-repository-maintenance-carrier/upload
          if-no-files-found: error
          retention-days: 30

      - name: Read back exact pre-effect recovery identity
        id: recovery-readback
        if: ${{ steps.prepare.outputs.requires-recovery == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.upload-recovery.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: sec-repository-maintenance-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_ARTIFACT_DIGEST: sha256:${{ steps.upload-recovery.outputs.artifact-digest }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1 ||
                !Number.isSafeInteger(expectedRunAttempt) || expectedRunAttempt < 1) {
              throw new Error('Repository maintenance recovery artifact identity is invalid.');
            }
            const [artifact, run] = await Promise.all([
              github.rest.actions.getArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              })
            ]);
            if (artifact.data.id !== artifactId ||
                artifact.data.name !== process.env.EXPECTED_ARTIFACT_NAME ||
                artifact.data.expired !== false ||
                !Number.isSafeInteger(artifact.data.size_in_bytes) ||
                artifact.data.size_in_bytes < 1 ||
                artifact.data.digest !== process.env.EXPECTED_ARTIFACT_DIGEST ||
                artifact.data.workflow_run?.id !== context.runId ||
                run.data.id !== context.runId ||
                run.data.run_attempt !== expectedRunAttempt) {
              throw new Error('Repository maintenance recovery artifact readback differs.');
            }

      - name: Download exact pre-effect recovery
        if: ${{ steps.prepare.outputs.requires-recovery == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.upload-recovery.outputs.artifact-id }}
          path: /tmp/sec-repository-maintenance-carrier/readback

      - name: Execute exact repository maintenance request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_MAINTENANCE_REQUEST_JSON: ${{ steps.request.outputs.request-json }}
          SEC_MAINTENANCE_ISSUE_NUMBER: ${{ steps.request.outputs.issue-number }}
          SEC_MAINTENANCE_COMMENT_ID: ${{ steps.request.outputs.comment-id }}
          SEC_MAINTENANCE_COMMENT_AUTHOR: ${{ steps.request.outputs.comment-author }}
          SEC_MAINTENANCE_RECOVERY_ARTIFACT_ID: ${{ steps.upload-recovery.outputs.artifact-id }}
          SEC_MAINTENANCE_RECOVERY_ARTIFACT_NAME: sec-repository-maintenance-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          SEC_MAINTENANCE_RECOVERY_ARTIFACT_DIGEST: sha256:${{ steps.upload-recovery.outputs.artifact-digest }}
          SEC_MAINTENANCE_RECOVERY_RUN_ID: ${{ github.run_id }}
          SEC_MAINTENANCE_RECOVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bun src/adapters/self-hosting/control/repository-maintenance/repository-maintenance.ts --json \
            | tee "$RUNNER_TEMP/sec-repository-maintenance-result.json"

      - name: Stage terminal repository maintenance receipt
        if: always()
        shell: bash
        run: |
          artifact_root="$RUNNER_TEMP/sec-repository-maintenance-receipt"
          mkdir -p -- "$artifact_root"
          for receipt in \
            "$RUNNER_TEMP/sec-repository-maintenance-request.json" \
            "$RUNNER_TEMP/sec-repository-maintenance-result.json"; do
            if [[ -f "$receipt" ]]; then
              cp -- "$receipt" "$artifact_root/"
            fi
          done

      - name: Upload repository maintenance receipt
        id: upload-receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec-repository-maintenance-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sec-repository-maintenance-receipt
          if-no-files-found: error
          retention-days: 30

      - name: Retire maintenance trigger comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_MAINTENANCE_REQUEST_JSON: ${{ steps.request.outputs.request-json }}
          SEC_MAINTENANCE_ISSUE_NUMBER: ${{ steps.request.outputs.issue-number }}
          SEC_MAINTENANCE_COMMENT_ID: ${{ steps.request.outputs.comment-id }}
          SEC_MAINTENANCE_COMMENT_AUTHOR: ${{ steps.request.outputs.comment-author }}
        run: bun src/adapters/self-hosting/control/repository-maintenance/repository-maintenance.ts retire-trigger

  retire-recovery-carrier:
    needs: retire
    if: ${{ needs.retire.result == 'success' && needs.retire.outputs.requires-recovery == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Retire exact terminal recovery carrier
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RECOVERY_ARTIFACT_ID: ${{ needs.retire.outputs.recovery-artifact-id }}
          RECOVERY_ARTIFACT_NAME: sec-repository-maintenance-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          RECOVERY_ARTIFACT_DIGEST: sha256:${{ needs.retire.outputs.recovery-artifact-digest }}
          RECEIPT_ARTIFACT_ID: ${{ needs.retire.outputs.receipt-artifact-id }}
          RECEIPT_ARTIFACT_NAME: sec-repository-maintenance-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          RECEIPT_ARTIFACT_DIGEST: sha256:${{ needs.retire.outputs.receipt-artifact-digest }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const recoveryId = Number(process.env.RECOVERY_ARTIFACT_ID);
            const receiptId = Number(process.env.RECEIPT_ARTIFACT_ID);
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            if (!Number.isSafeInteger(recoveryId) || recoveryId < 1 ||
                !Number.isSafeInteger(receiptId) || receiptId < 1 ||
                recoveryId === receiptId ||
                !Number.isSafeInteger(expectedRunAttempt) || expectedRunAttempt < 1) {
              throw new Error('Repository maintenance terminal artifact identities are invalid.');
            }
            const readArtifact = (artifactId) => github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId
            });
            const [recovery, receipt, run] = await Promise.all([
              readArtifact(recoveryId),
              readArtifact(receiptId),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              })
            ]);
            const assertExactArtifact = (artifact, id, name, digest) => {
              if (artifact.data.id !== id ||
                  artifact.data.name !== name ||
                  artifact.data.expired !== false ||
                  artifact.data.digest !== digest ||
                  artifact.data.workflow_run?.id !== context.runId) {
                throw new Error(`Repository maintenance artifact ${id} differs from its terminal binding.`);
              }
            };
            assertExactArtifact(
              recovery,
              recoveryId,
              process.env.RECOVERY_ARTIFACT_NAME,
              process.env.RECOVERY_ARTIFACT_DIGEST
            );
            assertExactArtifact(
              receipt,
              receiptId,
              process.env.RECEIPT_ARTIFACT_NAME,
              process.env.RECEIPT_ARTIFACT_DIGEST
            );
            if (run.data.id !== context.runId || run.data.run_attempt !== expectedRunAttempt) {
              throw new Error('Repository maintenance terminal run identity differs.');
            }
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: recoveryId
            });
            try {
              await readArtifact(recoveryId);
              throw new Error('Repository maintenance recovery artifact remains after terminal retirement.');
            } catch (error) {
              if (error?.status !== 404) throw error;
            }
            const receiptReadback = await readArtifact(receiptId);
            assertExactArtifact(
              receiptReadback,
              receiptId,
              process.env.RECEIPT_ARTIFACT_NAME,
              process.env.RECEIPT_ARTIFACT_DIGEST
            );

