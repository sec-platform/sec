name: repository-maintenance
run-name: 'maintenance/${{ inputs.execution_digest }}'

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Bounded v2 exact-ref batch JSON; no public comment carrier'
        required: true
        type: string
      request_digest:
        description: 'Canonical request digest computed by the maintenance CLI'
        required: true
        type: string
      execution_digest:
        description: 'Canonical plan and resume-mode digest computed by the maintenance CLI'
        required: true
        type: string
      resume_receipt:
        description: 'Optional exact prior result locator; resume is observation-only and never deletes'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

# Intersecting batches are settled by exact-old-OID CAS and per-ref readback.
# A whole-repository or batch-hash lock cannot model overlapping ref sets.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve exact maintenance request carrier
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUEST_JSON: ${{ inputs.request }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          EXECUTION_DIGEST: ${{ inputs.execution_digest }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
        with:
          script: |
            // BEGIN GENERATED repository-permission.ts
            function normalizeGitHubRepositoryPermission(value) {
                if (value === null || typeof value !== 'object' || Array.isArray(value))
                    return null;
                const source = value;
                const permission = source.permission;
                if (permission !== 'admin' && permission !== 'maintain' && permission !== 'write'
                    && permission !== 'triage' && permission !== 'read' && permission !== 'none')
                    return null;
                const role = source.role_name;
                if (role === undefined)
                    return permission;
                if (permission === 'write' && role === 'maintain')
                    return 'maintain';
                if (permission === 'read' && role === 'triage')
                    return 'triage';
                return role === permission ? permission : null;
            }
            // END GENERATED repository-permission.ts
            // BEGIN GENERATED repository-maintenance-permission.ts
            function isRepositoryMaintenancePermission(role) {
                return role === 'admin' || role === 'maintain';
            }
            // END GENERATED repository-maintenance-permission.ts
            const body = process.env.REQUEST_JSON;
            if (process.env.EVENT_NAME !== 'workflow_dispatch' ||
                process.env.RUN_ATTEMPT !== '1' ||
                process.env.WORKFLOW_SHA !== process.env.EVENT_SHA ||
                context.ref !== 'refs/heads/main' ||
                context.payload.sender?.login !== context.actor ||
                context.payload.sender?.type !== 'User' ||
                typeof body !== 'string' || Buffer.byteLength(body, 'utf8') > 60 * 1024 ||
                !/^sha256:[0-9a-f]{64}$/.test(process.env.REQUEST_DIGEST) ||
                !/^sha256:[0-9a-f]{64}$/.test(process.env.EXECUTION_DIGEST)) {
              throw new Error('Repository maintenance event identity or payload budget is invalid.');
            }
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            const role = normalizeGitHubRepositoryPermission(permission.data);
            if (!isRepositoryMaintenancePermission(role)) {
              throw new Error('Repository maintenance actor requires current maintain/admin permission.');
            }
            let request;
            try { request = JSON.parse(body); } catch { throw new Error('Repository maintenance request is not JSON.'); }
            if (request?.schema !== 'sec-repository-maintenance-request-v2' ||
                request?.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                request?.expectedMainSha !== process.env.EVENT_SHA ||
                !Array.isArray(request.operations) || request.operations.length < 1 || request.operations.length > 64 ||
                request.operations.some(operation => operation?.kind !== 'exact-ref-retirement')) {
              throw new Error('Repository maintenance batch is not bound to exact current main.');
            }
            core.setOutput('request-json', body);

      - name: Checkout exact maintenance authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install maintenance dependencies from frozen lock
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare exact recovery before any ref effect
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_MAINTENANCE_REQUEST_JSON: ${{ steps.request.outputs.request-json }}
          SEC_MAINTENANCE_RESUME_RECEIPT: ${{ inputs.resume_receipt }}
        run: |
          set -euo pipefail
          request_file="$RUNNER_TEMP/sec-repository-maintenance-request.json"
          printf '%s\n' "$SEC_MAINTENANCE_REQUEST_JSON" > "$request_file"
          carrier_root="/tmp/sec-repository-maintenance-carrier"
          if [[ -e "$carrier_root" || -L "$carrier_root" ]]; then
            echo "maintenance carrier root already exists" >&2
            exit 1
          fi
          umask 077
          mkdir -- "$carrier_root"
          test -d "$carrier_root"
          test ! -L "$carrier_root"
          preparation_file="$carrier_root/recovery-preparation.json"

          bun src/adapters/self-hosting/control/repository-maintenance/repository-maintenance.ts prepare-recovery \
            > "$preparation_file"
          bun -e '
            import { sha256 } from "./src/contracts/canonical.ts";
            import { REPOSITORY_MAINTENANCE_RECOVERY_RETENTION_DAYS as days } from "./src/adapters/self-hosting/control/repository-maintenance/contract.ts";
            const value = await Bun.file(process.argv[1]).json();
            if (value.required !== true) process.exit(2);
            const carrier = value.reusedCarrier;
            console.log(`retention-days=${days}`);
            console.log(`recovery-execution-digest=${sha256({ requestDigest: value.requestDigest, resumeReceipt: null })}`);
            console.log(`fresh-recovery=${carrier === null ? "true" : "false"}`);
            if (carrier !== null) {
              for (const [key, field] of Object.entries({
                "recovery-artifact-id": "artifactId", "recovery-artifact-name": "artifactName",
                "recovery-artifact-digest": "artifactDigest", "recovery-run-id": "runId",
                "recovery-run-attempt": "runAttempt"
              })) console.log(`${key}=${carrier[field]}`);
            }
          ' "$preparation_file" >> "$GITHUB_OUTPUT"
          if [[ -n "$SEC_MAINTENANCE_RESUME_RECEIPT" ]]; then
            exit 0
          fi

          recovery_root="$(dirname "$GITHUB_WORKSPACE")/sec-recovery"
          artifact_root="$carrier_root/upload"
          bundle_name="$(bun -e '
            const value = await Bun.file(process.argv[1]).json();
            const name = value.refPreparation?.recovery?.bundleName;
            if (typeof name !== "string" || name.length === 0) process.exit(2);
            process.stdout.write(name);
          ' "$preparation_file")"
          if [[ ! "$bundle_name" =~ ^sec-branch-closeout-[A-Za-z0-9.-]+\.bundle$ ]]; then
            echo "recovery bundle leaf is invalid" >&2
            exit 1
          fi
          bundle_digest="$(bun -e '
            const value = await Bun.file(process.argv[1]).json();
            const digest = value.refPreparation?.recovery?.sha256;
            if (typeof digest !== "string" || !/^sha256:[0-9a-f]{64}$/.test(digest)) process.exit(2);
            process.stdout.write(digest.slice(7));
          ' "$preparation_file")"
          mkdir -- "$artifact_root"
          test -d "$artifact_root"
          test ! -L "$artifact_root"
          cp -- "$preparation_file" "$artifact_root/recovery-preparation.json"
          cp -- "$recovery_root/$bundle_name" "$artifact_root/recovery.bundle"
          printf '%s  recovery.bundle\n' "$bundle_digest" > "$artifact_root/recovery.bundle.sha256"

      - name: Upload exact pre-effect recovery
        id: upload-recovery
        if: ${{ steps.prepare.outputs.fresh-recovery == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec-repository-maintenance-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sec-repository-maintenance-carrier/upload
          if-no-files-found: error
          retention-days: ${{ steps.prepare.outputs.retention-days }}

      - name: Read back exact pre-effect recovery identity
        id: recovery-readback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.upload-recovery.outputs.artifact-id || steps.prepare.outputs.recovery-artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.prepare.outputs.recovery-artifact-name || format('sec-repository-maintenance-recovery-{0}-{1}', github.run_id, github.run_attempt) }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.prepare.outputs.recovery-artifact-digest || format('sha256:{0}', steps.upload-recovery.outputs.artifact-digest) }}
          EXPECTED_RUN_ID: ${{ steps.prepare.outputs.recovery-run-id || github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.prepare.outputs.recovery-run-attempt || github.run_attempt }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          EXPECTED_EXECUTION_DIGEST: ${{ steps.prepare.outputs.recovery-execution-digest }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            const expectedRunId = Number(process.env.EXPECTED_RUN_ID);
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1 ||
                !Number.isSafeInteger(expectedRunId) || expectedRunId < 1 ||
                !Number.isSafeInteger(expectedRunAttempt) || expectedRunAttempt < 1) {
              throw new Error('Repository maintenance recovery artifact identity is invalid.');
            }
            const [artifact, run] = await Promise.all([
              github.rest.actions.getArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              }),
              github.rest.actions.getWorkflowRunAttempt({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: expectedRunId,
                attempt_number: expectedRunAttempt
              })
            ]);
            if (artifact.data.id !== artifactId ||
                artifact.data.name !== process.env.EXPECTED_ARTIFACT_NAME ||
                artifact.data.expired !== false ||
                typeof artifact.data.expires_at !== 'string' ||
                !Number.isFinite(Date.parse(artifact.data.expires_at)) ||
                Date.parse(artifact.data.expires_at) <= Date.now() ||
                !Number.isSafeInteger(artifact.data.size_in_bytes) ||
                artifact.data.size_in_bytes < 1 ||
                artifact.data.digest !== process.env.EXPECTED_ARTIFACT_DIGEST ||
                artifact.data.workflow_run?.id !== expectedRunId ||
                run.data.id !== expectedRunId ||
                run.data.head_sha !== process.env.EXPECTED_HEAD_SHA ||
                !['.github/workflows/repository-maintenance.yml',
                  '.github/workflows/repository-maintenance.yml@main',
                  '.github/workflows/repository-maintenance.yml@refs/heads/main'].includes(run.data.path) ||
                run.data.event !== 'workflow_dispatch' ||
                run.data.display_title !== `maintenance/${process.env.EXPECTED_EXECUTION_DIGEST}` ||
                run.data.run_attempt !== expectedRunAttempt) {
              throw new Error('Repository maintenance recovery artifact readback differs.');
            }
            core.setOutput('artifact-id', String(artifactId));
            core.setOutput('artifact-name', artifact.data.name);
            core.setOutput('artifact-digest', artifact.data.digest);
            core.setOutput('run-id', String(expectedRunId));
            core.setOutput('run-attempt', String(expectedRunAttempt));
            core.setOutput('expires-at', artifact.data.expires_at);
            core.notice(`Recovery artifact ${artifactId} is retained until provider-reported ${artifact.data.expires_at}; successful retirement does not delete it.`);

      - name: Download exact pre-effect recovery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.recovery-readback.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.recovery-readback.outputs.run-id }}
          path: /tmp/sec-repository-maintenance-carrier/readback

      - name: Execute exact repository maintenance request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_MAINTENANCE_REQUEST_JSON: ${{ steps.request.outputs.request-json }}
          SEC_MAINTENANCE_RESUME_RECEIPT: ${{ inputs.resume_receipt }}
          SEC_MAINTENANCE_RECOVERY_ARTIFACT_ID: ${{ steps.recovery-readback.outputs.artifact-id }}
          SEC_MAINTENANCE_RECOVERY_ARTIFACT_NAME: ${{ steps.recovery-readback.outputs.artifact-name }}
          SEC_MAINTENANCE_RECOVERY_ARTIFACT_DIGEST: ${{ steps.recovery-readback.outputs.artifact-digest }}
          SEC_MAINTENANCE_RECOVERY_RUN_ID: ${{ steps.recovery-readback.outputs.run-id }}
          SEC_MAINTENANCE_RECOVERY_RUN_ATTEMPT: ${{ steps.recovery-readback.outputs.run-attempt }}
        run: |
          set -euo pipefail
          bun src/adapters/self-hosting/control/repository-maintenance/repository-maintenance.ts --json \
            | tee "$RUNNER_TEMP/sec-repository-maintenance-result.json"

      - name: Upload repository maintenance receipt
        id: upload-receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec-repository-maintenance-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sec-repository-maintenance-carrier/maintenance-result.json
          if-no-files-found: warn # No ref effect can begin before this receipt is created.
          retention-days: ${{ steps.prepare.outputs.retention-days }}

      - name: Report retained recovery deadline
        if: ${{ always() && steps.recovery-readback.outputs.artifact-id != '' }}
        env:
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery-readback.outputs.artifact-id }}
          RECOVERY_EXPIRES_AT: ${{ steps.recovery-readback.outputs.expires-at }}
          RESULT_ARTIFACT_ID: ${{ steps.upload-receipt.outputs.artifact-id }}
          RESULT_ARTIFACT_DIGEST: ${{ steps.upload-receipt.outputs.artifact-digest }}
        run: |
          printf 'Recovery artifact: %s\nProvider expiry: %s\nPreserved after success, failure, or partial completion.\n' \
            "$RECOVERY_ARTIFACT_ID" "${RECOVERY_EXPIRES_AT:-unverified; inspect the artifact API}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$RESULT_ARTIFACT_ID" && -n "$RESULT_ARTIFACT_DIGEST" ]]; then
            printf 'Resume receipt locator: {"artifactId":"%s","artifactDigest":"sha256:%s","runId":"%s","runAttempt":%s}\nUse a new dispatch with this locator for observation-only resume; do not rerun the old attempt. Unstarted targets require a new explicit fresh plan; resume never performs CAS.\n' \
              "$RESULT_ARTIFACT_ID" "$RESULT_ARTIFACT_DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          fi
