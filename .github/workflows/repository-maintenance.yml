name: repository-maintenance
run-name: repository maintenance run ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Canonical sec-repository-maintenance-request-v1 JSON
        required: true
        type: string
      request_digest:
        description: Expected sha256 digest of the canonical request value
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sec-repository-maintenance-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: [self-hosted, Linux, X64, sec-linux-verification-v1, sec-linux-verification-trusted-v1]
    timeout-minutes: 45
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Bind request to current main and maintainer actor
        id: admission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const canonical = (value) => {
              if (value === null || typeof value !== 'object') return value;
              if (Array.isArray(value)) return value.map(canonical);
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            };
            const inputs = context.payload.inputs;
            const requestSource = inputs?.request_json;
            const requestDigest = inputs?.request_digest;
            if (typeof requestSource !== 'string' || requestSource.length === 0 || requestSource.length > 131072
                || typeof requestDigest !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(requestDigest)) {
              throw new Error('Maintenance request input shape is invalid.');
            }
            let request;
            try { request = JSON.parse(requestSource); }
            catch { throw new Error('Maintenance request is not strict JSON.'); }
            const digest = `sha256:${crypto.createHash('sha256').update(JSON.stringify(canonical(request))).digest('hex')}`;
            if (digest !== requestDigest || request?.schema !== 'sec-repository-maintenance-request-v1') {
              throw new Error('Maintenance request digest or schema is invalid.');
            }
            const triggeringActor = process.env.GITHUB_TRIGGERING_ACTOR;
            if (typeof triggeringActor !== 'string' || triggeringActor.length === 0) {
              throw new Error('Maintenance triggering actor identity is unavailable.');
            }
            const [repository, actorPermission, triggeringPermission, main] = await Promise.all([
              github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo }),
              github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: context.actor
              }),
              github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: triggeringActor
              }),
              github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' })
            ]);
            const trusted = (permission) => ['admin', 'maintain'].includes(permission.data.permission);
            const expectedWorkflowRef = `${repository.data.full_name}/.github/workflows/repository-maintenance.yml@refs/heads/main`;
            if (!trusted(actorPermission) || !trusted(triggeringPermission)
                || repository.data.full_name !== request.repository
                || repository.data.default_branch !== 'main'
                || context.ref !== 'refs/heads/main'
                || context.sha !== main.data.commit.sha
                || request.expectedMainSha !== main.data.commit.sha
                || process.env.GITHUB_WORKFLOW_REF !== expectedWorkflowRef
                || process.env.GITHUB_WORKFLOW_SHA !== main.data.commit.sha) {
              throw new Error('Maintenance request actor, repository, workflow or exact-main identity is stale.');
            }
            const requestRoot = path.join(process.env.GITHUB_WORKSPACE, '.tmp', 'repository-maintenance');
            fs.mkdirSync(requestRoot, { recursive: true });
            fs.writeFileSync(path.join(requestRoot, 'request.json'), requestSource, { flag: 'wx' });
            core.setOutput('main-sha', main.data.commit.sha);

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Execute canonical repository maintenance owner
        id: execute
        env:
          SEC_BRANCH_RECOVERY_ROOT: ${{ runner.temp }}/sec-repository-maintenance-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bun src/adapters/self-hosting/control/repository-maintenance/repository-maintenance.ts execute --json \
            | tee .tmp/repository-maintenance/result.json

      - name: Upload bounded maintenance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec-repository-maintenance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            .tmp/repository-maintenance/result.json
            ${{ runner.temp }}/sec-repository-maintenance-recovery-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
