name: sec086-process-delta
on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-process-delta.yml]
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4ec8b472937b9073d2c093ed2633c106214580c3
          persist-credentials: false
      - name: Apply exact native-lifecycle deltas without publishing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^{tree})" = db9b3200f50abb992dc00db9bcced4327e9f6436
          python3 - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          for sha in ['89f98d78430b2da3f72521a0ce1f3e3f40b0f154','fe4605d6aca8fcffa20f7890ead1ebd9acf88d18']:
              raw=json.loads(subprocess.check_output(['gh','api',f'repos/sec-platform/sec/git/blobs/{sha}']))
              patch=base64.b64decode(raw['content'])
              assert subprocess.check_output(['git','hash-object','--stdin'],input=patch).decode().strip()==sha
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          p=Path('src/adapters/runtime-state/physical/runtime/process-resource-session.test.ts')
          s=p.read_text();old="    { resource: 'processes', maximum: 3 }"
          new="    // Windows uses a separate native stdin worker for the first run.\n    { resource: 'processes', maximum: process.platform === 'win32' ? 3 : 2 }"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          expected={
              'src/adapters/runtime-state/physical/runtime/observed-process.ts':'450bccf658382f6d948ed77747a3fe83669f74f9',
              'src/adapters/runtime-state/physical/runtime/process-resource-session.test.ts':'416dcf2c19adb312a47d3d6f500d826e9e964285'}
          for name,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',name]).decode().strip()==sha
              Path('/tmp/blob.json').write_text(json.dumps({'content':Path(name).read_text(),'encoding':'utf-8'}))
              assert subprocess.check_output(['gh','api','--method','POST','repos/sec-platform/sec/git/blobs','--input','/tmp/blob.json','--jq','.sha']).decode().strip()==sha
              print(name,sha)
          PY
