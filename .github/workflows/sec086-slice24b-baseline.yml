name: sec086-slice24b-baseline

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice24b-baseline.yml]

permissions: {}

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dd345adc985203312e6fc6a838fc5f88445a2ec0
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dd345adc985203312e6fc6a838fc5f88445a2ec0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run baseline upgrade e2e
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 180000 tests/e2e/upgrade.test.ts
