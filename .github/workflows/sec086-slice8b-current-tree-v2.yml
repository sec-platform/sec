name: sec086-slice8b-current-tree-v2
on:
  push:
    branches:
      - refactor/sec086-architecture
    paths:
      - .github/workflows/sec086-slice8b-current-tree-v2.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = a851f1957d3f0c12869db607f0904ee25c9ed504
          test "$(git rev-parse HEAD:tests)" = ac831a9875d98317690901522a98564cb2caebf7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Rewrite postgres presentation ownership
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/bootstrap/cli/register-inspection-commands.ts')
          s = p.read_text()
          old = "import type { PostgresContract } from './formatters.ts';\n"
          new = "import type { PostgresContractProjectionSource } from '../../application/postgres-contract.ts';\n"
          assert s.count(old) == 1
          s = s.replace(old, new)
          a = s.index("  addJsonFlags(program.command('postgres')).action(")
          b = s.index("\n  });\n}", a) + len("\n  });")
          block = s[a:b]
          assert "printGeneratedContract<PostgresContract>" in block
          replacement = """  addJsonFlags(program.command('postgres')).action(async (rawOptions: Record<string, unknown>, cmd: Command) => {
    const cwd = process.cwd();
    const output = jsonOpts(captureJsonOutputInput(rawOptions, 'own-enumerable'));
    const missingMessage = `Postgres contract not found; run ${commandFromRoot(cmd, 'compose')} first`;
    const { projectPostgresContract } = await import('../../application/postgres-contract.ts');
    const { formatPostgresContract } = await import('../../entry/cli/postgres-contract.ts');
    const { printGeneratedContract } = await import('./artifact-command-read.ts');
    await printGeneratedContract<PostgresContractProjectionSource>(
      cwd,
      missingMessage,
      output,
      (contract) => formatPostgresContract(projectPostgresContract(contract)),
      (contract) => contract.provider === 'postgres'
    );
  });"""
          p.write_text(s[:a] + replacement + s[b:])

          p = Path('src/bootstrap/cli/formatters.ts')
          s = p.read_text()
          a = s.index('export type PostgresContract = {')
          b = s.index('type RuntimeStepInspect = {', a)
          s = s[:a] + s[b:]
          a = s.index('export function formatPostgresContract(')
          b = s.index('export function formatLockInspect(', a)
          s = s[:a] + s[b:]
          p.write_text(s)
          PY
          git add src/bootstrap/cli/register-inspection-commands.ts src/bootstrap/cli/formatters.ts
          git diff --cached --check
      - name: Verify exact slice
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun test --timeout 20000 tests/unit/postgres-contract-presentation.test.ts tests/unit/inspection-query.test.ts tests/unit/named-inspection-query.test.ts
          bun run docs:doctor
          bun run audit:module-topology
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: route postgres inspection through entry'
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          test "$(git ls-remote origin refs/heads/refactor/sec086-architecture | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/refactor/sec086-architecture
