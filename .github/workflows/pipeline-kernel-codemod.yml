name: pipeline-kernel-codemod

on:
  push:
    branches:
      - pipeline-kernel-v0-3

permissions:
  contents: write

jobs:
  apply-upgrade-pipeline-codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: pipeline-kernel-v0-3
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Apply exact Upgrade pipeline codemod
        run: bun scripts/codemod-upgrade-pipeline.ts

      - name: Commit codemod result
        run: |
          if git diff --quiet -- platform/upgrade/upgrade-workspace.ts; then
            echo "No Upgrade codemod changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/upgrade/upgrade-workspace.ts
          git commit -m "refactor(pipeline): route upgrade recompile through coordinator"
          git push origin HEAD:pipeline-kernel-v0-3
