name: sec086-refactor-snapshot

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-refactor-snapshot.yml]

permissions:
  contents: read

concurrency:
  group: sec086-refactor-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.repository == 'sec-platform/sec' && github.ref == 'refs/heads/refactor/sec086-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact refactor baseline, without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 85de472a4284b26565602d2b85bbdb04cc990c77
          fetch-depth: 1
          persist-credentials: false
      - name: Export tracked source and credential-free Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 85de472a4284b26565602d2b85bbdb04cc990c77
          mkdir -p "$RUNNER_TEMP/sec086-source"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/sec086-source/source.tar.gz"
          git show -s --format='%H%n%T' HEAD > "$RUNNER_TEMP/sec086-source/identity.txt"
          python3 - <<'PY'
          import os, pathlib, tarfile
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sec086-source' / 'git-objects.tar.gz'
          with tarfile.open(destination, 'w:gz') as archive:
              for item in ('.git/HEAD', '.git/objects', '.git/refs', '.git/shallow', '.git/packed-refs'):
                  path = pathlib.Path(item)
                  if path.exists():
                      archive.add(path, arcname=item)
          PY
          (cd "$RUNNER_TEMP/sec086-source" && sha256sum source.tar.gz git-objects.tar.gz > SHA256SUMS)
      - name: Upload exact tracked inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec086-source-85de472
          path: ${{ runner.temp }}/sec086-source/
          retention-days: 1
          if-no-files-found: error
      - name: Setup the repository-pinned Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install the locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Observe baseline status without granting implementation or merge authority
        shell: bash
        run: |
          set +e
          timeout 60 bun run dev:status -- --json
          result=$?
          printf '\nBaseline status command exit: %s\n' "$result"
          exit 0
      - name: Export the pinned runtime and dependency inputs for offline testing
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/sec086-runtime/bin"
          cp "$(command -v bun)" "$RUNNER_TEMP/sec086-runtime/bin/bun"
          bun --version > "$RUNNER_TEMP/sec086-runtime/bun-version.txt"
          tar -czf "$RUNNER_TEMP/sec086-runtime/node_modules.tar.gz" node_modules
          (cd "$RUNNER_TEMP/sec086-runtime" && sha256sum bin/bun node_modules.tar.gz > SHA256SUMS)
      - name: Upload offline test inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec086-runtime-85de472
          path: ${{ runner.temp }}/sec086-runtime/
          retention-days: 1
          if-no-files-found: error
