name: Linux immutable input physical qualification

# One frozen, non-main carrier. This is physical evidence, never MainHealth/Gate.
on:
  push:
    branches: [qualification/linux-immutable-b145-20261003]

permissions:
  contents: read

jobs:
  qualify:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false && github.event.before == 'f2334f1063068fdc6e04f3b109683b23ad0d1b2b' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact qualification carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Set up the declared Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Qualify the frozen physical boundary once
        env:
          QUALIFICATION_HEAD: ${{ github.sha }}
          QUALIFICATION_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/qualification/linux-immutable-input.sh "$QUALIFICATION_HEAD" "$QUALIFICATION_ATTEMPT" "$(command -v bun)"
