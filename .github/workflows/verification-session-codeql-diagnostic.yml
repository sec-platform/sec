name: Verification Session CodeQL Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  security-events: read

jobs:
  javascript-typescript-sarif:
    if: ${{ github.event.pull_request.number == 727 }}
    runs-on: ubuntu-latest
    env:
      CODE_SCANNING_REF: refs/pull/${{ github.event.pull_request.number }}/head
      CODE_SCANNING_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      CODE_SCANNING_IS_ANALYZING_DEFAULT_BRANCH: "false"
      CODE_SCANNING_IS_STEADY_STATE_DEFAULT_SETUP: "true"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Initialize exact JavaScript/TypeScript CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          analysis-kinds: code-scanning
          languages: javascript-typescript
          build-mode: none
          dependency-caching: true
          config: |
            name: SEC CodeQL
            paths-ignore:
              - tests/**
              - '**/*.test.ts'
              - '**/*.test.js'
              - '**/*.test.mjs'
            default-setup:
              org:
                model-packs: []
            threat-models:
              - local
            queries:
              - uses: security-extended
            query-filters:
              - exclude:
                  tags: exclude-from-incremental
          matrix: '{"language":"javascript-typescript","category":"/language:javascript-typescript","build-mode":"none","runner":["ubuntu-latest"]}'

      - name: Produce exact Default Setup post-processed SARIF
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/sec-codeql-raw
          post-processed-sarif-path: ${{ runner.temp }}/sec-codeql-post
          category: /language:javascript-typescript
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Upload exact Default Setup SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec-pr-727-codeql-default-exact-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/sec-codeql-post
          if-no-files-found: error
          retention-days: 1
