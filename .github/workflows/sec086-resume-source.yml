name: sec086-resume-source
on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-resume-source.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'sec-platform/sec' && github.ref == 'refs/heads/refactor/sec086-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bb83c8619bfe99eefc21cf02919e9059f5f609ad
          fetch-depth: 16
          persist-credentials: false
      - name: Export exact tracked content and credential-free Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bb83c8619bfe99eefc21cf02919e9059f5f609ad
          mkdir -p "$RUNNER_TEMP/sec086-resume"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/sec086-resume/source.tar.gz"
          git show -s --format='%H%n%T' HEAD > "$RUNNER_TEMP/sec086-resume/identity.txt"
          python3 - <<'PY'
          import os, pathlib, tarfile
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'sec086-resume' / 'git-objects.tar.gz', 'w:gz') as archive:
              for name in ('.git/HEAD', '.git/objects', '.git/refs', '.git/shallow', '.git/packed-refs'):
                  path = pathlib.Path(name)
                  if path.exists():
                      archive.add(path, arcname=name)
          PY
          (cd "$RUNNER_TEMP/sec086-resume" && sha256sum source.tar.gz git-objects.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sec086-resume-bb83c861
          path: ${{ runner.temp }}/sec086-resume/
          retention-days: 3
          if-no-files-found: error
