name: sec086-step1-apply

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-step1-apply.yml]

permissions: {}

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged verified source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:src)" = e038f39b0cc4804cc7d714a85c42cd9bcf33e77a
          test "$(git rev-parse HEAD:tests)" = 6b734805b154d4f9bacf0d45589b3317248ae845
          git diff --exit-code
      - name: Setup pinned Bun and frozen dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply exact local step-one patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sec086-step1/part{0,1,2}.b64 | base64 -d | xz -d > "$RUNNER_TEMP/step1.patch"
          echo '5fbff1d7c5f7fc192355a2d6f2299c1e37fc88db17b0a9a16921fbcd5d20b090  '"$RUNNER_TEMP/step1.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/step1.patch"
          git apply --index "$RUNNER_TEMP/step1.patch"
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith(('src/','tests/')) for p in paths), paths
          PY
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:src")" = 39826a7177d3cf61fa8bf1e0dba05822644d07a9
          test "$(git rev-parse "$tree:tests")" = 39f5b4d1d9f274e4962c3efa96df5363f311d7e8
          git diff --cached --check
      - name: Verify architecture and behavior
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun run docs:doctor
          bun run audit:module-topology
          bun run sec -- --help >/tmp/sec-step1-help.txt
          bun test \
            src/adapters/repository/architecture/contract.test.ts \
            src/adapters/repository/architecture/dependency-policy.test.ts \
            tests/unit/application-pipeline-run.test.ts \
            tests/unit/pipeline-invocation.test.ts \
            tests/unit/pipeline-registry-compilation.test.ts \
            tests/unit/pipeline-stage-contract.test.ts \
            tests/unit/pipeline-stage-state.test.ts \
            tests/unit/pipeline-proof-data.test.ts \
            tests/unit/semantic-mutation-source-adapter.test.ts \
            tests/contract/semantic-mutation-apply-contract.test.ts \
            tests/contract/error-protocol.test.ts \
            tests/contract/error-protocol-isolation.test.ts \
            tests/unit/workspace-lifecycle-template-boundary.test.ts
      - name: Commit only verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'refactor: move use-case coordination and proof contracts to canonical owners' \
            -m 'Move pipeline/workspace/semantic-mutation use-case state into application, proof contracts into assurance, stage and semantic-context identities into compiler, and execution capability ownership into execution. Transport files are excluded from this source commit.'
          test "$(git rev-parse HEAD:src)" = 39826a7177d3cf61fa8bf1e0dba05822644d07a9
          test "$(git rev-parse HEAD:tests)" = 39f5b4d1d9f274e4962c3efa96df5363f311d7e8
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build frozen release artifact
        run: bun run build
      - name: Fast-forward isolated refactor branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$(git rev-parse HEAD)"
