name: validation compact SEC workspace export

on:
  pull_request:
    branches:
      - main

concurrency:
  group: validation-sec-workspace-export
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_EXPORT_MAIN: 49fdb7cd3be991742061621e3add982107e50367

jobs:
  export:
    if: github.event.pull_request.number == 331 && github.event.pull_request.head.ref == 'validation/issue-178-workspace-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact new main with full reachable history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ env.SEC_EXPORT_MAIN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Build compact portable payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEC_EXPORT_MAIN"
          test -z "$(git status --porcelain=v1)"
          out="$RUNNER_TEMP/sec-workspace-export-compact"
          mkdir -p "$out"

          git update-ref refs/heads/sec-export-main "$SEC_EXPORT_MAIN"
          git bundle create "$out/main.bundle" refs/heads/sec-export-main
          git bundle verify "$out/main.bundle"
          git update-ref -d refs/heads/sec-export-main

          zstd -q -10 -T0 "$(command -v bun)" -o "$out/bun.zst"
          {
            printf 'schema=sec-portable-workspace-export-v1\n'
            printf 'main=%s\n' "$SEC_EXPORT_MAIN"
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'bun=%s\n' "$(bun --revision)"
            printf 'git=%s\n' "$(git --version)"
          } > "$out/identity.txt"
          (cd "$out" && sha256sum main.bundle bun.zst identity.txt > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS)
          du -h "$out"/*

      - name: Upload compact portable workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sec-workspace-compact-${{ env.SEC_EXPORT_MAIN }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/sec-workspace-export-compact
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
