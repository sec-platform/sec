name: validation issue-178 candidate publish and verification

on:
  pull_request:
    branches:
      - main

concurrency:
  group: validation-issue-178-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_BASE: 26dcb43c77c9bdfebee35efc217113c958ed017d
  SEC_EXPECTED_TREE: 624172dbc1b7894e6dcfe19f31adbc5ef67eb5a8
  SEC_PATCH_SHA256: b29c569a2f71dc3a6a57fd09c7b9407c93b4a28dca63783300073cf37a1eb6d6
  SEC_PATCH_GZIP_SHA256: 532e356c69145828ac78cc9d1768b84f8f377d53f96f1c00b0758abd72fcf945
  SEC_PATCH_B64_LENGTH: '40096'
  SEC_VALIDATION_PR: '331'
  SEC_TARGET_BRANCH: fix/trusted-verifier-causal-closure-v1
  SEC_EXPECTED_OLD_TARGET: 4a0bd0db7fb8a4d3f7aaf687ed868d896d26a2f1

jobs:
  publish-candidate:
    if: github.event.pull_request.number == 331 && github.event.pull_request.head.ref == 'validation/issue-178-workspace-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
      tree: ${{ steps.publish.outputs.tree }}
    steps:
      - name: Checkout exact trusted base for Git object construction only
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_BASE }}
          fetch-depth: 2
          persist-credentials: true

      - name: Resolve and authenticate immutable patch chunks
        id: patch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_PATCH_SHA: ${{ env.SEC_PATCH_SHA256 }}
          EXPECTED_GZIP_SHA: ${{ env.SEC_PATCH_GZIP_SHA256 }}
          EXPECTED_LENGTH: ${{ env.SEC_PATCH_B64_LENGTH }}
          VALIDATION_PR: ${{ env.SEC_VALIDATION_PR }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const zlib = require('zlib');
            const pullNumber = Number(process.env.VALIDATION_PR);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100
            });
            const chunks = [];
            for (let part = 1; part <= 4; part += 1) {
              const prefix = `SEC178_PATCH_CHUNK_V1 part=${part}/4`;
              const matches = comments.filter((comment) =>
                comment.user?.login === 'QzCrane' && (comment.body ?? '').startsWith(prefix));
              if (matches.length !== 1) throw new Error(`Expected exactly one trusted patch chunk ${part}; found ${matches.length}.`);
              const body = matches[0].body ?? '';
              const separator = body.indexOf('\n\n');
              if (separator < 0) throw new Error(`Patch chunk ${part} has no payload separator.`);
              const payload = body.slice(separator + 2).replace(/[^A-Za-z0-9+/=]/gu, '');
              if (payload.length === 0) throw new Error(`Patch chunk ${part} is empty.`);
              chunks.push(payload);
            }
            const encoded = chunks.join('');
            if (encoded.length !== Number(process.env.EXPECTED_LENGTH)) {
              throw new Error(`Patch Base64 length mismatch: ${encoded.length}.`);
            }
            const gzip = Buffer.from(encoded, 'base64');
            const gzipDigest = crypto.createHash('sha256').update(gzip).digest('hex');
            if (gzipDigest !== process.env.EXPECTED_GZIP_SHA) throw new Error('Patch gzip digest mismatch.');
            const patch = zlib.gunzipSync(gzip);
            const patchDigest = crypto.createHash('sha256').update(patch).digest('hex');
            if (patchDigest !== process.env.EXPECTED_PATCH_SHA) throw new Error('Patch digest mismatch.');
            fs.mkdirSync('.tmp/sec178', { recursive: true });
            fs.writeFileSync('.tmp/sec178/candidate.patch', patch);
            core.setOutput('patch-bytes', String(patch.byteLength));

      - name: Build one-parent candidate tree without executing candidate code
        id: publish
        shell: bash
        env:
          TARGET_BRANCH: ${{ env.SEC_TARGET_BRANCH }}
          EXPECTED_OLD_TARGET: ${{ env.SEC_EXPECTED_OLD_TARGET }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEC_BASE"
          test "$(git rev-parse HEAD^{tree})" = '5901592ff5f6b5636edc7700141b45acb2bf3dc0'
          test -z "$(git status --porcelain=v1)"

          git apply --binary --index .tmp/sec178/candidate.patch
          git diff --cached --check
          tree="$(git write-tree)"
          test "$tree" = "$SEC_EXPECTED_TREE"

          manifest_digest="$(sha256sum docs/work-packages/trusted-verifier-causal-closure-v1.md | cut -d' ' -f1)"
          test "$manifest_digest" = '4a73939ee98baaf17804605f1d9ae0d4d0938d3530e60112366aa3ae065720ba'
          grep -F "manifestDigest: sha256:$manifest_digest" docs/work/active-work-package.md >/dev/null

          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          current_target="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$current_target" = "$EXPECTED_OLD_TARGET"

          export GIT_AUTHOR_NAME='QzCrane'
          export GIT_AUTHOR_EMAIL='107861762+QzCrane@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          candidate="$(printf '%s\n' 'fix(tcb): converge verifier trust root to causal closure (#178)' | git commit-tree "$tree" -p "$SEC_BASE")"

          test "$(git rev-parse "$candidate^")" = "$SEC_BASE"
          test "$(git rev-parse "$candidate^{tree}")" = "$SEC_EXPECTED_TREE"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_OLD_TARGET"

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\nbase=%s\ntree=%s\npatch_sha256=%s\n' "$candidate" "$SEC_BASE" "$tree" "$SEC_PATCH_SHA256"

  verify-candidate:
    needs: publish-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SEC_CANDIDATE: ${{ needs.publish-candidate.outputs.candidate }}
      SEC_CANDIDATE_TREE: ${{ needs.publish-candidate.outputs.tree }}
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_CANDIDATE }}
          fetch-depth: 2
          persist-credentials: false

      - name: Materialize immutable legacy P0 object one
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ab5d3a839afc1d595ae5c43437eb862cde1500c1
          fetch-depth: 1
          persist-credentials: false
          path: .tmp/legacy-p0-head

      - name: Materialize immutable legacy P0 object two
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 514e6e401659f18ecffca19856a11354d66d05df
          fetch-depth: 1
          persist-credentials: false
          path: .tmp/legacy-p0-tested-head

      - name: Setup trusted Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install exact candidate dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          bun --revision
          bun install --frozen-lockfile --ignore-scripts

      - name: Verify old trusted classifier sees the exact candidate as bootstrap-relevant
        shell: bash
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/sec178-trusted-base"
          git clone --no-checkout "$GITHUB_WORKSPACE" "$base_dir"
          git -C "$base_dir" checkout --detach "$SEC_BASE"
          cp -a node_modules "$base_dir/node_modules"
          changed="$(git diff --name-only "$SEC_BASE" "$SEC_CANDIDATE")"
          OLD_CHANGED="$changed" bun --cwd "$base_dir" -e "import { matchesCanonicalTrustRoot } from './platform/shared/tcb-closure-lock.ts'; const changed=(process.env.OLD_CHANGED??'').split(/\\r?\\n/u).filter(Boolean); const matched=changed.filter(matchesCanonicalTrustRoot); console.log(JSON.stringify({changed,matched,repositoryAudit:matchesCanonicalTrustRoot('scripts/codex/repository-audit.ts')},null,2)); if(matched.length===0) process.exit(1);" | tee .tmp/sec178-old-classifier.json

      - name: Run exact candidate physical regression and collect evidence
        id: regression
        shell: bash
        env:
          SEC_CHANGED_BASE: ${{ env.SEC_BASE }}
          SEC_AFFECTED_TESTS_BASE: ${{ env.SEC_BASE }}
          SEC_WORK_PACKAGE_MANIFEST_PATH: docs/work-packages/trusted-verifier-causal-closure-v1.md
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/.tmp/legacy-p0-head/.git/objects:$GITHUB_WORKSPACE/.tmp/legacy-p0-tested-head/.git/objects"
          out=.tmp/sec178-evidence
          mkdir -p "$out"

          test "$(git rev-parse HEAD)" = "$SEC_CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$SEC_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$SEC_CANDIDATE_TREE"
          git diff --check "$SEC_BASE".."$SEC_CANDIDATE"

          bun -e "import {trustedRuntimeClosure,verifyTcbClosureLock,TCB_CLOSURE_LOCK} from './platform/shared/tcb-closure-lock.ts'; import {SEC_TRUSTED_BOOTSTRAP_REGISTRY_V1} from './platform/shared/tcb-trust-root-contract.ts'; const c=trustedRuntimeClosure(); const live=[...c.closure].sort(); const reg=[...SEC_TRUSTED_BOOTSTRAP_REGISTRY_V1.causalRuntimePaths]; const v=verifyTcbClosureLock(c); const result={live:live.length,registry:reg.length,lock:TCB_CLOSURE_LOCK.moduleCount,parity:JSON.stringify(live)===JSON.stringify(reg)&&JSON.stringify(live)===JSON.stringify(TCB_CLOSURE_LOCK.modules),verification:v,closureDigest:TCB_CLOSURE_LOCK.closureDigest,repositoryAuditInClosure:c.closure.has('scripts/codex/repository-audit.ts'),reviewedEdges:[...c.reviewedEdges],reviewedExternalImports:[...c.reviewedExternalImports],reviewedProcessDispatchers:[...c.reviewedProcessDispatchers]}; console.log(JSON.stringify(result,null,2)); if(!result.parity||v.status!=='passed'||result.repositoryAuditInClosure) process.exit(1);" | tee "$out/tcb.json"

          bun run imports:check 2>&1 | tee "$out/imports.log"
          bun run docs:doctor 2>&1 | tee "$out/docs-doctor.log"
          bun run typecheck 2>&1 | tee "$out/typecheck.log"

          bun test --timeout 180000 \
            tests/unit/tcb-trust-root-contract.test.ts \
            tests/contract/sec-merge-gate.test.ts \
            tests/contract/tcb-closure-lock.test.ts \
            tests/contract/default-branch-revision-health.test.ts \
            tests/contract/repository-audit.test.ts \
            tests/contract/documentation-authority.test.ts \
            tests/contract/test-impact.test.ts \
            tests/contract/ci-contract.test.ts \
            2>&1 | tee "$out/focused-tests.log"

          bun scripts/codex/repository-audit.ts --json | tee "$out/repository-audit.json"
          bun run check:affected --plan 2>&1 | tee "$out/affected-plan.log"
          bun run test:affected 2>&1 | tee "$out/affected-tests.log"

          test -z "$(git status --porcelain=v1)"
          {
            printf 'schema=sec-trusted-bootstrap-validation-v1\n'
            printf 'base=%s\n' "$SEC_BASE"
            printf 'candidate=%s\n' "$SEC_CANDIDATE"
            printf 'tree=%s\n' "$SEC_CANDIDATE_TREE"
            printf 'bun=%s\n' "$(bun --revision)"
            printf 'git=%s\n' "$(git --version)"
            printf 'os=%s\n' "$(uname -a)"
            printf 'status=passed\n'
          } > "$out/environment.txt"
          cp .tmp/sec178-old-classifier.json "$out/old-classifier.json"
          (cd "$out" && sha256sum * > SHA256SUMS)

      - name: Upload exact physical validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-issue-178-exact-candidate-${{ env.SEC_CANDIDATE }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/sec178-evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
