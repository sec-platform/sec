name: validation test-runner host independence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-test-runner-host-independence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_BASE: 26dcb43c77c9bdfebee35efc217113c958ed017d

jobs:
  reproduce-on-main:
    if: github.event.pull_request.number == 331 && github.event.pull_request.head.ref == 'validation/issue-178-workspace-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact main without persistent credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_BASE }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies without lifecycle scripts
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Print resolved fast-test concurrency
        shell: bash
        run: |
          bun -e "import {availableParallelism} from 'node:os'; import {DEFAULT_FAST_TEST_CONCURRENCY_BUDGET,DEFAULT_FAST_TEST_RESOURCE_CLASS_LIMITS,DEFAULT_FAST_TEST_MAX_CONCURRENCY} from './platform/dev-runner/fast-test-policy.ts'; console.log(JSON.stringify({availableParallelism:availableParallelism(),budget:DEFAULT_FAST_TEST_CONCURRENCY_BUDGET,resourceLimits:DEFAULT_FAST_TEST_RESOURCE_CLASS_LIMITS,maxConcurrency:DEFAULT_FAST_TEST_MAX_CONCURRENCY},null,2));"

      - name: Reproduce exact reverse-completion test on main
        shell: bash
        run: |
          set -euo pipefail
          bun test tests/unit/test-runner.test.ts --test-name-pattern 'mixed failures stay plan-ordered under reverse completion without host CPU assumptions' --timeout 15000
