name: validation issue-178 workspace export

on:
  push:
    branches:
      - validation/issue-178-workspace-export
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-issue-178-workspace-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_EXPORT_BASE: 26dcb43c77c9bdfebee35efc217113c958ed017d

jobs:
  export-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact trusted base with full reachable history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_EXPORT_BASE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEC_EXPORT_BASE"
          test -z "$(git status --porcelain=v1)"
          git fsck --no-progress
          mkdir -p .tmp
          git show-ref > .tmp/show-ref.txt
          git --version

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Build exact Linux dependency tree from frozen lock
        shell: bash
        run: |
          set -euo pipefail
          bun --revision
          bun install --frozen-lockfile
          test -d node_modules

      - name: Build self-contained workspace export
        shell: bash
        run: |
          set -euo pipefail
          out=.tmp/issue-178-workspace-export
          mkdir -p "$out"

          git bundle create "$out/sec-repository.bundle" --all
          git bundle verify "$out/sec-repository.bundle"

          if command -v zstd >/dev/null 2>&1; then
            tar -I 'zstd -T0 -6' -cf "$out/node_modules.tar.zst" node_modules
          else
            tar -czf "$out/node_modules.tar.gz" node_modules
          fi

          cp bun.lock "$out/bun.lock"
          cp package.json "$out/package.json"
          cp .tmp/show-ref.txt "$out/git-show-ref.txt"

          {
            printf 'schema=sec-workspace-export-v2\n'
            printf 'base=%s\n' "$SEC_EXPORT_BASE"
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'git=%s\n' "$(git --version)"
            printf 'bun=%s\n' "$(bun --revision)"
            printf 'os=%s\n' "$(uname -a)"
            printf 'node_modules_bytes=%s\n' "$(du -sb node_modules | cut -f1)"
          } > "$out/environment.txt"

          (cd "$out" && sha256sum sec-repository.bundle node_modules.tar.* bun.lock package.json git-show-ref.txt environment.txt > SHA256SUMS)
          du -h "$out"/*
          cat "$out/environment.txt"
          cat "$out/SHA256SUMS"

      - name: Upload workspace export artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-issue-178-workspace-export-v2-base-${{ env.SEC_EXPORT_BASE }}-run-${{ github.run_id }}
          path: .tmp/issue-178-workspace-export
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
