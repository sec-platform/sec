name: validation issue-178 exact candidate verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-issue-178-exact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_BASE: 26dcb43c77c9bdfebee35efc217113c958ed017d
  SEC_CANDIDATE: 550f4f60dcc4b6d202fc775592a8c27717d4c541
  SEC_CANDIDATE_TREE: 624172dbc1b7894e6dcfe19f31adbc5ef67eb5a8
  SEC_TARGET_BRANCH: fix/trusted-verifier-causal-closure-v1

jobs:
  verify-candidate:
    if: github.event.pull_request.number == 331 && github.event.pull_request.head.ref == 'validation/issue-178-workspace-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Resolve live base and formal candidate ref
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_BASE: ${{ env.SEC_BASE }}
          EXPECTED_HEAD: ${{ env.SEC_CANDIDATE }}
          TARGET_BRANCH: ${{ env.SEC_TARGET_BRANCH }}
        with:
          script: |
            const repository = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const [base, branch, commit] = await Promise.all([
              github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: repository.data.default_branch }),
              github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: process.env.TARGET_BRANCH }),
              github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: process.env.EXPECTED_HEAD })
            ]);
            if (base.data.commit.sha !== process.env.EXPECTED_BASE) throw new Error('Default branch moved; candidate verification is stale.');
            if (branch.data.commit.sha !== process.env.EXPECTED_HEAD) throw new Error('Formal candidate branch does not equal exact expected head.');
            if (commit.data.parents.length !== 1 || commit.data.parents[0].sha !== process.env.EXPECTED_BASE) {
              throw new Error('Formal candidate is not one exact single-parent commit on current base.');
            }

      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_CANDIDATE }}
          fetch-depth: 2
          persist-credentials: false

      - name: Materialize immutable legacy P0 object one
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ab5d3a839afc1d595ae5c43437eb862cde1500c1
          fetch-depth: 1
          persist-credentials: false
          path: .tmp/legacy-p0-head

      - name: Materialize immutable legacy P0 object two
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 514e6e401659f18ecffca19856a11354d66d05df
          fetch-depth: 1
          persist-credentials: false
          path: .tmp/legacy-p0-tested-head

      - name: Setup trusted Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install exact candidate dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          bun --revision
          bun install --frozen-lockfile --ignore-scripts

      - name: Verify old trusted classifier sees candidate as bootstrap-relevant
        shell: bash
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/sec178-trusted-base"
          git worktree add --detach "$base_dir" "$SEC_BASE"
          trap 'git worktree remove --force "$base_dir" >/dev/null 2>&1 || true' EXIT
          cp -a node_modules "$base_dir/node_modules"
          changed="$(git diff --name-only "$SEC_BASE" "$SEC_CANDIDATE")"
          mkdir -p .tmp
          OLD_CHANGED="$changed" bun --cwd "$base_dir" -e "import { matchesCanonicalTrustRoot } from './platform/shared/tcb-closure-lock.ts'; const changed=(process.env.OLD_CHANGED??'').split(/\\r?\\n/u).filter(Boolean); const matched=changed.filter(matchesCanonicalTrustRoot); const repositoryAudit=matchesCanonicalTrustRoot('scripts/codex/repository-audit.ts'); const result={changed,matched,repositoryAudit}; console.log(JSON.stringify(result,null,2)); if(matched.length===0||!repositoryAudit) process.exit(1);" | tee .tmp/sec178-old-classifier.json

      - name: Run exact candidate physical regression and collect evidence
        shell: bash
        env:
          SEC_CHANGED_BASE: ${{ env.SEC_BASE }}
          SEC_AFFECTED_TESTS_BASE: ${{ env.SEC_BASE }}
          SEC_WORK_PACKAGE_MANIFEST_PATH: docs/work-packages/trusted-verifier-causal-closure-v1.md
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/.tmp/legacy-p0-head/.git/objects:$GITHUB_WORKSPACE/.tmp/legacy-p0-tested-head/.git/objects"
          out=.tmp/sec178-evidence
          mkdir -p "$out"

          test "$(git rev-parse HEAD)" = "$SEC_CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$SEC_BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SEC_CANDIDATE_TREE"
          git update-ref refs/remotes/origin/main "$SEC_BASE"
          git diff --check "$SEC_BASE".."$SEC_CANDIDATE"

          bun -e "import {trustedRuntimeClosure,verifyTcbClosureLock,TCB_CLOSURE_LOCK,matchesCanonicalTrustRoot} from './platform/shared/tcb-closure-lock.ts'; import {SEC_TRUSTED_BOOTSTRAP_REGISTRY_V1} from './platform/shared/tcb-trust-root-contract.ts'; const c=trustedRuntimeClosure(); const live=[...c.closure].sort(); const reg=[...SEC_TRUSTED_BOOTSTRAP_REGISTRY_V1.causalRuntimePaths]; const v=verifyTcbClosureLock(c); const result={live:live.length,registry:reg.length,lock:TCB_CLOSURE_LOCK.moduleCount,parity:JSON.stringify(live)===JSON.stringify(reg)&&JSON.stringify(live)===JSON.stringify(TCB_CLOSURE_LOCK.modules),verification:v,closureDigest:TCB_CLOSURE_LOCK.closureDigest,repositoryAuditInClosure:c.closure.has('scripts/codex/repository-audit.ts'),repositoryAuditMatchesTrust:matchesCanonicalTrustRoot('scripts/codex/repository-audit.ts'),mergeGateMatchesTrust:matchesCanonicalTrustRoot('scripts/codex/merge-gate.ts'),registryMatchesTrust:matchesCanonicalTrustRoot('platform/shared/ci-trust-root-registry.json'),lockMatchesTrust:matchesCanonicalTrustRoot('platform/shared/tcb-closure-lock.ts'),reviewedEdges:[...c.reviewedEdges],reviewedExternalImports:[...c.reviewedExternalImports],reviewedProcessDispatchers:[...c.reviewedProcessDispatchers]}; console.log(JSON.stringify(result,null,2)); if(!result.parity||v.status!=='passed'||result.repositoryAuditInClosure||result.repositoryAuditMatchesTrust||!result.mergeGateMatchesTrust||!result.registryMatchesTrust||!result.lockMatchesTrust) process.exit(1);" | tee "$out/tcb.json"

          bun run imports:check 2>&1 | tee "$out/imports.log"
          bun run docs:doctor 2>&1 | tee "$out/docs-doctor.log"
          bun run typecheck 2>&1 | tee "$out/typecheck.log"

          bun test --timeout 180000 \
            tests/unit/tcb-trust-root-contract.test.ts \
            tests/contract/sec-merge-gate.test.ts \
            tests/contract/tcb-closure-lock.test.ts \
            tests/contract/default-branch-revision-health.test.ts \
            tests/contract/repository-audit.test.ts \
            tests/contract/documentation-authority.test.ts \
            tests/contract/test-impact.test.ts \
            tests/contract/ci-contract.test.ts \
            2>&1 | tee "$out/focused-tests.log"

          bun scripts/codex/repository-audit.ts --json | tee "$out/repository-audit.json"
          bun run check:affected --plan 2>&1 | tee "$out/affected-plan.log"
          bun run test:affected 2>&1 | tee "$out/affected-tests.log"

          test -z "$(git status --porcelain=v1)"
          {
            printf 'schema=sec-trusted-bootstrap-validation-v1\n'
            printf 'base=%s\n' "$SEC_BASE"
            printf 'candidate=%s\n' "$SEC_CANDIDATE"
            printf 'tree=%s\n' "$SEC_CANDIDATE_TREE"
            printf 'bun=%s\n' "$(bun --revision)"
            printf 'git=%s\n' "$(git --version)"
            printf 'os=%s\n' "$(uname -a)"
            printf 'status=passed\n'
          } > "$out/environment.txt"
          cp .tmp/sec178-old-classifier.json "$out/old-classifier.json"
          (cd "$out" && sha256sum * > SHA256SUMS)

      - name: Upload exact physical validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-issue-178-exact-candidate-${{ env.SEC_CANDIDATE }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/sec178-evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
