name: validation issue-178 candidate repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validation-issue-178-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_BASE: 26dcb43c77c9bdfebee35efc217113c958ed017d
  SEC_CANDIDATE: a3b6e4de97207758ea1a13419801af60e3bbde6b
  SEC_TARGET_BRANCH: fix/trusted-verifier-causal-closure-v1

jobs:
  repair-candidate-files:
    if: github.event.pull_request.number == 331 && github.event.pull_request.head.ref == 'validation/issue-178-workspace-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact formal candidate without persistent credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_CANDIDATE }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEC_CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$SEC_BASE"
          test -z "$(git status --porcelain=v1)"

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          bun install --frozen-lockfile --ignore-scripts

      - name: Apply the two reviewed contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/shared/tcb-trust-root-contract.ts')
          s = p.read_text()
          old_import = "import { compilerRoot } from './paths.ts';\n\n"
          if old_import not in s:
              raise SystemExit('expected compilerRoot import not found')
          s = s.replace(old_import, '', 1)
          old_load = "export function loadSecTrustedBootstrapRegistryV1(): SecTrustedBootstrapRegistryV1 {\n  const absolutePath = path.join(compilerRoot, ...SEC_TRUSTED_BOOTSTRAP_REGISTRY_PATH_V1.split('/'));\n  return parseSecTrustedBootstrapRegistryV1(readFileSync(absolutePath, 'utf8'));\n}"
          new_load = "export function loadSecTrustedBootstrapRegistryV1(): SecTrustedBootstrapRegistryV1 {\n  const absolutePath = path.join(import.meta.dir, 'ci-trust-root-registry.json');\n  return parseSecTrustedBootstrapRegistryV1(readFileSync(absolutePath, 'utf8'));\n}"
          if old_load not in s:
              raise SystemExit('expected registry loader not found')
          s = s.replace(old_load, new_load, 1)
          anchor = "function assertNoStaticOverlap(registry: SecTrustedBootstrapRegistryV1): void {\n"
          if anchor not in s:
              raise SystemExit('overlap function anchor not found')
          prefix_check = "  for (let index = 0; index < registry.staticPrefixes.length; index += 1) {\n    const prefix = registry.staticPrefixes[index]!;\n    for (const other of registry.staticPrefixes.slice(index + 1)) {\n      if (prefix.startsWith(other) || other.startsWith(prefix)) {\n        throw new Error(`Trusted bootstrap prefixes overlap: ${prefix} / ${other}.`);\n      }\n    }\n  }\n"
          s = s.replace(anchor, anchor + prefix_check, 1)
          p.write_text(s)
          PY

      - name: Regenerate exact frozen TCB lock from repaired candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          bun -e "import {generateTcbClosureLockForRevision,TCB_CLOSURE_TRUST_REVISION} from './platform/shared/tcb-closure-lock.ts'; await Bun.write('.tmp/sec178-lock.json', JSON.stringify(generateTcbClosureLockForRevision(TCB_CLOSURE_TRUST_REVISION), null, 2) + '\n');"
          python3 - <<'PY'
          from pathlib import Path
          import datetime, re
          lock = Path('.tmp/sec178-lock.json').read_text().rstrip('\n')
          p = Path('platform/shared/tcb-closure-lock.ts')
          s = p.read_text()
          marker = 'export const TCB_CLOSURE_LOCK: TcbClosureLock = '
          start = s.index(marker) + len(marker)
          end = s.index('\n\nexport const TCB_CLOSURE_LOCK_RECEIPT', start)
          s = s[:start] + lock + ';' + s[end:]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          s, count = re.subn(r"generatedAt: '[^']+'", f"generatedAt: '{now}'", s, count=1)
          if count != 1:
              raise SystemExit('generatedAt receipt field not found')
          p.write_text(s)
          PY

      - name: Verify repaired registry and lock contracts
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 180000 tests/unit/tcb-trust-root-contract.test.ts tests/contract/tcb-closure-lock.test.ts
          bun -e "import {trustedRuntimeClosure,verifyTcbClosureLock,TCB_CLOSURE_LOCK} from './platform/shared/tcb-closure-lock.ts'; const c=trustedRuntimeClosure(['scripts/codex/merge-gate.ts']); const pkgs=[...c.observedExternalImports].filter(x=>!x.startsWith('node:')&&!x.startsWith('bun:')); if(pkgs.length) throw new Error('merge-gate third-party closure: '+pkgs.join(',')); const full=trustedRuntimeClosure(); const v=verifyTcbClosureLock(full); if(v.status!=='passed') throw new Error(v.failures.join('\n')); if(TCB_CLOSURE_LOCK.moduleCount!==62) throw new Error('unexpected module count'); console.log(JSON.stringify({moduleCount:TCB_CLOSURE_LOCK.moduleCount,closureDigest:TCB_CLOSURE_LOCK.closureDigest,mergeGateThirdPartyPackages:pkgs,verification:v},null,2));"
          git diff --check

      - name: Rebuild one exact commit directly on current base
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SEC Trusted Bootstrap Validation'
          git config user.email 'sec-bootstrap@example.invalid'
          git reset --soft "$SEC_BASE"
          git add platform/shared/tcb-trust-root-contract.ts platform/shared/tcb-closure-lock.ts
          git commit -m 'fix(tcb): converge verifier trust root to causal closure (#178)'
          test "$(git rev-parse HEAD^)" = "$SEC_BASE"
          test -z "$(git status --porcelain=v1)"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          printf 'newHead=%s\nnewTree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Push exact corrected candidate ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEW_HEAD: ${{ steps.build.outputs.head }}
        run: |
          set -euo pipefail
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${NEW_HEAD}:refs/heads/${SEC_TARGET_BRANCH}"

      - name: Package exact repaired identity
        shell: bash
        env:
          NEW_HEAD: ${{ steps.build.outputs.head }}
          NEW_TREE: ${{ steps.build.outputs.tree }}
        run: |
          set -euo pipefail
          out=.tmp/sec178-repair
          mkdir -p "$out/platform/shared"
          cp platform/shared/tcb-trust-root-contract.ts "$out/platform/shared/"
          cp platform/shared/tcb-closure-lock.ts "$out/platform/shared/"
          {
            printf 'schema=sec-issue-178-repair-files-v1\n'
            printf 'base=%s\n' "$SEC_BASE"
            printf 'sourceCandidate=%s\n' "$SEC_CANDIDATE"
            printf 'newHead=%s\n' "$NEW_HEAD"
            printf 'newTree=%s\n' "$NEW_TREE"
            printf 'contractBlob=%s\n' "$(git hash-object platform/shared/tcb-trust-root-contract.ts)"
            printf 'lockBlob=%s\n' "$(git hash-object platform/shared/tcb-closure-lock.ts)"
            printf 'bun=%s\n' "$(bun --revision)"
          } > "$out/environment.txt"
          (cd "$out" && sha256sum platform/shared/tcb-trust-root-contract.ts platform/shared/tcb-closure-lock.ts environment.txt > SHA256SUMS)
          cat "$out/environment.txt"

      - name: Upload repaired identity artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-issue-178-corrected-candidate-${{ steps.build.outputs.head }}-run-${{ github.run_id }}
          path: .tmp/sec178-repair
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
