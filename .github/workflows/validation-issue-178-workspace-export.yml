name: validation issue-178 privileged authority closure repair

on:
  pull_request:
    branches: [main]

concurrency:
  group: validation-issue-178-single-writer
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_BASE: 26dcb43c77c9bdfebee35efc217113c958ed017d
  SEC_SOURCE_CANDIDATE: 7290279e5079dd179722f360900e1eb7f6856d72
  SEC_TARGET_BRANCH: fix/trusted-verifier-causal-closure-v1

jobs:
  verify-candidate:
    if: github.event.pull_request.number == 331 && github.event.pull_request.head.ref == 'validation/issue-178-workspace-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.identity.outputs.head }}
      tree: ${{ steps.identity.outputs.tree }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - name: Checkout exact reviewed source candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_SOURCE_CANDIDATE }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies without lifecycle scripts
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Materialize immutable legacy fixture objects
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEC_SOURCE_CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$SEC_BASE"
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --quiet --no-tags --no-recurse-submodules --no-write-fetch-head "$url" \
            01d5c45a573337bee484d6a9d2effb2a76787b86 \
            ab5d3a839afc1d595ae5c43437eb862cde1500c1 \
            514e6e401659f18ecffca19856a11354d66d05df
          for sha in \
            01d5c45a573337bee484d6a9d2effb2a76787b86 \
            ab5d3a839afc1d595ae5c43437eb862cde1500c1 \
            514e6e401659f18ecffca19856a11354d66d05df; do
            git cat-file -e "${sha}^{commit}"
          done
          git cat-file -e 334dd8dbe7162cd35f832257b735e79dd39e5650

      - name: Add authorization entrypoint and exact process dispatchers
        shell: bash
        env:
          BASE: ${{ env.SEC_BASE }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/sec178-p1
          python3 - <<'PY'
          import json
          from pathlib import Path

          tcb_path = Path('platform/shared/tcb-closure-lock.ts')
          tcb = tcb_path.read_text()
          insertions = [
              (
                  "  'scripts/codex/ci-orchestration-core.ts::function-declaration:CodexDevelopmentDefaultChangedPathsV1::spawnSync#1',\n",
                  "  'scripts/codex/branch-lifecycle-command.ts::const-arrow:defaultBranchLifecycleCommandRunner::spawnSync#1',\n",
                  'before',
              ),
              (
                  "  'scripts/codex/merge-gate.ts::function-declaration:mergeGateGitResolvers>const-arrow:run::spawnSync#1',\n",
                  "  'scripts/codex/sec-merge-bootstrap-runtime.ts::const-arrow:defaultShellRunner::spawnSync#1',\n",
                  'after',
              ),
          ]
          for anchor, addition, side in insertions:
              if addition in tcb or tcb.count(anchor) != 1:
                  raise SystemExit('reviewed process-dispatcher edit precondition failed')
              replacement = addition + anchor if side == 'before' else anchor + addition
              tcb = tcb.replace(anchor, replacement, 1)
          tcb_path.write_text(tcb)

          registry_path = Path('platform/shared/ci-trust-root-registry.json')
          registry = json.loads(registry_path.read_text())
          entrypoint = 'scripts/codex/sec-merge-bootstrap.ts'
          values = list(registry['runtimeEntrypoints'])
          if entrypoint in values:
              raise SystemExit('authorization entrypoint unexpectedly already registered')
          values.append(entrypoint)
          registry['runtimeEntrypoints'] = sorted(values)
          # Seed the entrypoint so module import sees it before the causal census is recomputed below.
          causal = list(registry['causalRuntimePaths'])
          if entrypoint not in causal:
              causal.append(entrypoint)
          registry['causalRuntimePaths'] = sorted(causal)
          registry_path.write_text(json.dumps(registry, indent=2) + '\n')
          PY

          bun -e "import {readFileSync,writeFileSync} from 'node:fs'; import {trustedRuntimeClosure} from './platform/shared/tcb-closure-lock.ts'; const p='platform/shared/ci-trust-root-registry.json'; const r=JSON.parse(readFileSync(p,'utf8')); const c=trustedRuntimeClosure(); r.causalRuntimePaths=[...c.closure].sort(); writeFileSync(p,JSON.stringify(r,null,2)+'\\n'); console.log(JSON.stringify({moduleCount:r.causalRuntimePaths.length,entrypoints:r.runtimeEntrypoints.length,dispatchers:[...c.reviewedProcessDispatchers].sort()},null,2));"
          BASE="$BASE" bun -e "import {writeFileSync} from 'node:fs'; import {generateTcbClosureLockForRevision} from './platform/shared/tcb-closure-lock.ts'; writeFileSync('.tmp/sec178-p1/lock.json',JSON.stringify(generateTcbClosureLockForRevision(process.env.BASE),null,2)+'\\n');"

      - name: Freeze regenerated lock and negative contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          lock = json.loads(Path('.tmp/sec178-p1/lock.json').read_text())
          lock_path = Path('platform/shared/tcb-closure-lock.ts')
          source = lock_path.read_text()
          pattern = re.compile(
              r'export const TCB_CLOSURE_LOCK: TcbClosureLock = \{.*?\n\};\n\nexport const TCB_CLOSURE_LOCK_RECEIPT = \{',
              re.S,
          )
          replacement = 'export const TCB_CLOSURE_LOCK: TcbClosureLock = ' + json.dumps(lock, indent=2) + ';\n\nexport const TCB_CLOSURE_LOCK_RECEIPT = {'
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('TCB lock replacement anchor mismatch')
          stamp = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          source, count = re.subn(r"generatedAt: '[^']+',", f"generatedAt: '{stamp}',", source, count=1)
          if count != 1:
              raise SystemExit('TCB receipt timestamp anchor mismatch')
          lock_path.write_text(source)

          registry_test = Path('tests/unit/tcb-trust-root-contract.test.ts')
          text = registry_test.read_text()
          text, c1 = re.subn(r'expect\(parsed\.causalRuntimePaths\)\.toHaveLength\(\d+\);', f"expect(parsed.causalRuntimePaths).toHaveLength({lock['moduleCount']});", text, count=1)
          text, c2 = re.subn(r'expect\(parsed\.runtimeEntrypoints\)\.toHaveLength\(\d+\);', 'expect(parsed.runtimeEntrypoints).toHaveLength(18);', text, count=1)
          anchor = "  expect(matchSecTrustedBootstrapPathV1('scripts/codex/repository-audit.ts')).toBeNull();\n"
          addition = "  expect(matchSecTrustedBootstrapPathV1('scripts/codex/sec-merge-bootstrap.ts')).toEqual({\n    kind: 'causal-runtime',\n    rule: 'scripts/codex/sec-merge-bootstrap.ts'\n  });\n"
          if c1 != 1 or c2 != 1 or text.count(anchor) != 1:
              raise SystemExit('registry contract edit precondition failed')
          registry_test.write_text(text.replace(anchor, anchor + addition, 1))

          gate_test = Path('tests/contract/sec-merge-gate.test.ts')
          text = gate_test.read_text()
          anchor = "    'scripts/codex/merge-gate.ts',\n    'platform/shared/tcb-closure-lock.ts',\n"
          replacement = "    'scripts/codex/merge-gate.ts',\n    'scripts/codex/sec-merge-bootstrap.ts',\n    'platform/shared/tcb-closure-lock.ts',\n"
          if text.count(anchor) != 1:
              raise SystemExit('merge-gate protected-path block anchor mismatch')
          gate_test.write_text(text.replace(anchor, replacement, 1))
          PY
          git diff --check
          test "$(git diff --name-only "$SEC_BASE" "$SEC_SOURCE_CANDIDATE")" = "$(git diff --name-only "$SEC_BASE")"

      - name: Build exact single-parent repaired candidate
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'SEC Trusted Bootstrap Validation'
          git config user.email 'sec-bootstrap@example.invalid'
          git reset --soft "$SEC_BASE"
          git commit -m 'fix(tcb): protect causal verifier and authorization closure (#178)'
          test "$(git rev-parse HEAD^)" = "$SEC_BASE"
          test -z "$(git status --porcelain=v1)"
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          artifact="sec-issue-178-p1-repair-${head}-run-${GITHUB_RUN_ID}"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Prove old trusted classification and host independence
        shell: bash
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/sec178-old-trusted"
          git worktree add --detach "$base_dir" "$SEC_BASE"
          cp -a node_modules "$base_dir/node_modules"
          bun --cwd "$base_dir" -e "import {matchesCanonicalTrustRoot} from './platform/shared/tcb-closure-lock.ts'; if(!matchesCanonicalTrustRoot('scripts/codex/sec-merge-bootstrap.ts')) throw new Error('old trusted classifier did not protect merge bootstrap');"
          git worktree remove --force "$base_dir"
          taskset -c 0 bun test tests/unit/test-runner.test.ts --timeout 30000
          taskset -c 0,1 bun test tests/unit/test-runner.test.ts --timeout 30000

      - name: Run exact repaired candidate physical verification
        shell: bash
        env:
          SEC_CHANGED_BASE: ${{ env.SEC_BASE }}
          SEC_AFFECTED_TESTS_BASE: ${{ env.SEC_BASE }}
          SEC_WORK_PACKAGE_MANIFEST_PATH: docs/work-packages/trusted-verifier-causal-closure-v1.md
          SEC_REPOSITORY_AUDIT_DEFAULT_REF: ${{ env.SEC_BASE }}
          VERIFIED_HEAD: ${{ steps.identity.outputs.head }}
          VERIFIED_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          git update-ref refs/remotes/origin/main "$SEC_BASE"
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          test "$(git rev-parse HEAD^)" = "$SEC_BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VERIFIED_TREE"
          bun -e "import {trustedRuntimeClosure,verifyTcbClosureLock,TCB_CLOSURE_LOCK,matchesCanonicalTrustRoot} from './platform/shared/tcb-closure-lock.ts'; import {SEC_TRUSTED_BOOTSTRAP_REGISTRY_V1} from './platform/shared/tcb-trust-root-contract.ts'; const c=trustedRuntimeClosure(); const live=[...c.closure].sort(); const reg=[...SEC_TRUSTED_BOOTSTRAP_REGISTRY_V1.causalRuntimePaths]; const v=verifyTcbClosureLock(c); for(const p of ['scripts/codex/sec-merge-bootstrap.ts','scripts/codex/sec-merge-bootstrap-runtime.ts','scripts/codex/branch-lifecycle.ts','scripts/codex/branch-lifecycle-command.ts']) if(!c.closure.has(p)) throw new Error('authorization closure omits '+p); if(!matchesCanonicalTrustRoot('scripts/codex/sec-merge-bootstrap.ts')) throw new Error('merge bootstrap is not protected'); if(c.closure.has('scripts/codex/repository-audit.ts')||matchesCanonicalTrustRoot('scripts/codex/repository-audit.ts')) throw new Error('repository audit was re-promoted'); if(JSON.stringify(live)!==JSON.stringify(reg)||JSON.stringify(live)!==JSON.stringify(TCB_CLOSURE_LOCK.modules)||v.status!=='passed') throw new Error('TCB identity verification failed'); console.log(JSON.stringify({moduleCount:live.length,closureDigest:TCB_CLOSURE_LOCK.closureDigest,dispatchers:[...c.reviewedProcessDispatchers].sort()},null,2));"
          bun run imports:check
          bun run docs:doctor
          bun run typecheck
          git diff --check "$SEC_BASE".."$VERIFIED_HEAD"
          bun test --timeout 180000 \
            tests/unit/tcb-trust-root-contract.test.ts \
            tests/unit/test-runner.test.ts \
            tests/unit/sec-merge-bootstrap.test.ts \
            tests/contract/ci-contract.test.ts \
            tests/contract/sec-merge-gate.test.ts \
            tests/contract/tcb-closure-lock.test.ts \
            tests/contract/default-branch-revision-health.test.ts \
            tests/contract/repository-audit.test.ts \
            tests/contract/documentation-authority.test.ts \
            tests/contract/test-impact.test.ts
          bun scripts/codex/repository-audit.ts --json > .tmp/sec178-p1/repository-audit.json
          bun run check:affected --plan > .tmp/sec178-p1/affected-plan.json
          bun run test:affected
          test -z "$(git status --porcelain=v1)"

      - name: Package exact repaired candidate
        shell: bash
        env:
          VERIFIED_HEAD: ${{ steps.identity.outputs.head }}
          VERIFIED_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          out=.tmp/sec178-publish
          mkdir -p "$out"
          ref=refs/sec-validation/issue-178-p1-candidate
          git update-ref "$ref" "$VERIFIED_HEAD"
          git bundle create "$out/candidate.bundle" "$ref" "^$SEC_BASE"
          git bundle verify "$out/candidate.bundle"
          printf 'base=%s\nhead=%s\ntree=%s\nparent=%s\n' "$SEC_BASE" "$VERIFIED_HEAD" "$VERIFIED_TREE" "$(git rev-parse "$VERIFIED_HEAD^")" > "$out/identity.txt"
          (cd "$out" && sha256sum candidate.bundle identity.txt > SHA256SUMS)

      - name: Upload exact repaired candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .tmp/sec178-publish
          retention-days: 30
          if-no-files-found: error

  publish-object:
    needs: verify-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_BASE }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact repaired candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify-candidate.outputs.artifact }}
          path: .tmp/sec178-publish

      - name: Verify artifact and materialize Git object
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_HEAD: ${{ needs.verify-candidate.outputs.head }}
          VERIFIED_TREE: ${{ needs.verify-candidate.outputs.tree }}
        run: |
          set -euo pipefail
          (cd .tmp/sec178-publish && sha256sum -c SHA256SUMS)
          git fetch .tmp/sec178-publish/candidate.bundle refs/sec-validation/issue-178-p1-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$VERIFIED_HEAD"
          test "$(git cat-file -p "$VERIFIED_HEAD" | sed -n 's/^parent //p')" = "$SEC_BASE"
          test "$(git rev-parse "$VERIFIED_HEAD^{tree}")" = "$VERIFIED_TREE"
          set +e
          output="$(git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERIFIED_HEAD:refs/heads/$SEC_TARGET_BRANCH" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | sed -E 's#x-access-token:[^@]+@#x-access-token:<redacted>@#g'
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -Eqi 'workflow|workflows permission|refusing to allow'; then
            exit "$status"
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${VERIFIED_HEAD}" >/dev/null
