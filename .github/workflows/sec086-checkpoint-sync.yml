name: sec086-checkpoint-sync
on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-checkpoint-sync.yml]
permissions:
  contents: read
jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7a1226f54ea3b9247b66fd21426759034bf5f13b HEAD
          git bundle create /tmp/sec086-checkpoint.bundle HEAD refs/remotes/origin/main ^f482d2077b2c025ffb0b574644dff7631c0b1baa
          git bundle verify /tmp/sec086-checkpoint.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sec086-checkpoint-delta
          path: /tmp/sec086-checkpoint.bundle
          retention-days: 7
