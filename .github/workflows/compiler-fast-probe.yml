name: compiler-risk-evidence-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  risk-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration head
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture PR risk gate
        shell: bash
        env:
          SEC_CHANGED_BASE: 7829670781e2f8b5d6485656bc78352192372863
          SEC_AFFECTED_TESTS_BASE: 7829670781e2f8b5d6485656bc78352192372863
        run: |
          set +e
          bun scripts/ci-pr-risk.ts > pr-risk.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> pr-risk.log

      - name: Upload risk evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr-risk-evidence
          path: pr-risk.log
          retention-days: 1
