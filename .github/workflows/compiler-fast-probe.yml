name: compiler-full-fast-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  full-fast-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v5
        with:
          ref: validation/case-51
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture full fast inventory
        shell: bash
        run: |
          set +e
          bun run test:fast > full-fast-evidence.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> full-fast-evidence.log

      - name: Upload full fast evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-fast-evidence
          path: full-fast-evidence.log
          retention-days: 1
