name: compiler-reference-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  reference-refresh-output:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout refresh output branch
        uses: actions/checkout@v5
        with:
          ref: validation/reference-refresh-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh reference workspace
        run: bun run reference:refresh

      - name: Commit canonical reference refresh
        shell: bash
        run: |
          git add -u -- source control
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No reference changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "chore(reference): refresh canonical workspace snapshot"
          git push origin HEAD:refs/heads/validation/reference-refresh-output
