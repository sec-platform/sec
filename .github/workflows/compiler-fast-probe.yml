name: compiler-current-import-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  current-import-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR 62 product head
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture exact changed import check
        shell: bash
        env:
          SEC_CHANGED_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
        run: |
          set +e
          changed_ts="$(git diff --name-only "$SEC_CHANGED_BASE"...HEAD -- '*.ts' '*.tsx')"
          printf '%s\n' "$changed_ts" > changed-ts.txt
          if [ -n "$changed_ts" ]; then
            mapfile -t changed_ts_files <<< "$changed_ts"
            bun scripts/check-imports.ts "${changed_ts_files[@]}" > import-check.log 2>&1
            status=$?
          else
            printf 'No changed TypeScript files\n' > import-check.log
            status=0
          fi
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> import-check.log

      - name: Upload import evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-import-evidence
          path: |
            changed-ts.txt
            import-check.log
          retention-days: 1
