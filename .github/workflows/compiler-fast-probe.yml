name: compiler-fixpoint-risk-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  fixpoint-risk-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_CHANGED_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
      SEC_AFFECTED_TESTS_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
    steps:
      - name: Checkout validated fix head
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture exact PR risk gate
        shell: bash
        run: |
          set +e
          bun scripts/ci-pr-risk.ts > pr-risk.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> pr-risk.log

      - name: Upload exact risk evidence
        uses: actions/upload-artifact@v4
        with:
          name: fixpoint-risk-evidence
          path: pr-risk.log
          retention-days: 1
