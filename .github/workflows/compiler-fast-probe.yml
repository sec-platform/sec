name: compiler-import-evidence-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  changed-import-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture PR changed-only import check
        shell: bash
        env:
          SEC_IMPORTS_CHANGED_ONLY: '1'
          SEC_CHANGED_BASE: 7829670781e2f8b5d6485656bc78352192372863
        run: |
          set +e
          bun run imports:check > changed-imports.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> changed-imports.log

      - name: Upload import evidence
        uses: actions/upload-artifact@v4
        with:
          name: changed-import-evidence
          path: changed-imports.log
          retention-days: 1
