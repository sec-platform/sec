name: compiler-project-runtime-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  project-runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout integration head
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture project runtime test
        id: test
        shell: bash
        run: |
          status=0
          bun test tests/integration/project-runtime.test.ts > project-runtime-test.log 2>&1 || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 project-runtime-test.log

      - name: Upload project runtime test log
        uses: actions/upload-artifact@v4
        with:
          name: project-runtime-test-log-current
          path: project-runtime-test.log
          retention-days: 1

      - name: Preserve test result
        if: steps.test.outputs.status != '0'
        run: exit ${{ steps.test.outputs.status }}
