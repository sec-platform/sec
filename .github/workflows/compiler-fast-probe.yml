name: compiler-fixpoint-idempotency-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  fixpoint-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validated fix branch
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check imports and types
        run: |
          bun run imports:check
          bun run typecheck

      - name: Run deterministic regression contracts
        run: >-
          bun ./platform/dev-runner.ts test:fast
          tests/unit/install-strategy-scheduling.test.ts
          tests/integration/provenance-projection-hash.test.ts
          --timeout 120000

      - name: Run pipeline end-to-end regression
        run: bun run test:slow -- --suite e2e-pipeline-end-to-end

      - name: Verify complete reference surface reaches a one-pass fixed point
        shell: bash
        run: |
          snapshot_reference() {
            local prefix="$1"
            git ls-files -z -- source project control \
              | sort -z \
              | xargs -0 sha256sum > "/tmp/${prefix}.tracked.sha"
            git ls-files --others --exclude-standard -- source project control \
              | sort > "/tmp/${prefix}.untracked"
          }

          bun run reference:refresh
          snapshot_reference pass1
          bun run reference:refresh
          snapshot_reference pass2

          diff -u /tmp/pass1.tracked.sha /tmp/pass2.tracked.sha
          diff -u /tmp/pass1.untracked /tmp/pass2.untracked

      - name: Verify official reference check after fixed point
        run: bun run sec -- reference check --json --compact
