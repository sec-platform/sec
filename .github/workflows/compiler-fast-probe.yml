name: compiler-reference-surface-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  capture-reference-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reference output branch
        uses: actions/checkout@v5
        with:
          ref: validation/reference-refresh-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh reference workspace
        run: bun run reference:refresh

      - name: Capture reference surface
        shell: bash
        run: |
          git status --short --untracked-files=all --ignored source project control > reference-status.txt
          git ls-files --others --exclude-standard -- source project control > reference-untracked.txt
          git ls-files --others --ignored --exclude-standard -- source project control > reference-ignored.txt
          cat reference-status.txt

      - name: Upload reference surface evidence
        uses: actions/upload-artifact@v4
        with:
          name: reference-surface-evidence
          path: |
            reference-status.txt
            reference-untracked.txt
            reference-ignored.txt
          retention-days: 1
