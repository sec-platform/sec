name: compiler-current-native-import-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  current-native-import-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_CHANGED_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
      SEC_AFFECTED_TESTS_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
    steps:
      - name: Checkout current PR 62 product head
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture native changed import check
        shell: bash
        env:
          SEC_IMPORTS_CHANGED_ONLY: '1'
        run: |
          set +e
          bun run imports:check > native-import-check.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> native-import-check.log

      - name: Upload native import evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-native-import-evidence
          path: native-import-check.log
          retention-days: 1
