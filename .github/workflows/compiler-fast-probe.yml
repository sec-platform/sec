name: compiler-final-release-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  final-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v5
        with:
          ref: validation/case-51
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check imports
        run: bun run imports:check

      - name: Typecheck
        run: bun run typecheck

      - name: Documentation doctor
        run: bun run docs:doctor

      - name: Full fast test inventory
        run: bun run test:fast

      - name: Test budget contract
        run: bun run sec -- test budget --json --compact

      - name: Contract freeze
        run: bun run test:contract-freeze

  final-slow-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.slow_suites.outputs.suites }}
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v5
        with:
          ref: validation/case-51
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Emit slow suite matrix
        id: slow_suites
        run: |
          suites=$(bun -e "import { slowTestSuiteIds } from './platform/shared/test-budget-contract.ts'; console.log(JSON.stringify(slowTestSuiteIds()))")
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  final-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - final-preflight
      - final-slow-matrix
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.final-slow-matrix.outputs.suites) }}
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v5
        with:
          ref: validation/case-51
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Slow e2e suite
        run: bun run test:slow -- --suite ${{ matrix.suite }}

  final-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: final-preflight
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v5
        with:
          ref: validation/case-51
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Benchmark task suite contract
        run: bun run sec -- benchmark suite --json --compact

      - name: Warm runtime dependency cache
        run: bun run sec -- deps warmup

      - name: Resolve graph
        run: bun run sec -- resolve

      - name: Compose project
        run: bun run sec -- compose

      - name: Adapt project
        run: bun run sec -- adapt

      - name: Verify all lanes
        run: bun run sec -- verify --lane all --json --compact

      - name: Lock project
        run: bun run sec -- lock

      - name: Explain project
        run: bun run sec -- explain

      - name: Reference drift check
        run: bun run sec -- reference check --json --compact

  final-release-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - final-preflight
      - final-slow
      - final-workspace
    steps:
      - name: Final release validation summary
        run: echo "Exact final release validation passed."
