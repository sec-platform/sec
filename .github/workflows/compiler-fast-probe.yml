name: compiler-risk-namespace-exact

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  risk-namespace-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v5
        with:
          ref: validation/risk-namespace-exact
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run exact PR risk gate
        shell: bash
        env:
          SEC_CHANGED_BASE: 7829670781e2f8b5d6485656bc78352192372863
          SEC_AFFECTED_TESTS_BASE: 7829670781e2f8b5d6485656bc78352192372863
        run: |
          set +e
          bun scripts/ci-pr-risk.ts > risk-namespace-exact.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> risk-namespace-exact.log
          cat risk-namespace-exact.log

      - name: Upload exact risk evidence
        uses: actions/upload-artifact@v4
        with:
          name: risk-namespace-exact
          path: risk-namespace-exact.log
          retention-days: 1
