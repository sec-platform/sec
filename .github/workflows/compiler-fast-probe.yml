name: compiler-current-import-organize-diff

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  current-import-organize-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_CHANGED_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
    steps:
      - name: Checkout current PR 62 product head
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture organizer diff
        shell: bash
        env:
          SEC_IMPORTS_CHANGED_ONLY: '1'
        run: |
          bun run imports:organize
          git diff -- platform dev-runner tests > import-organize.diff
          git diff --name-only > import-organize-paths.txt

      - name: Upload organizer diff
        uses: actions/upload-artifact@v4
        with:
          name: current-import-organize-diff
          path: |
            import-organize.diff
            import-organize-paths.txt
          retention-days: 1
