name: compiler-risk-budget-fix-validation

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  risk-budget-fix-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_CHANGED_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
      SEC_AFFECTED_TESTS_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
    steps:
      - name: Checkout budget fix output
        uses: actions/checkout@v5
        with:
          ref: validation/risk-budget-fix-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact resource budget metadata fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform/shared/test-budget-contract.ts')
          text = path.read_text()
          replacements = {
              "slowFileSuite('e2e-conflicts', 'conflicts', 'compiler-conflicts-e2e', 180_000, { parallelSafe: true }),": """slowFileSuite('e2e-conflicts', 'conflicts', 'compiler-conflicts-e2e', 180_000, {
              parallelSafe: true,
              resourceClass: 'runtime-heavy'
            }),""",
              "slowFileSuite('e2e-local-views', 'local-views', 'compiler-local-views-e2e', 120_000, { parallelSafe: true }),": """slowFileSuite('e2e-local-views', 'local-views', 'compiler-local-views-e2e', 120_000, {
              parallelSafe: true,
              resourceClass: 'runtime-heavy'
            }),"""
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cat > tests/contract/slow-suite-resource-budget.test.ts <<'TS'
          import fs from 'node:fs';
          import path from 'node:path';

          import { expect, test } from 'bun:test';

          import { getSlowTestSuitesSync } from '../../platform/shared/test-budget-contract.ts';
          import { compilerRoot } from '../../platform/shared/paths.ts';

          test('locked workspace cold-build suites do not run in the standard parallel PR risk pool', () => {
            const offenders = getSlowTestSuitesSync()
              .filter((suite) => suite.files.some((file) => {
                const source = fs.readFileSync(path.join(compilerRoot, file), 'utf8');
                return source.includes('prepareLockedWorkspace');
              }))
              .filter((suite) => suite.parallelSafe && suite.resourceClass === 'standard')
              .map((suite) => suite.id);

            expect(offenders).toEqual([]);
          });
          TS

      - name: Check imports and types
        run: |
          bun run imports:check
          bun run typecheck

      - name: Run resource budget contract
        run: bun ./platform/dev-runner.ts test:fast tests/contract/slow-suite-resource-budget.test.ts --timeout 120000

      - name: Run contract freeze
        run: bun run test:contract-freeze

      - name: Run exact PR risk gate
        run: bun scripts/ci-pr-risk.ts

      - name: Commit validated budget fix
        shell: bash
        run: |
          git add -- platform/shared/test-budget-contract.ts tests/contract/slow-suite-resource-budget.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): serialize locked-workspace heavy slow suites"
          git push origin HEAD:validation/risk-budget-fix-output
