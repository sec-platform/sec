name: compiler-import-fix-final

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  organize-latest-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Organize full project imports
        env:
          SEC_IMPORTS_CHANGED_ONLY: '0'
        run: bun run imports:organize

      - name: Verify full and PR import contracts
        shell: bash
        run: |
          SEC_IMPORTS_CHANGED_ONLY=0 bun run imports:check
          SEC_IMPORTS_CHANGED_ONLY=1 \
          SEC_CHANGED_BASE=7829670781e2f8b5d6485656bc78352192372863 \
          bun run imports:check

      - name: Commit canonical organizer output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No import changes."
            exit 0
          fi
          git diff --name-only
          git add -- '*.ts' '*.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(imports): apply canonical organizer"
          git push origin HEAD:integration/main-into-semantic
