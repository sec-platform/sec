name: compiler-reference-evidence-current

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  reference-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current integration head
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture canonical reference check
        shell: bash
        run: |
          set +e
          bun run sec -- reference check --json --compact > reference-check.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> reference-check.log

      - name: Upload reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: reference-evidence-current
          path: reference-check.log
          retention-days: 1
