name: compiler-final-slow-shard-1

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  slow-shard-1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v5
        with:
          ref: validation/case-53
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: e2e-artifacts
        run: bun run test:slow -- --suite e2e-artifacts
      - name: e2e-compiler-smoke
        run: bun run test:slow -- --suite e2e-compiler-smoke
      - name: e2e-conflicts
        run: bun run test:slow -- --suite e2e-conflicts
      - name: e2e-dry-run-plan
        run: bun run test:slow -- --suite e2e-dry-run-plan
