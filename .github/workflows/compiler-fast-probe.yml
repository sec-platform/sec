name: compiler-reference-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  reference-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh reference workspace
        run: bun run reference:refresh

      - name: Upload refreshed reference workspace
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-reference-workspace
          path: |
            source
            project
            control
          retention-days: 1
