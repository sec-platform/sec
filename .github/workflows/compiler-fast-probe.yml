name: compiler-affected-tests-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  affected-tests-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SEC_CHANGED_BASE: 7829670781e2f8b5d6485656bc78352192372863
      SEC_AFFECTED_TESTS_BASE: 7829670781e2f8b5d6485656bc78352192372863
    steps:
      - name: Checkout integration head
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture affected fast tests
        id: affected
        shell: bash
        run: |
          status=0
          bun run test:affected > affected-fast-tests.log 2>&1 || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 affected-fast-tests.log

      - name: Upload affected fast test log
        uses: actions/upload-artifact@v4
        with:
          name: affected-fast-tests-current
          path: affected-fast-tests.log
          retention-days: 1

      - name: Preserve affected test result
        if: steps.affected.outputs.status != '0'
        run: exit ${{ steps.affected.outputs.status }}
