name: compiler-import-fix-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  organize-integration-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Organize imports
        run: bun run imports:organize

      - name: Verify import contract
        run: bun run imports:check

      - name: Commit organizer output
        shell: bash
        run: |
          # Re-run against the latest integration head after Upgrade/testkit changes.
          if git diff --quiet; then
            echo "No import changes."
            exit 0
          fi
          git diff --name-only
          git add -- '*.ts' '*.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(imports): apply canonical organizer"
          git push origin HEAD:integration/main-into-semantic
