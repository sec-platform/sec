name: compiler-fixpoint-code-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-validate-fixpoint-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fix output branch
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact fixpoint patches
        shell: bash
        run: |
          cat > /tmp/fixpoint.patch <<'PATCH'
          diff --git a/platform/compiler/compose/install-strategies.ts b/platform/compiler/compose/install-strategies.ts
          index e992d64..0000000 100644
          --- a/platform/compiler/compose/install-strategies.ts
          +++ b/platform/compiler/compose/install-strategies.ts
          @@ -5,7 +5,7 @@ import { defaultLimit } from '../../shared/concurrency.ts';
           import { CompilerError } from '../../shared/errors.ts';
           import { copyRecursive, pathExists, readText, writeText } from '../../shared/fs.ts';
           import type { InstallPlanStep, LockFile } from '../../shared/lock-types.ts';
          -import { resolvePathInside, resolveRegistryRoot } from '../../shared/paths.ts';
          +import { posixPath, resolvePathInside, resolveRegistryRoot } from '../../shared/paths.ts';
           
           export interface InstallContext {
             workspaceRoot: string;
          @@ -72,6 +72,21 @@ export class MergePrismaInstallStrategy implements InstallStrategy {
             }
           }
           
          +function groupInstallStepsByTarget(steps: readonly InstallPlanStep[]): InstallPlanStep[][] {
          +  const groups = new Map<string, InstallPlanStep[]>();
          +  for (const step of steps) {
          +    const target = posixPath(step.to);
          +    const group = groups.get(target);
          +    if (group) {
          +      group.push(step);
          +    } else {
          +      groups.set(target, [step]);
          +    }
          +  }
          +  return [...groups.values()];
          +}
          +
           const BUILTIN_STRATEGIES: InstallStrategy[] = [
             new CopyInstallStrategy(),
             new MergePrismaInstallStrategy()
          @@ -94,9 +109,13 @@ export class InstallStrategyRegistry {
           }
           
           async executeAll(steps: InstallPlanStep[], context: InstallContext): Promise<void> {
          +    const targetGroups = groupInstallStepsByTarget(steps);
             await Promise.all(
          -      steps.map((step) => defaultLimit(() => this.resolve(step).execute(step, context)))
          +      targetGroups.map((group) => defaultLimit(async () => {
          +        for (const step of group) {
          +          await this.resolve(step).execute(step, context);
          +        }
          +      }))
             );
           }
           }
          diff --git a/platform/compiler/emit/write-provenance.ts b/platform/compiler/emit/write-provenance.ts
          index 18b0fec..0000000 100644
          --- a/platform/compiler/emit/write-provenance.ts
          +++ b/platform/compiler/emit/write-provenance.ts
          @@ -8,7 +8,8 @@ import {
             CI_ARTIFACT_FILES,
             CI_ARTIFACT_MANIFEST_PATH,
             CI_ARTIFACT_PATHS,
          -  CI_EXPLAIN_GRAPH_ARTIFACT_PATHS
          +  CI_EXPLAIN_GRAPH_ARTIFACT_PATHS,
          +  CI_PROVENANCE_PROJECTION_ARTIFACT_PATHS
           } from '../../shared/ci-artifact-contract.ts';
           import { uniqueSorted } from '../../shared/collections.ts';
           import { readOptionalJson, writeJson } from '../../shared/fs.ts';
          @@ -18,6 +19,8 @@ import type { ProvenanceArtifact, ProvenanceFile } from '../../shared/provenance-
           import type { VerificationReport } from '../../shared/verification-types.ts';
           import { loadOverrideManifest } from '../parse/load-override-manifest.ts';
           
          +const provenanceProjectionArtifacts = new Set(CI_PROVENANCE_PROJECTION_ARTIFACT_PATHS);
          +
           function buildTaskGeneratorId(taskId: string): string {
             return `fill_slot_${taskId}`;
           }
          @@ -194,6 +197,9 @@ export async function buildProvenance(workspaceRoot: string, lock: LockFile): Pro
           
             const { projectRoot } = getWorkspacePaths(workspaceRoot);
             for (const [artifactPath, artifact] of artifacts.entries()) {
          +    if (provenanceProjectionArtifacts.has(artifactPath)) {
          +      continue;
          +    }
               const absolutePath = artifactPath.startsWith('source/') || artifactPath.startsWith('control/')
                 ? path.join(workspaceRoot, artifactPath)
                 : path.join(projectRoot, artifactPath);
          diff --git a/platform/orchestrator/emit-orchestrator.ts b/platform/orchestrator/emit-orchestrator.ts
          index 7ffe1a4..0000000 100644
          --- a/platform/orchestrator/emit-orchestrator.ts
          +++ b/platform/orchestrator/emit-orchestrator.ts
          @@ -1,10 +1,19 @@
          -import { lockProject, writeCiArtifactManifest, writeExplainGraph, writeLocalViews, writeReviewSummary } from '../compiler/index.ts';
          +import {
          +  lockProject,
          +  writeCiArtifactManifest,
          +  writeExplainGraph,
          +  writeLocalViews,
          +  writeProvenance,
          +  writeReviewSummary
          +} from '../compiler/index.ts';
           import type { AcceptanceCoverageReport } from '../shared/acceptance-types.ts';
          +import { CI_EMIT_ARTIFACT_PATHS } from '../shared/ci-artifact-contract.ts';
           import { CompilerError } from '../shared/errors.ts';
           import type { ExplainGraph } from '../shared/explain-types.ts';
           import { pathExists, readJson } from '../shared/fs.ts';
           import type { LockFile } from '../shared/lock-types.ts';
          -import { assertPassStatus, readLockFile } from '../shared/lock-utils.ts';
          +import { addGeneratedPaths, assertPassStatus, readLockFile, saveLock } from '../shared/lock-utils.ts';
           import { getWorkspacePaths, resolveWorkspaceProvenancePath } from '../shared/paths.ts';
           import { executePipelineStage } from '../shared/pipeline-kernel.ts';
           import type { PipelineExecutionContext } from '../shared/pipeline-types.ts';
          @@ -43,18 +52,24 @@ async function explainWorkspaceCore(
             } = getWorkspacePaths(workspaceRoot);
             const lock = await readLockFile(workspaceRoot);
           
             assertPassStatus(lock, 'lock', 'succeeded', new CompilerError('EXPLAIN-BLOCKED-001', 'lock must succeed before explain'));
           
          -  const provenance = await readJson<ProvenanceFile>(await resolveWorkspaceProvenancePath(workspaceRoot));
          +  addGeneratedPaths(lock, CI_EMIT_ARTIFACT_PATHS);
          +  await saveLock(workspaceRoot, lock);
          +
          +  const provenance = await writeProvenance(workspaceRoot, lock);
             const report = await readJson<VerificationReport>(verificationReportPath);
             const coverage = await readJson<AcceptanceCoverageReport>(acceptanceCoveragePath);
             const graph = await writeExplainGraph(workspaceRoot, lock, provenance);
          -  const refreshedProvenance = await readJson<ProvenanceFile>(await resolveWorkspaceProvenancePath(workspaceRoot));
          -  const reviewSummary = await writeReviewSummary(workspaceRoot, lock, refreshedProvenance, report, coverage);
          +  const graphProvenance = await readJson<ProvenanceFile>(await resolveWorkspaceProvenancePath(workspaceRoot));
          +  const reviewSummary = await writeReviewSummary(workspaceRoot, lock, graphProvenance, report, coverage);
             await writeLocalViews(workspaceRoot);
             const finalLock = await readLockFile(workspaceRoot);
          -  return { lock: finalLock, provenance: refreshedProvenance, report, graph, reviewSummary };
          +  const finalProvenance = await writeProvenance(workspaceRoot, finalLock);
          +  return { lock: finalLock, provenance: finalProvenance, report, graph, reviewSummary };
           }
           
           export async function explainWorkspace(
          diff --git a/tests/unit/install-strategy-scheduling.test.ts b/tests/unit/install-strategy-scheduling.test.ts
          new file mode 100644
          index 0000000..0000000
          --- /dev/null
          +++ b/tests/unit/install-strategy-scheduling.test.ts
          @@ -0,0 +1,62 @@
          +import path from 'node:path';
          +
          +import { expect, test } from 'bun:test';
          +
          +import { defaultInstallRegistry } from '../../platform/compiler/compose/install-strategies.ts';
          +import { parsePrismaSchema } from '../../platform/compiler/compose/merge-prisma-template.ts';
          +import { readText, writeText } from '../../platform/shared/fs.ts';
          +import type { InstallPlanStep, LockFile } from '../../platform/shared/lock-types.ts';
          +import { getWorkspacePaths } from '../../platform/shared/paths.ts';
          +import { withTempWorkspace } from '../testkit/workspace.ts';
          +
          +function mergePrismaStep(stepId: string, from: string, to = 'prisma/schema.prisma'): InstallPlanStep {
          +  return {
          +    stepId,
          +    blockId: `test/${stepId}`,
          +    registrySourceId: 'test-private',
          +    registryKind: 'private',
          +    registryLocation: 'workspace',
          +    registryPath: '.',
          +    sourceRoot: 'registry',
          +    action: 'merge-prisma',
          +    from,
          +    to
          +  };
          +}
          +
          +test('install strategy registry serializes read-modify-write steps sharing a normalized target', async () => {
          +  await withTempWorkspace(async (workspaceRoot) => {
          +    await Promise.all([
          +      writeText(path.join(workspaceRoot, 'registry', 'alpha.prisma'), `model Alpha {
          +  id Int @id
          +}
          +`),
          +      writeText(path.join(workspaceRoot, 'registry', 'beta.prisma'), `model Beta {
          +  id Int @id
          +}
          +`)
          +    ]);
          +
          +    const { projectRoot } = getWorkspacePaths(workspaceRoot);
          +    await defaultInstallRegistry.executeAll([
          +      mergePrismaStep('alpha', 'alpha.prisma'),
          +      mergePrismaStep('beta', 'beta.prisma', 'prisma\\schema.prisma')
          +    ], {
          +      workspaceRoot,
          +      projectRoot,
          +      lock: {} as LockFile
          +    });
          +
          +    const schema = await readText(path.join(projectRoot, 'prisma', 'schema.prisma'));
          +    expect(parsePrismaSchema(schema).blocks
          +      .filter((block) => block.type === 'model')
          +      .map((block) => block.name)).toEqual(['Alpha', 'Beta']);
          +  }, 'engineering-compiler-install-target-scheduling-');
          +});
          diff --git a/tests/integration/provenance-projection-hash.test.ts b/tests/integration/provenance-projection-hash.test.ts
          new file mode 100644
          index 0000000..0000000
          --- /dev/null
          +++ b/tests/integration/provenance-projection-hash.test.ts
          @@ -0,0 +1,55 @@
          +import { expect, test } from 'bun:test';
          +
          +import { buildProvenance } from '../../platform/compiler/emit/write-provenance.ts';
          +import { CI_PROVENANCE_PROJECTION_ARTIFACT_PATHS } from '../../platform/shared/ci-artifact-contract.ts';
          +import { writeText } from '../../platform/shared/fs.ts';
          +import type { LockFile } from '../../platform/shared/lock-types.ts';
          +import { resolveWorkspaceArtifactPath } from '../../platform/shared/paths.ts';
          +import { withTempWorkspace } from '../testkit/workspace.ts';
          +
          +test('provenance records projection outputs without recursively hashing them', async () => {
          +  await withTempWorkspace(async (workspaceRoot) => {
          +    const stablePath = 'generated/stable-output.ts';
          +    const lock: LockFile = {
          +      formatVersion: '1',
          +      app: { name: 'projection-hash-test', stack: 'nextjs-ts-prisma-sqlite', mode: 'single-tenant' },
          +      resolvedBlocks: [],
          +      resolvedCapabilities: [],
          +      installPlan: [],
          +      slotTasks: [],
          +      generatedPaths: [...CI_PROVENANCE_PROJECTION_ARTIFACT_PATHS, stablePath],
          +      acceptancePlan: [],
          +      passStatus: {
          +        parse: 'succeeded',
          +        align: 'succeeded',
          +        resolve: 'succeeded',
          +        compose: 'succeeded',
          +        adapt: 'succeeded',
          +        verify: 'succeeded',
          +        repair: 'pending',
          +        lock: 'succeeded',
          +        emit: 'running'
          +      }
          +    };
          +
          +    await Promise.all(CI_PROVENANCE_PROJECTION_ARTIFACT_PATHS.map((artifactPath) =>
          +      writeText(resolveWorkspaceArtifactPath(workspaceRoot, artifactPath), `projection:${artifactPath}\n`)
          +    ));
          +    await writeText(resolveWorkspaceArtifactPath(workspaceRoot, stablePath), 'stable\n');
          +
          +    const provenance = await buildProvenance(workspaceRoot, lock);
          +    for (const artifactPath of CI_PROVENANCE_PROJECTION_ARTIFACT_PATHS) {
          +      const artifact = provenance.artifacts.find((entry) => entry.path === artifactPath);
          +      expect(artifact).toBeDefined();
          +      expect(artifact).not.toHaveProperty('hash');
          +    }
          +    expect(provenance.artifacts.find((entry) => entry.path === stablePath)?.hash).toMatch(/^[a-f0-9]{64}$/u);
          +  }, 'engineering-compiler-provenance-projection-hash-');
          +});
          PATCH
          git apply --check /tmp/fixpoint.patch
          git apply /tmp/fixpoint.patch

      - name: Organize and verify imports
        run: |
          bun run imports:organize
          bun run imports:check

      - name: Typecheck
        run: bun run typecheck

      - name: Run targeted contracts
        run: >-
          bun ./platform/dev-runner.ts test:fast
          tests/unit/install-strategy-scheduling.test.ts
          tests/integration/provenance-projection-hash.test.ts
          --timeout 120000

      - name: Run pipeline end-to-end regression
        run: bun run test:slow -- --suite e2e-pipeline-end-to-end

      - name: Verify reference refresh is single-pass idempotent
        shell: bash
        run: |
          tracked=(
            control/provenance/provenance.json
            control/graph/explain-graph.json
            control/workbench/views/graph-view.html
            project/prisma/schema.prisma
          )
          bun run reference:refresh
          sha256sum "${tracked[@]}" > /tmp/reference-pass-1.sha
          bun run reference:refresh
          sha256sum "${tracked[@]}" > /tmp/reference-pass-2.sha
          diff -u /tmp/reference-pass-1.sha /tmp/reference-pass-2.sha

      - name: Commit validated product fixes
        shell: bash
        run: |
          git add -- \
            platform/compiler/compose/install-strategies.ts \
            platform/compiler/emit/write-provenance.ts \
            platform/orchestrator/emit-orchestrator.ts \
            tests/unit/install-strategy-scheduling.test.ts \
            tests/integration/provenance-projection-hash.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(pipeline): make emit provenance and install writes deterministic"
          git push origin HEAD:validation/fixpoint-code-output
