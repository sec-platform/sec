name: compiler-version-overlay-pipeline-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  version-overlay-pipeline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout unchanged product head
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply version overlay root semantics in runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform/compiler/parse/load-manifest.ts')
          text = path.read_text()
          old = """function mergeVersionedManifest(rootManifest: BlockManifest | null, versionedManifest: BlockManifest): BlockManifest {
            return rootManifest ? { ...rootManifest, ...versionedManifest } : versionedManifest;
          }"""
          new = """const VERSION_MANIFEST_OVERLAY_FIELDS = new Set<keyof BlockManifest>(['version', 'upgrade']);

          function assertVersionManifestOverlay(rootManifest: BlockManifest | null, versionedManifest: BlockManifest): void {
            if (!rootManifest) return;
            const unsupportedFields = Object.keys(versionedManifest)
              .filter((field) => !VERSION_MANIFEST_OVERLAY_FIELDS.has(field as keyof BlockManifest))
              .sort();
            if (unsupportedFields.length > 0) {
              throw new CompilerError(
                'MANIFEST-SCHEMA-001',
                `Version manifest overlays may only declare version and upgrade; unsupported fields: ${unsupportedFields.join(', ')}`
              );
            }
          }

          function mergeVersionedManifest(rootManifest: BlockManifest | null, versionedManifest: BlockManifest): BlockManifest {
            assertVersionManifestOverlay(rootManifest, versionedManifest);
            return rootManifest ? { ...rootManifest, ...versionedManifest } : versionedManifest;
          }"""
          if text.count(old) != 1:
              raise SystemExit('merge function target mismatch')
          text = text.replace(old, new, 1)
          merge_line = "const manifest = mergeVersionedManifest(await tryReadManifest(rootPath), versionedManifest);"
          if text.count(merge_line) != 1:
              raise SystemExit('version merge target mismatch')
          text = text.replace(merge_line, """const rootManifest = await tryReadManifest(rootPath);
                const manifest = mergeVersionedManifest(rootManifest, versionedManifest);""", 1)
          marker_index = text.index('const manifest = mergeVersionedManifest(rootManifest, versionedManifest);')
          return_line = 'return manifestEntryFromPath(registrySource, manifest, manifestPath);'
          return_index = text.index(return_line, marker_index)
          replacement = """const entry = manifestEntryFromPath(registrySource, manifest, manifestPath);
                  if (rootManifest) entry.manifestRoot = path.dirname(rootPath);
                  return entry;"""
          text = text[:return_index] + replacement + text[return_index + len(return_line):]
          path.write_text(text)
          PY

      - name: Capture pipeline slow suite
        shell: bash
        run: |
          set +e
          bun run test:slow -- --suite e2e-pipeline > e2e-pipeline-after-overlay-root.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> e2e-pipeline-after-overlay-root.log

      - name: Upload pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: version-overlay-pipeline-evidence
          path: e2e-pipeline-after-overlay-root.log
          retention-days: 1
