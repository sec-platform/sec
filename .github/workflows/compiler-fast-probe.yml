name: compiler-doc-authority-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  docs-authority-output:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout docs output branch
        uses: actions/checkout@v5
        with:
          ref: validation/docs-authority-output
          fetch-depth: 0

      - name: Apply authoritative semantic component names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/03-MVP实施计划与路线图.md')
          text = roadmap.read_text(encoding='utf-8')
          text = text.replace('last-reviewed: 2026-07-06', 'last-reviewed: 2026-07-07')
          old = '''- Semantic Contract parser / normalizer prototype。\n- Engineering IR deterministic builder / index prototype。\n- Architecture / Scenario / State projector prototype。'''
          new = '''- Semantic Contract parser / normalizer prototype。\n- **Ticket Semantic Contract**：当前首个真实业务 Semantic Contract 母例，authoritative contract 位于 `platform/registry/official/ticket.basic/contracts/ticket.yaml`。\n- **Engineering IR Kernel**：`platform/compiler/ir/**` 下的 deterministic builder、index 与 identity boundary。\n- **Fact Provenance**：保存 Fact assertion 的 authority、confidence、provenance 与 evidence；与生成物来源的 Artifact Provenance 分工，不互相替代。\n- Architecture / Scenario / State projector prototype。'''
          if old not in text:
              raise SystemExit('roadmap semantic component anchor not found')
          roadmap.write_text(text.replace(old, new), encoding='utf-8')

          spec = Path('docs/05-编译器核心实现规格.md')
          text = spec.read_text(encoding='utf-8')
          text = text.replace('last-reviewed: 2026-07-05', 'last-reviewed: 2026-07-07')
          anchor = '### IR 模块职责\n\n'
          insertion = '''### IR 模块职责\n\n`platform/compiler/ir/` 是 **Engineering IR Kernel** 的实现 ownership boundary；builder、index 与 identity invariant 在此收敛。外部编译模块仍通过 `platform/compiler/index.ts` facade 使用公开能力，不穿透内部文件。\n\n'''
          if anchor not in text:
              raise SystemExit('IR responsibility anchor not found')
          spec.write_text(text.replace(anchor, insertion, 1), encoding='utf-8')
          PY

      - name: Commit docs authority repair
        shell: bash
        run: |
          git add -- docs/03-MVP实施计划与路线图.md docs/05-编译器核心实现规格.md
          git diff --cached --check
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "docs(semantic): register canonical component ownership"
          git push origin HEAD:refs/heads/validation/docs-authority-output
