name: compiler-affected-log-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  affected-log-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v5
        with:
          ref: validation/affected-log-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture affected test output
        shell: bash
        env:
          SEC_CHANGED_BASE: 7829670781e2f8b5d6485656bc78352192372863
          SEC_AFFECTED_TESTS_BASE: 7829670781e2f8b5d6485656bc78352192372863
        run: |
          mkdir -p report
          set +e
          bun run test:affected > report/affected-fast.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> report/affected-fast.log

      - name: Commit affected test log
        shell: bash
        run: |
          git add report/affected-fast.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(diagnostics): capture affected fast log"
          git push origin HEAD:validation/affected-log-output
