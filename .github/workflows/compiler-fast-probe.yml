name: compiler-final-affected-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  final-affected-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact final integration head
        uses: actions/checkout@v5
        with:
          ref: validation/final-affected-evidence
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture exact affected fast tests
        shell: bash
        env:
          SEC_CHANGED_BASE: 7829670781e2f8b5d6485656bc78352192372863
          SEC_AFFECTED_TESTS_BASE: 7829670781e2f8b5d6485656bc78352192372863
        run: |
          set +e
          bun run test:affected > final-affected.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> final-affected.log

      - name: Upload exact affected evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-affected-evidence
          path: final-affected.log
          retention-days: 1
