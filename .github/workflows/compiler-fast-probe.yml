name: compiler-fast-probe

on:
  pull_request:
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe semantic resolve plan
        run: bun -e "import { initWorkspace, addBlock, resolveWorkspace } from './platform/orchestrator.ts'; import { mkdtemp } from 'node:fs/promises'; import { tmpdir } from 'node:os'; import path from 'node:path'; const root = await mkdtemp(path.join(tmpdir(), 'sec-probe-resolve-')); await initWorkspace(root, { reset: true }); await addBlock(root, 'ticket/basic'); const { lock } = await resolveWorkspace(root); if ((lock.semanticLoweringTasks ?? []).length !== 1) throw new Error('expected one semantic lowering task');"

      - name: Probe semantic compose
        run: bun -e "import { initWorkspace, addBlock, resolveWorkspace, composeWorkspace } from './platform/orchestrator.ts'; import { mkdtemp } from 'node:fs/promises'; import { tmpdir } from 'node:os'; import path from 'node:path'; const root = await mkdtemp(path.join(tmpdir(), 'sec-probe-compose-')); await initWorkspace(root, { reset: true }); await addBlock(root, 'ticket/basic'); await resolveWorkspace(root); const { lock } = await composeWorkspace(root); if (lock.semanticLoweringTasks?.[0]?.status !== 'generated') throw new Error('semantic lowering task not generated'); if (!lock.generatedPaths.includes('src/installed/ticket/ticket-semantic-contract.ts')) throw new Error('semantic runtime contract missing from generatedPaths');"

      - name: Probe semantic runtime output
        run: bun -e "import { initWorkspace, addBlock, resolveWorkspace, composeWorkspace } from './platform/orchestrator.ts'; import { getWorkspacePaths } from './platform/shared/paths.ts'; import { readFile, mkdtemp } from 'node:fs/promises'; import { tmpdir } from 'node:os'; import path from 'node:path'; const root = await mkdtemp(path.join(tmpdir(), 'sec-probe-runtime-')); await initWorkspace(root, { reset: true }); await addBlock(root, 'ticket/basic'); await resolveWorkspace(root); await composeWorkspace(root); const { projectRoot } = getWorkspacePaths(root); const content = await readFile(path.join(projectRoot, 'src/installed/ticket/ticket-semantic-contract.ts'), 'utf8'); for (const expected of ['export const TICKET_STATUS_VALUES', 'export const TICKET_STATUS_TRANSITIONS', 'export const NEXT_TICKET_STATUS', 'satisfies Record<TicketStatus, TicketStatus>', '\"closed\": \"open\"', '\"in_progress\": \"closed\"', '\"open\": \"in_progress\"']) { if (!content.includes(expected)) throw new Error(`missing runtime output: ${expected}`); }"

      - name: Probe ticket status form usage
        run: bun -e "import { initWorkspace, addBlock, resolveWorkspace, composeWorkspace } from './platform/orchestrator.ts'; import { getWorkspacePaths } from './platform/shared/paths.ts'; import { readFile, mkdtemp } from 'node:fs/promises'; import { tmpdir } from 'node:os'; import path from 'node:path'; const root = await mkdtemp(path.join(tmpdir(), 'sec-probe-form-')); await initWorkspace(root, { reset: true }); await addBlock(root, 'ticket/basic'); await resolveWorkspace(root); await composeWorkspace(root); const { projectRoot } = getWorkspacePaths(root); const content = await readFile(path.join(projectRoot, 'components/ticket-status-form.tsx'), 'utf8'); if (!content.includes('NEXT_TICKET_STATUS[currentStatus]')) throw new Error('form does not use semantic runtime contract'); if (content.includes('const NEXT_STATUS')) throw new Error('form still uses local NEXT_STATUS');"

      - name: Probe semantic provenance
        run: bun -e "import { initWorkspace, addBlock, resolveWorkspace, composeWorkspace } from './platform/orchestrator.ts'; import { buildProvenance } from './platform/compiler/emit/write-provenance.ts'; import { mkdtemp } from 'node:fs/promises'; import { tmpdir } from 'node:os'; import path from 'node:path'; const root = await mkdtemp(path.join(tmpdir(), 'sec-probe-provenance-')); await initWorkspace(root, { reset: true }); await addBlock(root, 'ticket/basic'); await resolveWorkspace(root); const { lock } = await composeWorkspace(root); const provenance = await buildProvenance(root, lock); const artifact = provenance.artifacts.find((entry) => entry.path === 'src/installed/ticket/ticket-semantic-contract.ts'); if (!artifact) throw new Error('missing semantic provenance artifact'); if (artifact.originType !== 'generated') throw new Error('wrong originType'); if (artifact.originId !== 'generator:ticket/basic:ticket-status-runtime-contract') throw new Error('wrong originId'); if (!artifact.hash) throw new Error('missing hash');"
