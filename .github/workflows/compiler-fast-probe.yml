name: compiler-import-final-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  import-final-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/main-into-semantic
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture organizer and checks
        shell: bash
        run: |
          set +e
          : > import-final-evidence.log
          bun run imports:organize >> import-final-evidence.log 2>&1
          printf '\nORGANIZE_STATUS=%s\n' "$?" >> import-final-evidence.log
          printf '\nORGANIZER_DIFF_FILES\n' >> import-final-evidence.log
          git diff --name-only >> import-final-evidence.log 2>&1
          bun run imports:check >> import-final-evidence.log 2>&1
          printf '\nFULL_CHECK_STATUS=%s\n' "$?" >> import-final-evidence.log
          SEC_IMPORTS_CHANGED_ONLY=1 \
          SEC_CHANGED_BASE=7829670781e2f8b5d6485656bc78352192372863 \
          bun run imports:check >> import-final-evidence.log 2>&1
          printf '\nCHANGED_CHECK_STATUS=%s\n' "$?" >> import-final-evidence.log
          printf '\nFINAL_DIFF\n' >> import-final-evidence.log
          git diff >> import-final-evidence.log 2>&1
          cat import-final-evidence.log
          set -e

      - name: Upload import evidence
        uses: actions/upload-artifact@v4
        with:
          name: import-final-evidence
          path: import-final-evidence.log
          retention-days: 1
