name: compiler-risk-budget-fix-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  risk-budget-fix-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_CHANGED_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
      SEC_AFFECTED_TESTS_BASE: 0a3ea2cf8cc118e2d00859cf1adae9cf65f86067
    steps:
      - name: Checkout unchanged product head
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply metadata fix only in diagnostic runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('platform/shared/test-budget-contract.ts')
          text = path.read_text()
          replacements = {
              "slowFileSuite('e2e-conflicts', 'conflicts', 'compiler-conflicts-e2e', 180_000, { parallelSafe: true }),": """slowFileSuite('e2e-conflicts', 'conflicts', 'compiler-conflicts-e2e', 180_000, {
              parallelSafe: true,
              resourceClass: 'runtime-heavy'
            }),""",
              "slowFileSuite('e2e-local-views', 'local-views', 'compiler-local-views-e2e', 120_000, { parallelSafe: true }),": """slowFileSuite('e2e-local-views', 'local-views', 'compiler-local-views-e2e', 120_000, {
              parallelSafe: true,
              resourceClass: 'runtime-heavy'
            }),"""
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'exact metadata target not found once: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Capture PR risk after metadata fix
        shell: bash
        run: |
          set +e
          bun scripts/ci-pr-risk.ts > risk-after-budget-fix.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> risk-after-budget-fix.log

      - name: Upload post-fix risk evidence
        uses: actions/upload-artifact@v4
        with:
          name: risk-after-budget-fix
          path: risk-after-budget-fix.log
          retention-days: 1
