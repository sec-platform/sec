name: compiler-risk-resource-diagnostics

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  risk-resource-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout validated fix head
        uses: actions/checkout@v5
        with:
          ref: validation/fixpoint-code-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run serial cold-namespace controls
        shell: bash
        run: |
          set +e
          /usr/bin/time -v env SEC_TEST_WORKSPACE_NAMESPACE=diag-serial-conflicts bun run test:slow -- --suite e2e-conflicts > serial-conflicts.log 2>&1
          printf 'EXIT_STATUS=%s\n' "$?" >> serial-conflicts.log
          /usr/bin/time -v env SEC_TEST_WORKSPACE_NAMESPACE=diag-serial-local-views bun run test:slow -- --suite e2e-local-views > serial-local-views.log 2>&1
          printf 'EXIT_STATUS=%s\n' "$?" >> serial-local-views.log
          set -e

      - name: Run two-way cold-namespace pressure
        shell: bash
        run: |
          set +e
          (/usr/bin/time -v env SEC_TEST_WORKSPACE_NAMESPACE=diag-pair-conflicts bun run test:slow -- --suite e2e-conflicts > pair-conflicts.log 2>&1; printf 'EXIT_STATUS=%s\n' "$?" >> pair-conflicts.log) &
          p1=$!
          (/usr/bin/time -v env SEC_TEST_WORKSPACE_NAMESPACE=diag-pair-local-views bun run test:slow -- --suite e2e-local-views > pair-local-views.log 2>&1; printf 'EXIT_STATUS=%s\n' "$?" >> pair-local-views.log) &
          p2=$!
          wait "$p1"
          wait "$p2"
          set -e

      - name: Run original four-way first-wave pressure
        shell: bash
        run: |
          set +e
          suites=(e2e-conflicts e2e-dry-run-plan e2e-graph e2e-local-views)
          pids=()
          for suite in "${suites[@]}"; do
            log="wave-${suite}.log"
            ns="diag-wave-${suite}"
            (/usr/bin/time -v env SEC_TEST_WORKSPACE_NAMESPACE="$ns" bun run test:slow -- --suite "$suite" > "$log" 2>&1; printf 'EXIT_STATUS=%s\n' "$?" >> "$log") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          set -e

      - name: Upload resource diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: risk-resource-diagnostics
          path: |
            serial-*.log
            pair-*.log
            wave-*.log
          retention-days: 1
