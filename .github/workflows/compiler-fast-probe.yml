name: compiler-manifest-patch-context-evidence

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  manifest-patch-context-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout unchanged output branch
        uses: actions/checkout@v5
        with:
          ref: validation/manifest-resource-roots-output
          fetch-depth: 0

      - name: Count exact patch targets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = [
              ('types-entry', 'platform/shared/plan-manifest-types.ts', """export interface ManifestEntry {
            manifest: BlockManifest & {
              contracts: ManifestContractReference[];
              generators: ManifestGenerator[];
            };
            manifestPath: string;
            manifestRoot: string;
            registryRoot: string;"""),
              ('load-options', 'platform/compiler/parse/load-manifest.ts', """interface ManifestLoadOptions {
            workspaceRoot?: string;
            version?: string;
            registrySources?: PlanRegistrySource[];
          }

          function registryBlockRoot"""),
              ('entry-builder', 'platform/compiler/parse/load-manifest.ts', """function manifestEntryFromPath(
            registrySource: ResolvedRegistrySource,
            manifest: ManifestEntry['manifest'],
            manifestPath: string
          ): ManifestEntry {
            return {
              manifest,
              manifestPath,
              manifestRoot: path.dirname(manifestPath),
              registryRoot: registrySource.root,"""),
              ('version-branch', 'platform/compiler/parse/load-manifest.ts', """      if (versionedManifest) {
                const manifest = mergeVersionedManifest(await tryReadManifest(rootPath), versionedManifest);
                validateManifest(manifest);
                if (manifest.version === version) {
                  return manifestEntryFromPath(registrySource, manifest, manifestPath);
                }
              }"""),
              ('semantic-root', 'platform/compiler/parse/load-semantic-contract.ts', "const absolutePath = path.join(entry.manifestRoot, reference.path);"),
              ('install-root', 'platform/compiler/resolve/resolve-graph.ts', "sourceRoot: relativePosixPath(block.registryRoot, block.manifestRoot),"),
              ('upgrade-root', 'platform/upgrade/upgrade-workspace.ts', "const targetManifestRoot = path.dirname(targetEntry.manifestPath);"),
              ('conflicts-budget', 'platform/shared/test-budget-contract.ts', "slowFileSuite('e2e-conflicts', 'conflicts', 'compiler-conflicts-e2e', 180_000, { parallelSafe: true }),"),
              ('views-budget', 'platform/shared/test-budget-contract.ts', "slowFileSuite('e2e-local-views', 'local-views', 'compiler-local-views-e2e', 120_000, { parallelSafe: true }),")
          ]
          results = []
          for target_id, file_path, needle in targets:
              text = Path(file_path).read_text()
              results.append({'id': target_id, 'file': file_path, 'count': text.count(needle)})
          Path('patch-context-counts.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          PY

      - name: Upload patch context counts
        uses: actions/upload-artifact@v4
        with:
          name: manifest-patch-context-counts
          path: patch-context-counts.json
          retention-days: 1
