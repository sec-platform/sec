name: compiler-reference-final-refresh

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  refresh-canonical-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reference output branch
        uses: actions/checkout@v5
        with:
          ref: validation/reference-refresh-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh reference workspace
        run: bun run reference:refresh

      - name: Commit canonical reference snapshot
        shell: bash
        run: |
          untracked=$(git ls-files --others --exclude-standard -- source project control)
          if [ -n "$untracked" ]; then
            printf 'Unexpected non-ignored untracked reference surface:\n%s\n' "$untracked"
            exit 1
          fi

          git add -u -- source project control
          staged=$(git diff --cached --name-only)
          printf 'Staged canonical reference surface:\n%s\n' "$staged"
          if git diff --cached --quiet; then
            echo "No reference changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(reference): refresh canonical workspace snapshot"
          git push origin HEAD:validation/reference-refresh-output
