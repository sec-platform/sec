name: compiler-reference-fixpoint-probe

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  capture-reference-fixpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fixpoint output branch
        uses: actions/checkout@v5
        with:
          ref: validation/reference-fixpoint-output
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh canonical reference once
        run: bun run reference:refresh

      - name: Verify exact second-pass surface and commit
        shell: bash
        run: |
          expected=$(printf '%s\n' \
            'control/graph/explain-graph.json' \
            'control/provenance/provenance.json' \
            'control/workbench/views/graph-view.html' | sort)
          actual=$(git diff --name-only -- source project control | sort)
          untracked=$(git ls-files --others --exclude-standard -- source project control)
          if [ -n "$untracked" ]; then
            printf 'Unexpected untracked reference surface:\n%s\n' "$untracked"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            printf 'Unexpected second-pass surface.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          git add -- \
            control/graph/explain-graph.json \
            control/provenance/provenance.json \
            control/workbench/views/graph-view.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(reference): capture second-pass fixpoint drift"
          git push origin HEAD:validation/reference-fixpoint-output
