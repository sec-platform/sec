name: validation publish SEC #327 data ownership candidate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: validation-repository-information-data-ownership-publish
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_BASE: 49fdb7cd3be991742061621e3add982107e50367
  SEC_EXPECTED_TREE: ff489bc199dec86976df0b4c4266f8ada9b4b6ec
  SEC_PATCH_B64_SHA256: d16ffb8690ad82216d492ddf4e9f8129b2414a68bcfe3057252640d394ffc09c
  SEC_PATCH_ZST_SHA256: f774a25ecabf7d65face27609777746a6e09dc0d158995ce0366d69fecee3486
  SEC_PATCH_SHA256: 42befaec10ada62562dd6e6a0ad0cc521322e376fe5138ff6f134e7a84b1fe45
  SEC_MANIFEST_DIGEST: a29647d7e2a8f952b32e500fc1bdc4eb9e1387d5f0dad9f7347cf906f9b2150b
  SEC_WORK_PACKAGE_MANIFEST_PATH: docs/work-packages/repository-information-data-ownership-v1.md
  SEC_VALIDATION_BRANCH: validation/repository-information-data-ownership-publish

jobs:
  verify-and-materialize:
    if: >-
      github.repository == 'sec-platform/sec' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'sec-platform/sec' &&
      github.event.pull_request.head.ref == 'validation/repository-information-data-ownership-publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout immutable validation payload
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: payload
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact trusted main as candidate base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SEC_BASE }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Reconstruct and verify candidate patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SEC_BASE"
          test -z "$(git -C candidate status --porcelain=v1)"

          payload_dir=payload/validation/repository-information-data-ownership
          cat > "$RUNNER_TEMP/sec-327-expected-parts.txt" <<'EOF'
          patch.part00 7000 917d6d6bc5fc803ce1e788676dddda30cd0105e9bf0bc04f2ad6aa92fd6e931d
          patch.part01 7000 b2a029084d03d9dbe49b493c39448a6316ca9c90cee2a52a5c42c366308f24af
          patch.part02 7000 7eaf6543dc7f68cbb061354aad0dafb58ee66c5f9223c902ef4934d111b89f3d
          patch.part03 7000 838f357e6f6c5ad8550f880943e595719731a1d4fff0a424e27d6e055ab33e14
          patch.part04 7000 8857314701a8bc3586a92ba39a98f7f8aea11e39f0d6f4e7af3bada419efe818
          patch.part05 7000 92e2b26afb80a7fcae862ce660f1c22235203353b5dbc7fa3913245f7384ccbb
          patch.part06 1540 dbb793bec84562c430bfc3ae13ae35a876c4db11fe361e600405deb9dfec6ecc
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/sec-327-expected-parts.txt"
          part_failure=0
          while read -r name expected_bytes expected_sha; do
            file="$payload_dir/$name"
            actual_bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            actual_sha="$(sha256sum "$file" | cut -d' ' -f1)"
            printf '%s expectedBytes=%s actualBytes=%s expectedSha=%s actualSha=%s\n' \
              "$name" "$expected_bytes" "$actual_bytes" "$expected_sha" "$actual_sha"
            if [[ "$actual_bytes" != "$expected_bytes" || "$actual_sha" != "$expected_sha" ]]; then
              part_failure=1
            fi
          done < "$RUNNER_TEMP/sec-327-expected-parts.txt"
          test "$part_failure" -eq 0

          out="$RUNNER_TEMP/sec-327-publisher"
          mkdir -p "$out"
          cat "$payload_dir"/patch.part* > "$out/candidate.patch.zst.b64"
          printf '%s  %s\n' "$SEC_PATCH_B64_SHA256" "$out/candidate.patch.zst.b64" | sha256sum -c -
          base64 --decode "$out/candidate.patch.zst.b64" > "$out/candidate.patch.zst"
          printf '%s  %s\n' "$SEC_PATCH_ZST_SHA256" "$out/candidate.patch.zst" | sha256sum -c -
          zstd -q -d "$out/candidate.patch.zst" -o "$out/candidate.patch"
          printf '%s  %s\n' "$SEC_PATCH_SHA256" "$out/candidate.patch" | sha256sum -c -

          git -C candidate am "$out/candidate.patch"
          test "$(git -C candidate rev-parse HEAD^1)" = "$SEC_BASE"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$SEC_EXPECTED_TREE"

          git -C candidate diff --name-status "$SEC_BASE"..HEAD > "$out/changed-files.txt"
          cat > "$out/expected-changed-files.txt" <<'EOF'
          M	docs/work/active-work-package.md
          M	docs/work/rolling-plan.md
          A	docs/work-packages/repository-information-data-ownership-v1.md
          D	docs/work-packages/trusted-verifier-causal-closure-v1.md
          M	scripts/codex/repository-audit.ts
          A	scripts/sec-dev/repository-analysis/repository-information-lifecycle.json
          A	scripts/sec-dev/repository-analysis/repository-information-lifecycle.ts
          M	tests/contract/repository-audit.test.ts
          EOF
          sed -i 's/^          //' "$out/expected-changed-files.txt"
          diff -u "$out/expected-changed-files.txt" "$out/changed-files.txt"

          printf '%s  %s\n' "$SEC_MANIFEST_DIGEST" "candidate/$SEC_WORK_PACKAGE_MANIFEST_PATH" | sha256sum -c -
          git -C candidate diff --check "$SEC_BASE"..HEAD

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install candidate dependencies without lifecycle scripts
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          bun install --frozen-lockfile --ignore-scripts

      - name: Run focused and affected verification
        working-directory: candidate
        shell: bash
        env:
          SEC_CHANGED_BASE: ${{ env.SEC_BASE }}
          SEC_AFFECTED_TESTS_BASE: ${{ env.SEC_BASE }}
          SEC_WORK_PACKAGE_MANIFEST_PATH: ${{ env.SEC_WORK_PACKAGE_MANIFEST_PATH }}
          SEC_REPOSITORY_AUDIT_DEFAULT_REF: ${{ env.SEC_BASE }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          out="$RUNNER_TEMP/sec-327-publisher"
          git update-ref refs/remotes/origin/main "$SEC_BASE"

          bun run imports:check 2>&1 | tee "$out/imports.log"
          bun run docs:doctor 2>&1 | tee "$out/docs-doctor.log"
          bun run typecheck 2>&1 | tee "$out/typecheck.log"
          bun test --timeout 180000 \
            tests/contract/repository-audit.test.ts \
            tests/contract/documentation-authority.test.ts \
            tests/contract/test-impact.test.ts \
            2>&1 | tee "$out/focused-tests.log"
          bun run audit:repository > "$out/repository-audit.json"
          bun run check:affected --plan > "$out/affected-plan.json"
          bun run test:affected 2>&1 | tee "$out/affected-tests.log"

          test "$(git rev-parse HEAD^1)" = "$SEC_BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SEC_EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          {
            printf 'schema=sec-repository-information-data-ownership-publisher-v1\n'
            printf 'base=%s\n' "$SEC_BASE"
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'parent=%s\n' "$(git rev-parse HEAD^1)"
            printf 'manifestDigest=sha256:%s\n' "$SEC_MANIFEST_DIGEST"
            printf 'patchDigest=sha256:%s\n' "$SEC_PATCH_SHA256"
            printf 'bun=%s\n' "$(bun --revision)"
            printf 'git=%s\n' "$(git --version)"
            printf 'os=%s\n' "$(uname -a)"
          } > "$out/environment.txt"
          (cd "$out" && sha256sum * > SHA256SUMS)

      - name: Upload publisher evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-327-data-ownership-publisher-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sec-327-publisher
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact verified candidate to validation ref
        working-directory: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_VALIDATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$SEC_BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SEC_EXPECTED_TREE"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          main_remote="$(git ls-remote "$url" refs/heads/main | cut -f1)"
          validation_remote="$(git ls-remote "$url" "refs/heads/${SEC_VALIDATION_BRANCH}" | cut -f1)"
          test "$main_remote" = "$SEC_BASE"
          test "$validation_remote" = "$SEC_VALIDATION_HEAD"
          git push --force-with-lease="refs/heads/${SEC_VALIDATION_BRANCH}:${SEC_VALIDATION_HEAD}" \
            "$url" "HEAD:refs/heads/${SEC_VALIDATION_BRANCH}"
