name: sec086-slice3-apply

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice3-apply.yml]

permissions: {}

jobs:
  verify-publish:
    if: github.repository == 'sec-platform/sec' && github.ref == 'refs/heads/refactor/sec086-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact slice-two source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 0893762c2e9356ab9eb202d13d9211b76f2a93ee
          test "$(git rev-parse HEAD:tests)" = 601245c8944e6bf702078f0e064b715778b9f32f
          git diff --exit-code

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply exact demo-checklist responsibility patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/sec086-slice3.patch.b64 > "$RUNNER_TEMP/sec086-slice3.patch"
          echo 'a4e61113d7b9c360a247b6ce4c5caa33361e9b4dc00194d281120d1a44507088  '"$RUNNER_TEMP/sec086-slice3.patch" | sha256sum -c -
          git apply --index "$RUNNER_TEMP/sec086-slice3.patch"
          git diff --cached --check
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:src")" = fc5be0b3a3d2144790190fe525ed5c6a88f5738e
          test "$(git rev-parse "$tree:tests")" = 601245c8944e6bf702078f0e064b715778b9f32f

      - name: Verify type docs topology and pure checklist behavior
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun run docs:doctor
          bun run audit:module-topology
          bun -e "import {createDemoChecklistPlan,buildDemoChecklist} from './src/application/demo-checklist.ts'; const p=createDemoChecklistPlan({verifyAll:'va',verify:'v',lock:'l',compose:'c',explain:'e',passedNext:'p',missingNext:'m'}); if(p.items.length<1) process.exit(1); const all=new Set(p.items.map(x=>x.artifactPath)); const ok=buildDemoChecklist(p,all); if(ok.status!=='passed'||ok.missingCount!==0||ok.nextCommand!=='p') process.exit(2); const missing=buildDemoChecklist(p,new Set()); if(missing.status!=='attention'||missing.missingCount!==p.items.length||missing.nextCommand!=='m') process.exit(3);"

      - name: Commit only verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'refactor: split demo checklist ownership' \
            -m 'Move checklist planning and aggregation into application, move text rendering into entry, and leave bootstrap with filesystem observation and concrete command injection.'
          test "$(git rev-parse HEAD:src)" = fc5be0b3a3d2144790190fe525ed5c6a88f5738e
          test "$(git rev-parse HEAD:tests)" = 601245c8944e6bf702078f0e064b715778b9f32f

      - name: Fast-forward isolated refactor branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
