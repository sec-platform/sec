name: diagnostic-full-fast-release

on:
  push:
    branches:
      - diagnostic/full-fast-release
    paths-ignore:
      - diagnostic/full-fast-output.txt

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture repository-native full fast output
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          bun run test:fast > diagnostic/full-fast-output.txt 2>&1
          code=$?
          printf '\n__EXIT_CODE__=%s\n' "$code" >> diagnostic/full-fast-output.txt
          exit 0

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostic/full-fast-output.txt
          git commit -m 'diagnostic(ci): capture full fast output'
          git push origin HEAD:diagnostic/full-fast-release
