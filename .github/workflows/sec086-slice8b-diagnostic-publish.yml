name: sec086-slice8b-diagnostic-publish

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice8b-diagnostic-publish.yml]

permissions: {}

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact postgres presentation baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = c83486da7940bf0f700974954e51d4a8b997fe2d
          test "$(git rev-parse HEAD:tests)" = 42032601492b0733e4ed17ef6114412a437f2ebd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Diagnose and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/sec086-slice8b.patch.xz.b64"
          packed="$RUNNER_TEMP/sec086-slice8b.patch.xz"
          patch="$RUNNER_TEMP/sec086-slice8b.patch"

          git cat-file blob HEAD:.github/sec086-slice8b.patch.xz.b64 > "$encoded"
          echo "encoded_bytes=$(wc -c < "$encoded")"
          echo "encoded_git_blob=$(git hash-object "$encoded")"
          test "$(wc -c < "$encoded")" -eq 1424
          test "$(git hash-object "$encoded")" = 073055ac6f30a42cabd841e7136b06b00ce3a6e5

          python3 - "$encoded" "$packed" <<'PY'
          from pathlib import Path
          import base64, hashlib, sys
          encoded = Path(sys.argv[1]).read_bytes()
          raw = base64.b64decode(encoded, validate=True)
          print('packed_bytes=' + str(len(raw)))
          print('packed_sha256=' + hashlib.sha256(raw).hexdigest())
          assert hashlib.sha256(raw).hexdigest() == '02e73a0514d46605f07bfac408bd474f0a2dd9f7120ff284a91dc05a27f60d4a'
          Path(sys.argv[2]).write_bytes(raw)
          PY

          xz -dc "$packed" > "$patch"
          echo "patch_bytes=$(wc -c < "$patch")"
          echo "patch_sha256=$(sha256sum "$patch" | cut -d' ' -f1)"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = 690d0431cc0361595612b94c5b89d5906bdc2d22904c4e1d923778a97e1751e6

          git apply --check "$patch"
          echo 'git_apply_check=passed'
          git apply --index "$patch"
          echo 'git_apply_index=passed'
          git diff --cached --check

          echo "register_blob=$(git hash-object src/bootstrap/cli/register-inspection-commands.ts)"
          echo "formatters_blob=$(git hash-object src/bootstrap/cli/formatters.ts)"
          test "$(git hash-object src/bootstrap/cli/register-inspection-commands.ts)" = b61af27b151e674087a3ca5aa5ce5731948029f1
          test "$(git hash-object src/bootstrap/cli/formatters.ts)" = 0f43805510443b7d414ed62bc5e01c24878c872f

          tree=$(git write-tree)
          echo "candidate_src=$(git rev-parse "$tree:src")"
          echo "candidate_tests=$(git rev-parse "$tree:tests")"
          test "$(git rev-parse "$tree:src")" = c0cf0a8a1fecb6fcac61e1115832926dcad30c37
          test "$(git rev-parse "$tree:tests")" = 42032601492b0733e4ed17ef6114412a437f2ebd
      - name: Verify postgres inspection slice
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun test --timeout 20000 tests/unit/postgres-contract-presentation.test.ts tests/unit/inspection-query.test.ts tests/unit/named-inspection-query.test.ts
          bun run docs:doctor
          bun run audit:module-topology
      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: route postgres inspection through entry'
          test "$(git rev-parse HEAD:src)" = c0cf0a8a1fecb6fcac61e1115832926dcad30c37
          test "$(git rev-parse HEAD:tests)" = 42032601492b0733e4ed17ef6114412a437f2ebd
      - name: Fast-forward isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
