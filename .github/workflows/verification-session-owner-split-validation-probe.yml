name: verification-session-owner-split-validation-probe

on:
  push:
    branches:
      - refactor/verification-session-owner-split-v3

permissions:
  contents: read

concurrency:
  group: verification-session-owner-split-validation-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Run native typecheck
        run: bun run typecheck

      - name: Run focused VerificationSession regressions
        run: |
          bun test             tests/unit/verification-session-runtime.test.ts             tests/unit/verification-session-hosted-local-ref.test.ts             tests/unit/verification-action-github-provider.test.ts             tests/unit/branch-lifecycle-contract.test.ts             tests/contract/merge-gate.test.ts
