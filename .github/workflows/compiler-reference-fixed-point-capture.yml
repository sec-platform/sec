name: compiler-reference-fixed-point-capture

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'validation/fixpoint-code-output'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh stable reference outputs
        run: bun run reference:refresh

      - name: Upload stable reference outputs
        uses: actions/upload-artifact@v4
        with:
          name: reference-fixed-point
          retention-days: 1
          if-no-files-found: error
          path: |
            control/evidence/review-summary.json
            control/graph/explain-graph.dot
            control/graph/explain-graph.json
            control/graph/explain-graph.mmd
            control/provenance/provenance.json
            control/workbench/views/graph-view.html
            control/workbench/views/overview-view.html
            control/workbench/views/review-view.html
            control/workbench/views/source-view.html
