name: sec086-demo-formatters-cleanup

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-demo-formatters-cleanup.yml]

permissions: {}

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact intermediate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = bafc949c04a6b44af87147a560d7cf221b8e7e6e
          test "$(git rev-parse HEAD:tests)" = 601245c8944e6bf702078f0e064b715778b9f32f
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Move compatibility exports to canonical owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/bootstrap/cli/formatters.ts')
          text=p.read_text()
          old_types="""export type DemoChecklistItem = {
            id: string;
            status: 'passed' | 'missing';
            artifactPath: string;
            command: string;
          };

          export type DemoChecklist = {
            status: 'passed' | 'attention';
            itemCount: number;
            missingCount: number;
            items: DemoChecklistItem[];
            nextCommand: string;
          };
          """
          new_types="""export type { DemoChecklist, DemoChecklistItem } from '../../application/demo-checklist.ts';
          export { formatDemoChecklist } from '../../entry/cli/demo-checklist.ts';
          """
          old_formatter="""export function formatDemoChecklist(checklist: DemoChecklist): string {
            return [
              formatFields([
                `Demo checklist ${checklist.status}`,
                `items=${checklist.itemCount}`,
                `missing=${checklist.missingCount}`
              ]),
              ...checklist.items.map((item) => formatFields([
                `${item.id}: ${item.status}`,
                item.artifactPath,
                `command=${item.command}`
              ])),
              `Next command: ${checklist.nextCommand}`
            ].join('\\n');
          }

          """
          assert text.count(old_types)==1
          assert text.count(old_formatter)==1
          text=text.replace(old_types,new_types).replace(old_formatter,'')
          p.write_text(text)
          PY
          git add src/bootstrap/cli/formatters.ts
          git diff --cached --check
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:src")" = fc5be0b3a3d2144790190fe525ed5c6a88f5738e
          test "$(git rev-parse "$tree:tests")" = 601245c8944e6bf702078f0e064b715778b9f32f
      - name: Verify slice
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun run docs:doctor
          bun run audit:module-topology
          bun -e "import {formatDemoChecklist} from './src/bootstrap/cli/formatters.ts'; const s=formatDemoChecklist({status:'passed',itemCount:1,missingCount:0,items:[{id:'x',artifactPath:'a',command:'c',status:'passed'}],nextCommand:'n'}); if(!s.includes('Demo checklist passed')||!s.includes('Next command: n')) process.exit(1);"
      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: route demo checklist formatting through entry'
          test "$(git rev-parse HEAD:src)" = fc5be0b3a3d2144790190fe525ed5c6a88f5738e
      - name: Fast-forward isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          branch=refs/heads/refactor/sec086-architecture
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
