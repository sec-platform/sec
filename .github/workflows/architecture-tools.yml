name: architecture-tools

on:
  repository_dispatch:
    types:
      - sec-run-architecture-tools-v1

permissions:
  contents: read

jobs:
  architecture-tools:
    runs-on: [self-hosted, Linux, X64, sec-linux-verification-v1, sec-linux-verification-sut-v1]
    timeout-minutes: 15
    steps:
      - name: Resolve exact trusted default head
        id: trusted-default
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.default_branch
            });
            if (context.ref !== `refs/heads/${repository.default_branch}` || context.sha !== branch.commit.sha) {
              throw new Error('Architecture tools require the exact current trusted default head.');
            }
            core.setOutput('sha', branch.commit.sha);

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.trusted-default.outputs.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency graph check
        run: bun run depcruise

      - name: Run duplicate code scan
        run: bun run jscpd

      - name: Run structural discovery scan
        run: bun run discover
