name: architecture-tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-tools:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Run dependency graph check
        run: bunx --bun dependency-cruiser@17.3.10 platform/ --config .dependency-cruiser.json

      - name: Run duplicate code scan
        run: bunx --bun jscpd@4.0.9 platform/ scripts/ -o report/jscpd --reporters html,console --format typescript,javascript --ignore "**/node_modules/**,**/dist/**,**/*.test.ts,**/*.d.ts,**/upgrade/**,.tmp/**" --min-lines 5 --min-tokens 50 --absolute
