name: architecture-tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-tools:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency graph check
        run: bun run depcruise

      - name: Run duplicate code scan
        run: bun run jscpd

      - name: Run structural discovery scan
        run: bun run discover
