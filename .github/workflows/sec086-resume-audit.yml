name: sec086-resume-audit

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-resume-audit.yml]

permissions: {}

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Prepare exact bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name QzCrane
          git config user.email 107861762+QzCrane@users.noreply.github.com
          helper=.github/workflows/sec086-resume-audit.yml
          git rm --cached "$helper"
          test "$(git write-tree)" = 65f0878cda04b0ef0e3c25e3d236d9a0403a427a
          git add "$helper"
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/slice.patch
          git apply --check /tmp/slice.patch
          git apply --index /tmp/slice.patch
          candidate_with_helper=$(git write-tree)
          echo "CANDIDATE_WITH_HELPER=$candidate_with_helper" >> "$GITHUB_ENV"
          git rm --cached "$helper"
          candidate_tree=$(git write-tree)
          test "$candidate_tree" = 9361c7d37b69c9435d2dc394e6cf2937c6f8484d
          verify_commit=$(printf '%s\n' 'refactor(cli): artifact paths exact source verification' | git commit-tree "$candidate_tree" -p 75763009ad42e153bc34aca4f0f5c0eeaea10c64)
          git checkout --detach --force "$verify_commit"
          echo "VERIFY_COMMIT=$verify_commit" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify bounded source and production consumers
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun test --timeout 30000 tests/unit/artifact-upload-paths.test.ts tests/unit/artifact-command-input.test.ts tests/unit/artifact-command-read.test.ts tests/unit/workspace-native-paths.test.ts tests/unit/ci-artifact-manifest-inspect-presentation.test.ts tests/unit/ci-artifact-manifest-inspect-routing.test.ts
          bun run docs:doctor
          bun src/adapters/repository/repository-audit/cli.ts --worktree-module-topology --full > /tmp/topology.json
          bun -e 'const x=JSON.parse(await Bun.file("/tmp/topology.json").text()); if(x.unresolvedFiles.length||x.topology.violations.length) throw new Error(JSON.stringify(x)); console.log(JSON.stringify({files:x.files,references:x.references,unresolved:0,violations:0}))'
          bun run build
          test -z "$(git status --porcelain)"
      - name: Land only the verified source on the authorized branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate=$(printf '%s\n' 'refactor(cli): separate artifact path selection from presentation' | git commit-tree "$CANDIDATE_WITH_HELPER" -p "$GITHUB_SHA")
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote=$(git -c http.https://github.com/.extraheader="$auth" ls-remote origin refs/heads/refactor/sec086-architecture | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="$auth" push origin "$candidate:refs/heads/refactor/sec086-architecture"
          readback=$(git -c http.https://github.com/.extraheader="$auth" ls-remote origin refs/heads/refactor/sec086-architecture | cut -f1)
          test "$readback" = "$candidate"
          printf 'verified_commit=%s\nverified_clean_tree=%s\npublished_commit=%s\n' "$VERIFY_COMMIT" 9361c7d37b69c9435d2dc394e6cf2937c6f8484d "$candidate"
