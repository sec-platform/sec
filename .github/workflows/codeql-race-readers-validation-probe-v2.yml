name: codeql-race-readers-validation-probe-v2

on:
  push:
    branches:
      - fix/codeql-filesystem-race-readers-v2

permissions:
  contents: read

concurrency:
  group: codeql-race-readers-validation-probe-v2-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Run native typecheck
        run: bun run typecheck

      - name: Run focused regression tests
        run: |
          bun test             tests/unit/import-transform-transaction.test.ts             tests/unit/windows-appcontainer-probe-assets.test.ts             tests/unit/physical-no-follow.test.ts
