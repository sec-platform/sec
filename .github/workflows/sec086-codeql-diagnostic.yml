name: SEC-086 CodeQL diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: read

jobs:
  analyze:
    if: github.head_ref == 'diagnostic/sec086-codeql'
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact SEC-086 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2b34cf428b6929e3dc26efcbdd5b2f97394eaf38
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize exact diagnostic CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            name: SEC-086 diagnostic
            threat-models: [ local ]
            paths-ignore:
              - "tests/**"
              - "**/*.test.ts"
              - "**/*.test.js"
              - "**/*.test.mjs"
      - name: Analyze without code-scanning upload
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          upload: false
          output: sec-codeql-sarif
      - name: Emit compact SARIF findings and flows
        shell: bash
        run: |
          set -euo pipefail
          echo "SEC_CODEQL_FINDINGS_BEGIN:${{ matrix.language }}"
          find sec-codeql-sarif -type f -name '*.sarif' -print0 |
            sort -z |
            xargs -0 jq -c '
              .runs[] |
              .results[] |
              {
                ruleId: .ruleId,
                path: (.locations[0].physicalLocation.artifactLocation.uri // null),
                line: (.locations[0].physicalLocation.region.startLine // null),
                message: (.message.text // null),
                flows: [
                  (.codeFlows // [])[]?.threadFlows[]?.locations[]? |
                  {
                    path: (.location.physicalLocation.artifactLocation.uri // null),
                    line: (.location.physicalLocation.region.startLine // null),
                    message: (.location.message.text // null)
                  }
                ]
              }' |
            sort
          echo "SEC_CODEQL_FINDINGS_END:${{ matrix.language }}"
