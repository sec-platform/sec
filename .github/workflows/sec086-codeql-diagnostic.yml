name: SEC-086 CodeQL diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: read

jobs:
  javascript-typescript:
    if: github.head_ref == 'diagnostic/sec086-codeql'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact SEC-086 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2b34cf428b6929e3dc26efcbdd5b2f97394eaf38
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize exact diagnostic CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            name: SEC-086 diagnostic
            threat-models: [ local ]
            paths-ignore:
              - "tests/**"
              - "**/*.test.ts"
              - "**/*.test.js"
              - "**/*.test.mjs"
      - name: Analyze without code-scanning upload
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          upload: false
          output: sec-codeql-sarif
      - name: Emit compact SARIF findings
        shell: bash
        run: |
          set -euo pipefail
          echo 'SEC_CODEQL_FINDINGS_BEGIN'
          find sec-codeql-sarif -type f -name '*.sarif' -print0 |
            sort -z |
            xargs -0 jq -c '
              .runs[] |
              .tool.driver.rules as $rules |
              .results[] |
              {
                ruleId: .ruleId,
                level: (.level // null),
                securitySeverity: (
                  .ruleId as $id |
                  [$rules[] | select(.id == $id) | .properties["security-severity"]] |
                  .[0] // null
                ),
                path: (.locations[0].physicalLocation.artifactLocation.uri // null),
                line: (.locations[0].physicalLocation.region.startLine // null),
                message: (.message.text // null)
              }' |
            sort
          echo 'SEC_CODEQL_FINDINGS_END'
