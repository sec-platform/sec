name: sec086-slice24a-clean-verify

on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-slice24a-clean-verify.yml]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2d3eab96a7c6a67a300d2c0d7f45c25a5a2a6e7e
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact slice
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2d3eab96a7c6a67a300d2c0d7f45c25a5a2a6e7e
          test -z "$(find .github -maxdepth 2 -type f -name 'sec086-slice24a*' -print)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify slice 24a
        shell: bash
        run: |
          set -euo pipefail
          bun node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.json
          bun test --timeout 30000 tests/unit/upgrade-planning-presentation.test.ts tests/unit/upgrade-summary.test.ts
          bun run docs:doctor
      - name: Require clean topology
        shell: bash
        run: |
          set -euo pipefail
          bun src/adapters/repository/repository-audit/cli.ts --worktree-module-topology --full > /tmp/topology.json
          bun -e "const x=JSON.parse(await Bun.file('/tmp/topology.json').text()); if (x.unresolvedFiles.length !== 0) throw new Error('unresolved=' + JSON.stringify(x.unresolvedFiles)); if (x.topology.violations.length !== 0) throw new Error('violations=' + JSON.stringify(x.topology.violations)); console.log(JSON.stringify({files:x.files,references:x.references,unresolved:x.unresolvedFiles.length,violations:x.topology.violations.length}))"
      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          bun run build
