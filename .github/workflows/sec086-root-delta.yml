name: sec086-root-delta
on:
  push:
    branches: [refactor/sec086-architecture]
    paths: [.github/workflows/sec086-root-delta.yml]
permissions: {}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c30bf2fabfc970994e9c5ed622557919f69b5d65
          fetch-depth: 0
          persist-credentials: false
      - name: Construct only the locally verified delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = c30bf2fabfc970994e9c5ed622557919f69b5d65
          gh api repos/sec-platform/sec/git/blobs/b854e757b6cc6ef8c2c34aec6aaa27249c6c5f58 --jq .content | base64 -d > tests/unit/workspace-root-capture.test.ts
          python3 - <<'PY'
          from pathlib import Path
          import json
          edits = {
            'src/bootstrap/engineering/block-orchestrator.ts': ['resolveWorkspace'],
            'src/bootstrap/engineering/emit-orchestrator.ts': ['lockWorkspace', 'explainWorkspace', 'writeWorkspaceArtifacts'],
            'src/bootstrap/engineering/workspace-orchestrator.ts': ['initWorkspace'],
            'src/bootstrap/engineering/compose-orchestrator.ts': ['composeWorkspace'],
            'src/bootstrap/engineering/verify-orchestrator.ts': ['verifyWorkspace'],
            'src/bootstrap/engineering/repair-orchestrator.ts': ['repairWorkspace'],
            'src/bootstrap/upgrade/orchestration.ts': ['upgradeWorkspace'],
            'src/bootstrap/engineering/semantic-orchestrator.ts': ['runWorkspaceSemanticFrontend'],
            'src/adapters/workspace/engineering-input.ts': ['loadWorkspaceEngineeringIRBuildInput'],
            'src/adapters/compilation/emit/ci-artifacts.ts': ['buildCiArtifactManifestWithPlannedPaths', 'writeCiArtifactManifest']
          }
          for filename, names in edits.items():
            p=Path(filename); s=p.read_text()
            if "import path from 'node:path';" not in s: s="import path from 'node:path';\n"+s
            for name in names:
              anchor='async function '+name+'('
              assert s.count(anchor)==1
              end=s.index('> {\n',s.index(anchor))+4
              s=s[:end]+'  workspaceRoot = path.resolve(workspaceRoot);\n'+s[end:]
            p.write_text(s)
          files=list(edits)+['tests/unit/workspace-root-capture.test.ts']
          Path('/tmp/root-tree.json').write_text(json.dumps({'base_tree':'beacfddd714296f1610b6af619b8faa50016c6b4','tree':[{'path':f,'mode':'100644','type':'blob','content':Path(f).read_text()} for f in files]}))
          PY
          git add src tests/unit/workspace-root-capture.test.ts
          git diff --cached --check
          test "$(git write-tree)" = 67fc7393e67d0bcd168fdf9784f0090c255d9fc9
          tree=$(gh api --method POST repos/sec-platform/sec/git/trees --input /tmp/root-tree.json --jq .sha)
          test "$tree" = 67fc7393e67d0bcd168fdf9784f0090c255d9fc9
          git config user.name QzCrane
          git config user.email 107861762+QzCrane@users.noreply.github.com
          candidate=$(printf 'root binding diagnostic candidate\n' | git commit-tree "$tree" -p HEAD)
          git checkout --detach "$candidate"
          mkdir -p /tmp/root-checks
          printf 'source_tree=%s\n' "$tree" > /tmp/root-checks/source.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Establish owned dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun run deps:ensure 2>&1 | tee /tmp/root-checks/dependencies.log
      - name: Verify root binding regression
        shell: bash
        run: |
          set -euo pipefail
          bun test tests/unit/workspace-root-capture.test.ts tests/unit/add-block-workspace.test.ts 2>&1 | tee /tmp/root-checks/roots.log
      - name: Observe full CI selection on hosted resources
        shell: bash
        run: |
          set -euo pipefail
          free -m | tee /tmp/root-checks/memory-before.txt
          /usr/bin/time -v timeout 210s bun test tests/contract/ci-lanes.test.ts > /tmp/root-checks/ci-lanes.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sec086-root-checks
          path: /tmp/root-checks/
          retention-days: 7
          if-no-files-found: error
