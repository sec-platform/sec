name: sec-merge-gate
run-name: 'integrate compiler session run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}'

on:
  workflow_run:
    workflows:
      - compiler-pr-validation
    types:
      - completed

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_INTEGRATION_DURABLE_DIRECTORY: ${{ github.workspace }}/.tmp/codex
  # Canonical integration wall-clock budget. The outer job aliases the complete
  # pre-merge + preceding serialized push producer + queued explicit producer
  # + terminal poll + closeout window. The join step consumes the same values.
  SEC_INTEGRATION_PRE_MERGE_BUDGET_MINUTES: &sec_integration_pre_merge_budget_minutes 30
  SEC_MAIN_HEALTH_RUNNER_QUEUE_ALLOWANCE_MINUTES: &sec_main_health_runner_queue_allowance_minutes 10
  SEC_MAIN_HEALTH_PRODUCER_TIMEOUT_MINUTES: &sec_main_health_producer_timeout_minutes 30
  SEC_MAIN_HEALTH_JOIN_POLL_INTERVAL_SECONDS: &sec_main_health_join_poll_interval_seconds 10
  SEC_INTEGRATION_CLOSEOUT_BUDGET_MINUTES: &sec_integration_closeout_budget_minutes 15
  SEC_INTEGRATION_TIMEOUT_MINUTES: &sec_integration_timeout_minutes 116

jobs:
  plan:
    if: "${{ github.event.workflow_run.event == 'repository_dispatch' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'verify session PR #') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base-sha: ${{ steps.source.outputs.base-sha }}
      current-main-sha: ${{ steps.source.outputs.current-main-sha }}
      pr-number: ${{ steps.source.outputs.pr-number }}
      session-revision: ${{ steps.source.outputs.session-revision }}
    steps:
      - name: Resolve trusted compiler source and current default base
        id: source
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          script: |
            const run = JSON.parse(process.env.SOURCE_RUN_JSON);
            if (run.name !== 'compiler-pr-validation' || run.event !== 'repository_dispatch' ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                !Number.isSafeInteger(run.id) || !Number.isSafeInteger(run.run_attempt) ||
                typeof run.actor?.login !== 'string' || typeof run.triggering_actor?.login !== 'string') {
              throw new Error('Only one completed successful compiler repository_dispatch run can enter integration.');
            }
            const terminalTitle = /^verify session PR #([1-9][0-9]*) session (sha256:[0-9a-f]{64})$/u.exec(
              run.display_title ?? ''
            );
            if (terminalTitle === null) {
              throw new Error('Only an external sec-verify-session-v2 terminal Session run can enter integration.');
            }
            const sessionBaseSha = run.head_sha;
            if (typeof sessionBaseSha !== 'string' || !/^[0-9a-f]{40}$/u.test(sessionBaseSha)) {
              throw new Error('Compiler Session run has no exact trusted base SHA.');
            }
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const sourceWorkflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id
            });
            const actorPermission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: run.actor.login
            });
            const triggeringPermission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: run.triggering_actor.login
            });
            const trusted = (permission) => permission === 'maintain' || permission === 'admin';
            if (sourceWorkflow.data.path !== '.github/workflows/compiler-pr-validation.yml' ||
                !trusted(actorPermission.data.permission) || !trusted(triggeringPermission.data.permission)) {
              throw new Error('Compiler workflow path or dispatch principal is not trusted.');
            }
            const base = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.data.default_branch
            });
            const currentBase = base.data.commit.sha;
            if (process.env.WORKFLOW_SHA !== sessionBaseSha) {
              throw new Error('Trusted merge workflow revision differs from the original Session base.');
            }
            const baseToCurrentMain = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${sessionBaseSha}...${currentBase}`
            });
            if ((baseToCurrentMain.data.status !== 'identical' && baseToCurrentMain.data.status !== 'ahead') ||
                baseToCurrentMain.data.base_commit.sha !== sessionBaseSha ||
                baseToCurrentMain.data.merge_base_commit.sha !== sessionBaseSha ||
                baseToCurrentMain.data.behind_by !== 0) {
              throw new Error('Original Session base is not reachable from the separately observed live main.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const expectedArtifactName =
              `sec-verification-session-v2-pr-${terminalTitle[1]}-session-${terminalTitle[2].slice(7)}-run-${run.id}-attempt-${run.run_attempt}`;
            const sessionArtifacts = artifacts.filter((artifact) => artifact.name === expectedArtifactName);
            const sessionArtifact = sessionArtifacts[0];
            if (sessionArtifacts.length !== 1 ||
                sessionArtifact.expired !== false || !Number.isSafeInteger(sessionArtifact.id) ||
                !Number.isSafeInteger(sessionArtifact.size_in_bytes) || sessionArtifact.size_in_bytes < 1 ||
                sessionArtifact.workflow_run?.id !== run.id) {
              throw new Error('Compiler run must expose exactly one live provenance-bound terminal Session artifact.');
            }
            core.setOutput('base-sha', sessionBaseSha);
            core.setOutput('current-main-sha', currentBase);
            core.setOutput('pr-number', terminalTitle[1]);
            core.setOutput('session-revision', terminalTitle[2].slice(7));

  integrate:
    needs: plan
    if: "${{ github.event.workflow_run.event == 'repository_dispatch' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'verify session PR #') }}"
    runs-on: ubuntu-latest
    timeout-minutes: *sec_integration_timeout_minutes
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    concurrency:
      group: sec-integration-${{ github.repository_id }}-${{ github.event.repository.default_branch }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout trusted current default base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.plan.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup trusted Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache trusted integration Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install trusted integration dependencies from frozen lock
        run: bun install --frozen-lockfile

      - name: Create exact integration durable directory
        run: |
          set -euo pipefail
          test ! -L "${SEC_INTEGRATION_DURABLE_DIRECTORY}"
          mkdir -p -- "${SEC_INTEGRATION_DURABLE_DIRECTORY}"
          test -d "${SEC_INTEGRATION_DURABLE_DIRECTORY}"
          test ! -L "${SEC_INTEGRATION_DURABLE_DIRECTORY}"

      - name: Resolve exact hosted integration lane
        id: prepare-integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun scripts/codex/verification-session.ts prepare-integration-hosted
          --repository "${{ github.repository }}"
          --output "${SEC_INTEGRATION_DURABLE_DIRECTORY}/integration-projection.json"
          --json

      - name: Validate exact hosted integration lane projection
        env:
          INTEGRATION_LANE: ${{ steps.prepare-integration.outputs.integration-lane }}
          ROUTE_FILE: ${{ env.SEC_INTEGRATION_DURABLE_DIRECTORY }}/integration-projection.json
        run: >-
          bun -e "const route = await Bun.file(process.env.ROUTE_FILE).json();
          const lanes = new Set(['open-first-effect', 'merged-recovery', 'blocked']);
          if (route.schema !== 'sec-verification-session-hosted-integration-route-v1'
          || route.lane !== process.env.INTEGRATION_LANE || !lanes.has(route.lane))
          throw new Error('Hosted integration lane projection is not canonical.');"

      - name: Reject blocked hosted integration lane
        if: ${{ steps.prepare-integration.outputs.integration-lane == 'blocked' }}
        run: |
          echo 'Hosted integration is blocked; no integration or closeout effect was attempted.' >&2
          exit 1

      - name: Upload exact branch closeout recovery artifact
        id: upload-branch-closeout-recovery
        if: ${{ steps.prepare-integration.outputs.integration-lane == 'open-first-effect' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-branch-closeout-recovery-v1-pr-${{ needs.plan.outputs.pr-number }}-session-${{ needs.plan.outputs.session-revision }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/codex/branch-closeout-recovery.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Read back exact branch closeout recovery artifact
        if: ${{ steps.prepare-integration.outputs.integration-lane == 'open-first-effect' }}
        env:
          ARTIFACT_ID: ${{ steps.upload-branch-closeout-recovery.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: sec-branch-closeout-recovery-v1-pr-${{ needs.plan.outputs.pr-number }}-session-${{ needs.plan.outputs.session-revision }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1 ||
                !Number.isSafeInteger(expectedRunAttempt) || expectedRunAttempt < 1) {
              throw new Error('Recovery artifact output identity is invalid.');
            }
            const artifact = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId
            });
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            if (artifact.data.id !== artifactId || artifact.data.name !== process.env.EXPECTED_ARTIFACT_NAME ||
                artifact.data.expired !== false || !Number.isSafeInteger(artifact.data.size_in_bytes) ||
                artifact.data.size_in_bytes < 1 || artifact.data.workflow_run?.id !== context.runId ||
                run.data.id !== context.runId || run.data.run_attempt !== expectedRunAttempt) {
              throw new Error('Recovery artifact exact API readback differs from this integration invocation.');
            }

      - name: Integrate exact hosted Session and publish live readback status
        id: integrate-hosted
        if: ${{ steps.prepare-integration.outputs.integration-lane == 'open-first-effect' || steps.prepare-integration.outputs.integration-lane == 'merged-recovery' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun scripts/codex/verification-session.ts integrate-hosted
          --repository "${{ github.repository }}"
          --output "${SEC_INTEGRATION_DURABLE_DIRECTORY}/integration-projection.json"
          --json

      - name: Dispatch and join exact post-merge MainHealth
        id: post-merge-main-health
        if: ${{ steps.prepare-integration.outputs.integration-lane == 'open-first-effect' || steps.prepare-integration.outputs.integration-lane == 'merged-recovery' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr-number }}
          PRE_MERGE_MAIN_SHA: ${{ needs.plan.outputs.base-sha }}
          PLANNED_CURRENT_MAIN_SHA: ${{ needs.plan.outputs.current-main-sha }}
          MAIN_HEALTH_RUNNER_QUEUE_ALLOWANCE_MINUTES: *sec_main_health_runner_queue_allowance_minutes
          MAIN_HEALTH_PRODUCER_TIMEOUT_MINUTES: *sec_main_health_producer_timeout_minutes
          MAIN_HEALTH_JOIN_POLL_INTERVAL_SECONDS: *sec_main_health_join_poll_interval_seconds
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const sha = (value, label) => {
              if (typeof value !== 'string' || !/^[0-9a-f]{40}$/u.test(value)) {
                throw new Error(`${label} is not one lowercase Git SHA.`);
              }
              return value;
            };
            const positiveIntegerEnvironment = (name) => {
              const value = Number(process.env[name]);
              if (!Number.isSafeInteger(value) || value < 1) {
                throw new Error(`${name} is not one positive integer budget.`);
              }
              return value;
            };
            const prNumber = Number(process.env.PR_NUMBER);
            const preMergeMainSha = sha(process.env.PRE_MERGE_MAIN_SHA, 'pre-merge main SHA');
            const plannedCurrentMainSha = sha(
              process.env.PLANNED_CURRENT_MAIN_SHA,
              'planned current main SHA'
            );
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              throw new Error('Integration PR number is invalid.');
            }
            const workspace = process.env.GITHUB_WORKSPACE;
            if (typeof workspace !== 'string' || workspace.length === 0) {
              throw new Error('GitHub workspace is unavailable for integration readback.');
            }
            const integration = JSON.parse(fs.readFileSync(
              path.join(workspace, '.tmp/codex/integration-projection.json'), 'utf8'
            ));
            if (integration.schema !== 'sec-verification-session-integration-projection-v1' ||
                integration.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                integration.prNumber !== prNumber ||
                !/^sha256:[0-9a-f]{64}$/u.test(integration.sessionRevision ?? '') ||
                !/^sha256:[0-9a-f]{64}$/u.test(integration.authorizationPublicationId ?? '') ||
                typeof integration.authorizationId !== 'string' || integration.authorizationId.length === 0 ||
                !Number.isSafeInteger(integration.authorizationCommentId) ||
                integration.authorizationCommentId < 1 ||
                (integration.lane !== 'open-first-effect' && integration.lane !== 'merged-recovery')) {
              throw new Error('Integration projection is not one exact successful effect lane readback.');
            }

            const [repository, pull] = await Promise.all([
              github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo }),
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              })
            ]);
            if (repository.data.default_branch !== 'main' || pull.data.base.ref !== 'main' ||
                pull.data.merged !== true || pull.data.state !== 'closed' ||
                pull.data.merge_commit_sha === null) {
              throw new Error('Post-integration PR is not one merged change on canonical main.');
            }
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.data.default_branch
            });
            const mainSha = sha(main.data.commit.sha, 'live main SHA');
            const mergeCommitSha = sha(pull.data.merge_commit_sha, 'merge commit SHA');
            const mergeCommit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: mergeCommitSha
            });
            if (mergeCommit.data.sha !== mergeCommitSha) {
              throw new Error('The PR merge commit readback is not exact.');
            }
            if (integration.lane === 'open-first-effect') {
              if (plannedCurrentMainSha !== preMergeMainSha || mergeCommitSha !== mainSha ||
                  mainSha === preMergeMainSha ||
                  mergeCommit.data.parents.length !== 1 ||
                  mergeCommit.data.parents[0]?.sha !== preMergeMainSha) {
                throw new Error('First-effect integration did not advance main exactly once from the planned base.');
              }
            } else {
              if (mainSha !== plannedCurrentMainSha) {
                throw new Error('Main advanced after the merged-recovery lane was planned.');
              }
              const relation = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${mergeCommitSha}...${mainSha}`
              });
              if ((relation.data.status !== 'identical' && relation.data.status !== 'ahead') ||
                  relation.data.base_commit.sha !== mergeCommitSha ||
                  relation.data.merge_base_commit.sha !== mergeCommitSha ||
                  relation.data.behind_by !== 0) {
                throw new Error('Recovered PR merge commit is not an ancestor of the planned live main.');
              }
            }
            const exactMarker = (name) => {
              const prefix = `${name}: `;
              const matches = mergeCommit.data.commit.message.split(/\r?\n/u)
                .filter((line) => line.startsWith(prefix));
              if (matches.length !== 1 || matches[0].slice(prefix.length).length === 0) {
                throw new Error(`Integrated merge commit must contain exactly one ${name} marker.`);
              }
              return matches[0].slice(prefix.length);
            };
            if (exactMarker('Verification-Session') !== integration.sessionRevision ||
                exactMarker('Integration-Authorization') !== integration.authorizationId ||
                exactMarker('Integration-Authorization-Publication') !==
                  integration.authorizationPublicationId ||
                exactMarker('Integration-Authorization-Comment') !==
                  String(integration.authorizationCommentId)) {
              throw new Error('Integrated merge commit is not bound to the recovered Session authorization.');
            }
            const issueMarkerNames = [
              'Issue-Disposition-Plan',
              'Issue-Disposition-Mode',
              'Issue-Disposition-Tracking',
              'Issue-Disposition-Prose'
            ];
            const issueMarkerCounts = issueMarkerNames.map((name) => {
              const prefix = `${name}:`;
              return mergeCommit.data.commit.message.split(/\r?\n/u)
                .filter((line) => line.startsWith(prefix))
                .length;
            });
            const issueMarkersAbsent = issueMarkerCounts.every((count) => count === 0);
            const issueMarkersComplete = issueMarkerCounts.every((count) => count === 1);
            if (!integration.issueReconciliation ||
                !Array.isArray(integration.issueReconciliation.results) ||
                (integration.issueReconciliation.status !== 'observed' &&
                  integration.issueReconciliation.status !== 'legacy-no-effect')) {
              throw new Error('Integration projection has no typed Issue reconciliation result.');
            }
            if (integration.issueReconciliation.status === 'legacy-no-effect') {
              if (integration.lane !== 'merged-recovery' || !issueMarkersAbsent) {
                throw new Error('Only one marker-free historical merged recovery may be effect-free.');
              }
            } else {
              if (integration.issueReconciliation.results.some((result) =>
                result.status !== 'no-op')) {
                throw new Error('Issue reconciliation requires maintainer action; provider conditional writes are unsupported.');
              }
              if (!issueMarkersComplete ||
                  !/^sha256:[0-9a-f]{64}$/u.test(exactMarker('Issue-Disposition-Plan')) ||
                  !/^sha256:[0-9a-f]{64}$/u.test(exactMarker('Issue-Disposition-Prose')) ||
                  !/^(?:progress-only|close-tracking-after-readback)$/u.test(
                    exactMarker('Issue-Disposition-Mode')
                  ) ||
                  !/^(?:none|[1-9][0-9]*)$/u.test(exactMarker('Issue-Disposition-Tracking'))) {
                throw new Error('Integrated merge commit has no complete canonical IssueDisposition plan.');
              }
              if (integration.lane === 'open-first-effect' &&
                  (!integration.issueDispositionPlan ||
                    integration.issueDispositionPlan.planDigest !==
                      exactMarker('Issue-Disposition-Plan'))) {
                throw new Error('First-effect integration projection differs from its IssueDisposition marker.');
              }
            }

            const requestOperationPreimage = JSON.stringify({
              schema: 'sec-produce-main-health-request-v1',
              mainSha
            });
            const requestOperationId = `sha256:${crypto.createHash('sha256')
              .update(requestOperationPreimage, 'utf8').digest('hex')}`;
            const expectedTitle = `SEC main health ${mainSha} operation ${requestOperationId}`;
            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'compiler-pr-validation.yml'
            });
            if (workflow.data.path !== '.github/workflows/compiler-pr-validation.yml' ||
                workflow.data.state !== 'active') {
              throw new Error('Canonical MainHealth workflow is not active.');
            }

            const pageSize = 100;
            const maximumPages = 1000;
            const boundedNextPage = ({ label, response, page, expectedTotal, observedCount }) => {
              const totalCount = response.data.total_count;
              if (!Number.isSafeInteger(totalCount) || totalCount < 0 ||
                  (expectedTotal !== null && totalCount !== expectedTotal)) {
                throw new Error(`${label} census total count is invalid or changed during pagination.`);
              }
              const link = response.headers.link;
              if (link === undefined) {
                if (observedCount !== totalCount) {
                  throw new Error(`${label} census ended before every reported item was observed.`);
                }
                return { nextPage: null, totalCount };
              }
              if (typeof link !== 'string') {
                throw new Error(`${label} census Link header is invalid.`);
              }
              const nextLinks = [...link.matchAll(/<([^>]+)>;\s*rel="next"/gu)];
              if (nextLinks.length === 0) {
                if (observedCount !== totalCount) {
                  throw new Error(`${label} census ended before every reported item was observed.`);
                }
                return { nextPage: null, totalCount };
              }
              if (nextLinks.length !== 1) {
                throw new Error(`${label} census has ambiguous next cursor.`);
              }
              const nextPageValue = new URL(nextLinks[0][1]).searchParams.get('page');
              const nextPage = nextPageValue === null ? Number.NaN : Number(nextPageValue);
              if (!Number.isSafeInteger(nextPage) || nextPage !== page + 1 ||
                  nextPage > maximumPages) {
                throw new Error(`${label} census cursor is nonsequential or overbound.`);
              }
              if (observedCount >= totalCount) {
                throw new Error(`${label} census exposes a next cursor after every reported item.`);
              }
              return { nextPage, totalCount };
            };

            const observeExactRuns = async () => {
              const exactRuns = [];
              const observedRunIds = new Set();
              let expectedTotal = null;
              let observedCount = 0;
              let page = 1;
              while (true) {
                if (!Number.isSafeInteger(page) || page < 1 || page > maximumPages) {
                  throw new Error('MainHealth workflow-run census cursor is invalid or overbound.');
                }
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.data.id,
                  event: 'repository_dispatch',
                  head_sha: mainSha,
                  per_page: pageSize,
                  page
                });
                for (const run of runs.data.workflow_runs) {
                  if (!Number.isSafeInteger(run.id) || observedRunIds.has(run.id)) {
                    throw new Error('MainHealth workflow-run census contains an invalid or duplicate run id.');
                  }
                  observedRunIds.add(run.id);
                }
                observedCount += runs.data.workflow_runs.length;
                exactRuns.push(...runs.data.workflow_runs.filter((run) =>
                  run.name === 'compiler-pr-validation' && run.display_title === expectedTitle &&
                  run.event === 'repository_dispatch' && run.head_sha === mainSha &&
                  run.head_branch === repository.data.default_branch && run.workflow_id === workflow.data.id
                ));
                const cursor = boundedNextPage({ label: 'MainHealth workflow-run', response: runs,
                  page, expectedTotal, observedCount });
                expectedTotal = cursor.totalCount;
                if (cursor.nextPage === null) return exactRuns;
                page = cursor.nextPage;
              }
            };
            let matching = await observeExactRuns();
            if (matching.length > 1) {
              throw new Error('MainHealth operation already has multiple exact workflow runs.');
            }
            if (matching.length === 0) {
              const dispatch = await github.request('POST /repos/{owner}/{repo}/dispatches', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'sec-produce-main-health-v1',
                client_payload: { payload: { mainSha, requestOperationId } }
              });
              if (dispatch.status !== 204) {
                throw new Error(`MainHealth dispatch returned unexpected HTTP ${dispatch.status}.`);
              }
            }

            let joined = null;
            const mainHealthRunnerQueueAllowanceMilliseconds =
              positiveIntegerEnvironment('MAIN_HEALTH_RUNNER_QUEUE_ALLOWANCE_MINUTES') * 60 * 1000;
            const mainHealthProducerTimeoutMilliseconds =
              positiveIntegerEnvironment('MAIN_HEALTH_PRODUCER_TIMEOUT_MINUTES') * 60 * 1000;
            const mainHealthJoinPollIntervalMilliseconds =
              positiveIntegerEnvironment('MAIN_HEALTH_JOIN_POLL_INTERVAL_SECONDS') * 1000;
            const deadline = Date.now() + (2 * mainHealthProducerTimeoutMilliseconds) +
              mainHealthRunnerQueueAllowanceMilliseconds +
              mainHealthJoinPollIntervalMilliseconds;
            while (Date.now() < deadline) {
              matching = await observeExactRuns();
              if (matching.length > 1) {
                throw new Error('MainHealth dispatch resolved to multiple exact workflow runs.');
              }
              if (matching.length === 1) {
                const candidate = matching[0];
                if (candidate.status === 'completed') {
                  if (candidate.conclusion !== 'success') {
                    throw new Error(`Exact MainHealth run concluded ${candidate.conclusion ?? 'without conclusion'}.`);
                  }
                  joined = candidate;
                  break;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, mainHealthJoinPollIntervalMilliseconds));
            }
            if (joined === null) {
              throw new Error('Timed out joining the exact post-merge MainHealth run.');
            }

            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: joined.id
            });
            if (run.data.name !== 'compiler-pr-validation' ||
                run.data.display_title !== expectedTitle || run.data.workflow_id !== workflow.data.id ||
                run.data.path !== workflow.data.path || run.data.event !== 'repository_dispatch' ||
                run.data.head_sha !== mainSha || run.data.head_branch !== repository.data.default_branch ||
                run.data.status !== 'completed' || run.data.conclusion !== 'success' ||
                !Number.isSafeInteger(run.data.check_suite_id) || Number(run.data.check_suite_id) < 1) {
              throw new Error('Joined MainHealth workflow API readback is not canonical.');
            }
            const matchingChecks = [];
            const observedCheckIds = new Set();
            let expectedCheckTotal = null;
            let observedCheckCount = 0;
            let checkPage = 1;
            while (true) {
              const checks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: mainSha,
                check_name: 'sec/main-health',
                filter: 'latest',
                per_page: pageSize,
                page: checkPage
              });
              for (const check of checks.data.check_runs) {
                if (!Number.isSafeInteger(check.id) || observedCheckIds.has(check.id)) {
                  throw new Error('MainHealth check-run census contains an invalid or duplicate check id.');
                }
                observedCheckIds.add(check.id);
              }
              observedCheckCount += checks.data.check_runs.length;
              matchingChecks.push(...checks.data.check_runs.filter((check) =>
                check.name === 'sec/main-health' && check.head_sha === mainSha &&
                check.status === 'completed' && check.conclusion === 'success' &&
                check.check_suite?.id === run.data.check_suite_id && check.app?.slug === 'github-actions'
              ));
              const cursor = boundedNextPage({ label: 'MainHealth check-run', response: checks,
                page: checkPage, expectedTotal: expectedCheckTotal,
                observedCount: observedCheckCount });
              expectedCheckTotal = cursor.totalCount;
              if (cursor.nextPage === null) break;
              checkPage = cursor.nextPage;
            }
            if (matchingChecks.length !== 1) {
              throw new Error('Exact MainHealth run has no unique successful canonical sec/main-health check.');
            }
            core.setOutput('main-sha', mainSha);
            core.setOutput('request-operation-id', requestOperationId);
            core.setOutput('workflow-run-id', String(run.data.id));

      - name: Observe Issue disposition and close out exact integrated branch
        id: closeout-mutate-hosted
        if: ${{ steps.prepare-integration.outputs.integration-lane == 'open-first-effect' || steps.prepare-integration.outputs.integration-lane == 'merged-recovery' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun scripts/codex/verification-session.ts closeout-mutate-hosted
          --repository "${{ github.repository }}"
          --output "${{ github.workspace }}/.tmp/codex/closeout-mutation-projection.json"
          --json

      - name: Publish exact branch closeout receipt
        id: closeout-publish-hosted
        if: ${{ steps.prepare-integration.outputs.integration-lane == 'open-first-effect' || steps.prepare-integration.outputs.integration-lane == 'merged-recovery' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun scripts/codex/verification-session.ts closeout-publish-hosted
          --repository "${{ github.repository }}"
          --output "${{ github.workspace }}/.tmp/codex/closeout-publication-projection.json"
          --json

      - name: Retain exact closeout and Issue disposition projections
        if: always() && !cancelled() && hashFiles('.tmp/codex/closeout-mutation-projection.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-closeout-projections-v1-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            .tmp/codex/closeout-mutation-projection.json
            .tmp/codex/closeout-publication-projection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic integration projection
        if: always() && !cancelled() && hashFiles('.tmp/codex/integration-projection.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-integration-projection-v1-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/codex/integration-projection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
