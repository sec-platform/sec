name: "SEC CodeQL"

# Test fixtures intentionally create races, malformed objects, and temporary
# files. Production code, repository tools, and Actions workflows remain in the
# extended CodeQL scan.
paths-ignore:
  - "tests/**"
  - "**/*.test.ts"
  - "**/*.test.js"
  - "**/*.test.mjs"

# Preserve the repository's existing default-setup analysis policy when this
# configuration is consumed by the advanced workflow.
queries:
  - uses: security-extended
threat-models:
  - local
