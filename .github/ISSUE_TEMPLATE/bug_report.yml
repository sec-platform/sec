name: Bug report
description: Report reproducible incorrect behavior in the current main branch
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets or undisclosed vulnerabilities. Use the Security tab for private vulnerability reports.
  - type: input
    id: revision
    attributes:
      label: Exact revision
      description: Commit SHA or released version where the behavior occurs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime versions, and other relevant execution conditions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete sequence that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add sanitized logs, error messages, or links that help locate the responsible boundary.
